<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="SaivARCADE — a curated collection of browser games.">
<title>SaivARCADE</title>
<style>
/* ============================================================================
   SaivARCADE — Minimalist Edition
   ========================================================================== */

:root {
  --bg: #ffffff;
  --bg-soft: #fafafa;
  --surface: #ffffff;
  --border: #e5e5e5;
  --border-strong: #d4d4d4;
  --text: #111111;
  --text-2: #404040;
  --muted: #737373;
  --green: #16a34a;
  --star: #eab308;
}

html.dark {
  --bg: #0a0a0a;
  --bg-soft: #0f0f0f;
  --surface: #141414;
  --border: #262626;
  --border-strong: #333333;
  --text: #fafafa;
  --text-2: #d4d4d4;
  --muted: #a3a3a3;
  --green: #22c55e;
  --star: #facc15;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body { height: 100%; width: 100%; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color .25s ease, color .25s ease;
  line-height: 1.5;
}

/* ============================================================================
   APP SHELL
   ========================================================================== */
.app {
  position: relative;
  height: min(100vh, 900px);
  width: min(440px, 100vw, calc(100vh * 0.5));
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  isolation: isolate;
}
@supports (height: 100dvh) {
  .app { height: min(100dvh, 900px); }
}
@media (max-width: 460px) and (max-height: 900px) {
  .app {
    border-radius: 0;
    border-left: none;
    border-right: none;
    border-top: none;
    border-bottom: none;
    width: 100vw;
    height: 100dvh;
  }
}

/* ============================================================================
   HEADER
   ========================================================================== */
.hdr {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 16px 18px 12px;
  z-index: 3;
  border-bottom: 1px solid var(--border);
}
.hdr-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1 1 auto;
}

.hdr-logo {
  position: relative;
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  border-radius: 10px;
  overflow: hidden;
  background: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
}
.hdr-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.hdr-logo .fallback {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--bg);
  letter-spacing: -0.02em;
}

.hdr-title { min-width: 0; flex: 1 1 auto; }

.hdr-name {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  display: flex;
  align-items: baseline;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.hdr-name .saiv { font-weight: 700; color: var(--text); }
.hdr-name .arcade {
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.02em;
  margin-left: 3px;
}

.hdr-sub {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-2);
  cursor: pointer;
  transition: all .15s ease;
  font-family: inherit;
}
.icon-btn:hover { border-color: var(--border-strong); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

/* ============================================================================
   SCROLL
   ========================================================================== */
.scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding: 16px 16px 20px;
  -webkit-overflow-scrolling: touch;
}
.scroll::-webkit-scrollbar { display: none; }

/* ============================================================================
   HERO / FEATURED
   ========================================================================== */
.hero {
  position: relative;
  display: block;
  margin-bottom: 18px;
  border-radius: 14px;
  padding: 20px 18px 18px;
  overflow: hidden;
  isolation: isolate;
  color: #ffffff;
  text-decoration: none;
  background: var(--text);
  cursor: pointer;
  transition: opacity .15s ease;
}
html.dark .hero { color: #ffffff; background: #1a1a1a; }
.hero:active { opacity: 0.9; }

.hero-bg { display: none; }

.hero-tag {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.7);
  border: none;
  margin-bottom: 12px;
}
.hero-tag::before {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--c1, #22d3ee);
}

.hero-icon {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--c1, #22d3ee);
}
.hero-icon svg {
  width: 32px;
  height: 32px;
}

.hero-title {
  position: relative;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 4px;
  max-width: 75%;
  color: #ffffff;
}
.hero-desc {
  position: relative;
  font-size: 12px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 16px;
  max-width: 75%;
  line-height: 1.4;
}
.hero-play {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 16px;
  border: none;
  border-radius: 8px;
  background: #ffffff;
  color: #111111;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0;
  cursor: pointer;
  transition: background .15s ease;
}
.hero-play:hover { background: rgba(255, 255, 255, 0.9); }
.hero-play:active { transform: scale(.97); }
.hero-play svg {
  width: 11px;
  height: 11px;
  fill: currentColor;
}

/* ============================================================================
   SECTION HEADER
   ========================================================================== */
.section-hdr {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin: 0 2px 12px;
}
.section-hdr h2 {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text);
}
.section-hdr h2 .accent { color: var(--text); font-weight: 600; }
.section-hdr .count {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--muted);
}

/* ============================================================================
   FILTERS
   ========================================================================== */
.filters {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  margin: 0 -16px 14px;
  padding: 0 16px 2px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
}
.filters::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  padding: 6px 12px;
  border-radius: 6px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s ease;
}
.chip:hover {
  border-color: var(--border-strong);
  color: var(--text);
}
.chip:active { transform: scale(.96); }
.chip.active {
  color: var(--bg);
  background: var(--text);
  border-color: var(--text);
}

/* ============================================================================
   GRID
   ========================================================================== */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: border-color .18s ease, transform .12s ease;
}
.card:hover {
  border-color: var(--border-strong);
}
.card:active {
  transform: scale(.98);
}

/* Card visual */
.card-visual {
  position: relative;
  aspect-ratio: 1.15 / 1;
  overflow: hidden;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
}

/* Icon */
.card-icon {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 52%;
  height: 52%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--c1, #111111);
  transition: transform .25s ease;
}
.card-icon svg { width: 100%; height: 100%; }
.card:hover .card-icon { transform: translate(-50%, -50%) scale(1.06); }

/* Category badge */
.card-cat {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  z-index: 2;
}

/* Favorite */
.card-fav {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  z-index: 3;
  padding: 0;
  transition: all .15s ease;
}
.card-fav:hover { border-color: var(--border-strong); color: var(--text-2); }
.card-fav:active { transform: scale(.88); }
.card-fav svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.card-fav.on {
  color: var(--star);
  border-color: var(--star);
}
.card-fav.on svg { fill: currentColor; }

/* Play overlay */
.card-play {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  background: var(--text);
  color: var(--bg);
  opacity: 0;
  transform: translateY(4px);
  transition: all .2s ease;
  pointer-events: none;
  z-index: 2;
}
.card-play svg {
  width: 10px;
  height: 10px;
  fill: currentColor;
  margin-left: 1px;
}
.card:hover .card-play {
  opacity: 1;
  transform: translateY(0);
}

/* Body */
.card-body {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.card-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;
  line-height: 1.3;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-name .brand { color: var(--text); font-weight: 600; }
.card-desc {
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ============================================================================
   FOOTER
   ========================================================================== */
.ftr {
  text-align: center;
  padding: 16px 0 8px;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: var(--muted);
  border-top: 1px solid var(--border);
  margin-top: 8px;
}
.ftr .heart {
  color: #dc2626;
  display: inline-block;
}

/* ============================================================================
   TOAST
   ========================================================================== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  z-index: 100;
  padding: 10px 16px;
  border-radius: 8px;
  background: var(--text);
  color: var(--bg);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.25);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .25s ease;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================================================
   REDUCED MOTION
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>

              fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="36" r="4" fill="currentColor"/>
        <circle cx="15" cy="33" r="1.4" fill="#ffffff"/>
        <circle cx="9" cy="33" r="1.4" fill="#ffffff"/>
      </svg>`,
    cards: `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="14" width="28" height="40" rx="4" fill="currentColor" opacity="0.5" transform="rotate(-12 20 34)"/>
        <rect x="22" y="10" width="30" height="42" rx="4" fill="currentColor"/>
        <path d="M37 24 Q 37 30 42 30 Q 47 30 47 24 Q 47 19 42 14 Q 37 19 37 24 Z" fill="#ffffff"/>
      </svg>`,
    blocks: `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="14" height="14" rx="3" fill="currentColor"/>
        <rect x="22" y="6" width="14" height="14" rx="3" fill="currentColor"/>
        <rect x="38" y="6" width="14" height="14" rx="3" fill="currentColor"/>
        <rect x="6" y="22" width="14" height="14" rx="3" fill="currentColor" opacity="0.5"/>
        <rect x="22" y="22" width="14" height="14" rx="3" fill="currentColor" opacity="0.85"/>
        <rect x="38" y="22" width="14" height="14" rx="3" fill="currentColor" opacity="0.7"/>
        <rect x="22" y="38" width="14" height="14" rx="3" fill="currentColor"/>
        <rect x="38" y="38" width="14" height="14" rx="3" fill="currentColor" opacity="0.4"/>
        <rect x="6" y="38" width="14" height="14" rx="3" fill="currentColor" opacity="0.3"/>
      </svg>`,
  };

  /* ========================================================================
     UTILITIES
     ======================================================================== */

  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

  /* ========================================================================
     PERSISTENCE
     ======================================================================== */

  const STORAGE_KEY = "saiv-arcade.save.v1";

  const Save = {
    data: { favorites: [], recent: [], muted: false, totalPlays: 0 },
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p && typeof p === "object") {
          if (Array.isArray(p.favorites)) this.data.favorites = p.favorites;
          if (Array.isArray(p.recent)) this.data.recent = p.recent;
          if (typeof p.muted === "boolean") this.data.muted = p.muted;
          if (typeof p.totalPlays === "number") this.data.totalPlays = p.totalPlays;
        }
      } catch (e) {}
    },
    save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); } catch (e) {}
    },
    markPlayed(id) {
      this.data.recent = this.data.recent.filter((x) => x !== id);
      this.data.recent.unshift(id);
      if (this.data.recent.length > 6) this.data.recent.length = 6;
      this.data.totalPlays++;
      this.save();
    },
    toggleFavorite(id) {
      const i = this.data.favorites.indexOf(id);
      if (i === -1) this.data.favorites.push(id);
      else this.data.favorites.splice(i, 1);
      this.save();
      return i === -1;
    },
    isFavorite(id) {
      return this.data.favorites.indexOf(id) !== -1;
    },
  };

  /* ========================================================================
     SOUND (tiny synth)
     ======================================================================== */

  const Sound = (function () {
    let ctx = null, master = null, muted = false, available = true;

    function init() {
      if (ctx || !available) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { available = false; return; }
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.14;
        master.connect(ctx.destination);
      } catch (e) { available = false; }
    }
    function resume() {
      if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
    }
    function tone(o) {
      if (!ctx || muted || !available) return;
      const now = ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.08;
      const vol = o.vol === undefined ? 0.25 : o.vol;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(o.freq, now);
      if (o.to && o.to !== o.freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), now + dur);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(master);
      osc.start(now); osc.stop(now + dur + 0.02);
    }

    return {
      init, resume,
      get muted() { return muted; },
      toggle() {
        muted = !muted;
        Save.data.muted = muted;
        Save.save();
        if (!muted) { resume(); this.click(); }
        return muted;
      },
      setMuted(v) { muted = !!v; Save.data.muted = muted; Save.save(); },

      click() { tone({ freq: 720, type: "sine", dur: 0.04, vol: 0.16 }); },
      tap()   { tone({ freq: 900, type: "sine", dur: 0.03, vol: 0.12 }); },
      open()  {
        tone({ freq: 500, to: 900, type: "sine", dur: 0.09, vol: 0.18 });
        tone({ freq: 1200, type: "sine", dur: 0.06, vol: 0.1, delay: 0.05 });
      },
      fav() {
        tone({ freq: 900, type: "sine", dur: 0.06, vol: 0.16 });
        tone({ freq: 1400, type: "sine", dur: 0.09, vol: 0.14, delay: 0.04 });
      },
      unfav() {
        tone({ freq: 500, to: 340, type: "sine", dur: 0.1, vol: 0.14 });
      },
    };
  })();

  const Haptics = {
    tap()  { if (navigator.vibrate) try { navigator.vibrate(6); } catch (e) {} },
    play() { if (navigator.vibrate) try { navigator.vibrate([12, 20, 12]); } catch (e) {} },
  };

  /* ========================================================================
     DOM
     ======================================================================== */

  const els = {
    hero: $("#hero"),
    heroBg: $("#heroBg"),
    heroIcon: $("#heroIcon"),
    heroTitle: $("#heroTitle"),
    heroDesc: $("#heroDesc"),
    filters: $("#filters"),
    grid: $("#grid"),
    gridCount: $("#gridCount"),
    toast: $("#toast"),
    btnSound: $("#btnSound"),
    iconSound: $("#iconSound"),
    hdrSub: $("#hdrSub"),
    logoImg: $("#hdrLogoImg"),
    logoFallback: $("#hdrLogoFallback"),
  };

  let activeFilter = "all";

  /* ---- Toast ---- */
  let toastTimer = 0;
  function showToast(text) {
    els.toast.textContent = text;
    els.toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1400);
  }

  /* ---- Hero ---- */
  function buildHero() {
    const featured = GAMES.find((g) => g.featured) || GAMES[0];

    els.hero.href = featured.href;
    els.hero.dataset.id = featured.id;
    els.hero.style.setProperty("--c1", featured.c1);
    els.hero.style.setProperty("--c2", featured.c2);
    els.heroIcon.innerHTML = ICONS[featured.icon] || "";
    els.heroTitle.textContent = featured.title;
    els.heroDesc.textContent = featured.desc;

    els.hero.addEventListener("click", () => {
      Sound.init(); Sound.resume();
      Sound.open();
      Haptics.play();
      Save.markPlayed(featured.id);
    });
  }

  /* ---- Filters ---- */
  function buildFilters() {
    els.filters.innerHTML = "";
    CATEGORIES.forEach((c) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip" + (c.key === "all" ? " active" : "");
      btn.textContent = c.label;
      btn.dataset.cat = c.key;
      btn.addEventListener("click", () => {
        if (activeFilter === c.key) return;
        Sound.init(); Sound.resume();
        Sound.tap();
        activeFilter = c.key;
        $$(".chip", els.filters).forEach((el) => {
          el.classList.toggle("active", el.dataset.cat === c.key);
        });
        buildGrid();
      });
      els.filters.appendChild(btn);
    });
  }

  /* ---- Grid ---- */
  function buildGrid() {
    els.grid.innerHTML = "";

    const filtered = activeFilter === "all"
      ? GAMES
      : GAMES.filter((g) => g.category === activeFilter);

    els.gridCount.textContent = filtered.length + " title" + (filtered.length !== 1 ? "s" : "");

    filtered.forEach((g) => {
      const card = document.createElement("a");
      card.className = "card";
      card.href = g.href;
      card.dataset.id = g.id;
      card.style.setProperty("--c1", g.c1);
      card.style.setProperty("--c2", g.c2);

      // Visual
      const visual = document.createElement("div");
      visual.className = "card-visual";

      const cat = document.createElement("div");
      cat.className = "card-cat";
      cat.textContent = g.catLabel;
      visual.appendChild(cat);

      const fav = document.createElement("button");
      fav.type = "button";
      fav.className = "card-fav" + (Save.isFavorite(g.id) ? " on" : "");
      fav.setAttribute("aria-label", "Favorite");
      fav.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l2.7 5.6 6.2.9-4.5 4.4 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.1 9.5l6.2-.9z"/>
        </svg>`;
      fav.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        Sound.init(); Sound.resume();
        const added = Save.toggleFavorite(g.id);
        fav.classList.toggle("on", added);
        if (added) { Sound.fav(); showToast("Added to favorites"); }
        else { Sound.unfav(); }
      });
      visual.appendChild(fav);

      const icon = document.createElement("div");
      icon.className = "card-icon";
      icon.innerHTML = ICONS[g.icon] || "";
      visual.appendChild(icon);

      const playBtn = document.createElement("div");
      playBtn.className = "card-play";
      playBtn.innerHTML = `<svg viewBox="0 0 12 12"><path d="M3 1.5v9L10.5 6 3 1.5z"/></svg>`;
      visual.appendChild(playBtn);

      card.appendChild(visual);

      // Body
      const body = document.createElement("div");
      body.className = "card-body";

      const name = document.createElement("div");
      name.className = "card-name";
      const brandSpan = document.createElement("span");
      brandSpan.className = "brand";
      brandSpan.textContent = g.brand;
      name.appendChild(brandSpan);
      name.appendChild(document.createTextNode(g.suffix));
      body.appendChild(name);

      const desc = document.createElement("div");
      desc.className = "card-desc";
      desc.textContent = g.desc;
      body.appendChild(desc);

      card.appendChild(body);

      card.addEventListener("click", () => {
        Sound.init(); Sound.resume();
        Sound.open();
        Haptics.play();
        Save.markPlayed(g.id);
      });

      els.grid.appendChild(card);
    });
  }

  /* ========================================================================
     LOGO IMAGE
     ======================================================================== */

  function initLogo() {
    if (!els.logoImg) return;
    els.logoImg.addEventListener("error", () => {
      els.logoImg.style.display = "none";
      if (els.logoFallback) els.logoFallback.style.display = "flex";
    });
    els.logoImg.addEventListener("load", () => {
      if (els.logoFallback) els.logoFallback.style.display = "none";
    });
    if (els.logoImg.complete) {
      if (els.logoImg.naturalWidth === 0) {
        els.logoImg.style.display = "none";
        if (els.logoFallback) els.logoFallback.style.display = "flex";
      }
    }
  }

  /* ========================================================================
     SOUND TOGGLE
     ======================================================================== */

  function updateSoundIcon() {
    const svg = els.iconSound;
    if (!svg) return;
    if (Sound.muted) {
      svg.innerHTML =
        '<path d="M4 9v6h4l5 4V5l-5 4H4z"/>' +
        '<line x1="17" y1="9" x2="22" y2="15"/>' +
        '<line x1="22" y1="9" x2="17" y2="15"/>';
    } else {
      svg.innerHTML =
        '<path d="M4 9v6h4l5 4V5l-5 4H4z"/>' +
        '<path d="M16 8.5a5 5 0 0 1 0 7"/>' +
        '<path d="M18.5 6a8.5 8.5 0 0 1 0 12"/>';
    }
  }

  /* ========================================================================
     BOOTSTRAP
     ======================================================================== */

  function init() {
    Save.load();
    Sound.setMuted(Save.data.muted);
    updateSoundIcon();

    els.hdrSub.textContent = GAMES.length + " games · one hub";

    buildHero();
    buildFilters();
    buildGrid();
    initLogo();

    els.btnSound.addEventListener("click", () => {
      Sound.init();
      Sound.toggle();
      updateSoundIcon();
      Haptics.tap();
    });

    document.addEventListener("gesturestart", (e) => e.preventDefault());

    // Init audio on first user gesture (autoplay policy)
    const unlock = () => {
      Sound.init();
      Sound.resume();
      document.removeEventListener("pointerdown", unlock);
    };
    document.addEventListener("pointerdown", unlock);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
