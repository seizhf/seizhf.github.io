<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07030f">
<meta name="description" content="SaivARCADE — a curated collection of browser games.">
<title>SaivARCADE</title>
<style>
/* ============================================================================
   SaivARCADE — CATALOGUE  (v2 — bug-fixed)
   ========================================================================== */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%;
  width: 100%;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  overscroll-behavior: none;
  background: #07030f;
  color: #f5f3ff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================================
   ANIMATED BACKGROUND
   ========================================================================== */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, #1e0b40 0%, #0a0418 55%, #05020c 100%);
}
.bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(56, 232, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 232, 255, 0.045) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 75%);
          mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 75%);
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  will-change: transform;
}
.orb.a {
  width: 320px; height: 320px;
  background: radial-gradient(circle, #b176ff 0%, transparent 70%);
  top: -80px; left: -80px;
  animation: orbA 24s ease-in-out infinite;
}
.orb.b {
  width: 380px; height: 380px;
  background: radial-gradient(circle, #38e8ff 0%, transparent 70%);
  bottom: -120px; right: -120px;
  animation: orbB 28s ease-in-out infinite;
}
.orb.c {
  width: 260px; height: 260px;
  background: radial-gradient(circle, #ff3d81 0%, transparent 70%);
  top: 45%; right: -100px;
  animation: orbC 22s ease-in-out infinite;
}
@keyframes orbA {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(60px, 40px) scale(1.1); }
}
@keyframes orbB {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-50px, -60px) scale(1.08); }
}
@keyframes orbC {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-40px, 60px) scale(0.95); }
}

/* ============================================================================
   APP SHELL
   ========================================================================== */
.app {
  position: relative;
  z-index: 1;
  height: min(100vh, 900px);
  width: min(440px, 100vw, calc(100vh * 0.5));
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, rgba(20, 8, 42, 0.7) 0%, rgba(10, 4, 22, 0.85) 100%);
  border: 1px solid rgba(177, 118, 255, 0.16);
  border-radius: 24px;
  box-shadow:
    0 48px 120px -32px rgba(0, 0, 0, 0.95),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  overflow: hidden;
  isolation: isolate;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
@supports (height: 100dvh) {
  .app { height: min(100dvh, 900px); }
}
@media (max-width: 460px) and (max-height: 900px) {
  .app {
    border-radius: 0;
    border-left: none;
    border-right: none;
    box-shadow: none;
    width: 100vw;
    height: 100dvh;
  }
}

/* ============================================================================
   HEADER
   ========================================================================== */
.hdr {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px 8px;
  z-index: 3;
}
.hdr-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1 1 auto;
}

/* Logo — image from main/images/P logo.png with fallback */
.hdr-logo {
  position: relative;
  width: 44px;
  height: 44px;
  flex: 0 0 auto;
  border-radius: 12px;
  overflow: hidden;
  background: linear-gradient(135deg, #b176ff, #38e8ff);
  box-shadow:
    0 0 24px -2px rgba(177, 118, 255, 0.7),
    inset 0 1px 0 rgba(255, 255, 255, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
}
.hdr-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.hdr-logo .fallback {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
  color: #0a0518;
  letter-spacing: -0.04em;
  font-family: Georgia, "Times New Roman", serif;
}

.hdr-title {
  min-width: 0;
  flex: 1 1 auto;
}
.hdr-name {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1;
  display: flex;
  align-items: baseline;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hdr-name .saiv {
  background: linear-gradient(96deg, #b176ff, #38e8ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 12px rgba(177, 118, 255, 0.5));
}
.hdr-name .arcade {
  background: linear-gradient(96deg, #ffffff, #a79ec6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 0.06em;
  margin-left: 1px;
}
.hdr-sub {
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #6a6288;
  margin-top: 3px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(177, 118, 255, 0.08);
  border: 1px solid rgba(177, 118, 255, 0.2);
  border-radius: 11px;
  color: #a79ec6;
  cursor: pointer;
  transition:
    transform 0.08s ease,
    background 0.18s ease,
    border-color 0.18s ease,
    color 0.18s ease;
  font-family: inherit;
}
.icon-btn:active {
  transform: scale(0.9);
  color: #38e8ff;
  border-color: rgba(56, 232, 255, 0.6);
  background: rgba(56, 232, 255, 0.16);
}
.icon-btn svg {
  width: 17px;
  height: 17px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

/* ============================================================================
   SCROLLABLE BODY
   ========================================================================== */
.scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding: 4px 16px 20px;
  -webkit-overflow-scrolling: touch;
}
.scroll::-webkit-scrollbar { display: none; }

/* ============================================================================
   HERO
   ========================================================================== */
.hero {
  position: relative;
  display: block;
  margin-top: 6px;
  margin-bottom: 20px;
  border-radius: 20px;
  padding: 20px 18px 18px;
  overflow: hidden;
  isolation: isolate;
  color: #ffffff;
  text-decoration: none;
  box-shadow:
    0 24px 50px -22px var(--hero-glow, rgba(177, 118, 255, 0.7)),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  animation: heroIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.hero:active { transform: scale(0.985); }

@keyframes heroIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.hero-bg {
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 80% 15%, var(--c1, #b176ff) 0%, transparent 55%),
    radial-gradient(circle at 20% 90%, var(--c2, #38e8ff) 0%, transparent 55%),
    linear-gradient(135deg, var(--c1, #b176ff) 0%, var(--c2, #38e8ff) 100%);
}
.hero-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.4) 1px, transparent 0);
  background-size: 14px 14px;
  opacity: 0.18;
}
.hero-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.55) 100%);
}

.hero-tag {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px 4px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #ffffff;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  margin-bottom: 10px;
}
.hero-tag::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 8px #ffffff;
  animation: heroTagPulse 1.6s ease-in-out infinite;
}
@keyframes heroTagPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(0.7); }
}

.hero-icon {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: rgba(0, 0, 0, 0.28);
  border: 1px solid rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #ffffff;
  animation: heroIconFloat 4s ease-in-out infinite;
}
.hero-icon svg {
  width: 42px;
  height: 42px;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
}
@keyframes heroIconFloat {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50%      { transform: translateY(-5px) rotate(3deg); }
}

.hero-title {
  position: relative;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.05;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  margin-bottom: 4px;
  max-width: 75%;
}
.hero-desc {
  position: relative;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: rgba(255, 255, 255, 0.88);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  margin-bottom: 14px;
  max-width: 75%;
  line-height: 1.35;
}
.hero-play {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 18px 11px;
  border: none;
  border-radius: 12px;
  background: #ffffff;
  color: #0a0518;
  font-family: inherit;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow:
    0 10px 24px -8px rgba(0, 0, 0, 0.6),
    inset 0 -2px 0 rgba(0, 0, 0, 0.08);
  transition: transform 0.08s ease, box-shadow 0.2s ease;
}
.hero-play:active {
  transform: scale(0.94);
}
.hero-play svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

/* ============================================================================
   SECTION HEADER
   ========================================================================== */
.section-hdr {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin: 0 2px 12px;
}
.section-hdr h2 {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #ffffff;
}
.section-hdr h2 .accent {
  background: linear-gradient(96deg, #38e8ff, #b176ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.section-hdr .count {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #6a6288;
}

/* ============================================================================
   FILTERS
   ========================================================================== */
.filters {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0 0 12px 0;
  margin: 0 -16px 4px;
  padding-left: 16px;
  padding-right: 16px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  padding: 7px 13px 8px;
  border-radius: 999px;
  background: rgba(177, 118, 255, 0.06);
  border: 1px solid rgba(177, 118, 255, 0.18);
  color: #a79ec6;
  font-family: inherit;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  transition:
    background 0.18s ease,
    border-color 0.18s ease,
    color 0.18s ease,
    transform 0.08s ease,
    box-shadow 0.18s ease;
}
.chip:active { transform: scale(0.94); }
.chip.active {
  color: #0a0518;
  background: linear-gradient(96deg, #38e8ff, #b176ff);
  border-color: transparent;
  box-shadow:
    0 6px 18px -6px rgba(56, 232, 255, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.4);
}

/* ============================================================================
   GRID
   ========================================================================== */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

/* ---- Card ---- */
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.08);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  will-change: transform;
  transition:
    transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
    border-color 0.2s ease,
    box-shadow 0.24s ease;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(14px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card:hover,
.card:active {
  transform: translateY(-3px) scale(1.015);
  border-color: var(--stroke, rgba(255, 255, 255, 0.25));
  box-shadow:
    0 18px 40px -14px var(--glow, rgba(177, 118, 255, 0.7)),
    inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
.card:active {
  transform: translateY(-1px) scale(0.99);
}

/* Visual area */
.card-visual {
  position: relative;
  aspect-ratio: 1.15 / 1;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(circle at 30% 25%, var(--c1, #b176ff) 0%, transparent 65%),
    radial-gradient(circle at 75% 85%, var(--c2, #38e8ff) 0%, transparent 65%),
    linear-gradient(135deg, var(--c1, #b176ff) 0%, var(--c2, #38e8ff) 100%);
}
.card-visual::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.42) 1px, transparent 0);
  background-size: 12px 12px;
  opacity: 0.22;
  pointer-events: none;
}
.card-visual::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.32) 100%);
  pointer-events: none;
}

/* Icon */
.card-icon {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 58%;
  height: 58%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.5));
  transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.card-icon svg {
  width: 100%;
  height: 100%;
}
.card:hover .card-icon,
.card:active .card-icon {
  transform: translate(-50%, -50%) scale(1.08) rotate(-3deg);
}

/* Category badge */
.card-cat {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 3px 8px 4px;
  border-radius: 999px;
  font-size: 7px;
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #ffffff;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.28);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 2;
}

/* Favorite */
.card-fav {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 8px;
  color: rgba(255, 255, 255, 0.75);
  cursor: pointer;
  z-index: 3;
  padding: 0;
  transition:
    transform 0.1s ease,
    background 0.18s ease,
    border-color 0.18s ease,
    color 0.18s ease;
}
.card-fav:active { transform: scale(0.85); }
.card-fav svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.card-fav.on {
  color: #ffd966;
  border-color: rgba(255, 217, 102, 0.75);
  background: rgba(255, 217, 102, 0.24);
}
.card-fav.on svg {
  fill: currentColor;
  filter: drop-shadow(0 0 6px rgba(255, 217, 102, 0.8));
}

/* Play button overlay */
.card-play {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.92);
  color: #0a0518;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  transform: translateY(6px) scale(0.85);
  opacity: 0;
  transition:
    transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
    opacity 0.2s ease;
  pointer-events: none;
  z-index: 2;
}
.card-play svg {
  width: 12px;
  height: 12px;
  fill: currentColor;
  margin-left: 1px;
}
.card:hover .card-play,
.card:active .card-play {
  transform: translateY(0) scale(1);
  opacity: 1;
}

/* Body */
.card-body {
  padding: 10px 11px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.card-name {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: -0.01em;
  line-height: 1.15;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-name .brand {
  background: linear-gradient(96deg, var(--c1, #b176ff), var(--c2, #38e8ff));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.card-desc {
  font-size: 9.5px;
  font-weight: 600;
  color: #a79ec6;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ============================================================================
   FOOTER
   ========================================================================== */
.ftr {
  text-align: center;
  padding: 10px 0 8px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #6a6288;
  border-top: 1px solid rgba(255, 255, 255, 0.04);
  margin-top: 4px;
}
.ftr .heart {
  color: #ff3d81;
  text-shadow: 0 0 12px rgba(255, 61, 129, 0.9);
  animation: heartBeat 1.4s ease-in-out infinite;
  display: inline-block;
}
@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  20%      { transform: scale(1.18); }
  40%      { transform: scale(1); }
  60%      { transform: scale(1.12); }
}

/* ============================================================================
   TOAST
   ========================================================================== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  z-index: 100;
  padding: 9px 16px;
  border-radius: 999px;
  background: rgba(10, 4, 22, 0.9);
  border: 1px solid rgba(177, 118, 255, 0.4);
  color: #f5f3ff;
  font-size: 10.5px;
  font-weight: 900;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 12px 40px -8px rgba(0, 0, 0, 0.7);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================================================
   REDUCED MOTION
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>
<body>

<script>

    ball: `

        <path d="M4 52 Q 16 20 32 32 Q 48 44 60 12" stroke="currentColor" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round" stroke-dasharray="3 5"/>
        <circle cx="34" cy="34" r="18" fill="currentColor"/>
        <ellipse cx="28" cy="28" rx="6" ry="4.5" fill="rgba(255,255,255,0.6)" transform="rotate(-30 28 28)"/>
        <path d="M14 60 Q 22 50 30 60" stroke="currentColor" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
        <path d="M38 60 Q 46 50 54 60" stroke="currentColor" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
      </svg>`,
    dice: `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="10" width="34" height="34" rx="8" fill="currentColor" opacity="0.8" transform="rotate(-10 23 27)"/>
        <rect x="20" y="20" width="36" height="36" rx="9" fill="currentColor" transform="rotate(6 38 38)"/>
        <circle cx="30" cy="30" r="3" fill="#0a0518"/>
        <circle cx="46" cy="30" r="3" fill="#0a0518"/>

    snake: `

        <path d="M10 40 Q 10 22 26 22 L 42 22 Q 56 22 56 34 Q 56 46 42 46 L 26 46 Q 20 46 20 52 Q 20 56 26 56 L 40 56"
              fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="36" r="4" fill="currentColor"/>
        <circle cx="15" cy="33" r="1.6" fill="#0a0518"/>
        <circle cx="9" cy="33" r="1.6" fill="#0a0518"/>

    cards: `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="14" width="28" height="40" rx="4" fill="currentColor" opacity="0.7" transform="rotate(-12 20 34)"/>
        <rect x="22" y="10" width="30" height="42" rx="4" fill="currentColor" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
        <path d="M37 24 Q 37 30 42 30 Q 47 30 47 24 Q 47 19 42 14 Q 37 19 37 24 Z" fill="#0a0518" opacity="0.75"/>
        <path d="M30 44 L 32 44 L 32 48 L 30 48 Z M 44 44 L 46 44 L 46 48 L 44 48 Z" fill="#0a0518" opacity="0.7"/>
      </svg>`,
    blocks: `
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="14" height="14" rx="3" fill="currentColor"/>
        <rect x="22" y="6" width="14" height="14" rx="3" fill="currentColor"/>
        <rect x="38" y="6" width="14" height="14" rx="3" fill="currentColor"/>
        <rect x="6" y="22" width="14" height="14" rx="3" fill="currentColor" opacity="0.55"/>
        <rect x="22" y="22" width="14" height="14" rx="3" fill="currentColor" opacity="0.85"/>
        <rect x="38" y="22" width="14" height="14" rx="3" fill="currentColor" opacity="0.7"/>
        <rect x="22" y="38" width="14" height="14" rx="3" fill="currentColor"/>
        <rect x="38" y="38" width="14" height="14" rx="3" fill="currentColor" opacity="0.4"/>
        <rect x="6" y="38" width="14" height="14" rx="3" fill="currentColor" opacity="0.3"/>
      </svg>`,
  };

  /* ========================================================================
     UTILITIES
     ======================================================================== */

  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

  function hexToRgba(hex, alpha) {
    if (!hex) return "rgba(177, 118, 255, " + alpha + ")";
    let h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map((c) => c + c).join("");
    const n = parseInt(h, 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + alpha + ")";
  }

  /* ========================================================================
     PERSISTENCE
     ======================================================================== */

  const STORAGE_KEY = "saiv-arcade.save.v1";

  const Save = {
    data: { favorites: [], recent: [], muted: false, totalPlays: 0 },
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p && typeof p === "object") {
          if (Array.isArray(p.favorites)) this.data.favorites = p.favorites;
          if (Array.isArray(p.recent)) this.data.recent = p.recent;
          if (typeof p.muted === "boolean") this.data.muted = p.muted;
          if (typeof p.totalPlays === "number") this.data.totalPlays = p.totalPlays;
        }
      } catch (e) {}
    },
    save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); } catch (e) {}
    },
    markPlayed(id) {
      this.data.recent = this.data.recent.filter((x) => x !== id);
      this.data.recent.unshift(id);
      if (this.data.recent.length > 6) this.data.recent.length = 6;
      this.data.totalPlays++;
      this.save();
    },
    toggleFavorite(id) {
      const i = this.data.favorites.indexOf(id);
      if (i === -1) this.data.favorites.push(id);
      else this.data.favorites.splice(i, 1);
      this.save();
      return i === -1;
    },
    isFavorite(id) {
      return this.data.favorites.indexOf(id) !== -1;
    },
  };

  /* ========================================================================
     SOUND (tiny synth)
     ======================================================================== */

  const Sound = (function () {
    let ctx = null, master = null, muted = false, available = true;

    function init() {
      if (ctx || !available) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { available = false; return; }
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.14;
        master.connect(ctx.destination);
      } catch (e) { available = false; }
    }
    function resume() {
      if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
    }
    function tone(o) {
      if (!ctx || muted || !available) return;
      const now = ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.08;
      const vol = o.vol === undefined ? 0.25 : o.vol;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(o.freq, now);
      if (o.to && o.to !== o.freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), now + dur);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(master);
      osc.start(now); osc.stop(now + dur + 0.02);
    }

    return {
      init, resume,
      get muted() { return muted; },
      toggle() {
        muted = !muted;
        Save.data.muted = muted;
        Save.save();
        if (!muted) { resume(); this.click(); }
        return muted;
      },
      setMuted(v) { muted = !!v; Save.data.muted = muted; Save.save(); },

      click() { tone({ freq: 720, type: "sine", dur: 0.04, vol: 0.16 }); },
      tap()   { tone({ freq: 900, type: "sine", dur: 0.03, vol: 0.12 }); },
      open()  {
        tone({ freq: 500, to: 900, type: "sine", dur: 0.09, vol: 0.18 });
        tone({ freq: 1200, type: "sine", dur: 0.06, vol: 0.1, delay: 0.05 });
      },
      fav() {
        tone({ freq: 900, type: "sine", dur: 0.06, vol: 0.16 });
        tone({ freq: 1400, type: "sine", dur: 0.09, vol: 0.14, delay: 0.04 });
      },
      unfav() {
        tone({ freq: 500, to: 340, type: "sine", dur: 0.1, vol: 0.14 });
      },
    };
  })();

  const Haptics = {
    tap()  { if (navigator.vibrate) try { navigator.vibrate(6); } catch (e) {} },
    play() { if (navigator.vibrate) try { navigator.vibrate([12, 20, 12]); } catch (e) {} },
  };

  /* ========================================================================
     DOM
     ======================================================================== */

  const els = {
    hero: $("#hero"),
    heroBg: $("#heroBg"),
    heroIcon: $("#heroIcon"),
    heroTitle: $("#heroTitle"),
    heroDesc: $("#heroDesc"),
    filters: $("#filters"),
    grid: $("#grid"),
    gridCount: $("#gridCount"),
    toast: $("#toast"),
    btnSound: $("#btnSound"),
    iconSound: $("#iconSound"),
    hdrSub: $("#hdrSub"),
    logoImg: $("#hdrLogoImg"),
    logoFallback: $("#hdrLogoFallback"),
  };

  let activeFilter = "all";

  /* ---- Toast ---- */
  let toastTimer = 0;
  function showToast(text) {
    els.toast.textContent = text;
    els.toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1400);
  }

  /* ---- Hero ---- */
  function buildHero() {
    const featured = GAMES.find((g) => g.featured) || GAMES[0];

    els.hero.href = featured.href;
    els.hero.dataset.id = featured.id;
    els.hero.style.setProperty("--c1", featured.c1);
    els.hero.style.setProperty("--c2", featured.c2);
    els.hero.style.setProperty("--hero-glow", hexToRgba(featured.c1, 0.75));
    els.heroBg.style.setProperty("--c1", featured.c1);
    els.heroBg.style.setProperty("--c2", featured.c2);
    els.heroIcon.innerHTML = ICONS[featured.icon] || "";
    els.heroTitle.textContent = featured.title;
    els.heroDesc.textContent = featured.desc;

    els.hero.addEventListener("click", () => {
      Sound.init(); Sound.resume();
      Sound.open();
      Haptics.play();
      Save.markPlayed(featured.id);
    });
  }

  /* ---- Filters ---- */
  function buildFilters() {
    els.filters.innerHTML = "";
    CATEGORIES.forEach((c) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip" + (c.key === "all" ? " active" : "");
      btn.textContent = c.label;
      btn.dataset.cat = c.key;
      btn.addEventListener("click", () => {
        if (activeFilter === c.key) return;
        Sound.init(); Sound.resume();
        Sound.tap();
        activeFilter = c.key;
        $$(".chip", els.filters).forEach((el) => {
          el.classList.toggle("active", el.dataset.cat === c.key);
        });
        buildGrid();
      });
      els.filters.appendChild(btn);
    });
  }

  /* ---- Grid ---- */
  function buildGrid() {
    els.grid.innerHTML = "";

    const filtered = activeFilter === "all"
      ? GAMES
      : GAMES.filter((g) => g.category === activeFilter);

    els.gridCount.textContent = filtered.length + " title" + (filtered.length !== 1 ? "s" : "");

    filtered.forEach((g, i) => {
      const card = document.createElement("a");
      card.className = "card";
      card.href = g.href;
      card.dataset.id = g.id;
      card.style.setProperty("--c1", g.c1);
      card.style.setProperty("--c2", g.c2);
      card.style.setProperty("--glow", hexToRgba(g.c1, 0.7));
      card.style.setProperty("--stroke", hexToRgba(g.c1, 0.6));
      card.style.animationDelay = (i * 40) + "ms";

      // ---- Visual ----
      const visual = document.createElement("div");
      visual.className = "card-visual";

      // Category badge
      const cat = document.createElement("div");
      cat.className = "card-cat";
      cat.textContent = g.catLabel;
      visual.appendChild(cat);

      // Favorite button
      const fav = document.createElement("button");
      fav.type = "button";
      fav.className = "card-fav" + (Save.isFavorite(g.id) ? " on" : "");
      fav.setAttribute("aria-label", "Favorite");
      fav.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l2.7 5.6 6.2.9-4.5 4.4 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.1 9.5l6.2-.9z"/>
        </svg>`;
      fav.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        Sound.init(); Sound.resume();
        const added = Save.toggleFavorite(g.id);
        fav.classList.toggle("on", added);
        if (added) { Sound.fav(); showToast("Added to favorites"); }
        else { Sound.unfav(); }
      });
      visual.appendChild(fav);

      // Icon
      const icon = document.createElement("div");
      icon.className = "card-icon";
      icon.innerHTML = ICONS[g.icon] || "";
      visual.appendChild(icon);

      // Play overlay
      const playBtn = document.createElement("div");
      playBtn.className = "card-play";
      playBtn.innerHTML = `<svg viewBox="0 0 12 12"><path d="M3 1.5v9L10.5 6 3 1.5z"/></svg>`;
      visual.appendChild(playBtn);

      card.appendChild(visual);

      // ---- Body ----
      const body = document.createElement("div");
      body.className = "card-body";

      const name = document.createElement("div");
      name.className = "card-name";
      const brandSpan = document.createElement("span");
      brandSpan.className = "brand";
      brandSpan.textContent = g.brand;
      name.appendChild(brandSpan);
      name.appendChild(document.createTextNode(g.suffix));
      body.appendChild(name);

      const desc = document.createElement("div");
      desc.className = "card-desc";
      desc.textContent = g.desc;
      body.appendChild(desc);

      card.appendChild(body);

      // Card click
      card.addEventListener("click", () => {
        Sound.init(); Sound.resume();
        Sound.open();
        Haptics.play();
        Save.markPlayed(g.id);
      });

      els.grid.appendChild(card);
    });
  }

  /* ========================================================================
     LOGO IMAGE
     ======================================================================== */

  function initLogo() {
    // If the image fails to load, show the fallback letter
    if (!els.logoImg) return;
    els.logoImg.addEventListener("error", () => {
      els.logoImg.style.display = "none";
      if (els.logoFallback) els.logoFallback.style.display = "flex";
    });
    els.logoImg.addEventListener("load", () => {
      if (els.logoFallback) els.logoFallback.style.display = "none";
    });
    // If the image is already loaded (cached), trigger a check
    if (els.logoImg.complete) {
      if (els.logoImg.naturalWidth === 0) {
        els.logoImg.style.display = "none";
        if (els.logoFallback) els.logoFallback.style.display = "flex";
      }
    }
  }

  /* ========================================================================
     SOUND TOGGLE
     ======================================================================== */

  function updateSoundIcon() {
    const svg = els.iconSound;
    if (!svg) return;
    if (Sound.muted) {
      svg.innerHTML =
        '<path d="M4 9v6h4l5 4V5l-5 4H4z"/>' +
        '<line x1="17" y1="9" x2="22" y2="15"/>' +
        '<line x1="22" y1="9" x2="17" y2="15"/>';
    } else {
      svg.innerHTML =
        '<path d="M4 9v6h4l5 4V5l-5 4H4z"/>' +
        '<path d="M16 8.5a5 5 0 0 1 0 7"/>' +
        '<path d="M18.5 6a8.5 8.5 0 0 1 0 12"/>';
    }
  }

  /* ========================================================================
     BOOTSTRAP
     ======================================================================== */

  function init() {
    Save.load();
    Sound.setMuted(Save.data.muted);
    updateSoundIcon();

    els.hdrSub.textContent = GAMES.length + " games · one hub";

    buildHero();
    buildFilters();
    buildGrid();
    initLogo();

    els.btnSound.addEventListener("click", () => {
      Sound.init();
      Sound.toggle();
      updateSoundIcon();
      Haptics.tap();
    });

    document.addEventListener("gesturestart", (e) => e.preventDefault());

    // Init audio on first user gesture (autoplay policy)
    const unlock = () => {
      Sound.init();
      Sound.resume();
      document.removeEventListener("pointerdown", unlock);
    };
    document.addEventListener("pointerdown", unlock);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
