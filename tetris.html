<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEON TETRIS · GLASS EDITION</title>
  <style>
    /* ============================================================
       RESET & GLOBAL STYLES
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #0b0e1a, #02030a 90%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      padding: 12px;
      overflow: hidden;
      position: relative;
    }

    /* subtle animated glow behind everything */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 30% 30%, rgba(0, 255, 255, 0.08), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 0, 200, 0.08), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================================
       MAIN LAYOUT – GLASS PANEL & GAME CONTAINER
       ============================================================ */
    .game-shell {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: row;
      gap: 20px;
      background: rgba(12, 20, 30, 0.55);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border-radius: 48px;
      padding: 24px 28px;
      border: 1px solid rgba(80, 200, 255, 0.25);
      box-shadow:
        0 30px 50px -20px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(0, 255, 255, 0.1) inset,
        0 0 40px rgba(0, 180, 255, 0.15);
      transition: all 0.2s;
      max-width: 1100px;
      width: fit-content;
    }

    /* left – main playfield */
    .playfield-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-container {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0, 240, 255, 0.4),
        0 0 30px rgba(0, 200, 255, 0.3),
        0 20px 35px -10px black;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: auto;
      background: rgba(6, 10, 18, 0.75);
      backdrop-filter: blur(4px);
      border-radius: 28px;
    }

    /* ============================================================
       SIDE PANELS (SCORE, HOLD, NEXT, LEVEL)
       ============================================================ */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 150px;
    }

    .glass-card {
      background: rgba(16, 24, 36, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 16px 14px;
      border: 1px solid rgba(100, 210, 255, 0.3);
      box-shadow:
        0 10px 20px -10px black,
        0 0 15px rgba(0, 180, 255, 0.1) inset;
    }

    .panel-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 500;
      color: #a0e0ff;
      text-shadow: 0 0 8px rgba(0, 200, 255, 0.8);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-title i {
      font-style: normal;
      font-size: 14px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 15px #00e0ff, 0 0 30px #0088ff;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: #b0d0f0;
      font-size: 15px;
      font-weight: 500;
      margin-top: 4px;
    }

    .stat-row span:last-child {
      color: #fff;
      text-shadow: 0 0 8px cyan;
      font-weight: 600;
    }

    /* hold & next canvas */
    .mini-canvas {
      width: 100%;
      height: auto;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      border: 1px solid rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 200, 255, 0.2) inset;
      display: block;
    }

    .next-queue {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    /* ============================================================
       BUTTONS & MODALS
       ============================================================ */
    .btn {
      background: rgba(30, 60, 90, 0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.5);
      color: #e0f0ff;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 12px 18px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.2), 0 5px 15px -5px black;
      width: 100%;
      outline: none;
    }

    .btn:hover {
      background: rgba(50, 120, 180, 0.8);
      box-shadow: 0 0 25px #00ccff, 0 0 10px #00aaff inset;
      transform: scale(1.02);
      border-color: #a0f0ff;
    }

    .btn:active {
      transform: scale(0.96);
      background: rgba(0, 180, 255, 0.7);
      box-shadow: 0 0 40px cyan;
    }

    .btn.small {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 30px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    /* ============================================================
       OVERLAY MODALS (START, PAUSE, GAME OVER, SETTINGS)
       ============================================================ */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 8, 15, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(18, 28, 40, 0.85);
      backdrop-filter: blur(30px);
      border-radius: 48px;
      padding: 36px 34px;
      border: 1px solid rgba(0, 240, 255, 0.6);
      box-shadow:
        0 30px 50px -15px black,
        0 0 70px rgba(0, 200, 255, 0.3);
      max-width: 360px;
      width: 90%;
      text-align: center;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal h2 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #b0ffff, #80d0ff, #c080ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px cyan;
    }

    .modal p {
      color: #b8d0f0;
      font-size: 16px;
    }

    /* ============================================================
       MOBILE TOUCH CONTROLS
       ============================================================ */
    .touch-controls {
      display: none;
      margin-top: 18px;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
    }

    .touch-btn {
      background: rgba(30, 60, 90, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.45);
      border-radius: 22px;
      padding: 14px 0;
      color: #d0f0ff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(0, 200, 255, 0.3);
      transition: all 0.1s;
      touch-action: manipulation;
      cursor: pointer;
    }

    .touch-btn:active {
      transform: scale(0.88);
      background: rgba(0, 200, 255, 0.5);
      box-shadow: 0 0 30px cyan;
      border-color: white;
    }

    /* responsive */
    @media (max-width: 800px) {
      .game-shell {
        flex-direction: column;
        padding: 16px;
        border-radius: 36px;
        gap: 12px;
      }

      .sidebar {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        min-width: auto;
        gap: 10px;
      }

      .sidebar .glass-card {
        flex: 1 0 120px;
        padding: 12px;
      }

      .stat-value {
        font-size: 26px;
      }

      .touch-controls {
        display: grid;
      }

      .canvas-container {
        width: 100%;
        max-width: 340px;
        margin: 0 auto;
      }
    }

    @media (max-width: 500px) {
      .modal {
        padding: 28px 20px;
      }

      .modal h2 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <!-- ============================================================
       MAIN GAME SHELL
       ============================================================ -->
  <div class="game-shell" id="gameShell">
    <!-- PLAYFIELD -->
    <div class="playfield-wrapper">
      <div class="canvas-container">
        <canvas id="gameCanvas" width="300" height="600"></canvas>
      </div>
      <!-- MOBILE TOUCH CONTROLS -->
      <div class="touch-controls" id="touchControls">
        <div class="touch-btn" data-action="left">←</div>
        <div class="touch-btn" data-action="right">→</div>
        <div class="touch-btn" data-action="rotate">↻</div>
        <div class="touch-btn" data-action="softDrop">↓</div>
        <div class="touch-btn" data-action="hardDrop">⤓</div>
        <div class="touch-btn" data-action="hold" style="grid-column: span 2;">HOLD</div>
        <div class="touch-btn" data-action="pause" style="grid-column: span 3;">⏸ PAUSE</div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="glass-card">
        <div class="panel-title"><i>🏆</i> SCORE</div>
        <div class="stat-value" id="scoreDisplay">0</div>
        <div class="stat-row"><span>HIGH</span> <span id="highScoreDisplay">0</span></div>
      </div>

      <div class="glass-card">
        <div class="panel-title"><i>📊</i> LEVEL</div>
        <div class="stat-value" id="levelDisplay">1</div>
        <div class="stat-row"><span>LINES</span> <span id="linesDisplay">0</span></div>
      </div>

      <div class="glass-card">
        <div class="panel-title"><i>🔮</i> HOLD</div>
        <canvas id="holdCanvas" class="mini-canvas" width="100" height="100"></canvas>
      </div>

      <div class="glass-card">
        <div class="panel-title"><i>⏭️</i> NEXT</div>
        <div class="next-queue">
          <canvas id="nextCanvas1" class="mini-canvas" width="100" height="70"></canvas>
          <canvas id="nextCanvas2" class="mini-canvas" width="100" height="70"></canvas>
          <canvas id="nextCanvas3" class="mini-canvas" width="100" height="70"></canvas>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn small" id="pauseBtn">⏸ PAUSE</button>
        <button class="btn small" id="settingsBtn">⚙️</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       OVERLAYS: START / PAUSE / GAME OVER / SETTINGS
       ============================================================ -->
  <div class="overlay active" id="startOverlay">
    <div class="modal">
      <h2>NEON TETRIS</h2>
      <p>Glass · Neon · Synth</p>
      <button class="btn" id="startGameBtn">START GAME</button>
      <button class="btn" id="settingsBtnFromStart">⚙️ SETTINGS</button>
    </div>
  </div>

  <div class="overlay" id="pauseOverlay">
    <div class="modal">
      <h2>PAUSED</h2>
      <button class="btn" id="resumeBtn">RESUME</button>
      <button class="btn" id="restartFromPauseBtn">RESTART</button>
      <button class="btn" id="settingsBtnFromPause">⚙️ SETTINGS</button>
    </div>
  </div>

  <div class="overlay" id="gameOverOverlay">
    <div class="modal">
      <h2>GAME OVER</h2>
      <p id="finalScoreText">Score: 0</p>
      <button class="btn" id="restartGameBtn">PLAY AGAIN</button>
      <button class="btn" id="settingsBtnFromGameOver">⚙️ SETTINGS</button>
    </div>
  </div>

  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <h2>SETTINGS</h2>
      <div class="btn-row">
        <button class="btn" id="toggleSoundBtn">🔊 SOUND: ON</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="toggleGhostBtn">👻 GHOST: ON</button>
      </div>
      <button class="btn" id="closeSettingsBtn">CLOSE</button>
    </div>
  </div>

  <!-- ============================================================
       JAVASCRIPT – FULL GAME ENGINE
       ============================================================ -->
  <script>
    (function() {
      'use strict';

      // ============================================================
      // 1. CONSTANTS & CONFIGURATION
      // ============================================================
      const COLS = 10;
      const ROWS = 20;
      const BLOCK_SIZE = 30;          // game canvas block size (300/10)
      const MINI_BLOCK_SIZE = 20;     // for hold / next canvases

      // Tetromino definitions (SRS-compliant shapes + colors)
      const PIECES = {
        I: { shape: [[1,1,1,1]], color: '#00f0f0', glow: '#00ffff' },
        O: { shape: [[1,1],[1,1]], color: '#f0f000', glow: '#ffff00' },
        T: { shape: [[0,1,0],[1,1,1]], color: '#a000f0', glow: '#cc66ff' },
        S: { shape: [[0,1,1],[1,1,0]], color: '#00f000', glow: '#66ff66' },
        Z: { shape: [[1,1,0],[0,1,1]], color: '#f00000', glow: '#ff6666' },
        J: { shape: [[1,0,0],[1,1,1]], color: '#0000f0', glow: '#6666ff' },
        L: { shape: [[0,0,1],[1,1,1]], color: '#f0a000', glow: '#ffaa33' }
      };

      // SRS wall kick data (JLSTZ + I)
      const KICKS_JLSTZ = {
        '0->1': [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
        '1->0': [[0,0],[1,0],[1,-1],[0,2],[1,2]],
        '1->2': [[0,0],[1,0],[1,-1],[0,2],[1,2]],
        '2->1': [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
        '2->3': [[0,0],[1,0],[1,1],[0,-2],[1,-2]],
        '3->2': [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
        '3->0': [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
        '0->3': [[0,0],[1,0],[1,1],[0,-2],[1,-2]]
      };
      const KICKS_I = {
        '0->1': [[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
        '1->0': [[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
        '1->2': [[0,0],[-1,0],[2,0],[-1,2],[2,-1]],
        '2->1': [[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
        '2->3': [[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
        '3->2': [[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
        '3->0': [[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
        '0->3': [[0,0],[-1,0],[2,0],[-1,2],[2,-1]]
      };

      // Scoring
      const LINE_SCORES = { 1: 100, 2: 300, 3: 500, 4: 800 };
      const SOFT_DROP_BONUS = 1;
      const HARD_DROP_BONUS = 2;

      // ============================================================
      // 2. AUDIO SYNTHESIZER (Web Audio API)
      // ============================================================
      class SoundSynth {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }
        init() {
          if (this.ctx) return;
          try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) { this.enabled = false; }
        }
        play(type) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          let freq = 440, dur = 0.1, wave = 'sine', vol = 0.12;
          switch (type) {
            case 'move': freq = 220; dur = 0.04; wave = 'square'; vol = 0.06; break;
            case 'rotate': freq = 440; dur = 0.06; wave = 'triangle'; vol = 0.08; break;
            case 'softdrop': freq = 330; dur = 0.03; wave = 'sine'; vol = 0.05; break;
            case 'harddrop': freq = 120; dur = 0.12; wave = 'sawtooth'; vol = 0.14; break;
            case 'lineclear': freq = 880; dur = 0.18; wave = 'square'; vol = 0.12; break;
            case 'tetris': freq = 1320; dur = 0.3; wave = 'sawtooth'; vol = 0.16; break;
            case 'levelup': freq = 660; dur = 0.25; wave = 'triangle'; vol = 0.15; break;
            case 'gameover': freq = 110; dur = 0.6; wave = 'sawtooth'; vol = 0.18; break;
            case 'hold': freq = 550; dur = 0.08; wave = 'sine'; vol = 0.1; break;
          }
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now);
          if (type === 'lineclear' || type === 'tetris' || type === 'levelup') {
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + dur);
          }
          if (type === 'gameover') {
            osc.frequency.exponentialRampToValueAtTime(50, now + dur);
          }
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        }
      }

      // ============================================================
      // 3. PARTICLE SYSTEM (Canvas explosion effects)
      // ============================================================
      class ParticleSystem {
        constructor() {
          this.particles = [];
        }
        burst(x, y, color, count = 20) {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.5 + Math.random() * 5;
            this.particles.push({
              x, y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 1.0,
              decay: 0.015 + Math.random() * 0.03,
              color: color,
              size: 2 + Math.random() * 5
            });
          }
        }
        update() {
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.12;
            p.life -= p.decay;
            if (p.life <= 0) {
              this.particles.splice(i, 1);
            }
          }
        }
        draw(ctx) {
          for (const p of this.particles) {
            ctx.globalAlpha = p.life;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 15;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
        }
      }

      // ============================================================
      // 4. TETROMINO CLASS
      // ============================================================
      class Piece {
        constructor(type) {
          this.type = type;
          this.shape = PIECES[type].shape.map(row => [...row]);
          this.color = PIECES[type].color;
          this.glow = PIECES[type].glow;
          this.rotation = 0; // 0,1,2,3
        }
        rotateCW() {
          const old = this.shape;
          const n = old.length, m = old[0].length;
          const rotated = Array.from({ length: m }, () => Array(n).fill(0));
          for (let i = 0; i < n; i++)
            for (let j = 0; j < m; j++)
              rotated[j][n - 1 - i] = old[i][j];
          this.shape = rotated;
          this.rotation = (this.rotation + 1) % 4;
        }
        rotateCCW() {
          const old = this.shape;
          const n = old.length, m = old[0].length;
          const rotated = Array.from({ length: m }, () => Array(n).fill(0));
          for (let i = 0; i < n; i++)
            for (let j = 0; j < m; j++)
              rotated[m - 1 - j][i] = old[i][j];
          this.shape = rotated;
          this.rotation = (this.rotation + 3) % 4;
        }
        clone() {
          const p = new Piece(this.type);
          p.shape = this.shape.map(row => [...row]);
          p.rotation = this.rotation;
          return p;
        }
      }

      // ============================================================
      // 5. GAME ENGINE CLASS
      // ============================================================
      class TetrisGame {
        constructor() {
          this.sound = new SoundSynth();
          this.particles = new ParticleSystem();
          this.board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
          this.currentPiece = null;
          this.holdPiece = null;
          this.holdUsed = false;
          this.nextQueue = [];
          this.score = 0;
          this.highScore = parseInt(localStorage.getItem('neonTetrisHigh')) || 0;
          this.level = 1;
          this.lines = 0;
          this.combo = -1;
          this.gameActive = false;
          this.paused = false;
          this.gameOverFlag = false;
          this.dropCounter = 0;
          this.dropInterval = 800; // ms per gravity step
          this.lastTime = 0;
          this.softDropActive = false;
          this.ghostEnabled = true;
          this.soundEnabled = true;
          this.animationFrame = null;

          // DOM elements
          this.canvas = document.getElementById('gameCanvas');
          this.ctx = this.canvas.getContext('2d');
          this.holdCanvas = document.getElementById('holdCanvas');
          this.holdCtx = this.holdCanvas.getContext('2d');
          this.nextCanvases = [
            document.getElementById('nextCanvas1'),
            document.getElementById('nextCanvas2'),
            document.getElementById('nextCanvas3')
          ];
          this.nextCtxs = this.nextCanvases.map(c => c.getContext('2d'));
          this.scoreDisplay = document.getElementById('scoreDisplay');
          this.highScoreDisplay = document.getElementById('highScoreDisplay');
          this.levelDisplay = document.getElementById('levelDisplay');
          this.linesDisplay = document.getElementById('linesDisplay');

          // Initialize next queue
          this.refillQueue();
          this.updateUI();
        }

        // ---------- GAME STATE ----------
        start() {
          this.reset();
          this.gameActive = true;
          this.paused = false;
          this.gameOverFlag = false;
          this.lastTime = performance.now();
          this.spawnPiece();
          this.updateUI();
          this.hideAllOverlays();
          this.loop(performance.now());
        }

        reset() {
          this.board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
          this.currentPiece = null;
          this.holdPiece = null;
          this.holdUsed = false;
          this.score = 0;
          this.level = 1;
          this.lines = 0;
          this.combo = -1;
          this.dropCounter = 0;
          this.dropInterval = 800;
          this.nextQueue = [];
          this.refillQueue();
          this.particles = new ParticleSystem();
          this.updateUI();
        }

        refillQueue() {
          while (this.nextQueue.length < 3) {
            const types = Object.keys(PIECES);
            const rand = types[Math.floor(Math.random() * types.length)];
            this.nextQueue.push(rand);
          }
        }

        spawnPiece() {
          this.refillQueue();
          const type = this.nextQueue.shift();
          this.refillQueue();
          this.currentPiece = new Piece(type);
          // spawn position: centered, top
          this.currentPiece.x = Math.floor((COLS - this.currentPiece.shape[0].length) / 2);
          this.currentPiece.y = 0;
          this.holdUsed = false;

          // check collision immediately (game over)
          if (this.collides(this.currentPiece.shape, this.currentPiece.x, this.currentPiece.y)) {
            this.gameOver();
            return false;
          }
          return true;
        }

        // ---------- COLLISION ----------
        collides(shape, offsetX, offsetY) {
          for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[0].length; c++) {
              if (!shape[r][c]) continue;
              const boardX = offsetX + c;
              const boardY = offsetY + r;
              if (boardX < 0 || boardX >= COLS || boardY >= ROWS) return true;
              if (boardY >= 0 && this.board[boardY][boardX]) return true;
            }
          }
          return false;
        }

        // ---------- MOVEMENT ----------
        movePiece(dx, dy) {
          if (!this.currentPiece || !this.gameActive || this.paused) return false;
          const p = this.currentPiece;
          if (!this.collides(p.shape, p.x + dx, p.y + dy)) {
            p.x += dx;
            p.y += dy;
            if (dx !== 0) this.sound.play('move');
            if (dy > 0) this.sound.play('softdrop');
            return true;
          }
          return false;
        }

        softDrop() {
          if (!this.currentPiece || !this.gameActive || this.paused) return;
          if (this.movePiece(0, 1)) {
            this.score += SOFT_DROP_BONUS;
            this.updateUI();
          } else {
            this.lockPiece();
          }
          this.dropCounter = 0;
        }

        hardDrop() {
          if (!this.currentPiece || !this.gameActive || this.paused) return;
          let dropped = 0;
          while (!this.collides(this.currentPiece.shape, this.currentPiece.x, this.currentPiece.y + 1)) {
            this.currentPiece.y++;
            dropped++;
          }
          this.score += dropped * HARD_DROP_BONUS;
          this.sound.play('harddrop');
          this.lockPiece();
          this.dropCounter = 0;
          this.updateUI();
        }

        rotatePiece(clockwise = true) {
          if (!this.currentPiece || !this.gameActive || this.paused) return;
          const p = this.currentPiece;
          const oldRotation = p.rotation;
          const oldShape = p.shape.map(row => [...row]);

          if (clockwise) p.rotateCW(); else p.rotateCCW();
          const newRotation = p.rotation;

          // choose kick table
          const kickTable = (p.type === 'I') ? KICKS_I : KICKS_JLSTZ;
          const key = `${oldRotation}->${newRotation}`;
          const kicks = kickTable[key] || [[0,0]];

          let valid = false;
          for (const [dx, dy] of kicks) {
            if (!this.collides(p.shape, p.x + dx, p.y + dy)) {
              p.x += dx;
              p.y += dy;
              valid = true;
              break;
            }
          }
          if (!valid) {
            // revert
            p.shape = oldShape;
            p.rotation = oldRotation;
          } else {
            this.sound.play('rotate');
          }
        }

        hold() {
          if (!this.currentPiece || !this.gameActive || this.paused || this.holdUsed) return;
          const currentType = this.currentPiece.type;
          if (this.holdPiece) {
            const temp = this.holdPiece;
            this.holdPiece = currentType;
            this.currentPiece = new Piece(temp);
          } else {
            this.holdPiece = currentType;
            this.spawnPiece();
          }
          // reposition
          this.currentPiece.x = Math.floor((COLS - this.currentPiece.shape[0].length) / 2);
          this.currentPiece.y = 0;
          this.holdUsed = true;
          this.sound.play('hold');
        }

        // ---------- LOCK & CLEAR ----------
        lockPiece() {
          if (!this.currentPiece) return;
          const p = this.currentPiece;
          for (let r = 0; r < p.shape.length; r++) {
            for (let c = 0; c < p.shape[0].length; c++) {
              if (!p.shape[r][c]) continue;
              const boardY = p.y + r;
              const boardX = p.x + c;
              if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                this.board[boardY][boardX] = p.type;
              }
            }
          }

          // Particle burst on lock
          for (let r = 0; r < p.shape.length; r++) {
            for (let c = 0; c < p.shape[0].length; c++) {
              if (p.shape[r][c]) {
                const px = (p.x + c) * BLOCK_SIZE + BLOCK_SIZE / 2;
                const py = (p.y + r) * BLOCK_SIZE + BLOCK_SIZE / 2;
                this.particles.burst(px, py, PIECES[p.type].glow, 8);
              }
            }
          }

          this.clearLines();
          if (this.gameActive) this.spawnPiece();
        }

        clearLines() {
          let linesCleared = 0;
          for (let r = ROWS - 1; r >= 0; r--) {
            if (this.board[r].every(cell => cell !== null)) {
              // clear row
              this.board.splice(r, 1);
              this.board.unshift(Array(COLS).fill(null));
              linesCleared++;
              r++; // recheck same index
            }
          }

          if (linesCleared > 0) {
            // score & effects
            const baseScore = LINE_SCORES[linesCleared] || 0;
            const comboMultiplier = Math.max(0, this.combo);
            const total = (baseScore + comboMultiplier * 50) * this.level;
            this.score += total;
            this.lines += linesCleared;
            this.combo++;

            // particle burst per line
            for (let i = 0; i < linesCleared; i++) {
              for (let c = 0; c < COLS; c++) {
                this.particles.burst(c * BLOCK_SIZE + BLOCK_SIZE/2, (ROWS-1) * BLOCK_SIZE, '#ffffff', 15);
              }
            }

            // sound
            if (linesCleared === 4) this.sound.play('tetris');
            else this.sound.play('lineclear');

            // level up every 10 lines
            const newLevel = Math.floor(this.lines / 10) + 1;
            if (newLevel > this.level) {
              this.level = newLevel;
              this.dropInterval = Math.max(60, 800 - (this.level - 1) * 70);
              this.sound.play('levelup');
            }
            this.updateUI();
          } else {
            this.combo = -1; // reset combo on no clear
          }

          this.updateUI();
        }

        // ---------- GAME OVER ----------
        gameOver() {
          this.gameActive = false;
          this.gameOverFlag = true;
          this.sound.play('gameover');
          // update high score
          if (this.score > this.highScore) {
            this.highScore = this.score;
            localStorage.setItem('neonTetrisHigh', this.highScore);
          }
          this.updateUI();
          this.showGameOver();
        }

        // ---------- RENDERING ----------
        drawBlock(ctx, x, y, size, color, glow, alpha = 1) {
          ctx.globalAlpha = alpha;
          ctx.shadowColor = glow;
          ctx.shadowBlur = 15;
          ctx.fillStyle = color;
          ctx.fillRect(x, y, size, size);
          // inner highlight
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
          // border neon
          ctx.strokeStyle = glow;
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 1, y + 1, size - 2, size - 2);
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
        }

        draw() {
          const ctx = this.ctx;
          const w = this.canvas.width;
          const h = this.canvas.height;
          ctx.clearRect(0, 0, w, h);

          // background subtle grid
          ctx.strokeStyle = 'rgba(60, 120, 180, 0.15)';
          ctx.lineWidth = 1;
          for (let i = 0; i <= COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(i * BLOCK_SIZE, 0);
            ctx.lineTo(i * BLOCK_SIZE, h);
            ctx.stroke();
          }
          for (let i = 0; i <= ROWS; i++) {
            ctx.beginPath();
            ctx.moveTo(0, i * BLOCK_SIZE);
            ctx.lineTo(w, i * BLOCK_SIZE);
            ctx.stroke();
          }

          // draw board
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const type = this.board[r][c];
              if (type) {
                this.drawBlock(ctx, c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, PIECES[type].color, PIECES[type].glow);
              }
            }
          }

          // ghost piece
          if (this.currentPiece && this.ghostEnabled && this.gameActive && !this.paused) {
            const p = this.currentPiece;
            let ghostY = p.y;
            while (!this.collides(p.shape, p.x, ghostY + 1)) ghostY++;
            if (ghostY !== p.y) {
              for (let r = 0; r < p.shape.length; r++) {
                for (let c = 0; c < p.shape[0].length; c++) {
                  if (p.shape[r][c]) {
                    ctx.globalAlpha = 0.25;
                    ctx.shadowColor = PIECES[p.type].glow;
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = PIECES[p.type].color;
                    ctx.fillRect((p.x + c) * BLOCK_SIZE, (ghostY + r) * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                  }
                }
              }
            }
          }

          // current piece
          if (this.currentPiece && this.gameActive && !this.paused) {
            const p = this.currentPiece;
            for (let r = 0; r < p.shape.length; r++) {
              for (let c = 0; c < p.shape[0].length; c++) {
                if (p.shape[r][c]) {
                  this.drawBlock(
                    ctx,
                    (p.x + c) * BLOCK_SIZE,
                    (p.y + r) * BLOCK_SIZE,
                    BLOCK_SIZE,
                    PIECES[p.type].color,
                    PIECES[p.type].glow
                  );
                }
              }
            }
          }

          // particles
          this.particles.draw(ctx);
        }

        drawMiniPiece(ctx, type, canvasW, canvasH) {
          if (!type) return;
          const shape = PIECES[type].shape;
          const cols = shape[0].length;
          const rows = shape.length;
          const blockSize = Math.min(
            (canvasW - 20) / cols,
            (canvasH - 20) / rows,
            MINI_BLOCK_SIZE
          );
          const offsetX = (canvasW - cols * blockSize) / 2;
          const offsetY = (canvasH - rows * blockSize) / 2;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (shape[r][c]) {
                const x = offsetX + c * blockSize;
                const y = offsetY + r * blockSize;
                ctx.shadowColor = PIECES[type].glow;
                ctx.shadowBlur = 12;
                ctx.fillStyle = PIECES[type].color;
                ctx.fillRect(x, y, blockSize, blockSize);
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(x + 2, y + 2, blockSize - 4, blockSize - 4);
                ctx.strokeStyle = PIECES[type].glow;
                ctx.lineWidth = 1.5;
                ctx.strokeRect(x + 1, y + 1, blockSize - 2, blockSize - 2);
              }
            }
          }
        }

        updateSidePanels() {
          // hold
          const hCtx = this.holdCtx;
          hCtx.clearRect(0, 0, this.holdCanvas.width, this.holdCanvas.height);
          if (this.holdPiece) {
            this.drawMiniPiece(hCtx, this.holdPiece, this.holdCanvas.width, this.holdCanvas.height);
          }
          // next 3
          for (let i = 0; i < 3; i++) {
            const ctx = this.nextCtxs[i];
            const cvs = this.nextCanvases[i];
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            const type = this.nextQueue[i];
            if (type) this.drawMiniPiece(ctx, type, cvs.width, cvs.height);
          }
        }

        updateUI() {
          this.scoreDisplay.textContent = this.score;
          this.highScoreDisplay.textContent = this.highScore;
          this.levelDisplay.textContent = this.level;
          this.linesDisplay.textContent = this.lines;
          this.updateSidePanels();
        }

        // ---------- GAME LOOP ----------
        loop(timestamp) {
          if (!this.gameActive) return;
          if (this.paused) {
            this.animationFrame = requestAnimationFrame((t) => this.loop(t));
            return;
          }

          const delta = timestamp - this.lastTime;
          this.lastTime = timestamp;
          this.dropCounter += delta;

          if (this.dropCounter >= this.dropInterval) {
            this.dropCounter = 0;
            if (this.currentPiece) {
              if (!this.movePiece(0, 1)) {
                this.lockPiece();
              }
            }
          }

          this.particles.update();
          this.draw();
          this.updateUI();
          this.animationFrame = requestAnimationFrame((t) => this.loop(t));
        }

        pause() {
          if (!this.gameActive || this.gameOverFlag) return;
          this.paused = true;
          this.showPause();
        }

        resume() {
          if (!this.gameActive || this.gameOverFlag || !this.paused) return;
          this.paused = false;
          this.lastTime = performance.now();
          this.hideAllOverlays();
          this.animationFrame = requestAnimationFrame((t) => this.loop(t));
        }

        // ---------- OVERLAY MANAGEMENT ----------
        hideAllOverlays() {
          document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
        }

        showStart() {
          this.hideAllOverlays();
          document.getElementById('startOverlay').classList.add('active');
        }

        showPause() {
          this.hideAllOverlays();
          document.getElementById('pauseOverlay').classList.add('active');
        }

        showGameOver() {
          this.hideAllOverlays();
          document.getElementById('finalScoreText').textContent = `SCORE: ${this.score}`;
          document.getElementById('gameOverOverlay').classList.add('active');
        }

        showSettings() {
          this.hideAllOverlays();
          document.getElementById('settingsOverlay').classList.add('active');
        }

        toggleSound() {
          this.soundEnabled = !this.soundEnabled;
          this.sound.enabled = this.soundEnabled;
          document.getElementById('toggleSoundBtn').textContent = `🔊 SOUND: ${this.soundEnabled ? 'ON' : 'OFF'}`;
        }

        toggleGhost() {
          this.ghostEnabled = !this.ghostEnabled;
          document.getElementById('toggleGhostBtn').textContent = `👻 GHOST: ${this.ghostEnabled ? 'ON' : 'OFF'}`;
        }
      }

      // ============================================================
      // 6. INITIALIZE GAME AND BIND EVENTS
      // ============================================================
      const game = new TetrisGame();

      // ----- Keyboard Controls -----
      document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (!game.gameActive || game.paused) {
          if (key === 'p' || key === 'P' || key === 'Escape') {
            if (game.gameActive && !game.gameOverFlag) game.pause();
          }
          return;
        }
        e.preventDefault();

        switch (key) {
          case 'ArrowLeft': case 'a': case 'A': game.movePiece(-1, 0); break;
          case 'ArrowRight': case 'd': case 'D': game.movePiece(1, 0); break;
          case 'ArrowDown': case 's': case 'S': game.softDrop(); break;
          case 'ArrowUp': case 'w': case 'W': game.rotatePiece(true); break;
          case 'z': case 'Z': game.rotatePiece(false); break;
          case ' ': game.hardDrop(); break;
          case 'c': case 'C': case 'Shift': game.hold(); break;
          case 'p': case 'P': case 'Escape': game.pause(); break;
        }
      });

      // ----- Touch Controls -----
      document.querySelectorAll('.touch-btn').forEach(btn => {
        const action = btn.dataset.action;
        const handler = (e) => {
          e.preventDefault();
          if (!game.gameActive || game.paused) return;
          switch (action) {
            case 'left': game.movePiece(-1, 0); break;
            case 'right': game.movePiece(1, 0); break;
            case 'softDrop': game.softDrop(); break;
            case 'hardDrop': game.hardDrop(); break;
            case 'rotate': game.rotatePiece(true); break;
            case 'hold': game.hold(); break;
            case 'pause': game.pause(); break;
          }
        };
        btn.addEventListener('touchstart', handler, { passive: false });
        btn.addEventListener('mousedown', handler);
      });

      // ----- Swipe Gestures on Canvas -----
      let touchStartX = 0, touchStartY = 0;
      game.canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      game.canvas.addEventListener('touchend', (e) => {
        if (!game.gameActive || game.paused) return;
        const touch = e.changedTouches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);

        if (Math.max(absDx, absDy) < 30) return; // ignore taps

        if (absDx > absDy) {
          // horizontal swipe
          if (dx > 0) game.movePiece(1, 0);
          else game.movePiece(-1, 0);
        } else {
          // vertical swipe
          if (dy > 0) game.softDrop(); // soft drop
          else game.rotatePiece(true); // swipe up = rotate
        }
      }, { passive: true });

      // ----- UI Buttons -----
      document.getElementById('startGameBtn').addEventListener('click', () => {
        game.sound.init();
        game.start();
      });

      document.getElementById('pauseBtn').addEventListener('click', () => {
        if (game.gameActive && !game.paused) game.pause();
        else if (game.paused) game.resume();
      });

      document.getElementById('settingsBtn').addEventListener('click', () => game.showSettings());
      document.getElementById('settingsBtnFromStart').addEventListener('click', () => game.showSettings());
      document.getElementById('settingsBtnFromPause').addEventListener('click', () => game.showSettings());
      document.getElementById('settingsBtnFromGameOver').addEventListener('click', () => game.showSettings());

      document.getElementById('resumeBtn').addEventListener('click', () => game.resume());
      document.getElementById('restartFromPauseBtn').addEventListener('click', () => {
        game.reset();
        game.start();
      });
      document.getElementById('restartGameBtn').addEventListener('click', () => {
        game.reset();
        game.start();
      });

      document.getElementById('closeSettingsBtn').addEventListener('click', () => {
        game.hideAllOverlays();
        if (game.gameActive && !game.gameOverFlag) {
          if (game.paused) game.showPause();
        } else if (!game.gameActive && !game.gameOverFlag) {
          game.showStart();
        }
      });

      document.getElementById('toggleSoundBtn').addEventListener('click', () => game.toggleSound());
      document.getElementById('toggleGhostBtn').addEventListener('click', () => game.toggleGhost());

      // ----- Initialize UI -----
      game.updateUI();
      game.showStart();

      // expose for debugging (optional)
      window._game = game;
    })();
  </script>
</body>
</html>
