<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<meta name="description" content="SaivTETRIS — a polished mobile-first Tetris built with vanilla JS." />
<title>SaivTETRIS</title>
<style>
/* ============================================================================
   SaivTETRIS — STYLESHEET
   ----------------------------------------------------------------------------
   Design system:
     - CSS custom properties for all theming
     - Dark futuristic flat design with soft neon glows
     - Mobile-first, 9:16 aspect ratio play container
     - 60fps transforms/opacity transitions only
   ========================================================================== */

/* ---------------------------------------------------------------------------
   1. DESIGN TOKENS
   ------------------------------------------------------------------------- */
:root {
  /* Base surfaces */
  --bg-void:        #03050a;
  --bg-deep:        #06090f;
  --bg-panel:       rgba(255, 255, 255, 0.038);
  --bg-panel-hi:    rgba(255, 255, 255, 0.075);
  --stroke-soft:    rgba(255, 255, 255, 0.07);
  --stroke-mid:     rgba(255, 255, 255, 0.12);

  /* Typography */
  --text:           #e9eefb;
  --text-dim:       #93a1bd;
  --text-faint:     #5b6883;

  /* Accents */
  --accent:         #38e8ff;
  --accent-2:       #b14bff;
  --accent-3:       #ff3d81;
  --good:           #3dffa2;

  /* Ambient (updated dynamically by JS per level) */
  --glow-a:         hsla(190, 100%, 60%, 0.16);
  --glow-b:         hsla(280, 100%, 62%, 0.14);

  /* Motion */
  --ease-out:       cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring:    cubic-bezier(0.34, 1.56, 0.64, 1);

  /* Layout */
  --radius-lg:      26px;
  --radius-md:      16px;
  --radius-sm:      11px;
  --gap:            8px;
}

/* ---------------------------------------------------------------------------
   2. RESET & BASE
   ------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
  width: 100%;
}

body {
  background: var(--bg-void);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
               system-ui, "Apple Color Emoji", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

/* Ambient animated background (desktop + mobile) */
body::before {
  content: "";
  position: fixed;
  inset: -25%;
  z-index: 0;
  background:
    radial-gradient(circle at 22% 12%, var(--glow-a), transparent 42%),
    radial-gradient(circle at 78% 85%, var(--glow-b), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02), transparent 60%);
  filter: blur(50px);
  transition: background 1.2s var(--ease-out);
  animation: ambientDrift 22s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes ambientDrift {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(-3%, 2%, 0) scale(1.06); }
  100% { transform: translate3d(3%, -2%, 0) scale(1.02); }
}

/* ---------------------------------------------------------------------------
   3. APP SHELL (9:16 play container)
   ------------------------------------------------------------------------- */
.app {
  --avail-h: min(100vh, 880px);
  position: relative;
  z-index: 1;

  height: var(--avail-h);
  width: min(420px, 100vw, calc(var(--avail-h) * 9 / 16));

  display: flex;
  flex-direction: column;
  gap: var(--gap);

  padding: 10px 10px 12px;

  background: linear-gradient(168deg, #0c1223 0%, #080c17 48%, #05070e 100%);
  border: 1px solid var(--stroke-soft);
  border-radius: var(--radius-lg);
  box-shadow:
    0 48px 110px -28px rgba(0, 0, 0, 0.95),
    0 0 0 1px rgba(56, 232, 255, 0.045),
    inset 0 1px 0 rgba(255, 255, 255, 0.055);
  overflow: hidden;
  isolation: isolate;
}

@supports (height: 100dvh) {
  .app { --avail-h: min(100dvh, 880px); }
}

/* Edge-to-edge on true mobile screens */
@media (max-width: 430px) and (max-height: 900px) {
  .app {
    border-radius: 0;
    border-left: none;
    border-right: none;
    box-shadow: none;
    padding: 8px 8px 10px;
  }
}

/* ---------------------------------------------------------------------------
   4. HUD (score / high / level / lines)
   ------------------------------------------------------------------------- */
.hud {
  display: grid;
  grid-template-columns: 1.35fr 1fr 1fr 1fr;
  gap: 6px;
  flex: 0 0 auto;
}

.hud-cell {
  background: var(--bg-panel);
  border: 1px solid var(--stroke-soft);
  border-radius: var(--radius-sm);
  padding: 6px 8px 7px;
  min-width: 0;
  overflow: hidden;
  transition: border-color 0.3s ease, background 0.3s ease;
}

.hud-cell.flash {
  border-color: rgba(56, 232, 255, 0.55);
  background: rgba(56, 232, 255, 0.09);
}

.hud-label {
  display: block;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 1px;
  white-space: nowrap;
}

.hud-value {
  display: block;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud-cell[data-accent="score"] .hud-value { color: var(--accent); text-shadow: 0 0 16px rgba(56, 232, 255, 0.45); }
.hud-cell[data-accent="level"] .hud-value { color: var(--accent-2); text-shadow: 0 0 16px rgba(177, 75, 255, 0.45); }
.hud-cell[data-accent="lines"] .hud-value { color: var(--good); text-shadow: 0 0 16px rgba(61, 255, 162, 0.4); }

/* ---------------------------------------------------------------------------
   5. STAGE (playfield + sidebar)
   ------------------------------------------------------------------------- */
.stage {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  gap: var(--gap);
  align-items: stretch;
}

.board-wrap {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: box-shadow 0.4s ease;
}

/* Danger pulse when the stack gets high */
.board-wrap.danger {
  box-shadow: inset 0 0 0 1px rgba(255, 61, 129, 0.35), 0 0 34px -6px rgba(255, 61, 129, 0.4);
  animation: dangerPulse 1.1s ease-in-out infinite;
}

@keyframes dangerPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.62; }
}

#board {
  display: block;
  border-radius: var(--radius-md);
  background:
    radial-gradient(ellipse at 50% 0%, rgba(56, 232, 255, 0.055), transparent 62%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.022), rgba(255, 255, 255, 0.008));
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.065),
    inset 0 0 60px rgba(0, 0, 0, 0.5),
    0 0 42px -14px rgba(56, 232, 255, 0.22);
  touch-action: none;
}

/* ---------------------------------------------------------------------------
   6. SIDEBAR (hold / next / mini stats)
   ------------------------------------------------------------------------- */
.side {
  flex: 0 0 84px;
  width: 84px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 0;
}

.panel {
  position: relative;
  background: var(--bg-panel);
  border: 1px solid var(--stroke-soft);
  border-radius: var(--radius-sm);
  padding: 5px 5px 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow: hidden;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.panel-label {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-faint);
  text-align: center;
}

.panel canvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 6px;
}

.hold-panel.swap {
  animation: holdSwap 0.32s var(--ease-spring);
}

@keyframes holdSwap {
  0%   { transform: scale(0.9) rotate(-4deg); border-color: var(--accent); }
  55%  { transform: scale(1.05) rotate(2deg); }
  100% { transform: scale(1) rotate(0deg); }
}

.hold-panel.locked {
  opacity: 0.42;
  filter: saturate(0.35);
}

.next-panel { flex: 0 0 auto; }

/* Mini stat chips */
.chips {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  justify-content: flex-start;
}

.chip {
  background: var(--bg-panel);
  border: 1px solid var(--stroke-soft);
  border-radius: 9px;
  padding: 4px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-height: 26px;
  transition: all 0.25s var(--ease-out);
}

.chip .k {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.1em;
  color: var(--text-faint);
  text-transform: uppercase;
}

.chip .v {
  font-size: 11.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
}

.chip.on {
  border-color: rgba(61, 255, 162, 0.5);
  background: rgba(61, 255, 162, 0.09);
}
.chip.on .v { color: var(--good); text-shadow: 0 0 12px rgba(61, 255, 162, 0.55); }

.chip.hot {
  border-color: rgba(255, 61, 129, 0.55);
  background: rgba(255, 61, 129, 0.1);
}
.chip.hot .v { color: var(--accent-3); text-shadow: 0 0 12px rgba(255, 61, 129, 0.55); }

/* ---------------------------------------------------------------------------
   7. TOAST MESSAGES (TETRIS!, T-SPIN, COMBO...)
   ------------------------------------------------------------------------- */
.toast {
  position: absolute;
  left: 50%;
  top: 34%;
  transform: translate(-50%, -50%) scale(0.7);
  opacity: 0;
  z-index: 6;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
  will-change: transform, opacity;
}

.toast.show {
  animation: toastPop 1.15s cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
}

.toast .t-main {
  display: block;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 0.04em;
  background: linear-gradient(92deg, var(--accent), var(--accent-2) 55%, var(--accent-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 18px rgba(56, 232, 255, 0.55));
}

.toast .t-sub {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--good);
  text-shadow: 0 0 14px rgba(61, 255, 162, 0.6);
}

@keyframes toastPop {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
  16%  { opacity: 1; transform: translate(-50%, -50%) scale(1.14); }
  28%  { transform: translate(-50%, -50%) scale(1); }
  70%  { opacity: 1; transform: translate(-50%, -52%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -74%) scale(0.94); }
}

/* Floating score popups (+1200) */
.float-score {
  position: absolute;
  z-index: 5;
  font-size: 14px;
  font-weight: 900;
  color: var(--good);
  text-shadow: 0 0 14px rgba(61, 255, 162, 0.75);
  pointer-events: none;
  animation: floatUp 0.95s var(--ease-out) forwards;
  font-variant-numeric: tabular-nums;
}

@keyframes floatUp {
  0%   { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
  20%  { opacity: 1; transform: translate(-50%, -8px) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -46px) scale(0.95); }
}

/* ---------------------------------------------------------------------------
   8. TOUCH CONTROL DECK
   ------------------------------------------------------------------------- */
.controls {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.ctl-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  min-height: 50px;
  padding: 6px 2px 5px;

  background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.018));
  border: 1px solid var(--stroke-soft);
  border-radius: 13px;
  color: var(--text-dim);

  font-family: inherit;
  font-size: 7.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;

  cursor: pointer;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;

  transition: transform 0.08s var(--ease-out),
              background 0.18s ease,
              border-color 0.18s ease,
              box-shadow 0.18s ease,
              color 0.18s ease;
  will-change: transform;
}

.ctl-btn svg {
  width: 21px;
  height: 21px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.ctl-btn span { pointer-events: none; }

.ctl-btn:active,
.ctl-btn.active {
  transform: scale(0.93);
  color: var(--accent);
  border-color: rgba(56, 232, 255, 0.45);
  background: linear-gradient(180deg, rgba(56, 232, 255, 0.2), rgba(56, 232, 255, 0.05));
  box-shadow: 0 0 20px -4px rgba(56, 232, 255, 0.7), inset 0 0 18px rgba(56, 232, 255, 0.1);
}

.ctl-btn.accent-purple:active,
.ctl-btn.accent-purple.active {
  color: var(--accent-2);
  border-color: rgba(177, 75, 255, 0.5);
  background: linear-gradient(180deg, rgba(177, 75, 255, 0.22), rgba(177, 75, 255, 0.05));
  box-shadow: 0 0 20px -4px rgba(177, 75, 255, 0.7);
}

.ctl-btn.accent-pink:active,
.ctl-btn.accent-pink.active {
  color: var(--accent-3);
  border-color: rgba(255, 61, 129, 0.5);
  background: linear-gradient(180deg, rgba(255, 61, 129, 0.22), rgba(255, 61, 129, 0.05));
  box-shadow: 0 0 20px -4px rgba(255, 61, 129, 0.7);
}

.ctl-btn.accent-green:active,
.ctl-btn.accent-green.active {
  color: var(--good);
  border-color: rgba(61, 255, 162, 0.5);
  background: linear-gradient(180deg, rgba(61, 255, 162, 0.2), rgba(61, 255, 162, 0.05));
  box-shadow: 0 0 20px -4px rgba(61, 255, 162, 0.7);
}

/* ---------------------------------------------------------------------------
   9. OVERLAY SCREENS (start / pause / game over)
   ------------------------------------------------------------------------- */
.screen {
  position: absolute;
  inset: 0;
  z-index: 40;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 22px 20px;
  background: radial-gradient(ellipse at 50% 32%, rgba(12, 18, 35, 0.9), rgba(3, 5, 10, 0.975));

  opacity: 0;
  visibility: hidden;
  transform: scale(1.03);
  transition: opacity 0.28s var(--ease-out),
              visibility 0.28s,
              transform 0.34s var(--ease-out);

  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
}

.screen.active {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
}

.screen-inner {
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
}

/* -------- Logo mark -------- */
.logo-mark {
  display: grid;
  grid-template-columns: repeat(3, 18px);
  grid-template-rows: repeat(2, 18px);
  gap: 4px;
  margin-bottom: 2px;
  animation: logoFloat 3.4s ease-in-out infinite;
}

.logo-mark i {
  display: block;
  border-radius: 4px;
  box-shadow: 0 0 14px -1px currentColor, inset 0 1px 0 rgba(255, 255, 255, 0.55);
  background: currentColor;
}

.logo-mark i:nth-child(1) { color: #22d3ee; grid-column: 1; grid-row: 1; }
.logo-mark i:nth-child(2) { color: #b45cff; grid-column: 2; grid-row: 1; }
.logo-mark i:nth-child(3) { color: #ff9f2e; grid-column: 3; grid-row: 1; }
.logo-mark i:nth-child(4) { color: #ff4d6d; grid-column: 1; grid-row: 2; }
.logo-mark i:nth-child(5) { color: #3ddc84; grid-column: 2; grid-row: 2; }
.logo-mark i:nth-child(6) { color: #ffd23f; grid-column: 3; grid-row: 2; }

@keyframes logoFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-6px) rotate(-1.5deg); }
}

/* -------- Titles -------- */
.title {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.02;
  background: linear-gradient(96deg, var(--accent) 0%, var(--accent-2) 52%, var(--accent-3) 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 26px rgba(56, 232, 255, 0.4));
  animation: titleFlow 6s ease-in-out infinite alternate;
}

@keyframes titleFlow {
  0%   { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.title.small { font-size: 25px; }

.subtitle {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: -8px;
}

/* -------- Buttons -------- */
.btn {
  position: relative;
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 15px 18px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.1s var(--ease-out), box-shadow 0.22s ease, background 0.22s ease;
  touch-action: manipulation;
}

.btn:active { transform: scale(0.965); }

.btn-primary {
  color: #04121a;
  background: linear-gradient(96deg, var(--accent) 0%, #62f0ff 40%, var(--accent-2) 130%);
  box-shadow:
    0 12px 34px -10px rgba(56, 232, 255, 0.85),
    inset 0 1px 0 rgba(255, 255, 255, 0.55);
}

.btn-primary::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 34%, rgba(255, 255, 255, 0.5) 50%, transparent 66%);
  transform: translateX(-130%);
  animation: shine 3.4s ease-in-out infinite;
}

@keyframes shine {
  0%, 62%  { transform: translateX(-130%); }
  88%, 100%{ transform: translateX(130%); }
}

.btn-ghost {
  color: var(--text-dim);
  background: var(--bg-panel);
  border: 1px solid var(--stroke-soft);
  font-size: 11px;
  padding: 12px 16px;
  letter-spacing: 0.14em;
}

.btn-ghost:active {
  background: var(--bg-panel-hi);
  color: var(--text);
}

.btn-row {
  display: flex;
  gap: 8px;
  width: 100%;
}

/* -------- Start screen stat strip -------- */
.menu-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  width: 100%;
  margin-top: 2px;
}

.menu-stats > div {
  background: var(--bg-panel);
  border: 1px solid var(--stroke-soft);
  border-radius: 12px;
  padding: 9px 4px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.menu-stats b {
  font-size: 15px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  letter-spacing: -0.02em;
}

.menu-stats span {
  font-size: 7.5px;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* -------- Game over details -------- */
.over-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: rgba(61, 255, 162, 0.11);
  border: 1px solid rgba(61, 255, 162, 0.42);
  color: var(--good);
  text-shadow: 0 0 16px rgba(61, 255, 162, 0.7);
  animation: badgePop 0.55s var(--ease-spring);
}

@keyframes badgePop {
  0%   { transform: scale(0.6); opacity: 0; }
  70%  { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

.big-score {
  font-size: 46px;
  font-weight: 900;
  letter-spacing: -0.035em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(96deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 24px rgba(56, 232, 255, 0.45));
}

.score-caption {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: -6px;
}

.breakdown {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.breakdown > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 8px 11px;
  background: var(--bg-panel);
  border: 1px solid var(--stroke-soft);
  border-radius: 11px;
}

.breakdown .k {
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.breakdown .v {
