<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0518">
<title>SaivBOUNCE Infinity</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%;
  width: 100%;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  background: radial-gradient(ellipse at 50% 30%, #1a0a2e 0%, #05020f 100%);
  color: #f0f0f3;
  display: flex;
  align-items: center;
  justify-content: center;
}
.app {
  --avail-h: min(100vh, 880px);
  position: relative;
  height: var(--avail-h);
  width: min(420px, 100vw, calc(var(--avail-h) * 9 / 16));
  display: flex;
  flex-direction: column;
  background: linear-gradient(170deg, #14082a 0%, #08040e 100%);
  border: 1px solid rgba(177, 75, 255, 0.18);
  border-radius: 24px;
  box-shadow: 0 48px 110px -28px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  overflow: hidden;
  isolation: isolate;
}
@supports (height: 100dvh) {
  .app { --avail-h: min(100dvh, 880px); }
}
@media (max-width: 430px) and (max-height: 900px) {
  .app { border-radius: 0; border-left: none; border-right: none; box-shadow: none; }
}
.topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.icon-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(20, 8, 42, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 11px;
  color: #dbe9ff;
  cursor: pointer;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: transform 0.08s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
}
.icon-btn:active {
  transform: scale(0.9);
  color: #38e8ff;
  border-color: rgba(56, 232, 255, 0.6);
  background: rgba(56, 232, 255, 0.18);
}
.icon-btn svg {
  width: 17px; height: 17px;
  stroke: currentColor; fill: none;
  stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round;
  pointer-events: none;
}
.icon-btn.hidden { opacity: 0; pointer-events: none; }
.hud {
  position: absolute;
  top: 56px;
  left: 0; right: 0;
  z-index: 3;
  padding: 0 14px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.hud.show { opacity: 1; }
.hud-score {
  font-size: 40px;
  font-weight: 900;
  font-family: Georgia, "Times New Roman", serif;
  color: #ffffff;
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.4), 0 0 24px rgba(56, 232, 255, 0.5);
  line-height: 1;
  letter-spacing: -0.02em;
}
.hud-score-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.55);
  margin-top: 4px;
}
.hud-right { text-align: right; }
.hud-best {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: rgba(255, 255, 255, 0.6);
}
.hud-best b {
  color: #ffd966;
  font-size: 13px;
  margin-left: 4px;
}
.hud-lives {
  display: flex;
  gap: 5px;
  margin-top: 8px;
  justify-content: flex-end;
}
.life {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff9f9f 0%, #e8153f 45%, #8a0a24 100%);
  box-shadow: 0 0 8px rgba(232, 21, 63, 0.6), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.life.lost {
  opacity: 0.2;
  background: #333;
  box-shadow: none;
  transform: scale(0.75);
}
.board {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  touch-action: none;
  overflow: hidden;
}
#game {
  display: block;
  width: 100%; height: 100%;
  touch-action: none;
}
.controls {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1.4fr 1fr;
  gap: 8px;
  padding: 10px 12px 14px;
  z-index: 2;
}
.ctl {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 64px;
  background: linear-gradient(180deg, rgba(177, 75, 255, 0.16), rgba(177, 75, 255, 0.04));
  border: 1px solid rgba(177, 75, 255, 0.28);
  border-radius: 16px;
  color: #b9a8d8;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  font-family: inherit;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: transform 0.08s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
}
.ctl svg {
  width: 30px; height: 30px;
  stroke: currentColor; fill: none;
  stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
  pointer-events: none;
}
.ctl:active, .ctl.active {
  transform: scale(0.94);
  color: #38e8ff;
  border-color: rgba(56, 232, 255, 0.7);
  background: linear-gradient(180deg, rgba(56, 232, 255, 0.3), rgba(56, 232, 255, 0.08));
  box-shadow: 0 0 28px -4px rgba(56, 232, 255, 0.8);
}
.ctl.jump {
  color: #ffd966;
  background: linear-gradient(180deg, rgba(255, 217, 102, 0.18), rgba(255, 217, 102, 0.04));
  border-color: rgba(255, 217, 102, 0.35);
}
.ctl.jump:active, .ctl.jump.active {
  color: #ffffff;
  border-color: rgba(255, 217, 102, 0.85);
  background: linear-gradient(180deg, rgba(255, 217, 102, 0.4), rgba(255, 217, 102, 0.12));
  box-shadow: 0 0 28px -4px rgba(255, 217, 102, 0.9);
}
.ctl.jump svg {
  width: 34px; height: 34px;
}
.screen {
  position: absolute;
  inset: 0;
  z-index: 9999999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px 20px;
  background: radial-gradient(ellipse at 50% 30%, rgba(20, 8, 42, 0.96), rgba(8, 4, 14, 0.98));
  opacity: 0; visibility: hidden;
  transform: scale(1.03);
  transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.28s, transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  overflow-y: auto;
}
.screen.active {
  opacity: 1; visibility: visible; transform: scale(1);
}
.screen-inner {
  width: 100%; max-width: 320px;
  display: flex; flex-direction: column; align-items: center;
  gap: 12px; text-align: center; margin: auto;
}
.logo-mark {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px;
  animation: logoFloat 2.8s ease-in-out infinite;
}
.logo-ball {
  width: 66px; height: 66px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #ff9f9f 0%, #e8153f 40%, #8a0a24 100%);
  box-shadow: 0 0 34px rgba(232, 21, 63, 0.6), inset -6px -6px 14px rgba(0, 0, 0, 0.5), inset 6px 6px 12px rgba(255, 255, 255, 0.3);
  position: relative;
}
.logo-ball::after {
  content: ""; position: absolute;
  top: 18%; left: 22%; width: 22%; height: 22%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.75);
  filter: blur(2px);
}
@keyframes logoFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.03); }
}
.title {
  font-size: 30px; font-weight: 900;
  letter-spacing: -0.01em; line-height: 1.05;
  background: linear-gradient(96deg, #38e8ff 0%, #b14bff 52%, #ff3d81 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 22px rgba(56, 232, 255, 0.45));
}
.title.small { font-size: 24px; }
.subtitle {
  font-size: 9.5px; font-weight: 800;
  letter-spacing: 0.32em; text-transform: uppercase;
  color: #6d5c8c; margin-top: -8px;
}
.btn {
  position: relative; width: 100%;
  border: none; border-radius: 14px;
  padding: 14px 16px;
  font-family: inherit;
  font-size: 12px; font-weight: 900;
  letter-spacing: 0.16em; text-transform: uppercase;
  cursor: pointer; overflow: hidden;
  transition: transform 0.1s ease, box-shadow 0.22s ease, background 0.22s ease, color 0.22s ease;
  touch-action: manipulation;
  text-decoration: none; text-align: center; display: block;
}
.btn:active { transform: scale(0.965); }
.btn-primary {
  color: #0a0518;
  background: linear-gradient(96deg, #38e8ff, #b14bff);
  box-shadow: 0 12px 34px -10px rgba(56, 232, 255, 0.7);
}
.btn-ghost {
  color: #b9a8d8;
  background: rgba(177, 75, 255, 0.06);
  border: 1px solid rgba(177, 75, 255, 0.16);
  font-size: 10.5px;
  padding: 11px 14px;
  letter-spacing: 0.14em;
}
.btn-ghost:active { background: rgba(177, 75, 255, 0.2); color: #f0f0f3; }
.btn-back {
  color: #7be5ff;
  background: transparent;
  border: 1px solid rgba(56, 232, 255, 0.28);
  font-size: 10px; padding: 10px 14px;
  letter-spacing: 0.18em;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px;
}
.btn-back svg {
  width: 13px; height: 13px;
  stroke: currentColor; fill: none;
  stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
}
.btn-back:active { background: rgba(56, 232, 255, 0.15); }
.menu-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  width: 100%;
  margin-top: 2px;
}
.menu-stats > div {
  background: rgba(177, 75, 255, 0.06);
  border: 1px solid rgba(177, 75, 255, 0.14);
  border-radius: 12px;
  padding: 10px 4px 9px;
  display: flex; flex-direction: column; align-items: center;
  gap: 2px;
}
.menu-stats b {
  font-size: 20px; font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: #f0f0f3;
  letter-spacing: -0.02em;
}
.menu-stats span {
  font-size: 7.5px; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: #6d5c8c;
}
.hint-line {
  font-size: 9px;
  letter-spacing: 0.12em;
  color: #6d5c8c;
  text-transform: uppercase;
  font-weight: 700;
  margin-top: 4px;
}
.score-block {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
  margin-top: 4px;
}
.score-block > div {
  background: rgba(177, 75, 255, 0.06);
  border: 1px solid rgba(177, 75, 255, 0.14);
  border-radius: 12px;
  padding: 10px 6px;
  display: flex; flex-direction: column; align-items: center;
  gap: 2px;
}
.score-block span {
  font-size: 8px; font-weight: 800;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: #6d5c8c;
}
.score-block b {
  font-size: 28px; font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: #f0f0f3;
  line-height: 1;
  font-family: Georgia, "Times New Roman", serif;
}
.score-block > div.best b { color: #ffd966; }
.new-best {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: rgba(255, 217, 102, 0.15);
  border: 1px solid rgba(255, 217, 102, 0.55);
  color: #ffd966;
  text-shadow: 0 0 14px rgba(255, 217, 102, 0.8);
  animation: bestPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes bestPop {
  0% { transform: scale(0.4); opacity: 0; }
  70% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
.flash {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: #ffffff;
  opacity: 0;
}
.flash.on { animation: flashAnim 0.35s ease-out; }
@keyframes flashAnim {
  0% { opacity: 0.7; }
  100% { opacity: 0; }
}
.toast {
  position: absolute;
  left: 50%; top: 30%;
  transform: translate(-50%, -50%) scale(0.6);
  opacity: 0;
  z-index: 6;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
  font-size: 15px; font-weight: 900;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: #ffd966;
  text-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 20px rgba(255, 217, 102, 0.8);
  padding: 8px 16px;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 999px;
  backdrop-filter: blur(6px);
}
.toast.show { animation: toastPop 1.1s cubic-bezier(0.22, 0.9, 0.3, 1) forwards; }
@keyframes toastPop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  28% { transform: translate(-50%, -50%) scale(1); }
  70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -80%) scale(0.9); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>
<body>

<div class="app" id="app">

  <div class="topbar">
    <button class="icon-btn hidden" id="btnMenu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="icon-btn hidden" id="btnPause" aria-label="Pause">
      <svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.4" height="14" rx="1.2"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.2"/></svg>
    </button>
  </div>

  <div class="hud" id="hud">
    <div>
      <div class="hud-score" id="hudScore">0</div>
      <div class="hud-score-label">Meters</div>
    </div>
    <div class="hud-right">
      <div class="hud-best">BEST<b id="hudBest">0</b></div>
      <div class="hud-lives" id="hudLives">
        <div class="life"></div>
        <div class="life"></div>
        <div class="life"></div>
      </div>
    </div>
  </div>

  <div class="flash" id="flash"></div>

  <main class="board" id="board">
    <canvas id="game"></canvas>
    <div class="toast" id="toast"></div>
  </main>

  <footer class="controls">
    <button class="ctl" data-dir="left" aria-label="Slow down">
      <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <button class="ctl jump" data-dir="jump" aria-label="Jump">
      <svg viewBox="0 0 24 24"><path d="M12 20V5"/><path d="m6 11 6-6 6 6"/></svg>
    </button>
    <button class="ctl" data-dir="right" aria-label="Speed up">
      <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
    </button>
  </footer>

  <section class="screen active" id="screen-start">
    <div class="screen-inner">
      <div class="logo-mark"><div class="logo-ball"></div></div>
      <h1 class="title">SaivBOUNCE</h1>
      <p class="subtitle">Infinity · Endless Runner</p>
      <button class="btn btn-primary" id="btnPlay">Play</button>
      <button class="btn btn-ghost" id="btnSoundStart">🔊 Sound On</button>
      <div class="menu-stats">
        <div><b id="startBest">0</b><span>Best Distance</span></div>
        <div><b id="startRuns">0</b><span>Total Runs</span></div>
      </div>
      <a class="btn btn-back" href="https://seizhf.github.io/games">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Back to Games
      </a>
      <p class="hint-line">Arrows / A-D · Space / Up to jump</p>
    </div>
  </section>

  <section class="screen" id="screen-pause">
    <div class="screen-inner">
      <h2 class="title small">Paused</h2>
      <p class="subtitle">Take a break</p>
      <button class="btn btn-primary" id="btnResume">Resume</button>
      <button class="btn btn-ghost" id="btnRestartPause">Restart</button>
      <button class="btn btn-ghost" id="btnSoundPause">🔊 Sound On</button>
      <button class="btn btn-ghost" id="btnQuit">Main Menu</button>
    </div>
  </section>

  <section class="screen" id="screen-over">
    <div class="screen-inner">
      <h2 class="title small">Game Over</h2>
      <div id="bestBadgeSlot"></div>
      <p class="subtitle" id="overSub">Keep running!</p>
      <div class="score-block">
        <div><span>Distance</span><b id="overScore">0</b></div>
        <div class="best"><span>Best</span><b id="overBest">0</b></div>
      </div>
      <div class="menu-stats">
        <div><b id="overRings">0</b><span>Rings</span></div>
        <div><b id="overTime">0:00</b><span>Time</span></div>
      </div>
      <button class="btn btn-primary" id="btnPlayAgain">Play Again</button>
      <button class="btn btn-ghost" id="btnMenu2">Main Menu</button>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     CONSTANTS
     ========================================================= */
  const WORLD_ROWS = 16;         // total rows
  const GROUND_ROW = 13;         // top of ground (13, 14, 15 = ground)
  const BALL_R = 0.42;

  // Physics
  const GRAVITY = 30;            // tiles/sec²
  const MAX_FALL = 20;           // tiles/sec
  const JUMP_VEL = -13;          // tiles/sec

  // Movement
  const BASE_SPEED_START = 4.5;
  const BASE_SPEED_MAX = 7.5;
  const SPEED_RAMP_MS = 60000;   // 60s to reach max speed
  const SPEED_ADJUST = 2.0;      // how much left/right changes speed

  // Camera
  const CAM_ANCHOR = 0.30;       // ball is at 30% from left

  // Timing
  const FIXED_DT = 1 / 60;
  const MAX_SUB = 6;
  const RESPAWN_INVULN_MS = 1500;

  const STORAGE_KEY = "saiv-bounce-inf.v2";

  /* =========================================================
     UTILITIES
     ========================================================= */
  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const randInt = (a, b) => a + ((Math.random() * (b - a + 1)) | 0);

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ":" + (sec < 10 ? "0" : "") + sec;
  }

  /* =========================================================
     STORAGE
     ========================================================= */
  const Save = {
    data: { bestDistance: 0, runs: 0, muted: false },
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p && typeof p === "object") {
          Object.keys(this.data).forEach((k) => {
            if (typeof p[k] === typeof this.data[k]) this.data[k] = p[k];
          });
        }
      } catch (e) {}
    },
    save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); } catch (e) {}
    },
  };

  /* =========================================================
     SOUND
     ========================================================= */
  const Sound = (function () {
    let ctx = null, master = null, muted = false, available = true;

    function init() {
      if (ctx || !available) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { available = false; return; }
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.2;
        master.connect(ctx.destination);
      } catch (e) { available = false; }
    }
    function resume() {
      if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
    }
    function tone(o) {
      if (!ctx || muted || !available) return;
      const now = ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.08;
      const vol = o.vol === undefined ? 0.25 : o.vol;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(o.freq, now);
      if (o.to && o.to !== o.freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), now + dur);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(master);
      osc.start(now); osc.stop(now + dur + 0.02);
    }
    function noise(o) {
      if (!ctx || muted || !available) return;
      const now = ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.1;
      const frames = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < frames; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / frames);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = o.filter || "highpass";
      filter.frequency.setValueAtTime(o.freq || 2000, now);
      if (o.to) filter.frequency.exponentialRampToValueAtTime(o.to, now + dur);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(o.vol === undefined ? 0.12 : o.vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(filter); filter.connect(gain); gain.connect(master);
      src.start(now);
    }

    const api = {
      init, resume,
      get muted() { return muted; },
      toggle() {
        muted = !muted;
        Save.data.muted = muted;
        Save.save();
        if (!muted) { resume(); api.click(); }
        return muted;
      },
      setMuted(v) { muted = !!v; Save.data.muted = muted; Save.save(); },
      click()    { tone({ freq: 900, type: "sine", dur: 0.03, vol: 0.14 }); },
      jump()     {
        tone({ freq: 380, to: 720, type: "sine", dur: 0.09, vol: 0.16 });
        noise({ freq: 1800, to: 800, dur: 0.05, vol: 0.05 });
      },
      land()     { tone({ freq: 260, to: 160, type: "sine", dur: 0.07, vol: 0.14 }); },
      ring() {
        [880, 1318, 1760].forEach((f, i) => {
          tone({ freq: f, type: "sine", dur: 0.08, vol: 0.15, delay: i * 0.045 });
        });
      },
      hit() {
        tone({ freq: 260, to: 90, type: "square", dur: 0.14, vol: 0.2 });
        noise({ freq: 900, to: 200, dur: 0.12, vol: 0.12 });
      },
      respawn() {
        [660, 880, 1100].forEach((f, i) => {
          tone({ freq: f, type: "sine", dur: 0.09, vol: 0.14, delay: i * 0.05 });
        });
      },
      over() {
        [440, 330, 262, 196, 165].forEach((f, i) => {
          tone({ freq: f, type: "triangle", dur: 0.16, vol: 0.18, delay: i * 0.1 });
        });
      },
      newBest() {
        [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => {
          tone({ freq: f, type: "triangle", dur: 0.16, vol: 0.18, delay: i * 0.09 });
          tone({ freq: f * 2, type: "sine", dur: 0.12, vol: 0.05, delay: i * 0.09 });
        });
      },
    };
    return api;
  })();

  /* =========================================================
     HAPTICS
     ========================================================= */
  const Haptics = {
    jump()  { if (navigator.vibrate) try { navigator.vibrate(6);  } catch (e) {} },
    ring()  { if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {} },
    hit()   { if (navigator.vibrate) try { navigator.vibrate([30, 40, 90]); } catch (e) {} },
    over()  { if (navigator.vibrate) try { navigator.vibrate([40, 60, 120]); } catch (e) {} },
  };

  /* =========================================================
     GAME STATE
     ========================================================= */
  const G = {
    status: "menu",        // menu | playing | paused | dying | over
    score: 0,              // distance in tiles
    rings: 0,
    lives: 3,

    startTime: 0,
    elapsed: 0,

    ball: null,
    worldStartX: 0,
    columns: [],
    ringsList: [],
    particles: [],
    camX: 0,

    // World generation state
    gen: {
      type: "flat",
      colsLeft: 0,
      offset: 0,
      mustFlat: 0,
      safeStreak: 0,
    },

    lastSafeX: 3,
    invulnUntil: 0,
    dyingTimer: 0,
    landSoundCooldown: 0,
  };

  const input = {
    left: false,
    right: false,
    jumpPressed: false,
    jumpHeld: false,
  };

  /* =========================================================
     CANVAS & SCALING
     ========================================================= */
  const boardEl = $("#board");
  const canvasEl = $("#game");
  const ctx = canvasEl.getContext("2d");

  let viewW = 360;
  let viewH = 640;
  let tilePx = 32;
  let colsVisible = 12;

  function resizeCanvas() {
    const rect = boardEl.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    viewW = Math.max(80, rect.width);
    viewH = Math.max(80, rect.height);

    canvasEl.style.width = viewW + "px";
    canvasEl.style.height = viewH + "px";
    canvasEl.width  = Math.round(viewW * dpr);
    canvasEl.height = Math.round(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    tilePx = viewH / WORLD_ROWS;
    colsVisible = viewW / tilePx;
  }

  /* =========================================================
     INPUT
     ========================================================= */
  const KEY_LEFT  = ["ArrowLeft", "a", "A"];
  const KEY_RIGHT = ["ArrowRight", "d", "D"];
  const KEY_JUMP  = [" ", "ArrowUp", "w", "W", "Spacebar"];

  document.addEventListener("keydown", (e) => {
    if (KEY_LEFT.includes(e.key))  { input.left = true;  e.preventDefault(); }
    if (KEY_RIGHT.includes(e.key)) { input.right = true; e.preventDefault(); }
    if (KEY_JUMP.includes(e.key)) {
      if (!input.jumpHeld) {
        input.jumpPressed = true;
      }
      input.jumpHeld = true;
      e.preventDefault();
    }
    if (e.key === "Escape") {
      if (G.status === "playing") pauseGame();
      else if (G.status === "paused") resumeGame();
    }
    if (e.key === "r" || e.key === "R") {
      if (G.status === "playing" || G.status === "paused") restartGame();
    }
  });

  document.addEventListener("keyup", (e) => {
    if (KEY_LEFT.includes(e.key))  input.left = false;
    if (KEY_RIGHT.includes(e.key)) input.right = false;
    if (KEY_JUMP.includes(e.key))  input.jumpHeld = false;
  });

  function bindControl(selector, dir) {
    $$(selector).forEach((el) => {
      let active = false;

      function press(ev) {
        ev.preventDefault();
        if (active) return;
        active = true;
        el.classList.add("active");
        try { el.setPointerCapture(ev.pointerId); } catch (e) {}
        Sound.init(); Sound.resume();

        if (dir === "left")  input.left = true;
        if (dir === "right") input.right = true;
        if (dir === "jump") {
          if (!input.jumpHeld) input.jumpPressed = true;
          input.jumpHeld = true;
        }
      }
      function release() {
        if (!active) return;
        active = false;
        el.classList.remove("active");
        if (dir === "left")  input.left = false;
        if (dir === "right") input.right = false;
        if (dir === "jump")  input.jumpHeld = false;
      }

      el.addEventListener("pointerdown", press);
      el.addEventListener("pointerup", release);
      el.addEventListener("pointercancel", release);
      el.addEventListener("lostpointercapture", release);
      el.addEventListener("contextmenu", (e) => e.preventDefault());
    });
  }

  // Tap on the board also jumps
  boardEl.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest("button")) return;
    if (G.status !== "playing") return;
    e.preventDefault();
    Sound.init(); Sound.resume();
    if (!input.jumpHeld) input.jumpPressed = true;
    input.jumpHeld = true;
  });
  boardEl.addEventListener("pointerup", () => { input.jumpHeld = false; });
  boardEl.addEventListener("pointercancel", () => { input.jumpHeld = false; });
  boardEl.addEventListener("contextmenu", (e) => e.preventDefault());

  /* =========================================================
     WORLD GENERATION
     ========================================================= */

  function emptyColumn() {
    const col = new Array(WORLD_ROWS);
    for (let r = 0; r < WORLD_ROWS; r++) col[r] = "empty";
    return col;
  }

  function fillGround(col) {
    for (let r = GROUND_ROW; r < WORLD_ROWS; r++) col[r] = "brick";
  }

  function difficulty() {
    return clamp(G.elapsed / SPEED_RAMP_MS, 0, 1);
  }

  function getChunkLength(type) {
    switch (type) {
      case "flat":     return randInt(4, 6);
      case "gap_s":    return 4;
      case "gap_m":    return 5;
      case "spikes":   return 4;
      case "platform": return 4;
      default:         return 4;
    }
  }

  function pickChunkType() {
    const gen = G.gen;

    // Forced flat after hazard
    if (gen.mustFlat > 0) {
      gen.mustFlat--;
      return "flat";
    }

    const diff = difficulty();
    const r = Math.random();

    // Early game (0-20%): mostly flat
    if (diff < 0.2) {
      if (r < 0.75) return "flat";
      if (r < 0.9)  return "gap_s";
      return "spikes";
    }

    // Mid game (20-55%)
    if (diff < 0.55) {
      if (r < 0.25) return "flat";
      if (r < 0.5)  return "gap_s";
      if (r < 0.7)  return "gap_m";
      if (r < 0.9)  return "spikes";
      return "platform";
    }

    // Late game (55%+)
    if (r < 0.15) return "flat";
    if (r < 0.4)  return "gap_s";
    if (r < 0.65) return "gap_m";
    if (r < 0.85) return "spikes";
    return "platform";
  }

  /** Generate one column and push it to G.columns. */
  function generateColumn() {
    const gen = G.gen;
    const x = G.worldStartX + G.columns.length;

    // Start a new chunk?
    if (gen.colsLeft <= 0) {
      gen.type = pickChunkType();
      gen.colsLeft = getChunkLength(gen.type);
      gen.offset = 0;
    }

    const type = gen.type;
    const off = gen.offset;

    // Build column
    const col = emptyColumn();
    fillGround(col);

    let hasHazard = false;
    let hasGround = true;

    switch (type) {
      case "flat":
        // All ground. Optional ring in the air
        if (off >= 1 && Math.random() < 0.4) {
          G.ringsList.push({ x: x + 0.5, y: GROUND_ROW - 3, collected: false });
        }
        break;

      case "gap_s":
        // 2-tile gap at offsets 1-2
        if (off >= 1 && off <= 2) {
          for (let r = GROUND_ROW; r < WORLD_ROWS; r++) col[r] = "empty";
          hasGround = false;
        }
        // Ring above gap
        if (off === 1) {
          G.ringsList.push({ x: x + 1.0, y: GROUND_ROW - 4, collected: false });
        }
        break;

      case "gap_m":
        // 3-tile gap at offsets 1-3
        if (off >= 1 && off <= 3) {
          for (let r = GROUND_ROW; r < WORLD_ROWS; r++) col[r] = "empty";
          hasGround = false;
        }
        if (off === 2) {
          G.ringsList.push({ x: x + 0.5, y: GROUND_ROW - 5, collected: false });
        }
        break;

      case "spikes":
        // Spike at offset 2 (with warning ground)
        if (off === 2 && Math.random() < 0.75) {
          col[GROUND_ROW - 1] = "spike";
          hasHazard = true;
        }
        break;

      case "platform":
        // Floating brick platform + ring
        if (off === 2) {
          col[GROUND_ROW - 4] = "brick";
          G.ringsList.push({ x: x + 0.5, y: GROUND_ROW - 6, collected: false });
        }
        break;
    }

    // Track safe streak (columns where the player can safely stand)
    const isSafe = hasGround && !hasHazard;
    if (isSafe) {
      gen.safeStreak++;
      if (gen.safeStreak >= 3) G.lastSafeX = x;
    } else {
      gen.safeStreak = 0;
    }

    G.columns.push(col);
    gen.colsLeft--;
    gen.offset++;
  }

  function ensureWorldAhead() {
    const needed = G.ball.x + colsVisible * 2;
    while (G.worldStartX + G.columns.length < needed) {
      generateColumn();
    }
  }

  function pruneWorld() {
    const minX = Math.floor(G.ball.x) - 15;
    while (G.worldStartX < minX && G.columns.length > 0) {
      G.columns.shift();
      G.worldStartX++;
    }
    // Prune rings behind
    for (let i = G.ringsList.length - 1; i >= 0; i--) {
      const r = G.ringsList[i];
      if (r.x < minX) G.ringsList.splice(i, 1);
    }
  }

  function getTile(col, row) {
    const idx = col - G.worldStartX;
    if (idx < 0 || idx >= G.columns.length) return null;
    if (row < 0 || row >= WORLD_ROWS) return null;
    return G.columns[idx][row];
  }

  function isSolid(col, row) {
    const t = getTile(col, row);
    return t === "brick" || t === "platform" || t === "tramp" || t === "crumble";
  }

  /* =========================================================
     PHYSICS
     ========================================================= */

  function createBall() {
    return {
      x: 2.5,
      y: GROUND_ROW - BALL_R - 0.001,
      vx: 0,
      vy: 0,
      onGround: true,
      squash: 1,
      rotation: 0,
    };
  }

  function getBaseSpeed() {
    const t = difficulty();
    return BASE_SPEED_START + t * (BASE_SPEED_MAX - BASE_SPEED_START);
  }

  function physicsStep(dt) {
    const b = G.ball;
    if (!b || G.status !== "playing") return;

    const wasOnGround = b.onGround;

    // ============ HORIZONTAL ============
    const base = getBaseSpeed();
    let inputX = 0;
    if (input.left) inputX -= 1;
    if (input.right) inputX += 1;

    const targetVx = Math.max(1.5, base + inputX * SPEED_ADJUST);
    const accel = b.onGround ? 10 : 4;
    b.vx += (targetVx - b.vx) * Math.min(1, accel * dt);

    // ============ JUMP ============
    if (input.jumpPressed && b.onGround) {
      b.vy = JUMP_VEL;
      b.onGround = false;
      b.squash = 1.35;
      Sound.jump();
      Haptics.jump();
    }
    input.jumpPressed = false;

    // ============ GRAVITY ============
    b.vy += GRAVITY * dt;
    if (b.vy > MAX_FALL) b.vy = MAX_FALL;

    // ============ MOVE + COLLIDE ============
    // Move X
    moveX(b, b.vx * dt);

    // Move Y
    const preVy = b.vy;
    b.onGround = false;
    moveY(b, b.vy * dt);

    // If Y didn't set onGround, sense it
    if (!b.onGround) {
      b.onGround = senseGround(b);
    }

    // ============ LANDING EFFECTS ============
    if (!wasOnGround && b.onGround && preVy > 4 && G.landSoundCooldown <= 0) {
      b.squash = 1.25;
      Sound.land();
      spawnDust(b.x, b.y + BALL_R, "#b58bff", 4);
      G.landSoundCooldown = 0.08;
    }

    // Stop downward velocity when grounded
    if (b.onGround && b.vy > 0) {
      b.vy = 0;
    }

    // ============ VISUAL ============
    // Rotation for rolling ball effect
    b.rotation += b.vx * dt * 4;
    // Squash recovery
    b.squash += (1 - b.squash) * Math.min(1, dt * 12);

    // ============ INTERACTIONS ============
    checkRings(b);
    checkSpikes(b);

    // ============ FALL DEATH ============
    if (b.y > WORLD_ROWS + 3) {
      hitHazard();
    }

    // ============ SAFE TRACKING ============
    if (b.onGround) {
      const c = Math.floor(b.x);
      const belowRow = Math.floor(b.y + BALL_R + 0.1);
      if (getTile(c, belowRow) === "brick" && belowRow === GROUND_ROW) {
        G.lastSafeX = Math.max(G.lastSafeX, c);
      }
    }
  }

  function moveX(b, dx) {
    if (dx === 0) return;
    const rTop = Math.floor(b.y - BALL_R + 0.001);
    const rBot = Math.floor(b.y + BALL_R - 0.001);

    if (dx > 0) {
      const nx = b.x + dx;
      const c = Math.floor(nx + BALL_R - 0.0001);
      for (let r = rTop; r <= rBot; r++) {
        if (isSolid(c, r)) {
          b.x = c - BALL_R - 0.001;
          b.vx = 0;
          return;
        }
      }
      b.x = nx;
    } else {
      const nx = b.x + dx;
      const c = Math.floor(nx - BALL_R);
      for (let r = rTop; r <= rBot; r++) {
        if (isSolid(c, r)) {
          b.x = c + 1 + BALL_R + 0.001;
          b.vx = 0;
          return;
        }
      }
      b.x = nx;
    }
  }

  function moveY(b, dy) {
    const cLeft  = Math.floor(b.x - BALL_R + 0.001);
    const cRight = Math.floor(b.x + BALL_R - 0.001);

    if (dy > 0) {
      // Falling
      const ny = b.y + dy;
      const r = Math.floor(ny + BALL_R - 0.0001);
      for (let c = cLeft; c <= cRight; c++) {
        if (isSolid(c, r)) {
          b.y = r - BALL_R - 0.001;
          b.vy = 0;
          b.onGround = true;
          return;
        }
      }
      b.y = ny;
    } else if (dy < 0) {
      // Rising
      const ny = b.y + dy;
      const r = Math.floor(ny - BALL_R);
      for (let c = cLeft; c <= cRight; c++) {
        if (isSolid(c, r)) {
          b.y = r + 1 + BALL_R + 0.001;
          b.vy = 0;
          return;
        }
      }
      b.y = ny;
    }
  }

  function senseGround(b) {
    const r = Math.floor(b.y + BALL_R + 0.05);
    const cLeft  = Math.floor(b.x - BALL_R + 0.001);
    const cRight = Math.floor(b.x + BALL_R - 0.001);
    for (let c = cLeft; c <= cRight; c++) {
      if (isSolid(c, r)) return true;
    }
    return false;
  }

  /* =========================================================
     INTERACTIONS
     ========================================================= */

  function checkRings(b) {
    const reach = BALL_R + 0.4;
    const r2 = reach * reach;
    for (let i = 0; i < G.ringsList.length; i++) {
      const ring = G.ringsList[i];
      if (ring.collected) continue;
      const dx = b.x - ring.x;
      const dy = b.y - ring.y;
      if (dx * dx + dy * dy < r2) {
        ring.collected = true;
        G.rings++;
        Sound.ring();
        Haptics.ring();
        spawnRingBurst(ring.x, ring.y);
        showToast("+1 RING");
      }
    }
  }

  function checkSpikes(b) {
    if (performance.now() < G.invulnUntil) return;
    const cLeft  = Math.floor(b.x - BALL_R);
    const cRight = Math.floor(b.x + BALL_R);
    const rTop   = Math.floor(b.y - BALL_R);
    const rBot   = Math.floor(b.y + BALL_R);
    for (let r = rTop; r <= rBot; r++) {
      for (let c = cLeft; c <= cRight; c++) {
        const t = getTile(c, r);
        if (t === "spike") {
          hitHazard();
          return;
        }
      }
    }
  }

  function hitHazard() {
    if (G.status !== "playing") return;
    if (performance.now() < G.invulnUntil) return;

    G.lives--;
    updateHUDLives();
    Sound.hit();
    Haptics.hit();

    // Flash
    const fl = $("#flash");
    fl.classList.remove("on");
    void fl.offsetWidth;
    fl.classList.add("on");

    spawnCrashBurst(G.ball.x, G.ball.y);

    if (G.lives <= 0) {
      gameOver();
    } else {
      G.status = "dying";
      G.dyingTimer = 0;
    }
  }

  /* =========================================================
     PARTICLES
     ========================================================= */

  function spawnDust(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.4;
      const sp = 1 + Math.random() * 2;
      G.particles.push({
        x, y,
        vx: Math.cos(a) * sp - 0.5,
        vy: Math.sin(a) * sp,
        life: 1, max: 400,
        size: 2 + Math.random() * 2,
        color,
      });
    }
  }

  function spawnRingBurst(x, y) {
    for (let i = 0; i < 12; i++) {
      const a = (Math.PI * 2 / 12) * i;
      G.particles.push({
        x, y,
        vx: Math.cos(a) * 2.4,
        vy: Math.sin(a) * 2.4,
        life: 1, max: 500,
        size: 2.5 + Math.random() * 2,
        color: "#ffd966",
      });
    }
  }

  function spawnCrashBurst(x, y) {
    const colors = ["#ff3d81", "#ffd966", "#38e8ff", "#b58bff"];
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 4;
      G.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1,
        life: 1, max: 800,
        size: 2 + Math.random() * 2.5,
        color: colors[i % colors.length],
        gravity: 0.12,
      });
    }
  }

  function updateParticles(dt) {
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const p = G.particles[i];
      p.life -= dt * 1000 / p.max;
      if (p.life <= 0) { G.particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.gravity) p.vy += p.gravity * dt * 60;
      p.vx *= 0.97;
      p.vy *= 0.98;
    }
  }

  /* =========================================================
     CAMERA
     ========================================================= */
  function updateCamera(dt) {
    if (!G.ball) return;
    const target = G.ball.x - colsVisible * CAM_ANCHOR;
    G.camX += (target - G.camX) * Math.min(1, dt * 10);
  }

  /* =========================================================
     RENDERING
     ========================================================= */

  function render() {
    ctx.clearRect(0, 0, viewW, viewH);

    ctx.save();
    ctx.scale(tilePx, tilePx);
    ctx.translate(-G.camX, 0);

    drawSky();
    drawParallax();
    drawColumns();
    drawRings();
    drawParticles();
    drawBall();

    ctx.restore();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, WORLD_ROWS);
    g.addColorStop(0, "#1a1040");
    g.addColorStop(0.5, "#2d1b5e");
    g.addColorStop(1, "#0f0722");
    ctx.fillStyle = g;
    ctx.fillRect(G.camX, 0, colsVisible + 1, WORLD_ROWS);
  }

  function drawParallax() {
    // Far hills (parallax 0.2)
    const scroll1 = G.camX * 0.2;
    ctx.fillStyle = "rgba(60, 35, 100, 0.5)";
    ctx.beginPath();
    ctx.moveTo(G.camX - 1, WORLD_ROWS);
    for (let x = -1; x <= colsVisible + 1; x += 0.3) {
      const wx = x + scroll1;
      const y = GROUND_ROW - 1 - Math.sin(wx * 0.7) * 0.8 - 1.5;
      ctx.lineTo(x + G.camX, y);
    }
    ctx.lineTo(G.camX + colsVisible + 1, WORLD_ROWS);
    ctx.closePath();
    ctx.fill();

    // Near hills (parallax 0.5)
    const scroll2 = G.camX * 0.5;
    ctx.fillStyle = "rgba(40, 22, 70, 0.75)";
    ctx.beginPath();
    ctx.moveTo(G.camX - 1, WORLD_ROWS);
    for (let x = -1; x <= colsVisible + 1; x += 0.3) {
      const wx = x + scroll2;
      const y = GROUND_ROW - Math.sin(wx * 1.1) * 0.6 - 0.5;
      ctx.lineTo(x + G.camX, y);
    }
    ctx.lineTo(G.camX + colsVisible + 1, WORLD_ROWS);
    ctx.closePath();
    ctx.fill();
  }

  function drawColumns() {
    const startCol = Math.floor(G.camX) - 1;
    const endCol = Math.ceil(G.camX + colsVisible) + 1;
    for (let c = startCol; c <= endCol; c++) {
      const idx = c - G.worldStartX;
      if (idx < 0 || idx >= G.columns.length) continue;
      const col = G.columns[idx];
      for (let r = 0; r < WORLD_ROWS; r++) {
        const t = col[r];
        if (t === "empty") continue;
        drawTile(t, c, r);
      }
    }
  }

  function drawTile(type, col, row) {
    const x = col;
    const y = row;
    const pad = 0.04;
    const rad = 0.14;

    if (type === "brick") {
      const g = ctx.createLinearGradient(x, y, x, y + 1);
      g.addColorStop(0, "#4a2f7a");
      g.addColorStop(1, "#2a1a50");
      ctx.fillStyle = g;
      roundRect(x + pad, y + pad, 1 - pad * 2, 1 - pad * 2, rad);
      ctx.fill();
      ctx.strokeStyle = "rgba(177, 75, 255, 0.55)";
      ctx.lineWidth = 0.04;
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
      roundRect(x + pad + 0.06, y + pad + 0.05, 1 - pad * 2 - 0.12, 0.18, rad * 0.7);
      ctx.fill();
    } else if (type === "platform") {
      const g = ctx.createLinearGradient(x, y, x, y + 1);
      g.addColorStop(0, "#7be5ff");
      g.addColorStop(0.5, "#38e8ff");
      g.addColorStop(1, "#0a8fb3");
      ctx.fillStyle = g;
      roundRect(x + pad, y + pad, 1 - pad * 2, 1 - pad * 2, rad);
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
      ctx.lineWidth = 0.05;
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
      roundRect(x + 0.15, y + 0.15, 0.4, 0.2, rad * 0.5);
      ctx.fill();
    } else if (type === "spike") {
      ctx.fillStyle = "#ff3d81";
      ctx.shadowColor = "rgba(255, 61, 129, 0.9)";
      ctx.shadowBlur = 0.4;
      ctx.beginPath();
      ctx.moveTo(x + 0.5, y + 0.12);
      ctx.lineTo(x + 0.92, y + 0.92);
      ctx.lineTo(x + 0.08, y + 0.92);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      ctx.beginPath();
      ctx.moveTo(x + 0.5, y + 0.15);
      ctx.lineTo(x + 0.6, y + 0.4);
      ctx.lineTo(x + 0.4, y + 0.4);
      ctx.closePath();
      ctx.fill();
    }
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawRings() {
    const t = performance.now() / 700;
    for (let i = 0; i < G.ringsList.length; i++) {
      const ring = G.ringsList[i];
      if (ring.collected) continue;
      // Cull off-screen
      if (ring.x < G.camX - 1 || ring.x > G.camX + colsVisible + 1) continue;

      const pulse = 1 + Math.sin(t * 2 + i * 0.5) * 0.1;
      const r = 0.28 * pulse;

      ctx.save();
      ctx.shadowColor = "rgba(255, 217, 102, 0.9)";
      ctx.shadowBlur = 0.6;

      const g = ctx.createRadialGradient(
        ring.x - r * 0.3, ring.y - r * 0.3, 0.02,
        ring.x, ring.y, r
      );
      g.addColorStop(0, "#fff2a8");
      g.addColorStop(1, "#c8950c");

      ctx.strokeStyle = g;
      ctx.lineWidth = r * 0.6;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, r * 0.7, 0, Math.PI * 2);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
      ctx.lineWidth = r * 0.18;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, r * 0.78, -Math.PI * 0.9, -Math.PI * 0.3);
      ctx.stroke();

      ctx.restore();
    }
  }

  function drawParticles() {
    ctx.save();
    for (let i = 0; i < G.particles.length; i++) {
      const p = G.particles[i];
      const alpha = Math.max(0, p.life);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 0.3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha * 0.02, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawBall() {
    const b = G.ball;
    if (!b) return;

    // Invulnerability blink
    if (performance.now() < G.invulnUntil) {
      const blink = Math.floor(performance.now() / 90) % 2;
      if (blink) return;
    }

    ctx.save();
    ctx.translate(b.x, b.y);

    // Squash/stretch
    const sx = 1 + (b.squash - 1) * 0.5;
    const sy = 1 - (b.squash - 1) * 0.5;
    ctx.scale(sx, sy);

    // Glow
    ctx.shadowColor = "rgba(232, 21, 63, 0.9)";
    ctx.shadowBlur = 0.7;

    // Body
    const g = ctx.createRadialGradient(-BALL_R * 0.35, -BALL_R * 0.4, BALL_R * 0.1, 0, 0, BALL_R);
    g.addColorStop(0, "#ff9f9f");
    g.addColorStop(0.45, "#e8153f");
    g.addColorStop(1, "#8a0a24");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Rolling accent (a small dot that rotates to show rolling)
    const roll = b.rotation;
    ctx.fillStyle = "rgba(255, 200, 200, 0.6)";
    ctx.beginPath();
    ctx.arc(
      Math.cos(roll) * BALL_R * 0.55,
      Math.sin(roll) * BALL_R * 0.55,
      BALL_R * 0.15, 0, Math.PI * 2
    );
    ctx.fill();

    // Highlight
    ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
    ctx.beginPath();
    ctx.ellipse(-BALL_R * 0.35, -BALL_R * 0.4, BALL_R * 0.3, BALL_R * 0.2, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // Rim
    ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
    ctx.lineWidth = 0.05;
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R - 0.02, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  /* =========================================================
     GAME LOOP
     ========================================================= */
  let lastTime = 0;
  let accumulator = 0;

  function loop(now) {
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  function update(dt) {
    if (G.landSoundCooldown > 0) G.landSoundCooldown -= dt;

    if (G.status === "playing") {
      accumulator += dt;
      let iter = 0;
      while (accumulator >= FIXED_DT && iter < MAX_SUB) {
        physicsStep(FIXED_DT);
        accumulator -= FIXED_DT;
        iter++;
        if (G.status !== "playing") break;
      }

      G.elapsed = performance.now() - G.startTime;

      // Update score
      const newScore = Math.max(G.score, Math.floor(G.ball.x));
      if (newScore !== G.score) {
        G.score = newScore;
        updateHUDScore();
      }

      ensureWorldAhead();
      pruneWorld();
      updateCamera(dt);
      updateParticles(dt);
    } else if (G.status === "dying") {
      G.dyingTimer += dt * 1000;
      updateCamera(dt);
      updateParticles(dt);
      if (G.dyingTimer > 600) {
        respawnBall();
      }
    } else {
      updateParticles(dt);
    }
  }

  /* =========================================================
     FLOW
     ========================================================= */

  function initWorld() {
    G.worldStartX = 0;
    G.columns = [];
    G.ringsList = [];
    G.particles = [];
    G.gen = {
      type: "flat",
      colsLeft: 0,
      offset: 0,
      mustFlat: 0,
      safeStreak: 0,
    };

    // First 8 columns are always flat (safe start)
    for (let i = 0; i < 8; i++) {
      const col = emptyColumn();
      fillGround(col);
      G.columns.push(col);
      G.gen.safeStreak++;
    }

    G.lastSafeX = 6;
  }

  function startGame() {
    Sound.init();
    Sound.resume();
    Sound.click();

    G.status = "playing";
    G.score = 0;
    G.rings = 0;
    G.lives = 3;
    G.startTime = performance.now();
    G.elapsed = 0;
    G.invulnUntil = 0;
    G.dyingTimer = 0;
    G.landSoundCooldown = 0;
    G.particles = [];

    initWorld();

    G.ball = createBall();
    G.camX = G.ball.x - colsVisible * CAM_ANCHOR;

    ensureWorldAhead();

    hideScreens();
    els.hud.classList.add("show");
    els.btnPause.classList.remove("hidden");
    els.btnMenu.classList.remove("hidden");
    updateHUDScore();
    updateHUDLives();
  }

  function respawnBall() {
    const b = G.ball;
    // Find safe column at or ahead of lastSafeX
    let safeX = G.lastSafeX;
    // Verify ground exists there
    while (safeX < G.lastSafeX + 30 && !isSolid(safeX, GROUND_ROW)) {
      safeX++;
    }
    // Fallback
    if (!isSolid(safeX, GROUND_ROW)) {
      safeX = G.worldStartX + 5;
    }

    b.x = safeX + 0.5;
    b.y = GROUND_ROW - BALL_R - 0.001;
    b.vx = 0;
    b.vy = 0;
    b.onGround = true;
    b.squash = 1;

    // Snap camera
    G.camX = b.x - colsVisible * CAM_ANCHOR;

    G.invulnUntil = performance.now() + RESPAWN_INVULN_MS;

    Sound.respawn();
    G.status = "playing";
    G.dyingTimer = 0;
  }

  function pauseGame() {
    if (G.status !== "playing") return;
    G.status = "paused";
    Sound.click();
    updateSoundLabels();
    showScreen("pause");
  }

  function resumeGame() {
    if (G.status !== "paused") return;
    G.status = "playing";
    Sound.click();
    hideScreens();
  }

  function restartGame() {
    hideScreens();
    startGame();
  }

  function gameOver() {
    G.status = "over";
    Sound.over();
    Haptics.over();

    Save.data.runs++;
    const isNewBest = G.score > Save.data.bestDistance;
    if (isNewBest) Save.data.bestDistance = G.score;
    Save.save();

    $("#overScore").textContent = String(G.score);
    $("#overBest").textContent = String(Save.data.bestDistance);
    $("#overRings").textContent = String(G.rings);
    $("#overTime").textContent = fmtTime(G.elapsed);

    const badgeSlot = $("#bestBadgeSlot");
    badgeSlot.innerHTML = "";
    if (isNewBest) {
      const badge = document.createElement("div");
      badge.className = "new-best";
      badge.textContent = "★ New Best!";
      badgeSlot.appendChild(badge);
      setTimeout(() => Sound.newBest(), 300);
    }

    $("#overSub").textContent = isNewBest ? "Legendary!" : "Keep running!";

    els.hud.classList.remove("show");
    els.btnPause.classList.add("hidden");
    els.btnMenu.classList.add("hidden");

    setTimeout(() => showScreen("over"), 400);
  }

  function quitToMenu() {
    G.status = "menu";
    hideScreens();
    showScreen("start");
    refreshMenuStats();
    updateSoundLabels();
    Sound.click();
  }

  /* =========================================================
     UI
     ========================================================= */

  const els = {
    screens: {
      start: $("#screen-start"),
      pause: $("#screen-pause"),
      over:  $("#screen-over"),
    },
    hud: $("#hud"),
    hudScore: $("#hudScore"),
    hudBest: $("#hudBest"),
    hudLives: $("#hudLives"),
    toast: $("#toast"),
    btnPause: $("#btnPause"),
    btnMenu: $("#btnMenu"),
    startBest: $("#startBest"),
    startRuns: $("#startRuns"),
    btnSoundStart: $("#btnSoundStart"),
    btnSoundPause: $("#btnSoundPause"),
  };

  function showScreen(name) {
    Object.keys(els.screens).forEach((k) => {
      els.screens[k].classList.toggle("active", k === name);
    });
  }

  function hideScreens() {
    Object.keys(els.screens).forEach((k) => {
      els.screens[k].classList.remove("active");
    });
  }

  function updateHUDScore() {
    els.hudScore.textContent = String(G.score);
    els.hudBest.textContent = String(Math.max(Save.data.bestDistance, G.score));
  }

  function updateHUDLives() {
    const lives = els.hudLives.children;
    for (let i = 0; i < lives.length; i++) {
      lives[i].classList.toggle("lost", i >= G.lives);
    }
  }

  let toastTimeout = null;
  function showToast(text) {
    els.toast.textContent = text;
    els.toast.classList.remove("show");
    void els.toast.offsetWidth;
    els.toast.classList.add("show");
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => els.toast.classList.remove("show"), 1000);
  }

  function updateSoundLabels() {
    const label = Sound.muted ? "🔇 Sound Off" : "🔊 Sound On";
    if (els.btnSoundStart) els.btnSoundStart.textContent = label;
    if (els.btnSoundPause) els.btnSoundPause.textContent = Sound.muted ? "🔇 Off" : "🔊 On";
  }

  function refreshMenuStats() {
    els.startBest.textContent = String(Save.data.bestDistance);
    els.startRuns.textContent = String(Save.data.runs);
  }

  /* =========================================================
     BOOTSTRAP
     ========================================================= */

  function init() {
    Save.load();
    Sound.setMuted(Save.data.muted);
    updateSoundLabels();
    refreshMenuStats();

    resizeCanvas();
    let resizeRaf = 0;
    function scheduleResize() {
      if (resizeRaf) cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(() => {
        resizeCanvas();
        if (G.ball) G.camX = G.ball.x - colsVisible * CAM_ANCHOR;
      });
    }
    window.addEventListener("resize", scheduleResize);
    window.addEventListener("orientationchange", () => setTimeout(scheduleResize, 120));
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(scheduleResize);
      ro.observe(boardEl);
    }

    bindControl('.ctl[data-dir="left"]', "left");
    bindControl('.ctl[data-dir="right"]', "right");
    bindControl('.ctl[data-dir="jump"]', "jump");

    $("#btnPlay").addEventListener("click", () => {
      Sound.init();
      Sound.resume();
      startGame();
    });
    $("#btnPlayAgain").addEventListener("click", () => {
      hideScreens();
      startGame();
    });
    $("#btnMenu2").addEventListener("click", quitToMenu);

    els.btnSoundStart.addEventListener("click", () => {
      Sound.init();
      Sound.toggle();
      updateSoundLabels();
    });
    els.btnSoundPause.addEventListener("click", () => {
      Sound.toggle();
      updateSoundLabels();
    });

    $("#btnPause").addEventListener("click", () => {
      if (G.status === "playing") pauseGame();
      else if (G.status === "paused") resumeGame();
    });
    $("#btnMenu").addEventListener("click", () => {
      if (G.status === "playing") pauseGame();
      else if (G.status === "paused") resumeGame();
    });

    $("#btnResume").addEventListener("click", resumeGame);
    $("#btnRestartPause").addEventListener("click", restartGame);
    $("#btnQuit").addEventListener("click", quitToMenu);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && G.status === "playing") pauseGame();
    });
    window.addEventListener("blur", () => {
      if (G.status === "playing") pauseGame();
    });

    document.addEventListener("gesturestart", (e) => e.preventDefault());

    // Setup demo world for the menu screen (no ball, just scenery)
    initWorld();
    G.ball = createBall();
    G.ball.y = -10;  // hide ball
    G.camX = 0;

    showScreen("start");
    requestAnimationFrame(loop);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
