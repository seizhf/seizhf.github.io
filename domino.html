<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a1d">
<title>SaivDOMI</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Noto Kufi Arabic','Tahoma',sans-serif;
  background:#08161a;color:#e6f2f4;overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  touch-action:manipulation;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(55,160,140,.20), transparent 60%),
    radial-gradient(ellipse at 50% 110%, rgba(20,70,80,.30), transparent 60%),
    linear-gradient(180deg,#0a1c20 0%,#061114 100%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;opacity:.035;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 3px);
}

:root{
  --accent:#e9b949;
  --accent2:#c9962e;
  --green:#37c978;
  --red:#e05555;
  --panel:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.10);
  --hand-ts:42px;
  --board-ts:30px;
  --board-max-ts:44px;
  --board-min-ts:14px;
}
@media(min-width:820px){ :root{ --hand-ts:52px; --board-ts:38px; --board-max-ts:52px; } }
@media(min-width:1200px){ :root{ --hand-ts:60px; --board-ts:44px; --board-max-ts:60px; } }
@media(max-height:680px){ :root{ --hand-ts:34px; --board-ts:24px; --board-max-ts:34px; } }

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;}

.topbar{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;gap:8px;z-index:30;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.4px;}
.brand-dot{
  width:12px;height:12px;border-radius:3px;
  background:linear-gradient(150deg,#fff8e6,#e9b949 45%,#a97b1c);
  box-shadow:0 0 10px rgba(233,185,73,.5);
}
.top-actions{display:flex;align-items:center;gap:8px;}
.lang-switch{display:flex;gap:2px;background:rgba(255,255,255,.07);border-radius:10px;padding:3px;}
.lang-switch button{
  border:0;background:transparent;color:#9fb8bd;padding:4px 9px;border-radius:7px;
  font-size:11px;font-weight:800;cursor:pointer;transition:.18s;font-family:inherit;
}
.lang-switch button:hover{color:#fff;}
.lang-switch button.active{background:linear-gradient(180deg,#f0c05a,#c9962e);color:#1a1206;}
.icon-btn{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:#cfe4e8;font-weight:800;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s;font-family:inherit;
}
.icon-btn:hover{background:rgba(255,255,255,.12);}

.screen{display:none;flex:1;min-height:0;flex-direction:column;animation:fadeIn .28s ease;}
.screen.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

#screen-menu{overflow-y:auto;align-items:center;padding:18px 14px 40px;}
.menu-wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;}
.hero{text-align:center;padding:8px 0 4px;}
.hero-title{
  margin:0;font-size:30px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(180deg,#fff6dd,#e9b949 60%,#b8862a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 6px 26px rgba(233,185,73,.18);
}
.hero-sub{margin:6px 0 0;color:#8fa9ae;font-size:12.5px;line-height:1.6;}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid var(--border);border-radius:18px;padding:14px;
  box-shadow:0 12px 34px rgba(0,0,0,.28);
}
.card h2{
  margin:0 0 10px;font-size:13px;font-weight:800;color:#b9d4d9;
  text-transform:uppercase;letter-spacing:1px;
}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:400px){ .mode-grid{grid-template-columns:1fr;} }
.mode-btn{
  display:flex;flex-direction:column;gap:3px;align-items:flex-start;
  padding:12px 13px;border-radius:14px;cursor:pointer;font-family:inherit;
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
  color:#eaf6f8;text-align:start;transition:transform .13s ease,background .2s,border-color .2s;
}
.mode-btn:hover{background:rgba(233,185,73,.10);border-color:rgba(233,185,73,.45);}
.mode-btn:active{transform:scale(.975);}
.mode-btn b{font-size:14px;font-weight:800;color:#ffd976;}
.mode-btn span{font-size:11px;color:#93aeb3;line-height:1.45;}

.row{display:flex;gap:8px;flex-wrap:wrap;}
.row>*{flex:1 1 0;min-width:120px;}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  color:#eaf6f8;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:transform .12s ease,background .2s,opacity .2s;
  white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.14);}
.btn:active{transform:scale(.975);}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn.primary{
  background:linear-gradient(180deg,#f0c05a,#c9962e);
  color:#1d1407;border-color:#e8c471;font-weight:900;
  box-shadow:0 8px 22px rgba(233,185,73,.24);
}
.btn.primary:hover{background:linear-gradient(180deg,#f6ce78,#d4a53a);}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.16);}
.btn.small{padding:8px 12px;font-size:12px;border-radius:11px;}

#screen-lobby{align-items:center;padding:20px 14px;overflow-y:auto;}
.lobby-wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;}
.code-box{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(0,0,0,.32);border:1px dashed rgba(233,185,73,.5);
  border-radius:16px;padding:14px 16px;
}
.code-box .code{
  font-family:'Courier New',monospace;font-size:26px;font-weight:900;letter-spacing:4px;
  color:#ffd976;text-shadow:0 0 18px rgba(233,185,73,.35);
}

.team-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
@media(max-width:400px){ .team-columns{grid-template-columns:1fr;} }
.team-col{
  border-radius:14px;padding:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.08);
}
.team-col.team-a{border-color:rgba(55,201,120,.4);}
.team-col.team-b{border-color:rgba(224,85,85,.4);}
.team-col h3{
  margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;display:flex;align-items:center;gap:6px;
}
.team-col.team-a h3{color:#5fe0a0;}
.team-col.team-b h3{color:#ff9a9a;}

.players-list{display:flex;flex-direction:column;gap:7px;}
.pl-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
  transition:transform .12s ease, background .18s, border-color .18s;
}
.pl-item.clickable{cursor:pointer;}
.pl-item.clickable:hover{background:rgba(233,185,73,.10);border-color:rgba(233,185,73,.4);}
.pl-item.empty{opacity:.4;border-style:dashed;}
.pl-item .avatar{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;color:#1a1206;
  background:linear-gradient(150deg,#f0c05a,#c9962e);flex:none;
}
.pl-item.empty .avatar{background:rgba(255,255,255,.10);color:#7f989d;}
.pl-item .pl-name{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-item .tag{
  font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;
  background:rgba(55,201,120,.16);color:#5fe0a0;border:1px solid rgba(55,201,120,.3);
}
.pl-item .tag.bot{background:rgba(255,255,255,.08);color:#9fb8bd;border-color:rgba(255,255,255,.14);}
.pl-item .tag.host{background:rgba(233,185,73,.16);color:#ffd976;border-color:rgba(233,185,73,.35);}
.hint{font-size:12px;color:#8fa9ae;margin:0;line-height:1.6;}

#screen-game{padding:0;}
.game-top{
  flex:none;display:flex;gap:6px;padding:7px 8px;overflow-x:auto;
  scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.05);
  position:relative;
}
.game-top::-webkit-scrollbar{display:none;}
.opp-card{
  flex:none;min-width:98px;padding:7px 9px;border-radius:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);
  transition:border-color .25s,box-shadow .25s,background .25s;
  position:relative;
}
.opp-card.active{
  border-color:rgba(233,185,73,.75);
  box-shadow:0 0 0 1px rgba(233,185,73,.35),0 0 22px rgba(233,185,73,.22);
  background:linear-gradient(180deg,rgba(233,185,73,.13),rgba(233,185,73,.03));
}
.opp-card.teammate{border-color:rgba(55,201,120,.45);}
.opp-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.opp-card .avatar{
  width:20px;height:20px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;color:#1a1206;background:linear-gradient(150deg,#f0c05a,#c9962e);
}
.opp-card .opp-name{
  flex:1;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70px;
}
.opp-card .opp-count{
  font-size:10px;font-weight:900;color:#ffd976;background:rgba(233,185,73,.14);
  border-radius:20px;padding:1px 6px;min-width:18px;text-align:center;
}
.opp-tiles{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden;}
.opp-tiles .tile{--ts:9px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.4);}

.comment-bubble{
  position:absolute;top:-6px;right:-4px;
  background:linear-gradient(180deg,#fff5d6,#f0c05a);
  color:#1d1407;font-size:11px;font-weight:900;
  padding:3px 9px;border-radius:20px;
  box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.6);
  white-space:nowrap;pointer-events:none;z-index:20;
  animation:popBubble .35s cubic-bezier(.2,.9,.3,1.3);
}
.comment-bubble::after{
  content:'';position:absolute;bottom:-5px;right:14px;
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:6px solid #f0c05a;
}
.comment-bubble.fadeout{animation:bubbleOut .45s ease forwards;}
@keyframes popBubble{
  0%{transform:scale(.3) translateY(8px);opacity:0;}
  65%{transform:scale(1.12) translateY(-2px);opacity:1;}
  100%{transform:scale(1) translateY(0);opacity:1;}
}
@keyframes bubbleOut{ to{transform:translateY(-14px) scale(.85);opacity:0;} }

.comment-bar{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);
  transform:translate(-50%,20px);
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;
  padding:8px;max-width:96vw;
  background:rgba(6,20,24,.92);
  border:1px solid rgba(233,185,73,.45);
  border-radius:18px;
  box-shadow:0 12px 34px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06) inset;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:120;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;
}
.comment-bar.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);}
.comment-bar .cbtn{
  font-family:inherit;font-size:12px;font-weight:800;
  padding:7px 12px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  color:#eaf6f8;transition:transform .12s,background .18s,border-color .18s;
  white-space:nowrap;
}
.comment-bar .cbtn:hover{
  background:linear-gradient(180deg,rgba(233,185,73,.28),rgba(233,185,73,.10));
  border-color:rgba(233,185,73,.65);color:#ffd976;
}
.comment-bar .cbtn:active{transform:scale(.94);}
.comment-bar .cbtn.hot{
  background:linear-gradient(180deg,#f0c05a,#c9962e);
  color:#1d1206;border-color:#ffd976;
}
.comment-bar .cbtn.cancel{
  background:linear-gradient(180deg,rgba(224,85,85,.28),rgba(224,85,85,.08));
  border-color:rgba(224,85,85,.6);
  color:#ff9a9a;font-weight:900;font-size:13px;
  padding:7px 12px;min-width:34px;
}
.comment-bar .cbtn.cancel:hover{
  background:linear-gradient(180deg,#e05555,#a83838);
  border-color:#ff8080;color:#fff;
}
.comment-bar .ctitle{
  font-size:10px;font-weight:800;color:#ffd976;
  text-transform:uppercase;letter-spacing:1px;
  align-self:center;padding:0 6px;
}

.board-area{flex:1;position:relative;min-height:0;overflow:hidden;}
.board-scroll{
  position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:0 24px;scrollbar-width:thin;
  scroll-behavior:smooth;
  direction:ltr;
}
.board-scroll::-webkit-scrollbar{height:5px;}
.board-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}
.chain{
  display:flex;align-items:center;gap:3px;padding:6px 2px;direction:ltr;
  flex:none;max-width:none;
}
.chain:empty::after{
  content:'';width:120px;height:64px;border-radius:14px;
  border:2px dashed rgba(255,255,255,.10);
}
#chain .tile{--ts:var(--board-ts);}

.chain .tile.drop-target{
  box-shadow:
    0 0 0 3px rgba(55,201,120,.85),
    0 0 26px rgba(55,201,120,.5),
    inset 0 1px 0 rgba(255,255,255,.95),
    0 6px 14px rgba(0,0,0,.4);
  transition:box-shadow .18s ease;
}

.turn-banner{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:800;padding:5px 14px;border-radius:20px;
  background:rgba(0,0,0,.45);border:1px solid rgba(233,185,73,.35);
  color:#ffd976;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6;
  white-space:nowrap;
}
.turn-banner.show{opacity:1;animation:pulseBanner 1.6s ease-in-out infinite;}
@keyframes pulseBanner{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.045);}}

.hand-area{
  flex:none;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.35));
  border-top:1px solid rgba(255,255,255,.06);
}
.me-bar{display:flex;align-items:center;gap:7px;padding:0 3px 6px;font-size:12px;}
.me-name{font-weight:800;color:#dceef1;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.me-score{
  font-weight:900;color:#ffd976;background:rgba(233,185,73,.14);
  padding:2px 9px;border-radius:20px;font-size:11px;border:1px solid rgba(233,185,73,.28);
}
.me-bar .spacer{flex:1;}
.hand{
  display:flex;gap:6px;justify-content:center;justify-content:safe center;
  overflow-x:auto;overflow-y:visible;padding:14px 4px 6px;
  scrollbar-width:none;min-height:calc(var(--hand-ts) * 2 + 22px);
}
.hand::-webkit-scrollbar{display:none;}
.hand .tile{--ts:var(--hand-ts);cursor:grab;touch-action:none;}
.hand .tile:hover{transform:translateY(-9px);}
.hand .tile:active{cursor:grabbing;}
.hand .tile.playable{
  box-shadow:0 0 0 2px rgba(55,201,120,.85),0 0 20px rgba(55,201,120,.35),
             inset 0 1px 0 rgba(255,255,255,.9),0 8px 18px rgba(0,0,0,.4);
}
.hand .tile.dim{opacity:.42;filter:grayscale(.55);}
.hand .tile.picked{
  transform:translateY(-18px) scale(1.06);
  box-shadow:0 0 0 3px rgba(233,185,73,.9),0 0 22px rgba(233,185,73,.5),
             inset 0 1px 0 rgba(255,255,255,.9),0 10px 22px rgba(0,0,0,.45);
  animation:pickedPulse 1.4s ease-in-out infinite;
}
@keyframes pickedPulse{
  0%,100%{transform:translateY(-18px) scale(1.06);}
  50%{transform:translateY(-20px) scale(1.09);}
}

.drag-ghost{
  position:fixed!important;z-index:9999!important;pointer-events:none!important;
  margin:0!important;opacity:.94;
  transform:rotate(-3deg) scale(1.06);
  transition:transform .12s ease,box-shadow .15s ease;
}

.tile{
  --ts:var(--hand-ts);
  --tl:calc(var(--ts) * 2);
  position:relative;width:var(--ts);height:var(--tl);
  border-radius:calc(var(--ts) * 0.155);
  background:linear-gradient(155deg,#fffdf7 0%,#f6f0e0 42%,#e8dfc8 100%);
  border:1px solid rgba(150,135,105,.38);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -2px 5px rgba(120,100,60,.20),
    0 2px 3px rgba(0,0,0,.35),
    0 6px 14px rgba(0,0,0,.26);
  display:flex;flex-direction:column;flex:none;
  transition:transform .16s ease,box-shadow .16s ease,opacity .2s ease;
  will-change:transform;
}
.tile.h{width:var(--tl);height:var(--ts);flex-direction:row;}
.tile .half{
  flex:1 1 0;min-width:0;min-height:0;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:calc(var(--ts) * 0.13);place-items:center;
}
.pip{
  width:calc(var(--ts) * 0.155);height:calc(var(--ts) * 0.155);border-radius:50%;
  background:radial-gradient(circle at 33% 28%,#7a7a7a 0%,#2a2a2a 46%,#000 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.10);
}
.divider{flex:none;position:relative;display:flex;align-items:center;justify-content:center;}
.tile:not(.h) .divider{height:calc(var(--ts) * 0.12);width:100%;}
.tile.h .divider{width:calc(var(--ts) * 0.12);height:100%;}
.divider::before{content:'';position:absolute;background:rgba(45,35,18,.50);border-radius:2px;}
.tile:not(.h) .divider::before{left:6%;right:6%;top:50%;height:1.5px;transform:translateY(-50%);}
.tile.h .divider::before{top:6%;bottom:6%;left:50%;width:1.5px;transform:translateX(-50%);}
.pin{
  width:calc(var(--ts) * 0.11);height:calc(var(--ts) * 0.11);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffeeb0,#d4a53a 55%,#8a6414 100%);
  box-shadow:0 0 2px rgba(0,0,0,.35),inset 0 -.5px 1px rgba(0,0,0,.2);
  position:relative;z-index:1;flex:none;
}
.tile.back{
  background:linear-gradient(155deg,#1e4d5a 0%,#0e2b34 58%,#0a1f26 100%);
  border-color:rgba(255,255,255,.10);
}
.tile.back .half,.tile.back .divider{display:none;}
.tile.back::after{
  content:'';position:absolute;inset:11%;border-radius:calc(var(--ts) * 0.075);
  border:1px solid rgba(255,255,255,.09);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.055) 0 3px,transparent 3px 6px);
}
@keyframes popIn{
  0%{transform:scale(.45);opacity:0;}
  62%{transform:scale(1.09);opacity:1;}
  100%{transform:scale(1);opacity:1;}
}
.tile.just-played{animation:popIn .34s cubic-bezier(.2,.9,.3,1.15);}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);}
  40%{transform:translateX(5px);}
  60%{transform:translateX(-3px);}
  80%{transform:translateX(3px);}
}
.tile.shake{animation:shake .35s ease;}

.modal-mask{
  position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(3,10,12,.78);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  padding:18px;

const PIPS = {
  0: [],
  1: [[2,2]],
  2: [[1,1],[3,3]],
  3: [[1,1],[2,2],[3,3]],
  4: [[1,1],[1,3],[3,1],[3,3]],
  5: [[1,1],[1,3],[2,2],[3,1],[3,3]],
  6: [[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]
};
function makeSet(){
  const out = [];
  for (let a = 0; a <= 6; a++) for (let b = a; b <= 6; b++) out.push({ a: a, b: b });
  return out;
}
function handSum(hand){
  let s = 0;
  for (let i = 0; i < hand.length; i++){
    const tile = hand[i];
    if (tile.hidden) continue;
    s += tile.a + tile.b;
  }
  return s;
}
function makeTile(a, b, opts){
  opts = opts || {};
  const node = el('div', 'tile');
  if (opts.horizontal) node.classList.add('h');
  if (opts.back){ node.classList.add('back'); return node; }
  const h1 = el('div', 'half'); addPips(h1, a);
  const dv = el('div', 'divider'); dv.appendChild(el('i', 'pin'));
  const h2 = el('div', 'half'); addPips(h2, b);
  node.appendChild(h1); node.appendChild(dv); node.appendChild(h2);
  return node;
}
function addPips(half, n){
  const positions = PIPS[n] || [];
  for (let i = 0; i < positions.length; i++){
    const p = el('i', 'pip');
    p.style.gridRow = String(positions[i][0]);
    p.style.gridColumn = String(positions[i][1]);
    half.appendChild(p);
  }
}

   §4  ENGINE
   ============================================================ */
const TARGET_SCORE = 100;

const Engine = {
  newGame: function(opts){
    const numPlayers = opts.numPlayers;
    const botSeats = opts.botSeats || [];
    const names = opts.names || [];
    const teamMap = opts.teams || null;
    const pool = shuffle(makeSet());
    const players = [];
    for (let i = 0; i < numPlayers; i++){
      players.push({
        name: names[i] || ('P' + (i + 1)),
        isBot: botSeats.indexOf(i) !== -1,
        team: teamMap ? teamMap[i] : i,
        hand: [], score: 0, connected: true
      });
    }
    for (let r = 0; r < 7; r++) for (let i = 0; i < numPlayers; i++) players[i].hand.push(pool.pop());
    const state = {
      numPlayers: numPlayers, players: players, boneyard: pool,
      chain: [], leftEnd: null, rightEnd: null,
      turn: 0, passes: 0, phase: 'play', round: 1,
      lastPlay: null, roundResult: null, matchWinner: null
    };
    state.turn = Engine.findStarter(state);
    return state;
  },
  findStarter: function(state){
    let bestSeat = 0, bestVal = -1;
    for (let i = 0; i < state.players.length; i++){
      const hand = state.players[i].hand;
      for (let j = 0; j < hand.length; j++){
        const tile = hand[j];
        if (tile.a === tile.b && tile.a > bestVal){ bestVal = tile.a; bestSeat = i; }
      }
    }
    if (bestVal >= 0) return bestSeat;
    bestVal = -1;
    for (let i = 0; i < state.players.length; i++){
      const hand = state.players[i].hand;
      for (let j = 0; j < hand.length; j++){
        const s = hand[j].a + hand[j].b;
        if (s > bestVal){ bestVal = s; bestSeat = i; }
      }
    }
    return bestSeat;
  },
  legalSides: function(state, tile){
    if (!tile) return [];
    if (state.chain.length === 0) return ['left','right'];
    const sides = [];
    if (tile.a === state.leftEnd || tile.b === state.leftEnd) sides.push('left');
    if (tile.a === state.rightEnd || tile.b === state.rightEnd) sides.push('right');
    return sides;
  },
  hasAnyMove: function(state, seat){
    const p = state.players[seat];
    if (!p) return false;
    if (state.chain.length === 0) return p.hand.length > 0;
    for (let i = 0; i < p.hand.length; i++){
      const tile = p.hand[i];
      if (tile.a === state.leftEnd || tile.b === state.leftEnd) return true;
      if (tile.a === state.rightEnd || tile.b === state.rightEnd) return true;
    }
    return false;
  },
  isTeammate: function(state, a, b){
    if (a === b) return true;
    return state.players[a].team === state.players[b].team;
  },
  applyPlay: function(state, seat, tileIdx, side){
    if (state.phase !== 'play') return { ok:false, err:'phase' };
    if (state.turn !== seat) return { ok:false, err:'turn' };
    const p = state.players[seat];
    if (!p) return { ok:false, err:'player' };
    const tile = p.hand[tileIdx];
    if (!tile) return { ok:false, err:'tile' };
    let placedIndex = 0;
    if (state.chain.length === 0){
      state.chain.push({ a: tile.a, b: tile.b });
      state.leftEnd = tile.a; state.rightEnd = tile.b; placedIndex = 0;
    } else {
      if (side === 'left'){
        if (tile.a === state.leftEnd){
          state.chain.unshift({ a: tile.b, b: tile.a }); state.leftEnd = tile.b;
        } else if (tile.b === state.leftEnd){
          state.chain.unshift({ a: tile.a, b: tile.b }); state.leftEnd = tile.a;
        } else return { ok:false, err:'nomatch' };
        placedIndex = 0;
      } else if (side === 'right'){
        if (tile.a === state.rightEnd){
          state.chain.push({ a: tile.a, b: tile.b }); state.rightEnd = tile.b;
        } else if (tile.b === state.rightEnd){
          state.chain.push({ a: tile.b, b: tile.a }); state.rightEnd = tile.a;
        } else return { ok:false, err:'nomatch' };
        placedIndex = state.chain.length - 1;
      } else return { ok:false, err:'side' };
    }
    p.hand.splice(tileIdx, 1);
    state.passes = 0;
    state.lastPlay = { seat: seat, a: tile.a, b: tile.b, side: side, index: placedIndex };
    if (p.hand.length === 0){ Engine.endRound(state, seat, false); return { ok:true, ended:true }; }
    state.turn = (seat + 1) % state.numPlayers;
    return { ok: true };
  },
  applyDraw: function(state, seat){
    if (state.phase !== 'play') return { ok:false };
    if (state.turn !== seat) return { ok:false };
    if (state.boneyard.length === 0) return { ok:false, err:'empty' };
    state.players[seat].hand.push(state.boneyard.pop());
    return { ok: true };
  },
  applyPass: function(state, seat){
    if (state.phase !== 'play') return { ok:false };
    if (state.turn !== seat) return { ok:false };
    if (Engine.hasAnyMove(state, seat)) return { ok:false };
    if (state.boneyard.length > 0) return { ok:false };
    state.passes++;
    state.turn = (seat + 1) % state.numPlayers;
    if (state.passes >= state.numPlayers){
      Engine.endRound(state, -1, true);
      return { ok: true, ended: true };
    }
    return { ok: true };
  },
  endRound: function(state, winnerSeat, blocked){
    state.phase = 'roundEnd';
    let winner = winnerSeat;
    let gained = 0;
    if (blocked || winnerSeat < 0){
      let best = -1, bestSum = Infinity;
      for (let i = 0; i < state.players.length; i++){
        const s = handSum(state.players[i].hand);
        if (s < bestSum){ bestSum = s; best = i; }
      }
      winner = best;
    }
    for (let i = 0; i < state.players.length; i++){
      if (i === winner) continue;
      if (Engine.isTeammate(state, i, winner)) continue;
      gained += handSum(state.players[i].hand);
    }
    for (let i = 0; i < state.players.length; i++){
      if (Engine.isTeammate(state, i, winner)) state.players[i].score += gained;
    }
    state.roundResult = { winner: winner, blocked: !!blocked, points: gained };
    let champ = -1;
    for (let i = 0; i < state.players.length; i++){
      if (state.players[i].score >= TARGET_SCORE){ champ = state.players[i].team; break; }
    }
    if (champ >= 0){ state.matchWinner = champ; state.phase = 'matchEnd'; }
  },
  nextRound: function(state){
    const pool = shuffle(makeSet());
    const n = state.numPlayers;
    for (let i = 0; i < n; i++) state.players[i].hand = [];
    for (let r = 0; r < 7; r++) for (let i = 0; i < n; i++) state.players[i].hand.push(pool.pop());
    state.boneyard = pool; state.chain = [];
    state.leftEnd = null; state.rightEnd = null;
    state.passes = 0; state.phase = 'play';
    state.round++; state.roundResult = null; state.lastPlay = null;
    state.turn = Engine.findStarter(state);
    return state;
  }
};

/* ============================================================
   §5  BOT AI
   ============================================================ */
function countMatching(state, seat, value){
  const hand = state.players[seat].hand;
  let c = 0;
  for (let i = 0; i < hand.length; i++){
    if (hand[i].a === value || hand[i].b === value) c++;
  }
  return c;
}
function botScoreMove(state, move){
  const tile = move.tile;
  let score = tile.a + tile.b;
  if (tile.a === tile.b) score += 12;
  for (let i = 0; i < move.sides.length; i++){
    const side = move.sides[i];
    const end = (side === 'left') ? state.leftEnd : state.rightEnd;
    const newEnd = (tile.a === end) ? tile.b : tile.a;
    score += countMatching(state, move.seat, newEnd) * 1.5;
  }
  return score;
}
function botPickSide(state, seat, tile, sides){
  if (sides.length === 1) return sides[0];
  let bestSide = sides[0], bestScore = -Infinity;
  for (let i = 0; i < sides.length; i++){
    const side = sides[i];
    const end = (side === 'left') ? state.leftEnd : state.rightEnd;
    const newEnd = (tile.a === end) ? tile.b : tile.a;
    let sc = countMatching(state, seat, newEnd) * 3;
    if (side === 'right') sc += 0.1;
    if (sc > bestScore){ bestScore = sc; bestSide = side; }
  }
  return bestSide;
}
function botChooseMove(state, seat){
  const p = state.players[seat];
  if (state.chain.length === 0){
    let best = 0, bestVal = -Infinity;
    for (let i = 0; i < p.hand.length; i++){
      const tile = p.hand[i];
      const v = (tile.a === tile.b) ? (200 + tile.a) : (tile.a + tile.b);
      if (v > bestVal){ bestVal = v; best = i; }
    }
    return { type: 'play', tileIdx: best, side: 'right' };
  }
  const moves = [];
  for (let i = 0; i < p.hand.length; i++){
    const sides = Engine.legalSides(state, p.hand[i]);
    if (sides.length) moves.push({ i: i, tile: p.hand[i], sides: sides, seat: seat });
  }
  if (moves.length === 0){
    if (state.boneyard.length > 0) return { type: 'draw' };
    return { type: 'pass' };
  }
  let bestMove = moves[0], bestScore = -Infinity;
  for (let i = 0; i < moves.length; i++){
    const sc = botScoreMove(state, moves[i]);
    if (sc > bestScore){ bestScore = sc; bestMove = moves[i]; }
  }
  const side = botPickSide(state, seat, bestMove.tile, bestMove.sides);
  return { type: 'play', tileIdx: bestMove.i, side: side };
}

/* ============================================================
   §6  NET — PeerJS wrapper
   ============================================================ */
const Net = {
  peer: null,
  hostConn: null,
  clientConns: {},
  isHost: false,
  code: null,
  onMessage: null,
  onPeerJoin: null,
  onPeerLeave: null,
  onError: null,
  onOpen: null,
  onClose: null,
  _ready: false,

  peerIdFor: function(code){ return 'dmnpro-' + code; },

  initHost: function(code, cbs){
    Net.close();
    Net.isHost = true;
    Net.code = code;
    Net.onMessage = cbs.onMessage || null;
    Net.onPeerJoin = cbs.onPeerJoin || null;
    Net.onPeerLeave = cbs.onPeerLeave || null;
    Net.onError = cbs.onError || null;
    Net.onOpen = cbs.onOpen || null;
    Net.onClose = cbs.onClose || null;
    if (typeof Peer === 'undefined'){
      if (Net.onError) Net.onError({ type: 'lib-missing' });
      return;
    }
    try {
      Net.peer = new Peer(Net.peerIdFor(code), { debug: 0 });
    } catch (e){
      if (Net.onError) Net.onError({ type: 'init-failed', error: e });
      return;
    }
    Net.peer.on('open', function(id){
      Net._ready = true;
      if (Net.onOpen) Net.onOpen(id);
    });
    Net.peer.on('connection', function(conn){
      conn.on('open', function(){
        Net.clientConns[conn.peer] = conn;
        if (Net.onPeerJoin) Net.onPeerJoin(conn.peer);
      });
      conn.on('data', function(data){
        if (Net.onMessage) Net.onMessage(data, conn.peer);
      });
      conn.on('close', function(){
        delete Net.clientConns[conn.peer];
        if (Net.onPeerLeave) Net.onPeerLeave(conn.peer);
      });
      conn.on('error', function(err){ console.warn('[conn error]', err); });
    });
    Net.peer.on('error', function(err){
      console.warn('[peer error]', err.type, err);
      if (Net.onError) Net.onError(err);
    });
    Net.peer.on('disconnected', function(){
      try { Net.peer.reconnect(); } catch(e){}
    });
  },

  initClient: function(code, cbs){
    Net.close();
    Net.isHost = false;
    Net.code = code;
    Net.onMessage = cbs.onMessage || null;
    Net.onError = cbs.onError || null;
    Net.onOpen = cbs.onOpen || null;
    Net.onClose = cbs.onClose || null;
    if (typeof Peer === 'undefined'){
      if (Net.onError) Net.onError({ type: 'lib-missing' });
      return;
    }
    try {
      Net.peer = new Peer({ debug: 0 });
    } catch (e){
      if (Net.onError) Net.onError({ type: 'init-failed', error: e });
      return;
    }
    Net.peer.on('open', function(){
      Net._ready = true;
      const hostId = Net.peerIdFor(code);
      const conn = Net.peer.connect(hostId, { reliable: true });
      Net.hostConn = conn;
      conn.on('open', function(){ if (Net.onOpen) Net.onOpen(); });
      conn.on('data', function(data){ if (Net.onMessage) Net.onMessage(data, 'host'); });
      conn.on('close', function(){ if (Net.onClose) Net.onClose(); });
      conn.on('error', function(err){ console.warn('[conn error]', err); });
    });
    Net.peer.on('error', function(err){
      console.warn('[peer error]', err.type, err);
      if (Net.onError) Net.onError(err);
    });
    Net.peer.on('disconnected', function(){
      try { Net.peer.reconnect(); } catch(e){}
    });
  },

  send: function(msg){
    if (Net.isHost){
      for (const id in Net.clientConns){
        try { Net.clientConns[id].send(msg); } catch(e){}
      }
    } else {
      if (Net.hostConn && Net.hostConn.open){
        try { Net.hostConn.send(msg); } catch(e){}
      }
    }
  },
  sendTo: function(clientId, msg){
    if (!Net.isHost) return;
    const conn = Net.clientConns[clientId];
    if (conn){ try { conn.send(msg); } catch(e){} }
  },
  close: function(){
    if (Net.peer){ try { Net.peer.destroy(); } catch(e){} Net.peer = null; }
    Net.hostConn = null;
    Net.clientConns = {};
    Net.onMessage = null;
    Net.onPeerJoin = null;
    Net.onPeerLeave = null;
    Net.onError = null;
    Net.onOpen = null;
    Net.onClose = null;
    Net._ready = false;
  }
};

let boardAdjustRaf = null;
function scheduleAdjustBoard(){
  if (boardAdjustRaf) cancelAnimationFrame(boardAdjustRaf);
  boardAdjustRaf = requestAnimationFrame(function(){
    boardAdjustRaf = null;
    adjustBoardScale();
  });
}
function getCSSVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name);
  const n = parseFloat(v);
  return isNaN(n) ? fallback : n;
}
function adjustBoardScale(){
  const chain = D.chain;
  const scroll = D.boardScroll;
  if (!chain || !scroll) return;
  const tiles = chain.querySelectorAll('.tile');
  if (tiles.length === 0){ chain.style.removeProperty('--board-ts'); return; }
  const maxTs = getCSSVar('--board-max-ts', 44);
  const minTs = getCSSVar('--board-min-ts', 14);
  const availW = scroll.clientWidth - 48;
  const availH = scroll.clientHeight - 24;
  if (availW <= 0 || availH <= 0) return;
  chain.style.setProperty('--board-ts', maxTs + 'px');
  void chain.offsetWidth;
  let w = chain.getBoundingClientRect().width;
  let h = chain.getBoundingClientRect().height;
  if (w <= availW && h <= availH) return;
  const ratioW = availW / w;
  const ratioH = h > 0 ? availH / h : 1;
  const ratio = Math.min(ratioW, ratioH, 1);
  let newTs = Math.max(minTs, Math.floor(maxTs * ratio));
  chain.style.setProperty('--board-ts', newTs + 'px');
  void chain.offsetWidth;
  w = chain.getBoundingClientRect().width;
  if (w > availW){
    const r2 = availW / w;
    newTs = Math.max(minTs, Math.floor(newTs * r2));
    chain.style.setProperty('--board-ts', newTs + 'px');
  }
}

function render(){
  if (!S) return;
  renderTop();
  renderChain();
  renderHand();
  renderMeBar();
  renderBanner();
  pendingPop = -1;
  scheduleAdjustBoard();
}

function renderTop(){
  const top = D.gameTop;
  top.innerHTML = '';
  // Visual order: [opp1, teammate, opp2] — so teammate sits opposite (in middle)
  // Determine seat order to display
  const seatsInOrder = [];
  const meSeat = viewerSeat;
  if (S.numPlayers === 4 && isTeamsGame()){
    // Find teammate
    let teammateSeat = -1;
    for (let i = 0; i < S.numPlayers; i++){
      if (i !== meSeat && Engine.isTeammate(S, i, meSeat)){ teammateSeat = i; break; }
    }
    // Opponents (the other two)
    const oppSeats = [];
    for (let i = 0; i < S.numPlayers; i++){
      if (i !== meSeat && i !== teammateSeat) oppSeats.push(i);
    }
    // Visual order: opp1, teammate, opp2 -> teammate opposite
    if (oppSeats.length === 2 && teammateSeat >= 0){
      seatsInOrder.push(oppSeats[0], teammateSeat, oppSeats[1]);
    } else {
      for (let i = 0; i < S.numPlayers; i++) if (i !== meSeat) seatsInOrder.push(i);
    }
  } else {
    for (let i = 0; i < S.numPlayers; i++) if (i !== meSeat) seatsInOrder.push(i);
  }

  for (let k = 0; k < seatsInOrder.length; k++){
    const i = seatsInOrder[k];
    const p = S.players[i];
    const card = el('div', 'opp-card');
    card.dataset.seat = String(i);
    if (S.turn === i && S.phase === 'play') card.classList.add('active');
    if (isTeamsGame() && Engine.isTeammate(S, i, viewerSeat)) card.classList.add('teammate');

    const head = el('div', 'opp-head');
    const av = el('div', 'avatar', p.name.charAt(0).toUpperCase());
    const nm = el('span', 'opp-name', p.name);
    const ct = el('span', 'opp-count', String(p.hand.length));
    head.appendChild(av); head.appendChild(nm); head.appendChild(ct);

    const tiles = el('div', 'opp-tiles');
    const shown = Math.min(p.hand.length, 7);
    for (let j = 0; j < shown; j++) tiles.appendChild(makeTile(0, 0, { back: true }));
    if (p.hand.length > 7){
      const more = el('span', '', '+' + (p.hand.length - 7));
      more.style.cssText = 'font-size:9px;color:#9fb8bd;align-self:center;margin-left:2px;';
      tiles.appendChild(more);
    }
    card.appendChild(head);
    card.appendChild(tiles);
    top.appendChild(card);
  }
}

function isTeamsGame(){
  if (!S || S.numPlayers !== 4) return false;
  // Detect if teams are balanced (2 vs 2)
  const t0 = S.players[0].team;
  const t1 = S.players[1].team;
  const t2 = S.players[2].team;
  const t3 = S.players[3].team;
  return (t0 === t2 && t1 === t3 && t0 !== t1);
}

function renderChain(){
  const c = D.chain;
  c.innerHTML = '';
  for (let i = 0; i < S.chain.length; i++){
    const tile = S.chain[i];
    const isDouble = tile.a === tile.b;
    const node = makeTile(tile.a, tile.b, { horizontal: !isDouble });
    node.dataset.ci = String(i);
    if (i === pendingPop) node.classList.add('just-played');
    c.appendChild(node);
  }
}

function renderHand(){
  const h = D.hand;
  h.innerHTML = '';
  const me = S.players[viewerSeat];
  if (!me) return;
  const myTurn = (S.turn === viewerSeat && S.phase === 'play');
  for (let i = 0; i < me.hand.length; i++){
    const tile = me.hand[i];
    const node = makeTile(tile.a, tile.b, { horizontal: false });
    node.dataset.idx = String(i);
    if (myTurn){
      const sides = Engine.legalSides(S, tile);
      if (sides.length) node.classList.add('playable');
      else node.classList.add('dim');
    }
    if (pendingPlay && pendingPlay.tileIdx === i) node.classList.add('picked');
    h.appendChild(node);
  }
}

function renderMeBar(){
  const me = S.players[viewerSeat];
  if (!me) return;
  D.meName.textContent = me.name;
  D.meScore.textContent = me.score + ' ' + t('points');
  const myTurn = (S.turn === viewerSeat && S.phase === 'play' && !pendingPlay);

function renderBanner(){
  const b = D.turnBanner;
  if (!S || S.phase !== 'play'){ b.classList.remove('show'); return; }

function sendComment(seat, key){
  if (!S || seat < 0) return;
  hideCommentBar();
  if (mode === 'online'){

    else Net.send({ t:'comment', from: PLAYER_ID, seat: seat, key: key });

}
function broadcastComment(seat, key){
  // Send comment to all connected clients
  Net.send({ t:'comment', seat: seat, key: key });
}
function showCommentBubble(seat, key){
  let hostEl = null;
  const card = $('.opp-card[data-seat="' + seat + '"]');
  if (card) hostEl = card;
  else if (seat === viewerSeat) hostEl = D.hand.closest('.hand-area');

  if (old) old.remove();
  const bubble = el('div', 'comment-bubble', tComment(key));
  hostEl.style.position = hostEl.style.position || 'relative';

  clearTimeout(activeCommentTimers[seat]);
  activeCommentTimers[seat] = setTimeout(function(){
    bubble.classList.add('fadeout');
    setTimeout(function(){ bubble.remove(); }, 460);
  }, 2400);
}
function maybeBotComment(seat){
  if (!commentsEnabled) return;
  if (!S) return;
  if (!S.players[seat] || !S.players[seat].isBot) return;
  if (Math.random() > 0.18) return;
  setTimeout(function(){
    const key = COMMENT_KEYS[rnd(COMMENT_KEYS.length)];
    showCommentBubble(seat, key);
    // Broadcast bot comments so online players see them too
    if (mode === 'online' && isHost) broadcastComment(seat, key);
  }, 500 + rnd(600));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}

function doNextRound(){
  if (!S) return;
  if (mode === 'online' && !isHost) return;
  pendingPlay = null;
  Engine.nextRound(S);
  afterChange();
}
function afterChange(){
  if (mode === 'online' && isHost) broadcastState();
  tick();
}

function scheduleBot(){
  clearTimeout(botTimer); botTimer = null;
  if (!S || S.phase !== 'play') return;
  if (mode === 'online' && !isHost) return;
  if (privacyBlocking) return;
  if (pendingPlay) return;
  const p = S.players[S.turn];
  if (!p || !p.isBot) return;
  botTimer = setTimeout(doBotMove, 620 + rnd(420));
}
function doBotMove(){
  if (!S || S.phase !== 'play') return;
  if (mode === 'online' && !isHost) return;
  if (pendingPlay) return;
  const seat = S.turn;
  const p = S.players[seat];
  if (!p || !p.isBot) return;
  const move = botChooseMove(S, seat);
  if (move.type === 'play'){
    const r = Engine.applyPlay(S, seat, move.tileIdx, move.side);
    if (r.ok) pendingPop = S.lastPlay ? S.lastPlay.index : -1;
  } else if (move.type === 'draw'){
    Engine.applyDraw(S, seat);
  } else {
    Engine.applyPass(S, seat);
  }
  afterChange();
  maybeBotComment(seat);
}

/* ============================================================
   §15  HUMAN ACTIONS
   ============================================================ */
function isMyTurnOnline(){ return S && S.turn === mySeat && S.phase === 'play'; }

function humanPlay(tileIdx, side){
  if (!S || S.phase !== 'play') return;
  if (S.turn !== viewerSeat){ toast(t('notYourTurn'), 'err'); return; }
  if (pendingPlay) return;

  if (commentsEnabled && !privacyBlocking){
    pendingPlay = { tileIdx: tileIdx, side: side, seat: viewerSeat };
    const node = $('.hand .tile[data-idx="' + tileIdx + '"]');
    if (node) node.classList.add('picked');
    render();
    showCommentBar(viewerSeat, true);
    return;
  }
  applyHumanPlay(tileIdx, side);
}

function applyHumanPlay(tileIdx, side){
  if (mode === 'online' && !isHost){
    Net.send({ t:'action', from: PLAYER_ID, action: { type:'play', tileIdx: tileIdx, side: side } });
    return;
  }
  const r = Engine.applyPlay(S, viewerSeat, tileIdx, side);
  if (!r.ok){
    toast(t('invalidMove'), 'err');
    const node = $('.hand .tile[data-idx="' + tileIdx + '"]');
    if (node){ node.classList.remove('shake'); void node.offsetWidth; node.classList.add('shake'); }
    return;
  }
  pendingPop = S.lastPlay ? S.lastPlay.index : -1;
  afterChange();
}

function confirmPendingPlay(commentKey){
  if (!pendingPlay) return;
  const p = pendingPlay;
  pendingPlay = null;
  hideCommentBar();
  applyHumanPlay(p.tileIdx, p.side);
  if (commentKey){
    // Any real player — host or guest — can send a comment
    if (mode === 'online'){
      if (isHost) broadcastComment(p.seat, commentKey);
      else Net.send({ t:'comment', from: PLAYER_ID, seat: p.seat, key: commentKey });
    }
    showCommentBubble(p.seat, commentKey);
  }
}
function cancelPendingPlay(){
  if (!pendingPlay) return;
  const p = pendingPlay;
  pendingPlay = null;
  hideCommentBar();
  applyHumanPlay(p.tileIdx, p.side);
}

function humanDraw(){
  if (!S || S.phase !== 'play') return;
  if (S.turn !== viewerSeat) return;
  if (pendingPlay) return;
  if (mode === 'online' && !isHost){
    Net.send({ t:'action', from: PLAYER_ID, action: { type:'draw' } });
    return;
  }
  const r = Engine.applyDraw(S, viewerSeat);
  if (r.ok){ toast(t('drew'), 'ok'); afterChange(); }
}
function humanPass(){
  if (!S || S.phase !== 'play') return;
  if (S.turn !== viewerSeat) return;
  if (pendingPlay) return;
  if (mode === 'online' && !isHost){
    Net.send({ t:'action', from: PLAYER_ID, action: { type:'pass' } });
    return;
  }
  const r = Engine.applyPass(S, viewerSeat);
  if (r.ok){ toast(t('passed')); afterChange(); }
}

/* ============================================================
   §17  DRAG & DROP
   ============================================================ */
function computeDropSide(clientX){
  const tiles = D.chain.querySelectorAll('.tile');
  if (tiles.length === 0) return 'right';
  const firstRect = tiles[0].getBoundingClientRect();
  const lastRect  = tiles[tiles.length - 1].getBoundingClientRect();
  const midX = (firstRect.left + lastRect.right) / 2;
  return (clientX < midX) ? 'left' : 'right';
}
function clearDropTargets(){
  const old = D.chain.querySelectorAll('.tile.drop-target');
  for (let i = 0; i < old.length; i++) old[i].classList.remove('drop-target');
}
function updateDropTarget(clientX){
  clearDropTargets();
  if (!drag) return;
  const tiles = D.chain.querySelectorAll('.tile');
  if (tiles.length === 0) return;
  if (drag.sides.length === 0) return;
  if (drag.sides.length === 1){
    const idx = (drag.sides[0] === 'left') ? 0 : tiles.length - 1;
    tiles[idx].classList.add('drop-target');
    return;
  }
  const side = computeDropSide(clientX);
  if (drag.sides.indexOf(side) === -1){
    const fallback = drag.sides[0];
    const idx = (fallback === 'left') ? 0 : tiles.length - 1;
    tiles[idx].classList.add('drop-target');
  } else {
    const idx = (side === 'left') ? 0 : tiles.length - 1;
    tiles[idx].classList.add('drop-target');
  }
}
function updateGhostHint(){
  if (!drag || !drag.ghost) return;
  let color = '#37c978';
  if (drag.sides.length === 0) color = '#e05555';
  else if (drag.sides.length === 2){
    const side = computeDropSide(drag.x);
    color = (drag.sides.indexOf(side) !== -1) ? '#37c978' : '#e05555';
  }
  drag.ghost.style.boxShadow =
    '0 18px 40px rgba(0,0,0,.6), 0 0 0 3px ' + color + ', 0 0 24px ' + color + '55';
}
function onHandPointerDown(e){
  if (!S || S.phase !== 'play') return;
  if (S.turn !== viewerSeat) return;
  if (privacyBlocking) return;
  if (pendingPlay) return;
  if (mode === 'online' && !isHost && !isMyTurnOnline()) return;
  const tileEl = e.target.closest ? e.target.closest('.hand .tile') : null;
  if (!tileEl) return;
  const idx = parseInt(tileEl.dataset.idx, 10);
  if (isNaN(idx)) return;
  const me = S.players[viewerSeat];
  const tile = me.hand[idx];
  if (!tile) return;
  const sides = Engine.legalSides(S, tile);
  e.preventDefault();
  drag = {
    idx: idx, el: tileEl, tile: tile, sides: sides,
    sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY,
    active: false, ghost: null, gw: 0, gh: 0
  };
  window.addEventListener('pointermove', onHandPointerMove, { passive: false });
  window.addEventListener('pointerup', onHandPointerUp);
  window.addEventListener('pointercancel', onHandPointerUp);
}
function startGhost(){
  const rect = drag.el.getBoundingClientRect();
  const g = makeTile(drag.tile.a, drag.tile.b, { horizontal: false });
  g.classList.add('drag-ghost');
  g.style.setProperty('--ts', rect.width + 'px');
  g.style.width = rect.width + 'px';
  g.style.height = rect.height + 'px';
  g.style.left = rect.left + 'px';
  g.style.top = rect.top + 'px';
  document.body.appendChild(g);
  drag.ghost = g; drag.gw = rect.width; drag.gh = rect.height;
  drag.el.style.opacity = '0.22';
  updateGhostHint();
}
function moveGhost(){
  if (!drag || !drag.ghost) return;
  drag.ghost.style.left = (drag.x - drag.gw / 2) + 'px';
  drag.ghost.style.top = (drag.y - drag.gh / 2) + 'px';
}
function onHandPointerMove(e){
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.active && (dx * dx + dy * dy) > 70){
    drag.active = true;
    startGhost();
  }
  if (drag.active){
    e.preventDefault();
    moveGhost();
    updateGhostHint();
    updateDropTarget(e.clientX);
  }
}
function onHandPointerUp(e){
  window.removeEventListener('pointermove', onHandPointerMove);
  window.removeEventListener('pointerup', onHandPointerUp);
  window.removeEventListener('pointercancel', onHandPointerUp);
  clearDropTargets();
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  if (d.el) d.el.style.opacity = '';
  if (d.active){
    if (!d.sides || d.sides.length === 0){ render(); return; }
    let side;
    if (d.sides.length === 1) side = d.sides[0];
    else {
      side = computeDropSide(e.clientX);
      if (d.sides.indexOf(side) === -1) side = d.sides[0];
    }
    humanPlay(d.idx, side);
  } else {
    handleTap(d.idx, d.sides);
  }
}
function handleTap(idx, sides){
  if (!sides || sides.length === 0){ toast(t('noMove')); return; }
  if (sides.length === 1){ humanPlay(idx, sides[0]); return; }
  const me = S.players[viewerSeat];
  const tile = me.hand[idx];
  const side = botPickSide(S, viewerSeat, tile, sides);
  humanPlay(idx, side);
}

      '<div class="setup-row"><label>' + t('realPlayers') + '</label>' +
        '<div class="setup-ctrl">' +
          '<button data-act="minus" ' + (state.humans <= 1 ? 'disabled' : '') + '>−</button>' +
          '<span class="val">' + state.humans + '</span>' +
          '<button data-act="plus" ' + (state.humans >= state.total ? 'disabled' : '') + '>+</button>' +
        '</div></div>' +
      '<div class="setup-row"><label>' + t('botPlayers') + '</label>' +
        '<div class="setup-ctrl"><span class="val" style="color:#9fb8bd;">' + bots + '</span></div></div>' +
      '<div class="setup-row"><label>' + t('totalPlayers') + '</label>' +
        '<div class="setup-ctrl"><span class="val">' + state.total + '</span></div></div>' +
      commentNote +
      '<div class="row" style="margin-top:10px;">' +
        '<button class="btn primary" id="setupStart">' + t('startGame') + '</button>' +
        '<button class="btn ghost" id="setupCancel">' + t('cancel') + '</button>' +
      '</div>';
    openModal(html);
    D.modalBox.querySelectorAll('button[data-act]').forEach(function(b){
      b.addEventListener('click', function(){
        const act = b.getAttribute('data-act');
        if (act === 'minus') state.humans = Math.max(1, state.humans - 1);
        if (act === 'plus')  state.humans = Math.min(state.total, state.humans + 1);
        renderSetup();
      });
    });
    const startBtn = $('#setupStart');
    if (startBtn) startBtn.addEventListener('click', function(){
      closeModal();
      startBotGameWithSetup(state.modeKey, state.humans, state.total - state.humans);
    });
    const cancelBtn = $('#setupCancel');
    if (cancelBtn) cancelBtn.addEventListener('click', function(){ closeModal(); });
  }
  renderSetup();
}

/* ============================================================
   §19  START LOCAL BOT GAME
   ============================================================ */
function startBotGameWithSetup(modeKey, humansCount, botsCount){
  mode = 'bots';
  isHost = true;
  roomCode = null;
  connTimerStop();
  D.connDot.classList.add('hidden');

  const total = humansCount + botsCount;
  const is2v2 = (modeKey === '2v2');
  commentsEnabled = is2v2;
  let teams = null;
  if (total === 4) teams = [0, 1, 0, 1];

  const humans = [];
  for (let i = 0; i < humansCount; i++) humans.push(i);
  humanSeats = humans.slice();
  mySeat = 0; viewerSeat = 0;

  const botSeats = [];
  const names = [];
  for (let i = 0; i < total; i++){
    if (humans.indexOf(i) === -1){
      botSeats.push(i);
      names[i] = t('bot') + ' ' + (i + 1);
    } else {
      if (i === 0) names[i] = t('you');
      else if (humansCount === 2 && total === 2) names[i] = t('players') + ' 2';
      else if (is2v2) names[i] = (i === 1 ? t('teamB') : t('players')) + ' ' + (i + 1);
      else names[i] = t('players') + ' ' + (i + 1);
    }
  }

  S = Engine.newGame({ numPlayers: total, botSeats: botSeats, names: names, teams: teams });
  roundModalShown = -1;
  matchModalShown = false;
  commentPendingSeat = -1;
  pendingPlay = null;

  showScreen('game');
  render();
  renderCommentBar(false);
  scheduleBot();
  saveSession();
}

function createOnlineRoom(numPlayers, teamsMode){
  mode = 'online';
  isHost = true;
  roomCode = uid(6);
  mySeat = 0;
  viewerSeat = 0;
  humanSeats = [0];

  lobby = {
    code: roomCode,
    maxPlayers: numPlayers,
    teamsMode: !!teamsMode,
    members: [{
      id: PLAYER_ID,
      name: t('you'),
      seat: 0,
      host: true,
      team: 0
    }],
    started: false
  };

  D.roomCodeText.textContent = roomCode;
  renderLobby();
  showScreen('lobby');
  toast(t('creatingRoom'));

  Net.initHost(roomCode, {
    onOpen: function(){
      toast(t('reconnected'), 'ok');
    },
    onPeerJoin: function(peerId){},
    onPeerLeave: function(peerId){ handleHostPeerLeave(peerId); },
    onMessage: function(msg, fromId){ handleHostMessage(msg, fromId); },
    onError: function(err){
      console.warn('peer error', err);
      if (err && err.type === 'unavailable-id'){
        toast('Room code already in use. Try again.', 'err');
        leaveToMenu();
      }
    }
  });
  saveSession();
}

function handleHostPeerLeave(peerId){
  if (!lobby) return;
  const idx = lobby.members.findIndex(function(m){ return m.id === peerId; });
  if (idx >= 0){
    lobby.members.splice(idx, 1);
    broadcastLobby();
    toast('Player left', 'err');
  }
}

function handleHostMessage(msg, fromId){
  if (!msg || !msg.t) return;
  if (msg.t === 'hello'){
    handleHello(msg, fromId);
  } else if (msg.t === 'action'){
    handleRemoteAction(msg, fromId);
  } else if (msg.t === 'comment'){
    // ANY real player can send a comment — relay it to everyone
    if (msg.seat != null && msg.key){
      broadcastComment(msg.seat, msg.key);
      showCommentBubble(msg.seat, msg.key);
    }
  } else if (msg.t === 'ping'){
    Net.sendTo(fromId, { t: 'pong' });
  } else if (msg.t === 'bye'){
    handleHostPeerLeave(fromId);
  }
}

function handleHello(msg, fromId){
  if (!lobby) return;
  if (lobby.started){
    const existing = lobby.members.filter(function(m){ return m.id === fromId; })[0];
    if (existing){
      Net.sendTo(fromId, { t: 'state', state: sanitizeState(S, existing.seat), seat: existing.seat });
      Net.sendTo(fromId, { t: 'lobby', lobby: lobby });
    } else {
      Net.sendTo(fromId, { t: 'full' });
    }
    return;
  }
  const existing = lobby.members.filter(function(m){ return m.id === fromId; })[0];
  if (existing){
    existing.name = msg.name || existing.name;
    Net.sendTo(fromId, { t: 'lobby', lobby: lobby });
    return;
  }
  if (lobby.members.length >= lobby.maxPlayers){
    Net.sendTo(fromId, { t: 'full' });
    return;
  }

  /* =========================================================
     TEAM-AWARE SEAT ASSIGNMENT
     In 2v2 mode, prefer filling Team A first (seats 0 & 2)
     so the host's teammate sits opposite (seat 2), not beside.
     Join order: 0 (host) → 2 (teammate) → 1 → 3
     ========================================================= */
  const used = {};
  for (let i = 0; i < lobby.members.length; i++) used[lobby.members[i].seat] = true;
  let seat = -1;
  if (lobby.teamsMode && lobby.maxPlayers === 4){
    const teamOrder = [0, 2, 1, 3];
    for (let k = 0; k < teamOrder.length; k++){
      if (!used[teamOrder[k]]){ seat = teamOrder[k]; break; }
    }
  } else {
    for (let k = 0; k < lobby.maxPlayers; k++){
      if (!used[k]){ seat = k; break; }
    }
  }
  if (seat < 0){ Net.sendTo(fromId, { t: 'full' }); return; }

  // Default team: even seat -> Team A (0), odd seat -> Team B (1)
  const team = (lobby.teamsMode) ? (seat % 2) : 0;

  lobby.members.push({
    id: fromId,
    name: msg.name || ('P' + (seat + 1)),
    seat: seat,
    host: false,
    team: team
  });

  broadcastLobby();
  toast(t('playerJoined', msg.name || ('P' + (seat + 1))), 'ok');
}

function broadcastLobby(){
  Net.send({ t: 'lobby', lobby: lobby });
  renderLobby();
}

/* ============================================================
   §21  ONLINE — JOIN ROOM FLOW
   ============================================================ */
function joinRoom(code){
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6){ toast(t('roomNotFound'), 'err'); return; }

  mode = 'online';
  isHost = false;
  roomCode = code;
  mySeat = 0;
  viewerSeat = 0;
  humanSeats = [];

  lobby = { code: code, maxPlayers: 4, teamsMode: false, members: [], started: false };

  D.roomCodeText.textContent = code;
  renderLobby();
  showScreen('lobby');
  D.connDot.classList.remove('hidden');
  D.connDot.classList.add('wait');
  toast(t('connecting'));

  Net.initClient(code, {
    onOpen: function(){
      D.connDot.classList.remove('wait', 'off');
      Net.send({ t: 'hello', from: PLAYER_ID, name: t('you') });
    },
    onMessage: function(msg){ handleClientMessage(msg); },
    onError: function(err){
      if (err && err.type === 'peer-unavailable'){
        toast(t('roomNotFound'), 'err');
        leaveToMenu();
      } else if (err && err.type === 'lib-missing'){
        toast('PeerJS failed to load.', 'err');
        leaveToMenu();
      }
    },
    onClose: function(){
      D.connDot.classList.add('off');
      toast(t('hostLeft'), 'err');
      setTimeout(leaveToMenu, 1500);
    }
  });

  clearTimeout(joinTimeout);
  joinTimeout = setTimeout(function(){
    if (!S && lobby && lobby.members.length === 0){
      toast(t('roomNotFound'), 'err');
      leaveToMenu();
    }
  }, 7000);
  saveSession();
}

function handleClientMessage(msg){
  if (!msg || !msg.t) return;
  if (msg.t === 'lobby'){
    lobby = msg.lobby;
    if (lobby && lobby.members){
      const me = lobby.members.filter(function(m){ return m.id === PLAYER_ID; })[0];
      if (me){
        mySeat = me.seat;
        viewerSeat = me.seat;
        humanSeats = [me.seat];
      }
    }
    renderLobby();
  } else if (msg.t === 'state'){
    S = msg.state;
    if (msg.seat != null){
      mySeat = msg.seat;
      viewerSeat = msg.seat;
      humanSeats = [msg.seat];
    }
    if (S && isTeamsGame()){
      commentsEnabled = true;
    } else {
      commentsEnabled = false;
    }
    if (!S) return;
    if (S.phase === 'play'){ roundModalShown = -1; matchModalShown = false; }
    D.connDot.classList.remove('hidden', 'off', 'wait');
    showScreen('game');
    renderCommentBar(!!pendingPlay);
    tick();
  } else if (msg.t === 'full'){
    toast(t('roomFull'), 'err');
    leaveToMenu();
  } else if (msg.t === 'comment'){
    // Comment from anyone (host or another guest)
    if (msg.seat != null && msg.key) showCommentBubble(msg.seat, msg.key);
  } else if (msg.t === 'pong'){ /* heartbeat ok */ }
}

/* ============================================================
   §22  LOBBY RENDER
   ============================================================ */
function renderLobby(){
  if (!lobby) return;
  const box = D.lobbyPlayers;
  const teamCols = D.teamColumns;
  const aList = D.teamAList;
  const bList = D.teamBList;
  box.innerHTML = '';
  aList.innerHTML = '';
  bList.innerHTML = '';
  const max = lobby.maxPlayers;
  const teamsMode = !!lobby.teamsMode;

  if (teamsMode){
    box.classList.add('hidden');
    teamCols.classList.remove('hidden');
  } else {
    box.classList.remove('hidden');
    teamCols.classList.add('hidden');
  }

  for (let i = 0; i < max; i++){
    const m = (lobby.members || []).filter(function(x){ return x.seat === i; })[0];
    const item = makeLobbyItem(m, i, teamsMode);
    if (teamsMode){
      if (m){
        if (m.team === 0) aList.appendChild(item);
        else bList.appendChild(item);
      } else {
        // Empty seats: seat parity decides team
        if (i % 2 === 0) aList.appendChild(item);
        else bList.appendChild(item);
      }
    } else {
      box.appendChild(item);
    }
  }

  const titleEl = $('#lobbyPlayersTitle');
  if (titleEl){
    titleEl.textContent = t('players') + ' — ' + t('playersCount', lobby.members.length, lobby.maxPlayers);
  }

  const startBtn = $('#btnStartGame');
  if (isHost){
    const canStart = lobby.members.length >= 2;
    startBtn.disabled = !canStart;
    startBtn.textContent = canStart ? t('startGame') : t('needMorePlayers');
  } else {
    startBtn.disabled = true;
    startBtn.textContent = t('waitingHost');
  }
}

function makeLobbyItem(m, seat, teamsMode){
  const item = el('div', 'pl-item' + (m ? '' : ' empty'));
  const av = el('div', 'avatar', m ? m.name.charAt(0).toUpperCase() : '?');
  const nm = el('div', 'pl-name', m ? m.name : t('emptySeat'));
  item.appendChild(av); item.appendChild(nm);
  if (m){
    if (m.host) item.appendChild(el('span', 'tag host', t('host')));
    else item.appendChild(el('span', 'tag', t('guest')));
    if (teamsMode && isHost && !lobby.started){
      item.classList.add('clickable');
      item.title = t('clickToSwapTeam');
      item.addEventListener('click', function(){
        m.team = (m.team === 0) ? 1 : 0;
        broadcastLobby();
      });
    }
  } else {
    item.appendChild(el('span', 'tag bot', t('bot')));
  }
  return item;
}

/* ============================================================
   §23  START ONLINE GAME
   ============================================================ */
function startOnlineGame(){
  if (!isHost || !lobby) return;
  const max = lobby.maxPlayers;
  const names = [];
  const botSeats = [];
  const teamsArr = new Array(max).fill(0);

  for (let i = 0; i < max; i++){
    const m = lobby.members.filter(function(x){ return x.seat === i; })[0];
    if (m){
      names[i] = m.name;
      teamsArr[i] = m.team;
    } else {
      names[i] = t('bot') + ' ' + (i + 1);
      botSeats.push(i);
      teamsArr[i] = (i % 2);
    }
  }

  const teams = (max === 4 && lobby.teamsMode) ? teamsArr : null;

  S = Engine.newGame({
    numPlayers: max,
    botSeats: botSeats,
    names: names,
    teams: teams
  });

  commentsEnabled = (max === 4 && lobby.teamsMode);
  lobby.started = true;
  roundModalShown = -1;
  matchModalShown = false;
  pendingPlay = null;

  Net.send({ t: 'lobby', lobby: lobby });
  broadcastState();

  showScreen('game');
  render();
  renderCommentBar(false);
  scheduleBot();
  saveSession();
}

function broadcastState(){
  if (!S || !lobby) return;
  for (let i = 0; i < lobby.members.length; i++){
    const m = lobby.members[i];
    if (m.id === PLAYER_ID) continue;
    Net.sendTo(m.id, {
      t: 'state',
      state: sanitizeState(S, m.seat),
      seat: m.seat
    });
  }
}

function sanitizeState(state, forSeat){
  if (!state) return null;
  const copy = JSON.parse(JSON.stringify(state));
  for (let i = 0; i < copy.players.length; i++){
    if (i === forSeat) continue;
    const hand = copy.players[i].hand;
    const hidden = [];
    for (let j = 0; j < hand.length; j++) hidden.push({ a: -1, b: -1, hidden: true });
    copy.players[i].hand = hidden;
  }
  return copy;
}

function handleRemoteAction(msg, fromId){
  if (!lobby || !S || S.phase !== 'play') return;
  const member = lobby.members.filter(function(m){ return m.id === fromId; })[0];
  if (!member) return;
  const seat = member.seat;
  if (S.turn !== seat) return;
  const a = msg.action;
  if (!a) return;
  if (a.type === 'play'){
    const r = Engine.applyPlay(S, seat, a.tileIdx, a.side);
    if (r.ok){ pendingPop = S.lastPlay ? S.lastPlay.index : -1; afterChange(); }
  } else if (a.type === 'draw'){
    if (Engine.applyDraw(S, seat).ok) afterChange();
  } else if (a.type === 'pass'){
    if (Engine.applyPass(S, seat).ok) afterChange();
  }
}

/* ============================================================
   §24  LEAVE
   ============================================================ */
function leaveToMenu(){
  clearTimeout(botTimer); botTimer = null;
  hideCommentBar();
  Object.keys(activeCommentTimers).forEach(function(k){
    clearTimeout(activeCommentTimers[k]);
    delete activeCommentTimers[k];
  });
  if (mode === 'online'){
    if (Net._ready){ try { Net.send({ t:'bye', from: PLAYER_ID }); } catch(e){} }
    Net.close();
  }
  S = null; lobby = null; roomCode = null;
  drag = null; pendingPlay = null;
  privacyBlocking = false;
  commentsEnabled = false;
  mySeat = 0; viewerSeat = 0; humanSeats = [0];
  D.privacyMask.classList.remove('show');
  closeModal();
  connTimerStop();
  clearSession();
  D.connDot.classList.add('hidden');
  D.connDot.classList.remove('off', 'wait');
  showScreen('menu');
}

/* ============================================================
   §25  SESSION
   ============================================================ */
function saveSession(){
  try {
    localStorage.setItem('domino.session', JSON.stringify({
      mode: mode, roomCode: roomCode, isHost: isHost, mySeat: mySeat
    }));
  } catch (e){}
}
function clearSession(){ try { localStorage.removeItem('domino.session'); } catch (e){} }

/* ============================================================
   §26  CONNECTION WATCHDOG
   ============================================================ */
function connTimerStart(){
  connTimerStop();
  if (mode !== 'online' || isHost) return;
  D.connDot.classList.remove('hidden');

    if (Net.hostConn && Net.hostConn.open){
      try { Net.hostConn.send({ t:'ping', from: PLAYER_ID }); } catch(e){}

}
function connTimerStop(){ if (connTimer){ clearInterval(connTimer); connTimer = null; } }

$('#btnCopy').addEventListener('click', function(){ copyText(D.roomCodeText.textContent); });
function copyText(text){
  let done = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(t('copied'), 'ok'); }).catch(function(){ fallbackCopy(text); });
      done = true;
    }
  } catch (e){ done = false; }
  if (!done) fallbackCopy(text);
}
function fallbackCopy(text){
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast(t('copied'), 'ok');
  } catch (e){ toast(text); }
}

$('#btnStartGame').addEventListener('click', function(){
  if (!isHost) return;
  if (!lobby) return;
  if (lobby.members.length < 2){ toast(t('needMorePlayers'), 'err'); return; }
  startOnlineGame();
});
$('#btnLeaveLobby').addEventListener('click', function(){ leaveToMenu(); });

D.btnDraw.addEventListener('click', humanDraw);
D.btnPass.addEventListener('click', humanPass);
D.btnExit.addEventListener('click', function(){ leaveToMenu(); });
D.hand.addEventListener('pointerdown', onHandPointerDown);

$('#btnInfo').addEventListener('click', function(){
  const html =
    '<h3>' + t('infoTitle') + '</h3>' +
    '<p class="sub" style="white-space:pre-line;text-align:start;">' + escapeHtml(t('infoBody')) + '</p>' +
    '<div class="row"><button class="btn primary" id="btnInfoClose">' + t('close') + '</button></div>';
  openModal(html);
  const b = $('#btnInfoClose');
  if (b) b.addEventListener('click', function(){ closeModal(); });
});

document.addEventListener('keydown', function(e){
  if (!S || S.phase !== 'play') return;
  if (e.key === 'Escape'){
    if (pendingPlay) cancelPendingPlay();
    else hideCommentBar();
    return;
  }
  if (pendingPlay) return;
  if (e.key === 'd' || e.key === 'D') humanDraw();
  if (e.key === 'p' || e.key === 'P') humanPass();
});

window.addEventListener('beforeunload', function(){
  if (mode === 'online' && Net._ready){
    try { Net.send({ t:'bye', from: PLAYER_ID }); } catch(e){}
  }
});

/* ============================================================
   §28  BOOT
   ============================================================ */
function boot(){
  applyLang();
  showScreen('menu');
  window.addEventListener('resize', function(){
    if (S){ render(); scheduleAdjustBoard(); }
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){ if (S) scheduleAdjustBoard(); }, 260);
  });
}
boot();
