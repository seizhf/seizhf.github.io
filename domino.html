<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0a2a1f"/>
<title>Domino · دومينو</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;overflow:hidden;}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Noto Kufi Arabic",Tahoma,sans-serif;
  background:#050a12;color:#e9f0fa;
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;touch-action:manipulation;
}
#app{position:fixed;inset:0;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
.hidden{display:none!important;}
button{font-family:inherit;cursor:pointer;border:0;outline:0;}

.langPicker{position:absolute;top:10px;right:10px;display:flex;gap:4px;z-index:100;}
.langPicker button{
  padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);color:#dfe9f5;font-size:11.5px;font-weight:700;
  transition:.15s;
}
.langPicker button.on{background:#39d68b;color:#04311f;border-color:#39d68b;}
.langPicker button:hover{background:rgba(255,255,255,.18);}

#menu{
  align-items:center;justify-content:flex-start;gap:12px;padding:56px 14px 30px;
  background:radial-gradient(circle at 50% 15%,#12503a 0%,#07231a 45%,#04140d 100%);
  overflow-y:auto;
}
.logo{font-size:clamp(24px,6.5vw,38px);font-weight:800;letter-spacing:1px;
  background:linear-gradient(180deg,#fff2cf,#e0a84e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 6px 24px rgba(224,168,78,.25);margin-top:4px;text-align:center;}
.sub{opacity:.65;font-size:13px;margin:-6px 0 10px;text-align:center;max-width:420px;line-height:1.7;}
.card{width:min(460px,94vw);background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
  border-radius:18px;padding:14px;backdrop-filter:blur(8px);box-shadow:0 18px 44px rgba(0,0,0,.45);}
.card h3{margin:0 0 10px;font-size:14px;opacity:.75;font-weight:600;}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.modeBtn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#dfe9f5;
  padding:11px 8px;border-radius:12px;font-size:13.5px;font-weight:600;text-align:center;
  transition:.18s;line-height:1.5;
}
.modeBtn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px);}
.modeBtn.on{background:linear-gradient(180deg,#1f8f5f,#0d5f3d);border-color:#39d68b;color:#fff;
  box-shadow:0 0 0 2px rgba(57,214,139,.25),0 6px 18px rgba(0,0,0,.35);}
.big{width:100%;padding:13px;border-radius:13px;font-size:15px;font-weight:700;margin-top:10px;
  background:linear-gradient(180deg,#28a06a,#0e5f3e);color:#fff;box-shadow:0 6px 0 #06432c;transition:.12s;}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #06432c;}
.big.alt{background:linear-gradient(180deg,#3b6ea5,#22456b);box-shadow:0 6px 0 #16304a;}
.big.alt:active{box-shadow:0 3px 0 #16304a;}
.big.danger{background:linear-gradient(180deg,#a83a3a,#6b1e1e);box-shadow:0 6px 0 #3d0e0e;}
.big.danger:active{box-shadow:0 3px 0 #3d0e0e;}
.row{display:flex;gap:8px;margin-top:10px;align-items:center;}
.row label{font-size:13px;opacity:.75;white-space:nowrap;}
.row input[type=text],.row input[type=number]{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.3);color:#fff;font-family:inherit;font-size:15px;text-align:center;
  letter-spacing:2px;font-weight:700;outline:0;}
.row input[type=text]:focus,.row input[type=number]:focus{border-color:#39d68b;}
.row input::placeholder{letter-spacing:0;font-weight:400;font-size:13px;}
.row input[type=number]{max-width:80px;letter-spacing:0;}
.hint{font-size:12px;opacity:.55;text-align:center;margin-top:8px;line-height:1.7;}

#lobby{align-items:center;justify-content:center;gap:14px;padding:56px 20px 20px;
  background:radial-gradient(circle at 50% 20%,#12503a,#04140d 75%);}
.codebox{display:flex;align-items:center;gap:10px;font-size:15px;background:rgba(0,0,0,.35);
  padding:10px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);}
.codebox b{font-size:26px;letter-spacing:6px;color:#ffd166;font-family:monospace;}
.codebox button{background:rgba(255,255,255,.12);color:#fff;padding:7px 12px;border-radius:9px;font-size:12px;}
#lobbyPlayers{display:flex;flex-direction:column;gap:7px;width:min(420px,94vw);}
.lseat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:11px 13px;font-size:14px;
  transition:.25s;}
.lseat.me{border-color:#39d68b;background:rgba(57,214,139,.12);}
.lseat.host{border-color:#ffd166;box-shadow:0 0 0 1px rgba(255,209,102,.3);}
.lseat.waiting{opacity:.55;animation:breathe 1.8s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.85}}
.lseat.waiting .lnum{background:rgba(255,209,102,.3);}
.lnum{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.lname{flex:1;}
.ltag{font-size:11px;background:rgba(255,255,255,.13);padding:3px 8px;border-radius:20px;opacity:.8;}
.ltag.host{background:rgba(255,209,102,.3);color:#ffe8b0;opacity:1;}

#game{background:radial-gradient(ellipse at 50% 35%,#0f6b45 0%,#083c27 55%,#04200f 100%);}
#topbar{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:rgba(0,0,0,.3);backdrop-filter:blur(8px);font-size:13px;
  border-bottom:1px solid rgba(255,255,255,.07);}
#turnInfo{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#turnInfo .me{color:#7ef0b0;animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#myScore{font-size:12px;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:20px;white-space:nowrap;}
.tools{display:flex;gap:5px;}
.tools button{width:31px;height:31px;border-radius:9px;background:rgba(255,255,255,.1);
  color:#dfe9f5;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s;}
.tools button:active{background:rgba(255,255,255,.25);}

#opponents{display:flex;gap:7px;padding:8px 8px 4px;justify-content:center;flex-wrap:wrap;}
.opp{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.08);border-radius:13px;
  padding:6px 11px;min-width:86px;text-align:center;transition:.25s;}
.opp.active{border-color:#ffd166;box-shadow:0 0 0 2px rgba(255,209,102,.3),0 0 20px rgba(255,209,102,.35);}
.opp.mate{background:rgba(70,190,130,.16);}
.opp .oname{font-size:12.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:110px;margin:auto;}
.opp .ocount{font-size:11px;opacity:.75;}
.opp .oscore{font-size:10.5px;opacity:.6;margin-top:1px;}
.mini{display:flex;gap:2px;justify-content:center;margin-top:4px;min-height:15px;}
.mtile{width:6px;height:14px;border-radius:2px;
  background:linear-gradient(160deg,#efe6d0,#b3a78a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);}

#boardWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:6px 52px;min-height:0;}
#board{position:relative;direction:ltr;transform-origin:center center;}
.board-empty{opacity:.35;font-size:14px;letter-spacing:1px;direction:rtl;}

.dz{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:62%;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#cfe9dc;
  border:2px dashed rgba(255,255,255,.22);background:rgba(0,0,0,.15);
  opacity:0;pointer-events:none;transition:.16s;z-index:5;}
#dzLeft{left:5px;} #dzRight{right:5px;}
.dz.show{opacity:.5;}
.dz.hot{opacity:1;border-color:#7ef0b0;background:rgba(126,240,176,.18);color:#eafff2;
  box-shadow:0 0 24px rgba(126,240,176,.5);}
.dz.clickable{pointer-events:auto;opacity:.9;border-color:#7ef0b0;background:rgba(126,240,176,.16);}
.dz.clickable:active{background:rgba(126,240,176,.4);}

.tile{
  --c:30px;position:relative;display:flex;
  background:linear-gradient(158deg,#fffdf6 0%,#f3ecda 45%,#ded2b6 100%);
  border-radius:calc(var(--c)*0.17);
  box-shadow:0 2px 0 rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 #fff;
  padding:calc(var(--c)*0.075);flex:0 0 auto;
  transition:transform .16s ease,box-shadow .16s ease;
  overflow:hidden;
}
.tile.horiz{flex-direction:row;}
.tile.vert{flex-direction:column;}
.tile .half{flex:1 1 0;min-width:0;min-height:0;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5%;}
.tile.horiz .half+.half{border-left:1px solid rgba(70,52,25,.32);}
.tile.vert .half+.half{border-top:1px solid rgba(70,52,25,.32);}
.tile .half i{width:62%;height:62%;border-radius:50%;place-self:center;
  background:radial-gradient(circle at 34% 28%,#575757,#0d0d0d 72%);
  box-shadow:inset 0 -1px 1px rgba(255,255,255,.14);}
.tile.new{animation:pop .28s cubic-bezier(.2,1.5,.5,1);}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);
  opacity:.92;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6));}

#handWrap{padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.42));
  border-top:1px solid rgba(255,255,255,.07);}
#hand{--c:26px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end;
  min-height:56px;direction:rtl;}
#hand .tile{cursor:grab;touch-action:none;}
#hand .tile.playable{box-shadow:0 0 0 2px #7ef0b0,0 5px 12px rgba(0,0,0,.45);}
#hand .tile.playable:hover{transform:translateY(-9px);}
#hand .tile.dragging{opacity:.25;}
#hand .tile:active{cursor:grabbing;}

#overlay{position:absolute;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;z-index:60;animation:fade .25s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
#overlay .card{text-align:center;animation:pop2 .35s cubic-bezier(.2,1.4,.5,1);}
@keyframes pop2{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
#overlay h2{margin:0 0 8px;font-size:22px;color:#ffd166;}
#overlay p{margin:0 0 12px;opacity:.85;font-size:14px;line-height:1.8;}
#ovScores{display:flex;flex-direction:column;gap:5px;font-size:13px;}
#ovScores div{display:flex;justify-content:space-between;background:rgba(255,255,255,.06);
  padding:7px 12px;border-radius:9px;}

#toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.8);padding:9px 18px;border-radius:22px;font-size:13px;
  opacity:0;transition:.3s;pointer-events:none;z-index:70;white-space:nowrap;max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;}
#toast.show{opacity:1;}

#connBadge{position:absolute;top:56px;left:10px;font-size:11px;
  padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.5);z-index:80;
  display:flex;align-items:center;gap:5px;opacity:0;transition:.3s;}
#connBadge.show{opacity:1;}
#connBadge .dot{width:7px;height:7px;border-radius:50%;background:#7ef0b0;}
#connBadge.stale .dot{background:#ffb84a;animation:pulse 1s infinite;}

@media (max-width:400px){
  .modes{grid-template-columns:1fr;}
  #opponents{gap:5px;padding:6px 5px 2px;}
  .opp{min-width:74px;padding:5px 8px;}
  #boardWrap{padding:6px 44px;}
  .dz{width:38px;}
}
@media (min-width:900px){
  #opponents{padding:12px;}
  .opp{min-width:130px;padding:9px 16px;}
  #handWrap{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));}
}
</style>
</head>
<body>
<div id="app">

  <div id="menu" class="screen">
    <div class="langPicker" id="langPicker1"></div>
    <div class="logo" data-i18n="appName">دومينو أونلاين</div>
    <div class="sub" data-i18n="tagline"></div>

    <div class="card">
      <h3 data-i18n="modeTitle"></h3>
      <div class="modes" id="modeList">
        <button class="modeBtn on" data-mode="1v1" data-i18n="mode1v1"></button>
        <button class="modeBtn" data-mode="2v2" data-i18n="mode2v2"></button>
        <button class="modeBtn" data-mode="1v3" data-i18n="mode1v3"></button>
        <button class="modeBtn" data-mode="3v1" data-i18n="mode3v1"></button>
        <button class="modeBtn" data-mode="4p" data-i18n="mode4p"></button>
        <button class="modeBtn" data-mode="3p" data-i18n="mode3p"></button>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="onlineTitle"></h3>
      <div class="row">
        <input id="inpName" type="text" maxlength="10" data-i18n-ph="yourName"/>
      </div>
      <div class="row">
        <label data-i18n="humansLabel"></label>
        <input id="inpHumans" type="number" min="1" max="4" value="2"/>
        <span class="hint" style="margin:0;" data-i18n="humansHint"></span>
      </div>
      <button class="big" id="btnCreate" data-i18n="createRoom"></button>
      <div class="row">
        <input id="inpCode" type="text" maxlength="6" data-i18n-ph="roomCode" style="letter-spacing:6px;text-transform:uppercase;"/>
        <button class="big alt" id="btnJoin" style="width:auto;padding:13px 20px;margin:0;" data-i18n="joinBtn"></button>
      </div>
      <div class="hint" data-i18n="menuHint"></div>
    </div>

    <div class="card">
      <h3 data-i18n="quickTitle"></h3>
      <button class="big alt" id="btnSolo" data-i18n="quickPlay"></button>
    </div>
  </div>

  <div id="lobby" class="screen hidden">
    <div class="langPicker" id="langPicker2"></div>
    <div class="codebox">
      <span data-i18n="roomCodeLabel"></span>
      <b id="lobbyCode">------</b>
      <button id="btnCopy" data-i18n="copyBtn"></button>
    </div>
    <div id="lobbyPlayers"></div>
    <button class="big" id="btnStart" style="width:min(420px,94vw);" data-i18n="startBtn"></button>
    <button class="big danger" id="btnLeave" style="width:min(420px,94vw);" data-i18n="leaveBtn"></button>
    <div class="hint" data-i18n="lobbyHint"></div>
  </div>

  <div id="game" class="screen hidden">
    <div class="langPicker" id="langPicker3"></div>
    <div id="topbar">
      <div id="turnInfo"></div>
      <div id="myScore">0</div>
      <div class="tools">
        <button id="btnZoomIn" title="+">＋</button>
        <button id="btnZoomOut" title="−">－</button>
        <button id="btnRot" title="↻">↻</button>
        <button id="btnMenu" title="☰">☰</button>
      </div>
    </div>
    <div id="connBadge"><span class="dot"></span><span id="connText"></span></div>
    <div id="opponents"></div>
    <div id="boardWrap">
      <div id="board"></div>
      <div class="dz" id="dzLeft">◀</div>
      <div class="dz" id="dzRight">▶</div>
    </div>
    <div id="handWrap"><div id="hand"></div></div>
    <div id="toast"></div>
  </div>

  <div id="overlay" class="hidden">
    <div class="card">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div id="ovScores"></div>
    </div>
  </div>
</div>

<script>
'use strict';

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = n => Math.floor(Math.random() * n);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function genCode(){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i = 0; i < 6; i++) s += c[rnd(c.length)];
  return s;
}

let LANG = 'ar';
function t(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; }

function applyStaticTranslations(){
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
}

function setLang(lang){
  if(!I18N[lang]) lang = 'en';
  LANG = lang;
  try{ localStorage.setItem('domino_lang', lang); }catch(e){}
  document.documentElement.lang = lang;
  document.documentElement.dir  = I18N[lang].dir;
  applyStaticTranslations();
  renderLangPickers();
  if(currentScreen === 'lobby') renderLobby();
  else if(currentScreen === 'game') render();
  else renderMenuMode();
}

function renderLangPickers(){
  const html =
    '<button data-lang="ar"' + (LANG==='ar'?' class="on"':'') + '>العربية</button>' +
    '<button data-lang="fr"' + (LANG==='fr'?' class="on"':'') + '>FR</button>' +
    '<button data-lang="en"' + (LANG==='en'?' class="on"':'') + '>EN</button>';
  ['#langPicker1','#langPicker2','#langPicker3'].forEach(sel => {
    const el = $(sel);
    if(!el) return;
    el.innerHTML = html;
    el.querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => setLang(b.dataset.lang)));
  });
}

/* ===== التخزين ===== */
const KEYS = {
  session:'domino_session_v3',
  room: code => 'domino_room_v3_' + code
};
const store = {
  getSession(){ try{ return JSON.parse(localStorage.getItem(KEYS.session) || 'null'); }catch(e){ return null; } },
  setSession(s){ try{ localStorage.setItem(KEYS.session, JSON.stringify(s)); }catch(e){} },
  clearSession(){ try{ localStorage.removeItem(KEYS.session); }catch(e){} },
  getRoom(code){
    if(!code) return null;
    try{ return JSON.parse(localStorage.getItem(KEYS.room(code)) || 'null'); }catch(e){ return null; }
  },
  setRoom(room){
    if(!room || !room.code) return;
    try{ localStorage.setItem(KEYS.room(room.code), JSON.stringify(room)); }catch(e){}
  }
};

/* ===== الشبكة ===== */
let NET = null;
function openNet(code){
  closeNet();
  try{
    NET = new BroadcastChannel('domino_bc_v3_' + code);
    NET.onmessage = e => onNetMessage(e.data);
  }catch(e){ NET = null; }
}
function closeNet(){ if(NET){ try{ NET.close(); }catch(e){} NET = null; } }
function broadcast(msg){ if(NET){ try{ NET.postMessage(msg); }catch(e){} } }

let MY_CID = null;
let MY_NAME = '';
let MY_SEAT = 0;
let ROOM = null;
let IS_HOST = false;
let ONLINE = false;
let currentScreen = 'menu';
let selectedMode = '1v1';

let heartbeatTimer = null;
let hostCheckTimer = null;
let tickTimer = null;
let helloInterval = null;

const HEARTBEAT_MS = 1500;
const HOST_STALE_MS = 5000;
const TARGET_SCORE = 100;

const App = { zoom: 1, selectedTile: null, drag: null };

/* ===== الأنماط ===== */
const MODES = {
  '1v1': { players:2, teams:[[0],[1]] },
  '2v2': { players:4, teams:[[0,2],[1,3]] },
  '1v3': { players:4, teams:[[0],[1,2,3]] },
  '3v1': { players:4, teams:[[0,1,2],[3]] },
  '4p' : { players:4, teams:[[0],[1],[2],[3]] },
  '3p' : { players:3, teams:[[0],[1],[2]] }
};
const BOT_NAMES = {
  ar: ['آمين','كريم','ياسين','رشيد','سامي','نبيل'],
  fr: ['Ami','Karim','Yassine','Rachid','Sami','Nabil'],
  en: ['Ami','Karim','Yassine','Rachid','Sami','Nabil']
};

/* ===== إقلاع ===== */
function boot(){
  let savedLang = null;
  try{ savedLang = localStorage.getItem('domino_lang'); }catch(e){}
  LANG = I18N[savedLang] ? savedLang : 'ar';
  document.documentElement.lang = LANG;
  document.documentElement.dir  = I18N[LANG].dir;
  applyStaticTranslations();
  renderLangPickers();

  try{
    const n = localStorage.getItem('domino_name');
    if(n) $('#inpName').value = n;
  }catch(e){}

  const s = store.getSession();
  if(s && s.cid && s.code){
    const room = store.getRoom(s.code);
    if(room && room.players){
      const me = room.players.find(p => p.cid === s.cid);
      if(me){
        MY_CID = s.cid;
        MY_NAME = me.name || s.name || t('playerName');
        MY_SEAT = me.seat;
        ROOM = room;
        ONLINE = true;
        IS_HOST = (room.hostId === MY_CID);
        openNet(room.code);
        if(IS_HOST){
          const fresh = store.getRoom(room.code);
          if(fresh){ fresh.heartbeat = Date.now(); fresh.hostId = MY_CID; store.setRoom(fresh); ROOM = fresh; }
          startHeartbeat(); startHostTick();
        } else if(Date.now() - (room.heartbeat || 0) > HOST_STALE_MS){
          claimHost();
        }
        startHostCheck(); startHello();
        if(room.game && room.game.phase){
          showScreen('game'); render();
        } else {
          showScreen('lobby'); renderLobby();
        }
        return;
      }
    }
    store.clearSession();
  }
  showScreen('menu');
}

/* ===== إنشاء / انضمام ===== */
function buildSeats(mode, humans, hostCid, hostName){
  const n = MODES[mode].players;
  const pool = BOT_NAMES[LANG] || BOT_NAMES.en;
  humans = Math.max(1, Math.min(n, humans | 0));
  const seats = [];
  let b = 0;
  for(let i = 0; i < n; i++){
    if(i === 0){
      seats.push({ seat:i, cid:hostCid, name:hostName, bot:false, humanSlot:true,
                   connected:true, lastSeen:Date.now() });
    } else if(i < humans){
      seats.push({ seat:i, cid:null, name:'', bot:false, humanSlot:true,
                   connected:false, lastSeen:0 });
    } else {
      seats.push({ seat:i, cid:null, name:pool[b++ % pool.length], bot:true, humanSlot:false,
                   connected:false, lastSeen:0 });
    }
  }
  return seats;
}

function createRoom(){
  const name = ($('#inpName').value || '').trim().slice(0, 10) || t('playerName');
  try{ localStorage.setItem('domino_name', name); }catch(e){}
  MY_NAME = name;
  MY_CID = uid();
  const code = genCode();
  const mode = selectedMode;
  const n = MODES[mode].players;
  let humans = parseInt($('#inpHumans').value, 10);
  if(isNaN(humans)) humans = 2;
  humans = Math.max(1, Math.min(n, humans));

  const room = {
    code: code,
    createdAt: Date.now(),
    hostId: MY_CID,
    heartbeat: Date.now(),
    mode: mode,
    humansReserved: humans,
    players: buildSeats(mode, humans, MY_CID, MY_NAME),
    game: null,
    version: 0
  };
  store.setRoom(room);
  store.setSession({ cid:MY_CID, name:MY_NAME, code:code, seat:0 });

  ROOM = room; MY_SEAT = 0; IS_HOST = true; ONLINE = true;
  openNet(code);
  startHeartbeat(); startHostCheck(); startHello();
  showScreen('lobby'); renderLobby();
  broadcast({ t:'sync' });
  toast(t('roomCreated') + ' · ' + code);
}

function joinRoom(){
  const raw = ($('#inpCode').value || '').trim().toUpperCase();
  if(raw.length < 4){ toast(t('invalidCode')); return; }
  const name = ($('#inpName').value || '').trim().slice(0, 10) || t('playerName');
  try{ localStorage.setItem('domino_name', name); }catch(e){}

  const room = store.getRoom(raw);
  if(!room){ toast(t('roomNotFound')); return; }

  let existingCid = null;
  const s = store.getSession();
  if(s && s.code === raw && s.cid) existingCid = s.cid;

  let mySeat = -1;
  if(existingCid){
    const me = room.players.find(p => p.cid === existingCid);
    if(me) mySeat = me.seat;
  }
  if(mySeat < 0){
    for(const p of room.players){
      if(p.humanSlot && !p.cid){ mySeat = p.seat; break; }
    }
  }
  if(mySeat < 0){ toast(t('roomFull')); return; }

  MY_CID = existingCid || uid();
  MY_NAME = name;
  MY_SEAT = mySeat;

  const seatObj = room.players[mySeat];
  seatObj.cid = MY_CID;
  seatObj.name = MY_NAME;
  seatObj.bot = false;
  seatObj.connected = true;
  seatObj.lastSeen = Date.now();

  store.setRoom(room);
  store.setSession({ cid:MY_CID, name:MY_NAME, code:raw, seat:mySeat });

  ROOM = room;
  IS_HOST = (room.hostId === MY_CID);
  ONLINE = true;
  openNet(raw);
  startHostCheck(); startHello();
  if(!IS_HOST && Date.now() - (room.heartbeat || 0) > HOST_STALE_MS) claimHost();
  if(IS_HOST){ startHeartbeat(); startHostTick(); }

  if(room.game && room.game.phase){
    showScreen('game'); render();
  } else {
    showScreen('lobby'); renderLobby();
  }
  broadcast({ t:'sync' });
}

/* ===== نبض وانتخاب المضيف ===== */
function startHeartbeat(){
  stopHeartbeat();
  heartbeatTimer = setInterval(() => {
    if(!IS_HOST || !ROOM || !ONLINE) return;
    const fresh = store.getRoom(ROOM.code);
    if(!fresh) return;
    fresh.heartbeat = Date.now();
    fresh.hostId = MY_CID;
    store.setRoom(fresh);
    ROOM = fresh;
  }, HEARTBEAT_MS);
}
function stopHeartbeat(){ if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; } }

function startHostCheck(){
  stopHostCheck();
  hostCheckTimer = setInterval(() => {
    if(IS_HOST || !ROOM || !ONLINE) return;
    const fresh = store.getRoom(ROOM.code);
    if(!fresh) return;
    ROOM = fresh;
    if(Date.now() - (fresh.heartbeat || 0) > HOST_STALE_MS) claimHost();
    updateConnBadge();
  }, 2500);
}
function stopHostCheck(){ if(hostCheckTimer){ clearInterval(hostCheckTimer); hostCheckTimer = null; } }

function claimHost(){
  if(!ROOM) return;
  const fresh = store.getRoom(ROOM.code);
  if(!fresh) return;
  if(Date.now() - (fresh.heartbeat || 0) < HOST_STALE_MS) return;
  fresh.claimLock = { cid:MY_CID, at:Date.now() };
  fresh.hostId = MY_CID;
  fresh.heartbeat = Date.now();
  store.setRoom(fresh);
  setTimeout(() => {
    const check = store.getRoom(ROOM.code);
    if(!check) return;
    if(check.hostId === MY_CID && check.claimLock && check.claimLock.cid === MY_CID){
      IS_HOST = true;
      ROOM = check;
      startHeartbeat(); startHostTick();
      toast(t('youAreHost'));
      broadcast({ t:'sync' });
      if(currentScreen === 'game') render();
      else if(currentScreen === 'lobby') renderLobby();
    } else {
      ROOM = check; IS_HOST = false;
    }
  }, 140);
}

function startHello(){
  stopHello();
  helloInterval = setInterval(() => {
    if(ONLINE && ROOM && !IS_HOST) broadcast({ t:'hello' });
  }, 8000);
}
function stopHello(){ if(helloInterval){ clearInterval(helloInterval); helloInterval = null; } }

/* ===== رسائل قناة البث ===== */
function onNetMessage(m){
  if(!m || typeof m !== 'object') return;
  if(m.t === 'sync'){
    if(!ROOM) return;
    const fresh = store.getRoom(ROOM.code);
    if(!fresh) return;
    ROOM = fresh;
    const wasHost = IS_HOST;
    IS_HOST = (fresh.hostId === MY_CID);
    if(IS_HOST && !wasHost){ startHeartbeat(); startHostTick(); }
    if(currentScreen === 'game') render();
    else if(currentScreen === 'lobby') renderLobby();
  }
  else if(m.t === 'action'){
    if(!IS_HOST || !ROOM || !ROOM.game) return;
    hostApplyAction(m.seat, m.action);
  }
  else if(m.t === 'hello'){
    if(IS_HOST) broadcast({ t:'sync' });
  }
}

/* ===== منطق اللعبة ===== */
function createDeck(){
  const d = []; let id = 0;
  for(let a = 0; a <= 6; a++)
    for(let b = a; b <= 6; b++) d.push({ a:a, b:b, id:id++ });
  return d;
}

function makeGame(mode, names, bots){
  const cfg = MODES[mode];
  const players = [];
  for(let i = 0; i < cfg.players; i++){
    let team = 0;
    for(let k = 0; k < cfg.teams.length; k++)
      if(cfg.teams[k].indexOf(i) >= 0) team = k;
    players.push({
      name: names[i] || ('P' + (i + 1)),
      bot: !!bots[i], team: team, hand: [], score: 0
    });
  }
  return {
    mode: mode, players: players, board: [], boneyard: [],
    turn: 0, leftEnd: null, rightEnd: null,
    phase: 'playing', passStreak: 0, round: 1,
    target: TARGET_SCORE, lastPlaced: null,
    roundResult: null, gameOver: false, log: [],
    anchorIdx: 0
  };
}

function dealRound(G){
  const deck = shuffle(createDeck());
  G.board = []; G.boneyard = []; G.leftEnd = null; G.rightEnd = null;
  G.passStreak = 0; G.phase = 'playing'; G.roundResult = null;
  G.lastPlaced = null; G.log = []; G.anchorIdx = 0;
  G.players.forEach(p => p.hand = []);
  const per = 7;
  for(let r = 0; r < per; r++){
    for(let i = 0; i < G.players.length; i++){
      const tile = deck.pop();
      if(tile) G.players[i].hand.push(tile);
    }
  }
  G.boneyard = deck;
  G.turn = findStarter(G);
}

function findStarter(G){
  for(let d = 6; d >= 0; d--){
    for(let p = 0; p < G.players.length; p++){
      if(G.players[p].hand.some(t => t.a === d && t.b === d)) return p;
    }
  }
  let best = -1, bp = 0;
  for(let p = 0; p < G.players.length; p++){
    for(const t of G.players[p].hand){
      const s = t.a + t.b;
      if(s > best){ best = s; bp = p; }
    }
  }
  return bp;
}

function sidesFor(G, t){
  if(G.board.length === 0) return ['first'];
  const s = [];
  if(t.a === G.leftEnd || t.b === G.leftEnd) s.push('left');
  if(t.a === G.rightEnd || t.b === G.rightEnd) s.push('right');
  return s;
}
function playableTiles(G, hand){ return hand.filter(t => sidesFor(G, t).length > 0); }

function placeTile(G, tile, side){
  if(G.board.length === 0){
    G.board.push({ a:tile.a, b:tile.b, vert:(tile.a === tile.b), id:tile.id });
    G.leftEnd = tile.a; G.rightEnd = tile.b;
    G.anchorIdx = 0;
    return;
  }
  if(side === 'left'){
    const cur = G.leftEnd;
    const v = (tile.a === cur) ? tile.b : tile.a;
    G.board.unshift({ a:v, b:cur, vert:(v === cur), id:tile.id });
    G.leftEnd = v;
    G.anchorIdx++;
  } else {
    const cur = G.rightEnd;
    const v = (tile.a === cur) ? tile.b : tile.a;
    G.board.push({ a:cur, b:v, vert:(v === cur), id:tile.id });
    G.rightEnd = v;
  }
}

function doPlay(G, seat, tile, side){
  const p = G.players[seat];
  const idx = p.hand.findIndex(x => x.id === tile.id);
  if(idx < 0) return false;
  p.hand.splice(idx, 1);
  placeTile(G, tile, side);
  G.passStreak = 0;
  G.lastPlaced = tile.id;
  if(p.hand.length === 0){ endRound(G, 'win', seat); return true; }
  G.turn = (G.turn + 1) % G.players.length;
  return true;
}

function drawLoop(G){
  const p = G.players[G.turn];
  let drew = 0;
  while(G.boneyard.length > 0){
    const t = G.boneyard.pop();
    p.hand.push(t);
    drew++;
    if(sidesFor(G, t).length > 0) break;
  }
  return drew;
}

function passTurn(G){
  G.passStreak++;
  if(G.passStreak >= G.players.length){ endRound(G, 'blocked', -1); return; }
  G.turn = (G.turn + 1) % G.players.length;
}

function endRound(G, reason, winner){
  if(G.phase === 'ended') return;
  G.phase = 'ended';
  let pts = 0;
  if(reason === 'blocked'){
    let low = Infinity, w = 0;
    G.players.forEach((p, i) => {
      const v = p.hand.reduce((s, t) => s + t.a + t.b, 0);
      if(v < low){ low = v; w = i; }
    });
    winner = w;
  }
  G.players.forEach((p, i) => { if(i !== winner) pts += p.hand.reduce((s, t) => s + t.a + t.b, 0); });
  G.players[winner].score += pts;
  G.roundResult = { winner: winner, pts: pts, reason: reason };

  if(G.players.some(p => p.score >= G.target)){
    G.gameOver = true;
    if(IS_HOST) saveAndSync();
    return;
  }

  setTimeout(() => {
    if(!IS_HOST || !ROOM || !ROOM.game) return;
    if(ROOM.game.phase !== 'ended' || ROOM.game.gameOver) return;
    ROOM.game.round++;
    dealRound(ROOM.game);
    saveAndSync();
    startHostTick();
  }, 3600);

  if(IS_HOST) saveAndSync();
}

/* ===== ذكاء الروبوت ===== */
function botMove(G){
  const p = G.players[G.turn];
  let opts = playableTiles(G, p.hand);
  if(opts.length === 0){
    drawLoop(G);
    opts = playableTiles(G, p.hand);
    if(opts.length === 0){ passTurn(G); return; }
  }
  let best = null, bestScore = -1e9, bestSide = null;
  for(const tile of opts){
    const sides = sidesFor(G, tile);
    for(const s of sides){
      let sc = tile.a + tile.b;
      if(tile.a === tile.b) sc += 6;
      if(sides.length > 1) sc += 4;
      if(s === 'first') sc += 2;
      if(sc > bestScore){ bestScore = sc; best = tile; bestSide = s; }
    }
  }
  if(best) doPlay(G, G.turn, best, bestSide);
}

/* ===== حلقة المضيف ===== */
function startHostTick(){ stopHostTick(); tickTimer = setTimeout(hostTick, 800); }
function stopHostTick(){ if(tickTimer){ clearTimeout(tickTimer); tickTimer = null; } }

function hostTick(){
  if(!IS_HOST || !ROOM || !ROOM.game) return;
  const G = ROOM.game;
  if(G.phase !== 'playing' || G.gameOver) return;
  const p = G.players[G.turn];
  if(p.bot){ botMove(G); saveAndSync(); startHostTick(); return; }

  const opts = playableTiles(G, p.hand);
  if(opts.length === 0){
    if(G.boneyard.length > 0){ drawLoop(G); saveAndSync(); startHostTick(); }
    else { passTurn(G); saveAndSync(); startHostTick(); }
  }
}

function saveAndSync(){
  if(!IS_HOST || !ROOM) return;
  ROOM.version = (ROOM.version || 0) + 1;
  ROOM.heartbeat = Date.now();
  if(ONLINE) store.setRoom(ROOM);
  broadcast({ t:'sync' });
  render();
}

function hostApplyAction(seat, action){
  if(!IS_HOST || !ROOM || !ROOM.game) return;
  const G = ROOM.game;
  if(G.phase !== 'playing' || G.gameOver) return;
  if(G.turn !== seat) return;
  if(action.type !== 'play') return;
  const p = G.players[seat];
  if(!p) return;
  const tile = p.hand.find(x => x.id === action.tileId);
  if(!tile) return;
  const sides = sidesFor(G, tile);
  if(sides.indexOf(action.side) < 0) return;
  doPlay(G, seat, tile, action.side);
  saveAndSync();
  startHostTick();
}

function submitPlay(tile, side){
  if(!ROOM || !ROOM.game) return;
  const action = { type:'play', tileId: tile.id, side: side };
  if(IS_HOST) hostApplyAction(MY_SEAT, action);
  else broadcast({ t:'action', seat: MY_SEAT, action: action });
  App.selectedTile = null;
}

/* ===== مغادرة ===== */
function leaveRoom(){
  if(ROOM && MY_CID){
    const room = store.getRoom(ROOM.code);
    if(room){
      const p = room.players.find(x => x.cid === MY_CID);
      if(p){ p.connected = false; p.lastSeen = Date.now(); }
      store.setRoom(room);
    }
  }
  stopHeartbeat(); stopHostCheck(); stopHostTick(); stopHello();
  closeNet();
  ROOM = null; IS_HOST = false; ONLINE = false;
  showScreen('menu');
}

const PIPS = {
  0:[], 1:[[2,2]], 2:[[1,1],[3,3]],
  3:[[1,1],[2,2],[3,3]],
  4:[[1,1],[1,3],[3,1],[3,3]],
  5:[[1,1],[1,3],[2,2],[3,1],[3,3]],
  6:[[1,1],[1,2],[1,3],[3,1],[3,2],[3,3]]
};
function pipsHTML(n){
  return PIPS[n].map(([r, c]) => '<i style="grid-row:' + r + ';grid-column:' + c + '"></i>').join('');
}
function halfEl(num){

  return d;
}

/* =========================================================
   ★ خوارزمية الثعبان مع دعم المزدوجات العمودية ★
   ========================================================= */
function dx(dir){ return dir === 'E' ? 1 : dir === 'W' ? -1 : 0; }
function dy(dir){ return dir === 'S' ? 1 : dir === 'N' ? -1 : 0; }
function turnCW(d){  return d === 'E' ? 'S' : d === 'S' ? 'W' : d === 'W' ? 'N' : 'E'; }
function turnCCW(d){ return d === 'E' ? 'N' : d === 'N' ? 'W' : d === 'W' ? 'S' : 'E'; }

function computeSnake(board, anchorIdx, rowLen){
  const n = board.length;
  if(!n) return null;
  anchorIdx = Math.max(0, Math.min(n - 1, anchorIdx));

  const dirs = new Array(n);
  const startPos = new Array(n);
  const chainLen = new Array(n);

  for(let i = 0; i < n; i++){
    chainLen[i] = (board[i].a === board[i].b) ? 1 : 2;
  }

  // المرساة
  dirs[anchorIdx] = 'E';
  startPos[anchorIdx] = { x: 0, y: 0 };

  // الجانب الأيمن
  let run = 1;
  for(let i = anchorIdx + 1; i < n; i++){
    const prevDir = dirs[i - 1];
    const prevStart = startPos[i - 1];
    const prevLen = chainLen[i - 1];
    startPos[i] = {
      x: prevStart.x + dx(prevDir) * prevLen,
      y: prevStart.y + dy(prevDir) * prevLen
    };
    if(run >= rowLen){
      dirs[i] = turnCW(prevDir);
      run = 1;
    } else {
      dirs[i] = prevDir;
      run++;
    }
  }

  // الجانب الأيسر
  run = 1;
  for(let i = anchorIdx - 1; i >= 0; i--){
    const nxtDir = dirs[i + 1];
    const nxtStart = startPos[i + 1];
    let myDir;
    if(run >= rowLen){
      myDir = turnCCW(nxtDir);
      run = 1;
    } else {
      myDir = nxtDir;
      run++;
    }
    dirs[i] = myDir;
    startPos[i] = {
      x: nxtStart.x - dx(myDir) * chainLen[i],
      y: nxtStart.y - dy(myDir) * chainLen[i]
    };
  }

  // حساب الخانات لكل حجر
  const cells = new Array(n);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

  for(let i = 0; i < n; i++){
    const tile = board[i];
    const d = dirs[i];
    const s = startPos[i];
    const isDouble = (tile.a === tile.b);

    let c2x, c2y;
    if(isDouble){
      // المزدوج: الخانة الثانية عمودية على اتجاه السلسلة
      if(dx(d) !== 0){ c2x = 0; c2y = -1; }
      else            { c2x = -1; c2y = 0; }
    } else {
      c2x = dx(d); c2y = dy(d);
    }

    const c1 = { x: s.x, y: s.y };
    const c2 = { x: s.x + c2x, y: s.y + c2y };

    const x0 = Math.min(c1.x, c2.x);
    const y0 = Math.min(c1.y, c2.y);
    const x1 = Math.max(c1.x, c2.x) + 1;
    const y1 = Math.max(c1.y, c2.y) + 1;

    cells[i] = { x0, y0, x1, y1, dir: d, isDouble, tile };
    if(x0 < minX) minX = x0;
    if(x1 > maxX) maxX = x1;
    if(y0 < minY) minY = y0;
    if(y1 > maxY) maxY = y1;
  }

  return { cells, dirs, minX, minY, cols: maxX - minX, rows: maxY - minY };
}

/* =========================================================
   رسم الطابلة
   ========================================================= */
function renderBoard(){
  const el = $('#board');
  const G = ROOM.game;
  el.innerHTML = '';

  if(!G.board.length){
    el.innerHTML = '<div class="board-empty">—</div>';
    el.style.width = '';
    el.style.height = '';
    return;
  }

  const wrapW = $('#boardWrap').clientWidth  || window.innerWidth - 100;
  const wrapH = $('#boardWrap').clientHeight || window.innerHeight - 250;
  const refCell = Math.max(14, Math.min(34, Math.floor(Math.min(wrapW, wrapH) / 6)));
  const rowLen = Math.max(3, Math.min(7, Math.floor(wrapW / (refCell * 2.2))));

  const snake = computeSnake(G.board, G.anchorIdx, rowLen);
  if(!snake) return;

  const cellByW = Math.floor(wrapW / Math.max(snake.cols, 3));
  const cellByH = Math.floor(wrapH / Math.max(snake.rows, 3));
  let cell = Math.min(cellByW, cellByH, 40);
  cell = Math.max(12, cell);

  el.style.width  = (snake.cols * cell) + 'px';
  el.style.height = (snake.rows * cell) + 'px';

  G.board.forEach((tile, i) => {
    const c = snake.cells[i];
    const horizontal = (c.x1 - c.x0) > (c.y1 - c.y0);

    const px = (c.x0 - snake.minX) * cell;
    const py = (c.y0 - snake.minY) * cell;
    const pw = (c.x1 - c.x0) * cell;
    const ph = (c.y1 - c.y0) * cell;

    const d = document.createElement('div');
    d.className = 'tile ' + (horizontal ? 'horiz' : 'vert');
    d.style.position = 'absolute';
    d.style.left = px + 'px';
    d.style.top  = py + 'px';
    d.style.width  = pw + 'px';
    d.style.height = ph + 'px';
    d.style.setProperty('--c', cell + 'px');
    d.style.zIndex = String(100 + i);

    let first = tile.a, second = tile.b;
    if(!c.isDouble){
      if((horizontal && c.dir === 'W') || (!horizontal && c.dir === 'N')){
        first = tile.b; second = tile.a;
      }
    }

    d.appendChild(halfEl(first));
    d.appendChild(halfEl(second));

    if(tile.id === G.lastPlaced) d.classList.add('new');
    el.appendChild(d);
  });
}

/* ===== اليد ===== */
function renderHand(){
  const G = ROOM.game, me = MY_SEAT;
  const p = G.players[me];
  const el = $('#hand');
  el.innerHTML = '';
  if(!p) return;
  const myTurn = (G.turn === me) && G.phase === 'playing' && !G.gameOver;
  const sorted = p.hand.slice().sort((x, y) => (y.a + y.b) - (x.a + x.b));
  sorted.forEach(tile => {
    const d = document.createElement('div');
    d.className = 'tile vert';
    d.dataset.id = tile.id;
    d.appendChild(halfEl(tile.a));
    d.appendChild(halfEl(tile.b));
    if(myTurn && sidesFor(G, tile).length > 0) d.classList.add('playable');
    d.addEventListener('pointerdown', ev => onHandDown(ev, tile, d));
    el.appendChild(d);
  });
  fitHand();
}
function fitHand(){
  const el = $('#hand');
  const n = el.children.length;
  if(!n) return;
  const avail = el.clientWidth || (window.innerWidth - 24);
  const gap = 6;
  let size = Math.floor((avail - (n - 1) * gap) / n);
  size = Math.max(15, Math.min(32, size));
  el.style.setProperty('--c', size + 'px');
}

/* ===== الرسم العام ===== */
function showScreen(name){
  currentScreen = name;
  ['menu','lobby','game'].forEach(s => {
    const el = document.getElementById(s);
    if(el) el.classList.toggle('hidden', s !== name);
  });
  if(name === 'menu') renderMenuMode();
}
function renderMenuMode(){
  $$('#modeList .modeBtn').forEach(b => b.classList.toggle('on', b.dataset.mode === selectedMode));
}

function renderLobby(){
  if(!ROOM) return;
  $('#lobbyCode').textContent = ROOM.code;
  const box = $('#lobbyPlayers');
  box.innerHTML = '';

  ROOM.players.forEach(p => {
    const d = document.createElement('div');
    d.className = 'lseat';
    const isHumanSlot = p.humanSlot;
    const waiting = isHumanSlot && !p.cid;

    if(p.cid === MY_CID) d.classList.add('me');
    if(ROOM.hostId === p.cid) d.classList.add('host');
    if(waiting) d.classList.add('waiting');

    let name;
    if(p.cid) name = p.name;
    else if(waiting) name = t('waitingTag');
    else if(p.bot) name = p.name || t('botTag');
    else name = t('emptySeat');

    let tags = '';
    if(ROOM.hostId === p.cid) tags += '<span class="ltag host">' + t('hostTag') + '</span>';
    if(p.cid === MY_CID) tags += '<span class="ltag">' + t('youTag') + '</span>';
    else if(waiting) tags += '<span class="ltag">⏳</span>';
    else if(!p.cid || p.bot) tags += '<span class="ltag">' + t('botTag') + '</span>';
    else tags += '<span class="ltag">' + t('onlineTag') + '</span>';

    d.innerHTML =
      '<span class="lnum">' + (p.seat + 1) + '</span>' +
      '<span class="lname">' + esc(name) + '</span>' +
      tags;
    box.appendChild(d);
  });
  $('#btnStart').style.display = IS_HOST ? '' : 'none';
}

function render(){
  if(!ROOM || !ROOM.game) return;
  renderTop();
  renderOpponents();
  renderBoard();
  renderHand();
  renderOverlay();
  updateConnBadge();
}

function renderTop(){
  const G = ROOM.game, me = MY_SEAT;
  let txt;
  if(G.gameOver) txt = '🏁 ' + t('gameEnded');
  else if(G.phase === 'ended') txt = t('roundEnded');
  else if(G.turn === me) txt = '<b class="me">▶ ' + t('myTurn') + '</b>';
  else txt = t('hisTurn') + ': ' + esc(G.players[G.turn].name);
  $('#turnInfo').innerHTML = txt;
  $('#myScore').textContent = t('yourScore') + ': ' + (G.players[me] ? G.players[me].score : 0);
}

function renderOpponents(){
  const G = ROOM.game, me = MY_SEAT, n = G.players.length;
  const box = $('#opponents');
  box.innerHTML = '';
  const myTeam = G.players[me].team;

  for(let k = 1; k < n; k++){
    const i = (me + k) % n;
    const p = G.players[i];
    const d = document.createElement('div');
    d.className = 'opp'
      + (G.turn === i && G.phase === 'playing' ? ' active' : '')
      + (n > 2 && p.team === myTeam ? ' mate' : '');

    const show = Math.min(p.hand.length, 6);
    let mini = '';
    for(let m = 0; m < show; m++) mini += '<span class="mtile"></span>';

    d.innerHTML =
      '<span class="oname">' + esc(p.name) + '</span>' +
      '<span class="ocount">🁢 ' + p.hand.length + '</span>' +
      '<div class="mini">' + mini + '</div>' +
      '<span class="oscore">' + p.score + ' ' + t('points') + '</span>';
    box.appendChild(d);
  }
}

function renderOverlay(){
  const G = ROOM.game;
  const ov = $('#overlay');
  if(G.gameOver){
    ov.classList.remove('hidden');
    let best = G.players[0];
    for(const p of G.players) if(p.score > best.score) best = p;
    $('#ovTitle').textContent = '🏆 ' + best.name + ' ' + t('wonGame');
    $('#ovText').textContent = best.score + ' ' + t('points');
    $('#ovScores').innerHTML = G.players
      .map(p => '<div><span>' + esc(p.name) + '</span><b>' + p.score + '</b></div>').join('');
    return;
  }
  if(G.phase === 'ended' && G.roundResult){
    ov.classList.remove('hidden');
    const w = G.players[G.roundResult.winner];
    $('#ovTitle').textContent = '🎉 ' + w.name + ' ' + t('wonRound');
    $('#ovText').textContent = (G.roundResult.reason === 'blocked' ? t('blockedRound') : '') +
      '+' + G.roundResult.pts + ' ' + t('plusPoints');
    $('#ovScores').innerHTML = G.players
      .map(p => '<div><span>' + esc(p.name) + '</span><b>' + p.score + '</b></div>').join('');
    return;
  }
  ov.classList.add('hidden');
}

function updateConnBadge(){
  const badge = $('#connBadge'), txt = $('#connText');
  if(!badge || !txt) return;
  if(!ONLINE || IS_HOST){ badge.classList.remove('show'); return; }
  const stale = ROOM && (Date.now() - (ROOM.heartbeat || 0) > HOST_STALE_MS);
  badge.classList.toggle('stale', !!stale);
  txt.textContent = stale ? t('connectionStale') : t('connectionOk');
  badge.classList.add('show');
}

function toast(msg){
  const el = $('#toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ===== السحب ===== */
function onHandDown(ev, tile, el){
  const G = ROOM && ROOM.game;
  if(!G || G.phase !== 'playing' || G.gameOver) return;
  if(G.turn !== MY_SEAT) return;
  if(sidesFor(G, tile).length === 0) return;
  ev.preventDefault();
  ev.stopPropagation();
  startDrag(ev, tile, el);
}
function startDrag(ev, tile, el){
  const rect = el.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'tile vert ghost';
  ghost.style.setProperty('--c', Math.max(rect.width, rect.height / 2) + 'px');
  ghost.appendChild(halfEl(tile.a));
  ghost.appendChild(halfEl(tile.b));
  ghost.style.width  = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  document.body.appendChild(ghost);

  App.drag = { tile, el, ghost, moved:false, sx:ev.clientX, sy:ev.clientY, side:null };
  moveGhost(ev.clientX, ev.clientY);
  window.addEventListener('pointermove', onDragMove, { passive:false });
  window.addEventListener('pointerup', onDragUp);
  window.addEventListener('pointercancel', onDragUp);
}
function moveGhost(x, y){
  const d = App.drag;
  if(!d) return;
  d.ghost.style.left = x + 'px';
  d.ghost.style.top  = y + 'px';
}
function onDragMove(ev){
  const d = App.drag;
  if(!d) return;
  ev.preventDefault();
  if(Math.abs(ev.clientX - d.sx) > 6 || Math.abs(ev.clientY - d.sy) > 6){
    if(!d.moved){ d.moved = true; d.el.classList.add('dragging'); }
  }
  moveGhost(ev.clientX, ev.clientY);
  if(d.moved){
    const side = sideAtPoint(ev.clientX, ev.clientY, d.tile);
    d.side = side;
    highlightZones(side);
  }
}
function onDragUp(){
  const d = App.drag;
  if(!d) return;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragUp);
  window.removeEventListener('pointercancel', onDragUp);
  if(d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  d.el.classList.remove('dragging');
  hideZones();
  App.drag = null;
  if(d.moved && d.side) submitPlay(d.tile, d.side);
  else if(!d.moved) tapTile(d.tile);
}
function sideAtPoint(x, y, tile){
  const G = ROOM.game;
  const sides = sidesFor(G, tile);
  if(sides.length === 0) return null;
  if(sides.length === 1) return sides[0];
  if(sides.indexOf('first') >= 0) return 'first';
  const r = $('#boardWrap').getBoundingClientRect();
  const cx = r.left + r.width / 2;
  return (x < cx) ? 'left' : 'right';
}
function highlightZones(side){
  const L = $('#dzLeft'), R = $('#dzRight');
  L.classList.remove('hot'); R.classList.remove('hot');
  L.classList.toggle('show', side === 'left');
  R.classList.toggle('show', side === 'right');
  if(side === 'left') L.classList.add('hot');
  if(side === 'right') R.classList.add('hot');
}
function hideZones(){
  $('#dzLeft').className = 'dz';
  $('#dzRight').className = 'dz';
  App.selectedTile = null;
}
function tapTile(tile){
  const G = ROOM && ROOM.game;
  if(!G || G.phase !== 'playing' || G.gameOver) return;
  if(G.turn !== MY_SEAT) return;
  const sides = sidesFor(G, tile);
  if(sides.length === 0) return;
  if(sides.length === 1){ submitPlay(tile, sides[0]); return; }
  App.selectedTile = tile;
  $('#dzLeft').className = 'dz clickable';
  $('#dzRight').className = 'dz clickable';
}

/* ===== ربط الواجهة ===== */
function wireUp(){
  $$('#modeList .modeBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('#modeList .modeBtn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      selectedMode = btn.dataset.mode;
      const n = MODES[selectedMode].players;
      $('#inpHumans').max = n;
      if(parseInt($('#inpHumans').value, 10) > n) $('#inpHumans').value = n;
    });
  });

  $('#inpHumans').addEventListener('change', () => {
    const n = MODES[selectedMode].players;
    let v = parseInt($('#inpHumans').value, 10) || 1;
    v = Math.max(1, Math.min(n, v));
    $('#inpHumans').value = v;
  });

  $('#btnSolo').addEventListener('click', () => {
    const mode = selectedMode;
    const cfg = MODES[mode];
    const names = [], bots = [];
    const pool = BOT_NAMES[LANG] || BOT_NAMES.en;
    let b = 0;
    for(let i = 0; i < cfg.players; i++){
      if(i === 0){ names.push(t('playerName')); bots.push(false); }
      else { names.push(pool[b++ % pool.length]); bots.push(true); }
    }
    MY_CID = uid(); MY_NAME = t('playerName'); MY_SEAT = 0;
    IS_HOST = true; ONLINE = false;
    closeNet(); stopHeartbeat(); stopHostCheck(); stopHello();
    ROOM = {
      code: 'SOLO-' + genCode(),
      createdAt: Date.now(), hostId: MY_CID, heartbeat: Date.now(),
      mode, players: names.map((n, i) => ({
        seat:i, cid: i === 0 ? MY_CID : null, name:n, bot: bots[i],
        humanSlot:false, connected: i === 0, lastSeen: Date.now(), score: 0
      })),
      game: null, version: 0
    };
    ROOM.game = makeGame(mode, names, bots);
    dealRound(ROOM.game);
    showScreen('game'); render(); startHostTick();
  });

  $('#btnCreate').addEventListener('click', createRoom);
  $('#btnJoin').addEventListener('click', joinRoom);
  $('#inpCode').addEventListener('keydown', e => { if(e.key === 'Enter') joinRoom(); });

  $('#btnCopy').addEventListener('click', () => {
    const c = ROOM ? ROOM.code : '';
    if(!c) return;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(c).then(() => toast(t('copied'))).catch(() => toast(c));
    } else toast(c);
  });

  $('#btnStart').addEventListener('click', () => {
    if(!IS_HOST || !ROOM) return;
    const n = MODES[ROOM.mode].players;
    const pool = BOT_NAMES[LANG] || BOT_NAMES.en;
    const names = [], bots = [];
    let b = 0;
    for(let i = 0; i < n; i++){
      const s = ROOM.players[i];
      if(s.cid){
        names.push(s.seat === MY_SEAT ? t('playerName') : s.name);
        bots.push(false);
      } else {
        const botName = (s.humanSlot ? pool[b++ % pool.length] : (s.name || pool[b++ % pool.length]));
        names.push(botName);
        bots.push(true);
        s.bot = true;
        s.name = botName;
        s.humanSlot = false;
      }
    }
    if(ONLINE) store.setRoom(ROOM);

    ROOM.game = makeGame(ROOM.mode, names, bots);
    ROOM.game.players.forEach((p, i) => p.score = ROOM.players[i].score || 0);
    dealRound(ROOM.game);
    saveAndSync();
    showScreen('game'); render(); startHostTick();
  });

  $('#btnLeave').addEventListener('click', leaveRoom);

  $('#btnZoomIn').addEventListener('click', () => { App.zoom = Math.min(2.2, App.zoom + 0.15); renderBoard(); });
  $('#btnZoomOut').addEventListener('click', () => { App.zoom = Math.max(0.5, App.zoom - 0.15); renderBoard(); });
  $('#btnRot').addEventListener('click', () => { renderBoard(); });
  $('#btnMenu').addEventListener('click', () => { if(confirm(t('confirmLeave'))) leaveRoom(); });

  $('#dzLeft').addEventListener('click', () => {
    if(App.selectedTile) submitPlay(App.selectedTile, 'left');
    hideZones();
  });
  $('#dzRight').addEventListener('click', () => {
    if(App.selectedTile) submitPlay(App.selectedTile, 'right');
    hideZones();
  });
  document.addEventListener('pointerdown', e => {
    if(App.selectedTile && !e.target.closest('.dz') && !e.target.closest('#hand')) hideZones();
  });

  let rzT = null;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => { fitHand(); if(currentScreen === 'game') renderBoard(); }, 120);
  });

  window.addEventListener('beforeunload', () => {
    if(ROOM && MY_CID && ONLINE){
      const room = store.getRoom(ROOM.code);
      if(room){
        const p = room.players.find(x => x.cid === MY_CID);
        if(p){ p.connected = false; p.lastSeen = Date.now(); }
        store.setRoom(room);
      }
    }
  });
}

wireUp();
boot();
</script>
