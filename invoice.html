<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaivINVOICE — Professional Invoice & Quote Builder | SaivCORE</title>
<meta name="description" content="SaivINVOICE — build professional invoices, quotes and delivery notes in Arabic, French and English. 100% client-side. Powered by SaivCORE.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&family=Inter:wght@300..900&family=Roboto:wght@300..900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ============================================================
   BASE / RESET
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:#eef2f7;color:#0f172a;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c2ccda;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#9aa8bd;background-clip:content-box;border:2px solid transparent}

/* ============================================================
   TOP BAR
   ============================================================ */
#topbar{
  background:#0b1220;color:#fff;padding:9px 14px;display:flex;align-items:center;
  gap:9px;flex-wrap:wrap;z-index:40;box-shadow:0 2px 14px rgba(0,0,0,.28);
}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:4px}
.brand .logo{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(135deg,#0ea5e9,#6366f1);box-shadow:0 4px 14px rgba(99,102,241,.45)
}
.brand b{font-size:14.5px;letter-spacing:.3px;line-height:1.1;display:block}
.brand small{display:block;font-size:9.5px;opacity:.62;letter-spacing:.5px;text-transform:uppercase}
.tb-sep{width:1px;height:26px;background:#1e293b;margin:0 2px}
.tb-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.55;font-weight:700}
.tb-select{
  background:#17233a;color:#fff;border:1px solid #26364f;border-radius:9px;
  padding:7px 10px;font-size:12.5px;outline:none;cursor:pointer;max-width:190px
}
.tb-select:focus{border-color:#3b82f6}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:0;border-radius:9px;padding:8px 12px;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:.16s;background:#17233a;color:#dbe4f0;
  white-space:nowrap;
}
.btn:hover{background:#243350;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.35)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:transparent;border:1px solid #26364f}
.btn-ghost:hover{background:#17233a}
.btn-danger{background:#b91c1c;color:#fff}
.btn-danger:hover{background:#dc2626}
.spacer{flex:1}
#saveState{font-size:11px;opacity:.6;display:flex;align-items:center;gap:6px;white-space:nowrap}
#saveState.ok{color:#4ade80;opacity:.95}

/* ============================================================
   WORKSPACE
   ============================================================ */
#workspace{flex:1;display:flex;overflow:hidden;min-height:0}

/* ---------- EDITOR ---------- */
#editor{
  width:480px;min-width:480px;background:#f7f9fc;border-inline-end:1px solid #dde4ee;
  display:flex;flex-direction:column;overflow:hidden;
}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid #e2e8f0;background:#fff;overflow-x:auto}
.tab{
  flex:1;min-width:78px;padding:9px 6px;border-radius:9px;border:1px solid transparent;background:transparent;
  font-weight:700;font-size:11.5px;color:#7a8699;cursor:pointer;transition:.16s;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
}
.tab:hover{color:#0ea5e9;background:#f1f7fd}
.tab.active{background:#eef6ff;border-color:#c7e0ff;color:#0369a1}
.panels{flex:1;overflow-y:auto;padding:12px 12px 70px}
.panel{display:none;animation:fade .18s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:#fff;border:1px solid #e5eaf2;border-radius:13px;padding:13px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.card>h3{
  margin:0 0 11px;font-size:11.5px;font-weight:800;color:#0f172a;display:flex;align-items:center;
  gap:8px;text-transform:uppercase;letter-spacing:.7px
}
.card>h3 i{color:#0ea5e9}
.hint{font-size:11px;color:#8b98ab;line-height:1.5;margin:8px 0 0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:700;color:#6b7a90;letter-spacing:.2px;min-width:0}
.fld input,.fld select,.fld textarea{
  border:1px solid #dbe2ec;border-radius:9px;padding:7px 9px;font-size:12.5px;color:#0f172a;
  background:#fff;outline:none;width:100%;transition:.15s;font-weight:500;
}
.fld textarea{resize:vertical;line-height:1.5;min-height:62px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.13)}
.fld input[type=color]{padding:2px;height:36px;cursor:pointer;border-radius:9px;background:#fff}
.fld input[type=range]{padding:0;height:22px;accent-color:#0ea5e9;cursor:pointer}
.chk{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:600;color:#475569;cursor:pointer;padding:5px 0}
.chk input{width:16px;height:16px;accent-color:#0ea5e9;cursor:pointer;flex:0 0 auto}

/* Item editor rows */
.item-card{border:1px solid #e2e8f0;border-radius:11px;padding:10px;background:#fbfcfe;margin-bottom:9px}
.item-card:hover{border-color:#c9d6ea}
.item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.item-num{
  width:22px;height:22px;border-radius:7px;background:#eef6ff;color:#0369a1;
  display:grid;place-items:center;font-size:11px;font-weight:800
}
.item-body{display:flex;flex-direction:column;gap:8px}
.item-line{display:grid;gap:7px}
.item-total{
  display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;
  color:#0369a1;background:#f0f9ff;border-radius:8px;padding:6px 9px;margin-top:2px
}
.mini{
  border:0;background:transparent;color:#94a3b8;cursor:pointer;width:26px;height:26px;
  border-radius:7px;font-size:11.5px;display:grid;place-items:center;transition:.15s
}
.mini:hover{background:#eef2f8;color:#1e293b}
.mini.danger:hover{background:#fee2e2;color:#dc2626}
.add-btn{
  border:1px dashed #b9c9e2;background:#f6f9ff;color:#0369a1;border-radius:9px;padding:9px;
  font-size:12px;font-weight:700;cursor:pointer;transition:.15s;width:100%
}
.add-btn:hover{background:#eaf2ff;border-color:#8fb4f0}

/* Image upload blocks */
.img-drop{
  border:1px dashed #c9d6ea;border-radius:11px;padding:12px;display:flex;align-items:center;gap:12px;
  background:#fbfcfe
}
.img-box{
  width:70px;height:70px;border-radius:10px;background:#eef2f8;display:grid;place-items:center;
  overflow:hidden;flex:0 0 auto;border:1px solid #e2e8f0
}
.img-box img{width:100%;height:100%;object-fit:contain}
.img-actions{display:flex;flex-direction:column;gap:6px;flex:1}
.img-actions .btn{justify-content:center;font-size:11.5px;padding:7px 10px}

/* Totals summary in editor */
.sum-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed #e8eef7;color:#475569}
.sum-row:last-child{border-bottom:0}
.sum-row b{color:#0f172a}
.sum-row.grand{font-size:14px;font-weight:800;color:#0369a1;border-top:2px solid #dbeafe;border-bottom:0;padding-top:8px;margin-top:4px}
.sum-row.grand b{color:#0369a1}

/* ---------- PREVIEW ---------- */
#previewArea{flex:1;position:relative;overflow:hidden;background:#dfe5ee;min-width:0}
#previewScroll{
  position:absolute;inset:0;overflow:auto;padding:34px 28px 90px;
  display:flex;justify-content:center;align-items:flex-start;
}
#zoomBar{
  position:absolute;inset-inline-end:18px;bottom:18px;z-index:20;background:#0b1220;color:#fff;
  border-radius:13px;display:flex;align-items:center;gap:4px;padding:6px;
  box-shadow:0 10px 30px rgba(0,0,0,.32)
}
#zoomBar button{
  border:0;background:transparent;color:#cbd5e1;width:32px;height:32px;border-radius:9px;
  cursor:pointer;font-size:12.5px;transition:.15s
}
#zoomBar button:hover{background:#1e2b41;color:#fff}
#zoomLabel{font-size:11.5px;font-weight:700;min-width:46px;text-align:center;letter-spacing:.3px}
#zoomBar .divider{width:1px;height:20px;background:#25344c;margin:0 3px}

#pageWrap{zoom:1;flex:0 0 auto}

/* ============================================================
   A4 CANVAS
   ============================================================ */
#a4{
  --accent:#1d4ed8;
  --f:'Inter',sans-serif;
  width:210mm;
  min-height:297mm;
  background:#ffffff;
  color:#1e293b;
  padding:12mm;
  font-family:var(--f);
  font-size:9.6pt;
  line-height:1.45;
  position:relative;
  box-shadow:0 12px 44px rgba(15,23,42,.22);
  border-radius:2px;
  overflow-wrap:break-word;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}
#a4 *{box-sizing:border-box}

/* --- Header --- */
.inv-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;
  padding-bottom:5mm;border-bottom:2.5px solid var(--accent);margin-bottom:5mm;
}
.inv-brand{display:flex;gap:4mm;align-items:center;min-width:0}
.inv-logo{max-width:34mm;max-height:24mm;object-fit:contain;flex:0 0 auto}
.inv-co-name{font-size:13.5pt;font-weight:800;color:#0f172a;line-height:1.2}
.inv-co-legal{font-size:8.4pt;color:#64748b;margin-top:1px}
.inv-co-meta{font-size:8.4pt;color:#64748b;line-height:1.55;margin-top:3px}
.inv-co-meta span{display:block}
.inv-doc-title{text-align:end;flex:0 0 auto}
.inv-doc-title h1{
  margin:0;font-size:20pt;font-weight:900;letter-spacing:1.5px;color:var(--accent);
  line-height:1.1;text-transform:uppercase;
}
.inv-doc-no{font-size:9.6pt;font-weight:800;color:#0f172a;margin-top:3px}
.inv-badge{
  display:inline-block;margin-top:5px;font-size:8pt;font-weight:800;letter-spacing:.6px;
  padding:2.5px 9px;border-radius:20px;text-transform:uppercase;
}
.inv-badge.paid{background:#dcfce7;color:#15803d}
.inv-badge.unpaid{background:#fee2e2;color:#b91c1c}
.inv-badge.partial{background:#fef3c7;color:#b45309}

/* --- Meta blocks --- */
.inv-meta{display:grid;grid-template-columns:1.35fr 1fr;gap:5mm;margin-bottom:5mm}
.inv-meta-box{
  border:1px solid #e2e8f0;border-radius:3mm;padding:3.4mm 4mm;background:#f8fafc;
}
.inv-meta-box.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.inv-meta-label{
  font-size:7.6pt;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--accent);margin-bottom:2.2mm;
}
.inv-meta-box.accent .inv-meta-label{color:rgba(255,255,255,.78)}
.inv-client-name{font-size:11pt;font-weight:800;color:#0f172a;line-height:1.25}
.inv-meta-box.accent .inv-client-name{color:#fff}
.inv-client-line{font-size:8.6pt;color:#64748b;line-height:1.55;margin-top:1px}
.inv-meta-box.accent .inv-client-line{color:rgba(255,255,255,.85)}
.inv-kv{display:flex;justify-content:space-between;gap:4mm;font-size:8.8pt;padding:1.5px 0}
.inv-kv span{color:#64748b}
.inv-meta-box.accent .inv-kv span{color:rgba(255,255,255,.78)}
.inv-kv b{color:#0f172a;font-weight:700;text-align:end}
.inv-meta-box.accent .inv-kv b{color:#fff}

/* --- Items table --- */
.inv-table{width:100%;border-collapse:collapse;font-size:8.8pt;margin-bottom:4mm}
.inv-table thead th{
  background:var(--accent);color:#fff;font-size:7.8pt;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;padding:2.6mm 2.2mm;text-align:start;vertical-align:middle;
}
.inv-table thead th.num{text-align:end}
.inv-table thead th.ctr{text-align:center}
.inv-table tbody td{
  padding:2.4mm 2.2mm;border-bottom:1px solid #e8eef7;vertical-align:top;color:#1e293b;
}
.inv-table tbody tr:nth-child(even) td{background:#f8fafc}
.inv-table tbody td.num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.inv-table tbody td.ctr{text-align:center;white-space:nowrap}
.inv-table tbody td.desc{font-weight:600}
.inv-table tfoot td{
  padding:2.6mm 2.2mm;font-weight:800;background:#f1f5f9;border-top:2px solid var(--accent);
  font-size:9pt;
}
.inv-table tfoot td.num{text-align:end;font-variant-numeric:tabular-nums}
.inv-idx{color:#94a3b8;font-weight:700;font-size:8pt}
.inv-desc-sub{font-size:7.8pt;color:#94a3b8;font-weight:400;margin-top:1px}

/* --- Totals --- */
.inv-bottom{display:grid;grid-template-columns:1fr 68mm;gap:5mm;margin-bottom:5mm;align-items:start}
.inv-notes-box{
  border:1px solid #e2e8f0;border-radius:3mm;padding:3.4mm 4mm;background:#f8fafc;
  font-size:8.6pt;color:#475569;line-height:1.55;
}
.inv-notes-box h4{
  margin:0 0 1.8mm;font-size:7.8pt;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--accent);
}
.inv-totals{border:1px solid #e2e8f0;border-radius:3mm;overflow:hidden}
.inv-tot-row{
  display:flex;justify-content:space-between;gap:4mm;padding:2.2mm 3.6mm;font-size:8.8pt;
  border-bottom:1px solid #eef2f8;color:#475569;
}
.inv-tot-row:last-child{border-bottom:0}
.inv-tot-row span{flex:0 0 auto}
.inv-tot-row b{font-weight:700;color:#0f172a;font-variant-numeric:tabular-nums;white-space:nowrap}
.inv-tot-row.disc b{color:#b91c1c}
.inv-tot-row.grand{
  background:var(--accent);color:#fff;font-size:11.5pt;font-weight:900;padding:3.2mm 3.6mm;
  border-bottom:0;
}
.inv-tot-row.grand span,.inv-tot-row.grand b{color:#fff}
.inv-tot-row.sub{background:#f8fafc;font-weight:700}

/* --- Amount in words --- */
.inv-words{
  border:1px dashed var(--accent);border-radius:3mm;padding:3.2mm 4mm;
  background:#f0f9ff;font-size:9pt;line-height:1.55;margin-bottom:5mm;
}
.inv-words .lbl{
  font-size:7.6pt;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--accent);display:block;margin-bottom:1.2mm;
}
.inv-words .val{font-weight:700;color:#0f172a;text-transform:capitalize}

/* --- Bank + signature --- */
.inv-foot{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-bottom:4mm}
.inv-foot-box{border:1px solid #e2e8f0;border-radius:3mm;padding:3.4mm 4mm;min-height:32mm}
.inv-foot-box h4{
  margin:0 0 2.2mm;font-size:7.8pt;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--accent);
}
.inv-foot-box .kv{display:flex;gap:2mm;font-size:8.6pt;padding:1.2px 0;line-height:1.5}
.inv-foot-box .kv span{color:#64748b;flex:0 0 auto;min-width:22mm}
.inv-foot-box .kv b{color:#0f172a;font-weight:700;word-break:break-all}
.inv-stamp-wrap{
  display:flex;align-items:center;justify-content:center;height:100%;min-height:26mm;
}
.inv-stamp-wrap img{max-width:52mm;max-height:30mm;object-fit:contain;opacity:.95}

/* --- Footer --- */
.inv-footer{
  margin-top:auto;padding-top:3mm;border-top:1px solid #e2e8f0;display:flex;
  justify-content:space-between;align-items:center;gap:4mm;font-size:7.6pt;color:#94a3b8;
}
.inv-footer .credit{font-weight:700}
.inv-footer .credit b{color:var(--accent)}

/* RTL adjustments */
#a4.rtl .inv-doc-title{text-align:start}
#a4.rtl .inv-table thead th.num,
#a4.rtl .inv-table tbody td.num,
#a4.rtl .inv-table tfoot td.num{text-align:start}
#a4.rtl .inv-table thead th.ctr,
#a4.rtl .inv-table tbody td.ctr{text-align:center}
#a4.rtl .inv-kv b{text-align:start}
#a4.rtl .inv-tot-row b{text-align:start}
#a4.rtl .inv-tot-row span{order:2}
#a4.rtl .inv-tot-row b{order:1}

/* ============================================================
   PRINT ENGINE
   ============================================================ */
@page{size:A4;margin:0}

@media print{
  html,body{
    background:#fff !important;margin:0 !important;padding:0 !important;
    height:auto !important;overflow:visible !important;
  }
  #topbar,#editor,#zoomBar,#creditBar,.no-print{display:none !important}
  #app{display:block !important;height:auto !important;overflow:visible !important}
  #workspace{display:block !important;overflow:visible !important;height:auto !important}
  #previewArea{
    position:static !important;overflow:visible !important;background:#fff !important;
    height:auto !important;display:block !important;
  }
  #previewScroll{
    position:static !important;overflow:visible !important;padding:0 !important;
    display:block !important;height:auto !important;
  }
  #pageWrap{zoom:1 !important}
  #a4{
    box-shadow:none !important;margin:0 !important;border-radius:0 !important;
    width:210mm !important;min-height:296mm !important;padding:12mm !important;
  }
  .inv-table tbody tr{break-inside:avoid}
  .inv-totals,.inv-words,.inv-foot,.inv-meta{break-inside:avoid}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1240px){ #editor{width:430px;min-width:430px} }
@media (max-width:1020px){
  #workspace{flex-direction:column}
  #editor{width:100%;min-width:0;height:48vh;border-inline-end:0;border-bottom:1px solid #dde4ee}
  #previewArea{height:52vh}
}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(20px);
  background:#0b1220;color:#fff;padding:10px 18px;border-radius:11px;font-size:12.5px;
  font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;
  box-shadow:0 10px 30px rgba(0,0,0,.3)
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="app">

  <!-- ================= TOP BAR ================= -->
  <header id="topbar" class="no-print">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-file-invoice-dollar"></i></div>
      <div>
        <b>Saiv<span style="color:#38bdf8">INVOICE</span></b>
        <small>Powered by SaivCORE</small>
      </div>
    </div>

    <div class="tb-sep"></div>

    <span class="tb-label" data-i18n="language"></span>
    <select id="langSelect" class="tb-select" style="max-width:132px">
      <option value="fr">🇫🇷 Français</option>
      <option value="ar">🇩🇿 العربية</option>
      <option value="en">🇬🇧 English</option>
    </select>

    <span class="tb-label" data-i18n="docType"></span>
    <select id="docTypeSelect" class="tb-select" style="max-width:170px"></select>

    <span class="tb-label" data-i18n="currency"></span>
    <select id="currencySelect" class="tb-select" style="max-width:118px">
      <option value="DZD">DZD — دج</option>
      <option value="EUR">EUR — €</option>
      <option value="USD">USD — $</option>
    </select>

    <div class="tb-sep"></div>

    <button class="btn btn-ghost" id="btnSample"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="sample"></span></button>
    <button class="btn btn-ghost" id="btnExport"><i class="fa-solid fa-file-export"></i><span data-i18n="exportJson"></span></button>
    <button class="btn btn-ghost" id="btnImport"><i class="fa-solid fa-file-import"></i><span data-i18n="importJson"></span></button>
    <button class="btn btn-danger" id="btnReset"><i class="fa-solid fa-trash-can"></i><span data-i18n="reset"></span></button>

    <div class="spacer"></div>
    <div id="saveState"><i class="fa-solid fa-circle-check"></i><span data-i18n="saved"></span></div>

  if (n < 20) return FR_ONES[n];
  const t = Math.floor(n / 10), u = n % 10;
  if (t === 7 || t === 9){
    const base = FR_TENS[t];
    if (u === 0) return t === 7 ? 'soixante-dix' : 'quatre-vingt-dix';
    if (u === 1 && t === 7) return 'soixante et onze';
    return base + '-' + FR_ONES[10 + u];
  }
  if (u === 0){
    if (t === 8) return 'quatre-vingts';
    return FR_TENS[t];
  }
  if (u === 1 && t !== 8) return FR_TENS[t] + ' et un';
  return FR_TENS[t] + '-' + FR_ONES[u];
}

function frUnder1000(n, followed){
  if (n < 100){
    let s = frUnder100(n);
    if (followed && s.slice(-6) === 'vingts') s = s.slice(0, -1);
    return s;
  }
  const h = Math.floor(n / 100);
  const rest = n % 100;
  let base = h === 1 ? 'cent' : FR_ONES[h] + ' cent';
  if (rest === 0){
    if (h > 1 && !followed) base += 's';
    return base;
  }
  let r = frUnder100(rest);
  if (followed && r.slice(-6) === 'vingts') r = r.slice(0, -1);
  return base + ' ' + r;
}

function frNumberToWords(n){
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n === 0) return 'zéro';
  const out = [];
  const b = Math.floor(n / 1e9); n %= 1e9;
  const m = Math.floor(n / 1e6); n %= 1e6;
  const t = Math.floor(n / 1e3); n %= 1e3;
  const u = n;
  if (b > 0) out.push(b === 1 ? 'un milliard' : frUnder1000(b, false) + ' milliards');
  if (m > 0) out.push(m === 1 ? 'un million' : frUnder1000(m, false) + ' millions');
  if (t > 0) out.push(t === 1 ? 'mille' : frUnder1000(t, true) + ' mille');
  if (u > 0) out.push(frUnder1000(u, false));
  return out.join(' ');
}

/* ---------- ARABIC ---------- */
const AR_ONES = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
const AR_TEENS = ['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر',
  'ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const AR_TENS = ['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const AR_HUNDREDS = ['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];

function arGroup3(n){
  const parts = [];
  const h = Math.floor(n / 100);
  const rest = n % 100;
  if (h > 0) parts.push(AR_HUNDREDS[h]);
  if (rest > 0){
    if (rest < 10) parts.push(AR_ONES[rest]);
    else if (rest < 20) parts.push(AR_TEENS[rest - 10]);
    else {
      const t = Math.floor(rest / 10);
      const u = rest % 10;
      if (u > 0) parts.push(AR_ONES[u] + ' و' + AR_TENS[t]);
      else parts.push(AR_TENS[t]);
    }
  }
  return parts.join(' و');
}

function arNumberToWords(n){
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n === 0) return 'صفر';
  const out = [];
  const b = Math.floor(n / 1e9); n %= 1e9;
  const m = Math.floor(n / 1e6); n %= 1e6;
  const t = Math.floor(n / 1e3); n %= 1e3;
  const u = n;

  if (b > 0){
    if (b === 1) out.push('مليار');
    else if (b === 2) out.push('ملياران');
    else if (b <= 10) out.push(arGroup3(b) + ' مليارات');
    else out.push(arGroup3(b) + ' مليار');
  }
  if (m > 0){
    if (m === 1) out.push('مليون');
    else if (m === 2) out.push('مليونان');
    else if (m <= 10) out.push(arGroup3(m) + ' ملايين');
    else out.push(arGroup3(m) + ' مليون');
  }
  if (t > 0){
    if (t === 1) out.push('ألف');
    else if (t === 2) out.push('ألفان');
    else if (t <= 10) out.push(arGroup3(t) + ' آلاف');
    else out.push(arGroup3(t) + ' ألف');
  }
  if (u > 0) out.push(arGroup3(u));

  return out.join(' و');
}

/* ---------- ENGLISH ---------- */
const EN_ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
  'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const EN_TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

function enUnder100(n){
  if (n < 20) return EN_ONES[n];
  const t = Math.floor(n / 10), u = n % 10;
  return u === 0 ? EN_TENS[t] : EN_TENS[t] + '-' + EN_ONES[u];
}
function enUnder1000(n){
  if (n < 100) return enUnder100(n);
  const h = Math.floor(n / 100), r = n % 100;
  const s = EN_ONES[h] + ' hundred';
  return r === 0 ? s : s + ' and ' + enUnder100(r);
}
function enNumberToWords(n){
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n === 0) return 'zero';
  const out = [];
  const b = Math.floor(n / 1e9); n %= 1e9;
  const m = Math.floor(n / 1e6); n %= 1e6;
  const t = Math.floor(n / 1e3); n %= 1e3;
  const u = n;
  if (b > 0) out.push(enUnder1000(b) + ' billion');
  if (m > 0) out.push(enUnder1000(m) + ' million');
  if (t > 0) out.push(enUnder1000(t) + ' thousand');
  if (u > 0) out.push(enUnder1000(u));
  return out.join(' ');
}

function numberToWords(n, lang){
  if (lang === 'ar') return arNumberToWords(n);
  if (lang === 'fr') return frNumberToWords(n);
  return enNumberToWords(n);
}

/* ---------- FULL AMOUNT IN WORDS ---------- */
function amountInWords(amount, lang, currency){
  const c = CURRENCIES[currency] || CURRENCIES.DZD;
  const val = Math.abs(Number(amount) || 0);
  const intPart = Math.floor(val);
  const decPart = Math.round((val - intPart) * 100);

  let main = '', sub = '';

  if (lang === 'ar'){
    if (intPart === 1) main = c.arOne;
    else if (intPart === 2) main = c.arDual;
    else main = arNumberToWords(intPart) + ' ' + c.ar;
    if (decPart > 0) sub = ' و' + arNumberToWords(decPart) + ' ' + c.subAr;
    return 'فقط ' + main + sub + ' لا غير';
  }

  if (lang === 'fr'){
    const curName = intPart > 1 ? c.frP : c.fr;
    main = frNumberToWords(intPart) + ' ' + curName;
    if (decPart > 0) sub = ' et ' + frNumberToWords(decPart) + ' ' + c.subFr + (decPart > 1 ? 's' : '');
    return 'Arrêté à la somme de : ' + main + sub;
  }

  const curName = intPart === 1 ? c.en : c.enP;
  main = enNumberToWords(intPart) + ' ' + curName;
  if (decPart > 0) sub = ' and ' + enNumberToWords(decPart) + ' ' + c.subEn + (decPart > 1 ? 's' : '');
  return main.charAt(0).toUpperCase() + main.slice(1) + sub + ' only';
}

/* ============================================================

   ============================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function nl2br(s){ return esc(s).replace(/\n/g, '<br>'); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function clamp(n, a, b){ n = Number(n); if (isNaN(n)) n = a; return Math.min(b, Math.max(a, n)); }

function T(key){
  const d = I18N[state.lang] || I18N.fr;
  return d[key] !== undefined ? d[key] : (I18N.fr[key] || key);
}

function setPath(obj, path, val){
  const parts = String(path).split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++){
    if (cur[parts[i]] == null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = val;
}
function getPath(obj, path){
  return String(path).split('.').reduce(function(o, k){ return o == null ? undefined : o[k]; }, obj);
}

function fmtDate(iso){
  if (!iso) return '';
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0];
}

function fmtNum(v, decimals){
  const d = decimals == null ? 2 : decimals;
  const n = num(v);
  const s = Math.abs(n).toFixed(d);
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
  const out = parts.length > 1 ? parts[0] + ',' + parts[1] : parts[0];
  return (n < 0 ? '-' : '') + out;
}

function fmtMoney(v){
  const c = CURRENCIES[state.currency] || CURRENCIES.DZD;
  const body = fmtNum(v, c.decimals);
  const sp = '\u00A0';
  return c.after ? (body + sp + c.symbol) : (c.symbol + sp + body);
}

/* ============================================================
   6. CALCULATIONS
   ============================================================ */
function lineHT(it){
  const q = num(it.qty), p = num(it.price), d = num(it.discount);
  return q * p * (1 - d / 100);
}
function lineTaxAmount(it){
  return lineHT(it) * num(it.tax) / 100;
}

function computeTotals(){
  const items = state.items || [];
  let subtotalHT = 0, totalDiscount = 0;
  const taxGroups = {};

  items.forEach(function(it){
    const gross = num(it.qty) * num(it.price);
    const disc = gross * num(it.discount) / 100;
    const ht = gross - disc;
    subtotalHT += ht;
    totalDiscount += disc;
    const rate = num(it.tax);
    if (rate > 0) taxGroups[rate] = (taxGroups[rate] || 0) + ht * rate / 100;
  });

  const globalDisc = Math.min(num(state.globalDiscount), subtotalHT);
  const netHT = subtotalHT - globalDisc;
  let totalTax = 0;
  Object.keys(taxGroups).forEach(function(k){ totalTax += taxGroups[k]; });
  /* Recompute tax proportionally after global discount */
  if (globalDisc > 0 && subtotalHT > 0){
    const factor = netHT / subtotalHT;
    totalTax = 0;
    Object.keys(taxGroups).forEach(function(k){
      taxGroups[k] *= factor;
      totalTax += taxGroups[k];
    });
  }
  const shipping = num(state.shipping);
  const grandTotal = netHT + totalTax + shipping;

  return {
    subtotalHT: subtotalHT,
    totalDiscount: totalDiscount,
    globalDiscount: globalDisc,
    netHT: netHT,
    taxGroups: taxGroups,
    totalTax: totalTax,
    shipping: shipping,
    grandTotal: grandTotal
  };
}

function migrate(obj){
  const base = defaultState();
  const out = Object.assign({}, base, obj || {});
  out.doc     = Object.assign({}, base.doc, (obj && obj.doc) || {});
  out.company = Object.assign({}, base.company, (obj && obj.company) || {});
  out.client  = Object.assign({}, base.client, (obj && obj.client) || {});
  if (!Array.isArray(out.items) || !out.items.length){
    out.items = [{ desc:'', qty:1, unit:'', price:0, discount:0, tax:19 }];
  }
  out.items = out.items.map(function(it){
    return {
      desc: it.desc || '',
      qty: it.qty == null ? 1 : it.qty,
      unit: it.unit || '',
      price: it.price == null ? 0 : it.price,
      discount: it.discount == null ? 0 : it.discount,
      tax: it.tax == null ? 19 : it.tax
    };
  });
  if (!['invoice','quote','delivery'].includes(out.docType)) out.docType = 'invoice';
  if (!CURRENCIES[out.currency]) out.currency = 'DZD';
  if (!['ar','fr','en'].includes(out.lang)) out.lang = 'fr';
  if (!FONTS.some(function(f){ return f.id === out.font; })) out.font = 'Inter';
  if (!['auto','ar','fr','en'].includes(out.wordsLang)) out.wordsLang = 'auto';
  return out;
}

function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || typeof obj !== 'object') return null;
    return migrate(obj);
  } catch (e){ return null; }
}

    body = '<tr><td colspan="' + span + '" style="text-align:center;color:#94a3b8;padding:8mm 0;font-style:italic">' +

/* ============================================================
   15. IMAGE UPLOAD
   ============================================================ */
function handleImage(file, key, maxSize){
  if (!file || !/^image\//.test(file.type)) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const MAX = maxSize || 520;
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, MAX / Math.max(w, h));
      w = Math.max(1, Math.round(w * sc));
      h = Math.max(1, Math.round(h * sc));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      /* keep transparency for PNG logos */
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const isPng = /png/i.test(file.type);
      state[key] = c.toDataURL(isPng ? 'image/png' : 'image/jpeg', 0.92);
      renderLogoBoxes();
      renderPreview();
      save();
    };
    img.onerror = function(){ toast('⚠ image error'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   16. EVENT WIRING
   ============================================================ */
function wireEvents(){

  /* ---- Tabs ---- */
  $$('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      $$('.tab').forEach(function(b){ b.classList.remove('active'); });
      $$('.panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      $('#panel-' + btn.getAttribute('data-tab')).classList.add('active');
    });
  });

  /* ---- Top bar selects ---- */
  $('#langSelect').addEventListener('change', function(){
    state.lang = this.value;
    if (state.lang === 'ar' && state.font !== 'Cairo' && state.font !== 'Tajawal'){
      state.font = 'Cairo';
    }
    if (state.lang !== 'ar' && (state.font === 'Cairo' || state.font === 'Tajawal')){
      state.font = 'Inter';
    }
    applyI18n();
    renderEditor();
    renderPreview();
    save();
  });

  $('#docTypeSelect').addEventListener('change', function(){
    state.docType = this.value;
    const y = new Date().getFullYear();
    const prefix = state.docType === 'quote' ? 'DEV' : (state.docType === 'delivery' ? 'BL' : 'FAC');
    if (!state.doc.number || /^(FAC|DEV|BL)-/.test(state.doc.number)){
      state.doc.number = prefix + '-' + y + '-' + String(state.doc.number || '').slice(-4).replace(/[^0-9]/g, '') || (prefix + '-' + y + '-0001');
      if (!/^\d{4}$/.test(state.doc.number.slice(-4))){
        state.doc.number = prefix + '-' + y + '-0001';
      }
    }
    syncDocVisibility();
    bindInputs();
    renderPreview();
    save();
  });

  $('#currencySelect').addEventListener('change', function(){
    state.currency = this.value;
    renderPreview();
    updateEditorTotals();
    save();
  });

  /* ---- Generic path inputs ---- */
  const editor = $('#editor');
  editor.addEventListener('input', function(e){
    const el = e.target;

    /* data-path */
    if (el.hasAttribute('data-path')){
      const path = el.getAttribute('data-path');
      let val = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'number') val = el.value === '' ? '' : num(el.value);
      setPath(state, path, val);
      schedulePreview();
      save();
      return;
    }

    /* item fields */
    if (el.hasAttribute('data-idx') && el.hasAttribute('data-f')){
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      const f = el.getAttribute('data-f');
      const it = state.items[idx];
      if (!it) return;
      if (el.type === 'number'){
        it[f] = el.value === '' ? '' : num(el.value);
      } else {
        it[f] = el.value;
      }
      updateItemTotals();
      schedulePreview();
      save();
      return;
    }
  });

  editor.addEventListener('change', function(e){
    const el = e.target;
    if (el.hasAttribute('data-path') && el.tagName === 'SELECT'){
      const path = el.getAttribute('data-path');
      setPath(state, path, el.value);
      renderPreview();
      save();
    }
  });

  /* ---- Items actions ---- */
  $('#itemsList').addEventListener('click', function(e){
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.getAttribute('data-act');
    if (act === 'del-item'){
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      state.items.splice(idx, 1);
      if (!state.items.length){
        state.items.push({ desc:'', qty:1, unit:'', price:0, discount:0, tax:19 });
      }
      renderItemsEditor();
      renderPreview();
      save();
    }
  });

  $('#btnAddItem').addEventListener('click', function(){
    state.items.push({ desc:'', qty:1, unit:'', price:0, discount:0, tax:19 });
    renderItemsEditor();
    renderPreview();
    save();
    /* scroll last item into view */
    const cards = $$('.item-card', $('#itemsList'));
    if (cards.length){
      cards[cards.length - 1].scrollIntoView({ behavior:'smooth', block:'center' });
      const ta = cards[cards.length - 1].querySelector('textarea');
      if (ta) setTimeout(function(){ ta.focus(); }, 200);
    }
  });

  /* ---- Logo / stamp ---- */
  $('#logoInput').addEventListener('change', function(){
    if (this.files && this.files[0]) handleImage(this.files[0], 'logo', 560);
    this.value = '';
  });
  $('#stampInput').addEventListener('change', function(){
    if (this.files && this.files[0]) handleImage(this.files[0], 'stamp', 480);
    this.value = '';
  });
  $('#btnRemoveLogo').addEventListener('click', function(){
    state.logo = '';
    renderLogoBoxes();
    renderPreview();
    save();
  });
  $('#btnRemoveStamp').addEventListener('click', function(){
    state.stamp = '';
    renderLogoBoxes();
    renderPreview();
    save();
  });

  /* ---- Font select ---- */
  $('#fontSelect').addEventListener('change', function(){
    state.font = this.value;
    renderPreview();
    save();
  });

  /* ---- Top actions ---- */
  $('#btnSample').addEventListener('click', fillSample);
  $('#btnSample2').addEventListener('click', fillSample);
  $('#btnExport').addEventListener('click', exportBackup);
  $('#btnExport2').addEventListener('click', exportBackup);
  $('#btnImport').addEventListener('click', function(){ $('#jsonInput').click(); });
  $('#btnImport2').addEventListener('click', function(){ $('#jsonInput').click(); });
  $('#jsonInput').addEventListener('change', function(){
    if (this.files && this.files[0]) importBackup(this.files[0]);
    this.value = '';
  });
  $('#btnReset').addEventListener('click', resetAll);
  $('#btnReset2').addEventListener('click', resetAll);
  $('#btnPrint').addEventListener('click', function(){ window.print(); });

  /* ---- Zoom ---- */
  $('#zoomIn').addEventListener('click', function(){ setZoom(ui.zoom + 0.1); });
  $('#zoomOut').addEventListener('click', function(){ setZoom(ui.zoom - 0.1); });
  $('#zoomReset').addEventListener('click', function(){ setZoom(1); });
  $('#zoomFit').addEventListener('click', fitToScreen);

  /* ---- Keyboard shortcuts ---- */
  document.addEventListener('keydown', function(e){
    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === 's'){ e.preventDefault(); save(); toast(T('saved') + ' ✓'); }
    if (k === 'p'){ e.preventDefault(); window.print(); }
  });

  /* ---- Persist on exit ---- */
  window.addEventListener('beforeunload', function(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (err){}
  });
}

/* ============================================================
   17. INIT
   ============================================================ */
function init(){
  const loaded = loadState();
  if (loaded) state = loaded;

  /* Sync UI controls with state */
  $('#langSelect').value = state.lang;
  $('#currencySelect').value = state.currency;

  applyI18n();
  renderEditor();
  renderPreview();

  setZoom(1);
  if (!loaded) setTimeout(fitToScreen, 140);

  wireEvents();
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
