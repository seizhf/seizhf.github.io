<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SaivRESUME Ultimate — Professional Multi-Lingual CV Builder</title>
<meta name="description" content="SaivRESUME Ultimate — build pixel-perfect A4 resumes in Arabic, French and English. Powered by SaivCORE." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&family=Inter:wght@300..900&family=Lora:wght@400..700&family=Montserrat:wght@300..900&family=Playfair+Display:wght@400..900&family=Poppins:wght@300..800&family=Roboto:wght@300..900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
/* ============================================================
   GLOBAL / APP SHELL
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:#eef2f7;color:#0f172a;-webkit-font-smoothing:antialiased;
}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c2ccda;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#9aa8bd;background-clip:content-box;border:2px solid transparent}

/* ============================================================
   TOP BAR
   ============================================================ */
#topbar{
  background:#0b1220;color:#fff;padding:9px 14px;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;z-index:40;box-shadow:0 2px 14px rgba(0,0,0,.28);
}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:6px}
.brand .logo{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,.45)
}
.brand b{font-size:14.5px;letter-spacing:.3px;line-height:1.1;display:block}
.brand small{display:block;font-size:9.5px;opacity:.62;letter-spacing:.5px;text-transform:uppercase}
.tb-sep{width:1px;height:26px;background:#1e293b;margin:0 2px}
.tb-group{display:flex;align-items:center;gap:7px}
.tb-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.55;font-weight:700}
select,input,textarea,button{font-family:inherit}
.tb-select{
  background:#17233a;color:#fff;border:1px solid #26364f;border-radius:9px;
  padding:7px 10px;font-size:12.5px;outline:none;cursor:pointer;max-width:190px
}
.tb-select:focus{border-color:#3b82f6}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:0;border-radius:9px;padding:8px 12px;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:.16s;background:#17233a;color:#dbe4f0;
  white-space:nowrap;
}
.btn:hover{background:#243350;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.35)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:transparent;border:1px solid #26364f}
.btn-ghost:hover{background:#17233a}
.btn-danger{background:#b91c1c;color:#fff}
.btn-danger:hover{background:#dc2626}
.spacer{flex:1}
#saveState{font-size:11px;opacity:.6;display:flex;align-items:center;gap:6px;white-space:nowrap}
#saveState.ok{color:#4ade80;opacity:.95}
#saveState.ok i{color:#4ade80}

/* ============================================================
   WORKSPACE
   ============================================================ */
#workspace{flex:1;display:flex;overflow:hidden;min-height:0}

/* ---------- EDITOR ---------- */
#editor{
  width:462px;min-width:462px;background:#f7f9fc;border-inline-end:1px solid #dde4ee;
  display:flex;flex-direction:column;overflow:hidden;
}
.tabs{display:flex;gap:5px;padding:9px;border-bottom:1px solid #e2e8f0;background:#fff}
.tab{
  flex:1;padding:9px 6px;border-radius:9px;border:1px solid transparent;background:transparent;
  font-weight:700;font-size:12px;color:#7a8699;cursor:pointer;transition:.16s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab:hover{color:#2563eb;background:#f1f5fd}
.tab.active{background:#eef4ff;border-color:#c7dbff;color:#1d4ed8}
.panels{flex:1;overflow-y:auto;padding:12px 12px 60px}
.panel{display:none;animation:fade .18s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:#fff;border:1px solid #e5eaf2;border-radius:13px;padding:13px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.card>h3{
  margin:0 0 11px;font-size:11.5px;font-weight:800;color:#0f172a;display:flex;align-items:center;
  gap:8px;text-transform:uppercase;letter-spacing:.7px
}
.card>h3 i{color:#2563eb}
.hint{font-size:11px;color:#8b98ab;line-height:1.5;margin:8px 0 0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:700;color:#6b7a90;letter-spacing:.2px;min-width:0}
.fld input,.fld select,.fld textarea{
  border:1px solid #dbe2ec;border-radius:9px;padding:7px 9px;font-size:12.5px;color:#0f172a;
  background:#fff;outline:none;width:100%;transition:.15s;font-weight:500;
}
.fld textarea{resize:vertical;line-height:1.5;min-height:62px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.fld input[type=color]{
  padding:2px;height:34px;cursor:pointer;border-radius:9px;background:#fff
}
.fld input[type=range]{padding:0;height:22px;accent-color:#2563eb;cursor:pointer}

/* Section cards in editor */
.sec-card{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:9px;background:#fff;overflow:hidden;transition:.16s}
.sec-card:hover{border-color:#c9d6ea}
.sec-card.dragging{opacity:.45}
.sec-card.hidden-sec{opacity:.55;background:#f8fafc}
.sec-head{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#fbfcfe;border-bottom:1px solid #eef2f8}
.sec-head .drag-handle{cursor:grab;color:#b3bfd0;padding:2px 3px;font-size:13px}
.sec-head .drag-handle:active{cursor:grabbing}
.sec-head .ico{width:22px;height:22px;border-radius:7px;background:#eef4ff;color:#2563eb;display:grid;place-items:center;font-size:10.5px;flex:0 0 auto}
.sec-head .nm{flex:1;font-size:12.5px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{
  border:0;background:transparent;color:#94a3b8;cursor:pointer;width:26px;height:26px;
  border-radius:7px;font-size:11.5px;display:grid;place-items:center;transition:.15s;flex:0 0 auto
}
.mini:hover{background:#eef2f8;color:#1e293b}
.mini.danger:hover{background:#fee2e2;color:#dc2626}
.sec-body{padding:11px;display:flex;flex-direction:column;gap:9px}
.sec-body.collapsed{display:none}
.item-card{border:1px dashed #d6dfec;border-radius:10px;padding:10px;background:#fbfcfe;display:flex;flex-direction:column;gap:8px}
.item-head{display:flex;align-items:center;justify-content:space-between}
.item-head span{font-size:10px;font-weight:800;color:#94a3b8;letter-spacing:.6px;text-transform:uppercase}
.add-item-btn{
  border:1px dashed #b9c9e2;background:#f6f9ff;color:#2563eb;border-radius:9px;padding:8px;
  font-size:12px;font-weight:700;cursor:pointer;transition:.15s;width:100%
}
.add-item-btn:hover{background:#eaf2ff;border-color:#8fb4f0}

/* ---------- PREVIEW ---------- */
#previewArea{flex:1;position:relative;overflow:hidden;background:#dfe5ee;min-width:0}
#previewScroll{
  position:absolute;inset:0;overflow:auto;padding:34px 28px 90px;
  display:flex;justify-content:center;align-items:flex-start;
}
#zoomBar{
  position:absolute;inset-inline-end:18px;bottom:18px;z-index:20;background:#0b1220;color:#fff;
  border-radius:13px;display:flex;align-items:center;gap:4px;padding:6px;
  box-shadow:0 10px 30px rgba(0,0,0,.32)
}
#zoomBar button{
  border:0;background:transparent;color:#cbd5e1;width:32px;height:32px;border-radius:9px;
  cursor:pointer;font-size:12.5px;transition:.15s
}
#zoomBar button:hover{background:#1e2b41;color:#fff}
#zoomLabel{font-size:11.5px;font-weight:700;min-width:46px;text-align:center;letter-spacing:.3px}
#zoomBar .divider{width:1px;height:20px;background:#25344c;margin:0 3px}

#pageWrap{
  zoom:1;background:#fff;box-shadow:0 12px 46px rgba(15,23,42,.22);
  border-radius:2px;flex:0 0 auto;
}

/* ============================================================
   THE A4 CV PAGE
   ============================================================ */
#cvPage{
  width:210mm;min-height:297mm;background:var(--page-bg);color:var(--text);
  font-family:var(--cv-font);font-size:var(--cv-fs);line-height:var(--cv-lh);
  padding:var(--cv-pad);position:relative;overflow-wrap:break-word;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
#cvPage.nopad{padding:0}
#cvPage.rtl{direction:rtl}
#cvPage.ltr{direction:ltr}
#cvPage *{box-sizing:border-box}

.cv-center{margin-left:auto;margin-right:auto}

/* --- Generic typography --- */
.cv-name{margin:0;font-size:2em;font-weight:800;line-height:1.14;letter-spacing:.2px}
.cv-role{font-size:1.02em;font-weight:600;color:var(--secondary);margin-top:3px;letter-spacing:.3px}
.cv-para{margin:0;text-align:justify;hyphens:auto}
.cv-link{font-size:.85em;color:var(--primary);word-break:break-all;font-weight:600}

/* --- Sections --- */
.cv-section{margin-bottom:var(--sec-gap);break-inside:avoid}
.cv-section:last-child{margin-bottom:0}
.cv-sec-title{
  margin:0 0 7px;font-size:1.05em;font-weight:800;text-transform:uppercase;
  letter-spacing:.8px;color:var(--primary);border-bottom:1.6px solid var(--primary);
  padding-bottom:3px;line-height:1.3
}
.cv-sec-body{}

/* --- Items --- */
.cv-item{margin-bottom:8px;break-inside:avoid}
.cv-item:last-child{margin-bottom:0}
.cv-item-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cv-item-title{font-weight:700;color:var(--text);font-size:1em}
.cv-item-date{font-size:.85em;color:var(--muted);white-space:nowrap;font-weight:700}
.cv-item-sub{font-size:.92em;color:var(--primary);font-weight:600;margin-top:1px}
.cv-item-meta{font-size:.85em;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:3px 12px}
.cv-bullets{margin:4px 0 0;padding-inline-start:16px}
.cv-bullets li{margin-bottom:2px;font-size:.95em;line-height:1.45}
.cv-bullets li::marker{color:var(--primary)}

/* --- Chips --- */
.cv-chips{display:flex;flex-wrap:wrap;gap:5px}
.cv-chip{
  background:var(--primary-soft);color:var(--primary);border-radius:20px;
  padding:2.5px 10px;font-size:.85em;font-weight:700;line-height:1.5;
  border:1px solid var(--primary-soft2);
}

/* --- Bars --- */
.cv-bar{margin-bottom:6px}
.cv-bar:last-child{margin-bottom:0}
.cv-bar-label{display:flex;justify-content:space-between;font-size:.9em;font-weight:600}
.cv-bar-track{height:5px;border-radius:5px;background:var(--primary-soft2);overflow:hidden;margin-top:3px}
.cv-bar-fill{height:100%;background:var(--primary);border-radius:5px}

/* --- Languages --- */
.cv-lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px}
.cv-lang{display:flex;justify-content:space-between;gap:10px;font-size:.93em;align-items:center}
.cv-lang-lv{color:var(--muted);font-weight:600;font-size:.88em}
.cv-langs{list-style:none;margin:0;padding:0}
.cv-langs li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9em;margin-bottom:5px}
.dots{display:inline-flex;gap:3px;flex:0 0 auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--primary-soft2)}
.dot.on{background:var(--primary)}

/* --- Photo --- */
.cv-photo{overflow:hidden;flex:0 0 auto;background:#e8edf5;display:block;line-height:0}
.cv-photo img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center center}

/* --- Contact lists --- */
.cv-contact-side{list-style:none;margin:14px 0 16px;padding:0;font-size:.9em}
.cv-contact-side li{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px;word-break:break-word;line-height:1.35}
.cv-contact-side i{width:13px;text-align:center;margin-top:2px;color:var(--side-accent);flex:0 0 auto;font-size:.95em}
.cv-contact-side a{color:inherit;text-decoration:none}
.cv-contact-inline{display:flex;flex-wrap:wrap;gap:5px 16px;font-size:.88em}
.cv-contact-inline span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cv-contact-inline i{opacity:.9}

/* ============================================================
   LAYOUT: SIDEBAR (left / right)
   ============================================================ */
.lyt-sidebar{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:297mm;align-items:stretch}
.lyt-sidebar.side-right{grid-template-columns:1fr var(--side-w)}
.lyt-sidebar.side-right .cv-side{grid-column:2;grid-row:1}
.lyt-sidebar.side-right .cv-main{grid-column:1;grid-row:1}

.cv-side{
  background:var(--side-bg);color:var(--side-text);
  padding:calc(var(--cv-pad) * .85) calc(var(--cv-pad) * .55);
  --primary:var(--side-accent);
  --primary-soft:var(--side-accent-soft);
  --primary-soft2:var(--side-accent-soft2);
  --text:var(--side-text);
  --muted:rgba(255,255,255,.62);
}
.cv-side .cv-name{color:#fff;font-size:1.55em;text-align:center;line-height:1.15}
.cv-side .cv-role{color:var(--side-accent);text-align:center;font-weight:600;font-size:.95em}
.cv-side .cv-sec-title{color:#fff;border-bottom-color:rgba(255,255,255,.28);font-size:.95em;letter-spacing:.6px}
.cv-side .cv-item-title{color:#fff}
.cv-side .cv-item-date,.cv-side .cv-item-meta{color:rgba(255,255,255,.6)}
.cv-side .cv-item-sub{color:var(--side-accent)}
.cv-side .cv-chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff}
.cv-side .cv-bar-track{background:rgba(255,255,255,.2)}
.cv-side .cv-bar-fill{background:var(--side-accent)}
.cv-side .cv-bullets li::marker{color:var(--side-accent)}
.cv-side .cv-lang-grid{grid-template-columns:1fr}
.cv-main{padding:calc(var(--cv-pad) * .85) calc(var(--cv-pad) * .8);min-width:0}

/* ============================================================
   LAYOUT: HEADER BAND
   ============================================================ */
.lyt-band{min-height:297mm;display:flex;flex-direction:column}
.cv-band{
  background:var(--primary);color:#fff;display:flex;align-items:center;gap:16px;
  padding:calc(var(--cv-pad) * .85) calc(var(--cv-pad) * .9);
}
.cv-band-txt{flex:1;min-width:0}
.cv-band .cv-name{color:#fff}
.cv-band .cv-role{color:rgba(255,255,255,.82)}
.cv-band .cv-contact-inline{color:rgba(255,255,255,.92);margin-top:9px;font-size:.85em}
.cv-band .cv-contact-inline i{opacity:.85}
.cv-body{
  flex:1;display:grid;grid-template-columns:1fr;gap:var(--sec-gap);
  padding:calc(var(--cv-pad) * .8) calc(var(--cv-pad) * .9)
}
.cv-body.has-side{grid-template-columns:1fr 60mm;gap:calc(var(--cv-pad) * .6)}
.cv-col-side{background:var(--primary-soft);border-radius:8px;padding:11px}

/* ============================================================
   LAYOUT: TWO COLUMN
   ============================================================ */
.lyt-twocol{min-height:297mm}
.cv-tc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:10px;border-bottom:2.5px solid var(--primary);margin-bottom:14px}
.cv-tc-head .cv-contact-inline{justify-content:flex-end;text-align:end;color:var(--muted);font-size:.84em;max-width:52%}
.cv-tc-body{display:grid;grid-template-columns:1fr 60mm;gap:calc(var(--cv-pad) * .6)}
.cv-tc-body .cv-col-side{background:var(--primary-soft);border-radius:8px;padding:11px}

/* ============================================================
   LAYOUT: COMPACT
   ============================================================ */
.lyt-compact{min-height:297mm}
.cv-cp-head{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  background:var(--primary-soft);border-inline-start:4px solid var(--primary);
  padding:10px 13px;margin-bottom:13px;border-radius:4px
}
.cv-cp-head .cv-contact-inline{font-size:.82em;color:var(--muted);max-width:55%;justify-content:flex-end}

/* ============================================================
   LAYOUT: CREATIVE
   ============================================================ */
.lyt-creative{min-height:297mm}
.cv-cr-head{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;padding:calc(var(--cv-pad) * 1.05) calc(var(--cv-pad) * .9);
  display:flex;align-items:center;gap:18px;border-radius:0 0 22px 22px
}
.cv-cr-head .cv-name{color:#fff;font-size:2.1em}
.cv-cr-head .cv-role{color:rgba(255,255,255,.88)}
.cv-cr-head .cv-contact-inline{color:rgba(255,255,255,.92);margin-top:10px;font-size:.85em}
.cv-cr-body{display:grid;grid-template-columns:1fr 60mm;gap:calc(var(--cv-pad) * .6);padding-top:calc(var(--cv-pad) * .8)}
.cv-cr-body .cv-col-side{background:var(--primary-soft);border-radius:10px;padding:12px}
.lyt-creative .cv-sec-title{border-bottom:none;background:var(--primary-soft);padding:4px 9px;border-radius:6px;display:inline-block}

/* ============================================================
   LAYOUT: ATS / MINIMAL
   ============================================================ */
.lyt-ats{min-height:297mm}
.cv-ats-head{text-align:center;padding-bottom:9px;border-bottom:1.4px solid #475569;margin-bottom:13px}
.lyt-ats .cv-name{font-size:1.72em;letter-spacing:.4px}
.lyt-ats .cv-role{color:var(--text);font-weight:600;font-size:.98em}
.lyt-ats .cv-contact-inline{justify-content:center;margin-top:8px;color:var(--muted);font-size:.85em}
.lyt-ats .cv-sec-title{color:var(--text);border-bottom:1px solid #94a3b8;letter-spacing:.9px}
.lyt-ats .cv-chip{background:transparent;border:0;padding:0;color:var(--text);font-weight:500}
.lyt-ats .cv-chips{gap:3px 14px}

/* ============================================================
   LAYOUT: CLASSIC SERIF
   ============================================================ */
.lyt-classic{min-height:297mm}
.cv-cl-head{text-align:center;margin-bottom:14px}
.lyt-classic .cv-name{font-size:2.15em;font-weight:700;letter-spacing:1.2px}
.lyt-classic .cv-role{letter-spacing:2.2px;text-transform:uppercase;font-size:.86em;color:var(--muted);font-weight:600}
.lyt-classic .cv-contact-inline{justify-content:center;margin-top:10px;color:var(--muted);font-size:.86em}
.cv-cl-rule{height:2px;background:var(--primary);margin:11px 0 15px;position:relative}
.cv-cl-rule::after{content:'';position:absolute;left:50%;top:-3px;transform:translateX(-50%);width:8px;height:8px;background:var(--primary);border-radius:50%}
.lyt-classic .cv-sec-title{
  text-align:center;border-bottom:none;color:var(--primary);
  letter-spacing:2.4px;font-size:.96em;margin-bottom:9px
}
.lyt-classic .cv-sec-title::after{content:'';display:block;width:38px;height:1.6px;background:var(--primary);margin:5px auto 0}

/* ============================================================
   LAYOUT: TIMELINE
   ============================================================ */
.lyt-timeline{min-height:297mm}
.cv-tl-head{
  display:flex;align-items:center;gap:18px;padding-bottom:12px;
  border-bottom:2px solid var(--primary-soft2);margin-bottom:15px
}
.cv-tl-head .cv-contact-inline{margin-top:8px;color:var(--muted);font-size:.85em}
.lyt-timeline .cv-section[data-type="experience"] .cv-item,
.lyt-timeline .cv-section[data-type="education"] .cv-item{
  position:relative;padding-inline-start:17px;
  border-inline-start:2px solid var(--primary-soft2);
  padding-bottom:9px;margin-bottom:3px
}
.lyt-timeline .cv-section[data-type="experience"] .cv-item:last-child,
.lyt-timeline .cv-section[data-type="education"] .cv-item:last-child{border-inline-start-color:transparent;padding-bottom:0}
.lyt-timeline .cv-section[data-type="experience"] .cv-item::before,
.lyt-timeline .cv-section[data-type="education"] .cv-item::before{
  content:'';position:absolute;inset-inline-start:-6px;top:4px;width:10px;height:10px;border-radius:50%;
  background:var(--primary);border:2px solid var(--page-bg)
}

/* ============================================================
   LAYOUT: ELEGANT
   ============================================================ */
.lyt-elegant{min-height:297mm}
.cv-el-head{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.cv-el-head .cv-el-txt{flex:1;min-width:0;border-inline-start:4px solid var(--primary);padding-inline-start:14px}
.lyt-elegant .cv-name{font-size:2.1em;font-weight:300;letter-spacing:3px;text-transform:uppercase}
.lyt-elegant .cv-name b{font-weight:800}
.lyt-elegant .cv-role{text-transform:uppercase;letter-spacing:2.6px;font-size:.8em;color:var(--muted)}
.cv-el-contact{display:flex;flex-wrap:wrap;gap:5px 15px;font-size:.85em;color:var(--muted);margin-top:10px}
.cv-el-contact span{display:inline-flex;align-items:center;gap:6px}
.lyt-elegant .cv-sec-title{border-bottom:1px solid var(--primary-soft2);position:relative;color:var(--text);letter-spacing:1.6px}
.lyt-elegant .cv-sec-title::after{content:'';position:absolute;bottom:-1px;inset-inline-start:0;width:46px;height:2px;background:var(--primary)}

/* ============================================================
   SORTABLE GHOST
   ============================================================ */
.drag-ghost{opacity:.35;background:#dbeafe !important;outline:2px dashed #3b82f6;outline-offset:-2px}

/* ============================================================
   PRINT ENGINE — TRUE A4
   ============================================================ */
@page{size:A4;margin:0}

@media print{
  html,body{background:#fff !important;height:auto !important;overflow:visible !important;margin:0 !important;padding:0 !important}
  .no-print{display:none !important}
  #app{display:block !important;height:auto !important;overflow:visible !important}
  #workspace{display:block !important;overflow:visible !important;height:auto !important}
  #editor{display:none !important}
  #previewArea{position:static !important;overflow:visible !important;background:#fff !important;height:auto !important}
  #previewScroll{position:static !important;overflow:visible !important;padding:0 !important;display:block !important;height:auto !important}
  #pageWrap{zoom:1 !important;box-shadow:none !important;margin:0 !important;border-radius:0 !important;background:#fff !important}
  #cvPage{
    box-shadow:none !important;margin:0 !important;border-radius:0 !important;
    width:210mm !important;min-height:296mm !important;
  }
  .cv-section{break-inside:avoid}
  .cv-item{break-inside:avoid}
  .lyt-sidebar{min-height:296mm}
  .lyt-band,.lyt-twocol,.lyt-compact,.lyt-creative,.lyt-ats,.lyt-classic,.lyt-timeline,.lyt-elegant{min-height:auto}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1180px){
  #editor{width:400px;min-width:400px}
}
@media (max-width:980px){
  #workspace{flex-direction:column}
  #editor{width:100%;min-width:0;height:46vh;border-inline-end:0;border-bottom:1px solid #dde4ee}
  #previewArea{height:54vh}
}

<body>

<div id="app">

  <!-- ============================= TOP BAR ============================= -->
  <header id="topbar" class="no-print">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-file-lines"></i></div>
      <div>
        <b>SaivRESUME <span style="color:#60a5fa">Ultimate</span></b>
        <small>Powered by SaivCORE</small>
      </div>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group">
      <span class="tb-label" data-i18n="cvLang"></span>
      <select id="langSelect" class="tb-select" style="max-width:130px">
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="ar">🇩🇿 العربية</option>
      </select>
    </div>

    <div class="tb-group">
      <span class="tb-label" data-i18n="template"></span>
      <select id="templateSelect" class="tb-select"></select>
    </div>

    <div class="tb-sep"></div>

    <button class="btn btn-ghost" id="btnSample"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="fillSample"></span></button>
    <button class="btn btn-ghost" id="btnExport"><i class="fa-solid fa-file-export"></i><span data-i18n="exportBackup"></span></button>
    <button class="btn btn-ghost" id="btnImport"><i class="fa-solid fa-file-import"></i><span data-i18n="importBackup"></span></button>
    <button class="btn btn-danger" id="btnReset"><i class="fa-solid fa-trash-can"></i><span data-i18n="clearAll"></span></button>

    <div class="spacer"></div>
    <div id="saveState"><i class="fa-solid fa-circle-check"></i><span data-i18n="saved"></span></div>
    <button class="btn btn-primary" id="btnPrint"><i class="fa-solid fa-print"></i><span data-i18n="print"></span></button>
  </header>

  <!-- ============================= WORKSPACE ============================= -->
  <div id="workspace">

    <!-- ======================= EDITOR ======================= -->
    <aside id="editor" class="no-print">
      <div class="tabs">
        <button class="tab active" data-tab="content"><i class="fa-solid fa-pen-to-square"></i><span data-i18n="tabContent"></span></button>
        <button class="tab" data-tab="design"><i class="fa-solid fa-palette"></i><span data-i18n="tabDesign"></span></button>
        <button class="tab" data-tab="data"><i class="fa-solid fa-database"></i><span data-i18n="tabData"></span></button>
      </div>

      <div class="panels">

        <!-- ---------- CONTENT PANEL ---------- -->
        <div class="panel active" id="panel-content">

          <section class="card">
            <h3><i class="fa-solid fa-user"></i><span data-i18n="personal"></span></h3>
            <div id="personalFields"></div>
          </section>

          <section class="card">
            <h3><i class="fa-solid fa-camera-retro"></i><span data-i18n="photoStudio"></span></h3>

            <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:11px">
              <div id="photoPreviewBox" style="width:78px;height:78px;border-radius:12px;overflow:hidden;background:#eef2f8;display:grid;place-items:center;flex:0 0 auto;border:1px solid #e2e8f0">
                <i class="fa-solid fa-user" style="font-size:30px;color:#c3cede"></i>
              </div>
              <div style="flex:1;display:flex;flex-direction:column;gap:7px">
                <label class="btn btn-primary" style="justify-content:center;cursor:pointer">
                  <i class="fa-solid fa-upload"></i><span data-i18n="uploadPhoto"></span>
                  <input type="file" id="photoInput" accept="image/*" style="display:none">
                </label>
                <button class="btn btn-ghost" id="btnRemovePhoto" style="justify-content:center;background:#f1f5f9;color:#334155">
                  <i class="fa-solid fa-xmark"></i><span data-i18n="removePhoto"></span>
                </button>
              </div>
            </div>

            <div class="fld" style="margin-bottom:9px">
              <span data-i18n="shape"></span>
              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px" id="shapeGroup">
                <button class="shape-btn" data-shape="circle"    style="padding:8px 4px;border-radius:9px;border:1px solid #dbe2ec;background:#fff;cursor:pointer;font-size:15px"><i class="fa-solid fa-circle"></i></button>
                <button class="shape-btn" data-shape="rounded"   style="padding:8px 4px;border-radius:9px;border:1px solid #dbe2ec;background:#fff;cursor:pointer;font-size:15px"><i class="fa-solid fa-square" style="border-radius:4px"></i></button>
                <button class="shape-btn" data-shape="square"    style="padding:8px 4px;border-radius:9px;border:1px solid #dbe2ec;background:#fff;cursor:pointer;font-size:15px"><i class="fa-regular fa-square"></i></button>
                <button class="shape-btn" data-shape="hidden"    style="padding:8px 4px;border-radius:9px;border:1px solid #dbe2ec;background:#fff;cursor:pointer;font-size:15px"><i class="fa-solid fa-eye-slash"></i></button>
              </div>
            </div>

            <div class="grid2">
              <label class="fld"><span data-i18n="zoom"></span><input type="range" id="photoZoom" min="100" max="260" value="100"></label>
              <label class="fld"><span data-i18n="borderWidth"></span><input type="range" id="photoBorder" min="0" max="12" value="3"></label>
              <label class="fld"><span data-i18n="posX"></span><input type="range" id="photoX" min="-40" max="40" value="0"></label>
              <label class="fld"><span data-i18n="posY"></span><input type="range" id="photoY" min="-40" max="40" value="0"></label>
              <label class="fld"><span data-i18n="borderColor"></span><input type="color" id="photoBorderColor" value="#ffffff"></label>
            </div>
          </section>

          <section class="card">
            <h3><i class="fa-solid fa-layer-group"></i><span data-i18n="sections"></span></h3>
            <div id="sectionList"></div>
            <div id="addSectionBar" style="display:flex;gap:8px;margin-top:4px"></div>
            <p class="hint" data-i18n="dragHint"></p>
          </section>
        </div>

        <!-- ---------- DESIGN PANEL ---------- -->
        <div class="panel" id="panel-design">

          <section class="card">
            <h3><i class="fa-solid fa-swatchbook"></i><span data-i18n="palettes"></span></h3>
            <div id="paletteGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:7px"></div>
          </section>

          <section class="card">
            <h3><i class="fa-solid fa-droplet"></i><span data-i18n="colorTheme"></span></h3>
            <div class="grid2">
              <label class="fld"><span data-i18n="primary"></span><input type="color" id="cPrimary"></label>
              <label class="fld"><span data-i18n="secondary"></span><input type="color" id="cSecondary"></label>
              <label class="fld"><span data-i18n="textColor"></span><input type="color" id="cText"></label>
              <label class="fld"><span data-i18n="mutedColor"></span><input type="color" id="cMuted"></label>
              <label class="fld"><span data-i18n="pageBg"></span><input type="color" id="cPageBg"></label>
              <label class="fld"><span data-i18n="sidebarBg"></span><input type="color" id="cSideBg"></label>
              <label class="fld"><span data-i18n="sidebarText"></span><input type="color" id="cSideText"></label>
            </div>
          </section>

          <section class="card">
            <h3><i class="fa-solid fa-font"></i><span data-i18n="typography"></span></h3>
            <label class="fld" style="margin-bottom:9px"><span data-i18n="fontFamily"></span><select id="fFont"></select></label>
            <div class="grid2">
              <label class="fld"><span data-i18n="fontSize"></span><input type="range" id="rFontSize" min="8" max="14" step="0.1"></label>
              <label class="fld"><span data-i18n="lineHeight"></span><input type="range" id="rLineHeight" min="1.1" max="1.9" step="0.05"></label>
              <label class="fld"><span data-i18n="pagePadding"></span><input type="range" id="rPagePad" min="5" max="22" step="0.5"></label>
              <label class="fld"><span data-i18n="sectionGap"></span><input type="range" id="rSecGap" min="4" max="30" step="1"></label>
              <label class="fld"><span data-i18n="sideWidth"></span><input type="range" id="rSideW" min="45" max="80" step="1"></label>
            </div>
            <label class="fld" style="flex-direction:row;align-items:center;gap:9px;margin-top:11px;cursor:pointer">
              <input type="checkbox" id="chkSkillBars" style="width:16px;height:16px;accent-color:#2563eb;cursor:pointer">
              <span data-i18n="skillBars" style="font-size:11.5px"></span>
            </label>
          </section>
        </div>

        <!-- ---------- DATA PANEL ---------- -->
        <div class="panel" id="panel-data">
          <section class="card">
            <h3><i class="fa-solid fa-floppy-disk"></i><span data-i18n="dataMgmt"></span></h3>
            <div style="display:flex;flex-direction:column;gap:8px">
              <button class="btn btn-primary" id="btnExport2" style="justify-content:center"><i class="fa-solid fa-file-export"></i><span data-i18n="exportBackup"></span></button>
              <button class="btn" id="btnImport2" style="justify-content:center;background:#eef2f8;color:#1e293b"><i class="fa-solid fa-file-import"></i><span data-i18n="importBackup"></span></button>
              <button class="btn" id="btnSample2" style="justify-content:center;background:#eef2f8;color:#1e293b"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="fillSample"></span></button>
              <button class="btn btn-danger" id="btnReset2" style="justify-content:center"><i class="fa-solid fa-trash-can"></i><span data-i18n="clearAll"></span></button>
            </div>
            <p class="hint" data-i18n="autosaveHint"></p>
          </section>

          <section class="card">
            <h3><i class="fa-solid fa-circle-info"></i><span data-i18n="aboutTitle"></span></h3>
            <p class="hint" data-i18n="aboutText"></p>
          </section>
        </div>

      </div>
    </aside>

    <!-- ======================= PREVIEW ======================= -->
    <main id="previewArea">
      <div id="zoomBar" class="no-print">
        <button id="zoomOut" title="Zoom out"><i class="fa-solid fa-minus"></i></button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" title="Zoom in"><i class="fa-solid fa-plus"></i></button>
        <div class="divider"></div>
        <button id="zoomFit" title="Fit to screen"><i class="fa-solid fa-expand"></i></button>
        <button id="zoomReset" title="Reset zoom"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
      <div id="previewScroll">
        <div id="pageWrap">
          <div id="cvPage" class="ltr"></div>
        </div>
      </div>
    </main>
  </div>
</div>

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function clamp(n, a, b){ n = Number(n); if (isNaN(n)) n = a; return Math.min(b, Math.max(a, n)); }
function T(k){
  const d = I18N[state.lang] || I18N.en;
  return d[k] !== undefined ? d[k] : (I18N.en[k] || k);
}
function hexA(hex, a){
  let h = String(hex || '#000000').replace('#','').trim();
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (h.length !== 6 || !/^[0-9a-f]{6}$/i.test(h)) h = '000000';
  const n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function safeUrl(v){
  if (!v) return '';
  v = String(v).trim();
  if (/^(https?:)?\/\//i.test(v) || /^mailto:/i.test(v) || /^tel:/i.test(v)) return v;
  return 'https://' + v;
}
function hasContent(o){
  if (!o) return false;
  for (const k in o){ if (String(o[k] || '').trim() !== '') return true; }
  return false;
}
function uid(p){ return (p || 'sec') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function getTpl(){ return TEMPLATES.filter(t => t.id === state.template)[0] || TEMPLATES[0]; }

/* ============================================================
   6. PERSISTENCE
   ============================================================ */
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      flashSaved(true);
    } catch (e){
      flashSaved(false);
    }
  }, 350);
}
function flashSaved(ok){
  const el = $('#saveState');
  if (!el) return;
  el.classList.toggle('ok', !!ok);
  $('span', el).textContent = ok ? T('saved') : '⚠ storage';
}

function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || typeof obj !== 'object') return null;
    return migrate(obj);
  } catch (e){ return null; }
}

function migrate(obj){
  const base = defaultState();
  const out = Object.assign({}, base, obj);
  out.theme    = Object.assign({}, base.theme, obj.theme || {});
  out.photo    = Object.assign({}, base.photo, obj.photo || {});
  out.personal = Object.assign({}, base.personal, obj.personal || {});
  if (!Array.isArray(out.sections) || !out.sections.length) out.sections = defaultSections();
  out.sections = out.sections.map(function(s){
    const def = SEC_DEFS[s.type] || SEC_DEFS.custom;
    return {
      id: s.id || uid('sec'),
      type: SEC_DEFS[s.type] ? s.type : 'custom',
      visible: s.visible !== false,
      text: s.text || '',
      items: Array.isArray(s.items) ? s.items : [],
      title: Object.assign({}, def.title, s.title || {})
    };
  });
  if (!FONTS.includes(out.font)) out.font = 'Inter';
  if (!TEMPLATES.some(t => t.id === out.template)) out.template = 'modern-sidebar';
  return out;
}

/* ============================================================
   7. CV CONTENT RENDERERS
   ============================================================ */
function bullets(txt){
  const lines = String(txt || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) return '';
  return '<ul class="cv-bullets">' + lines.map(function(l){
    return '<li>' + esc(l.replace(/^[-•*·]\s*/, '')) + '</li>';
  }).join('') + '</ul>';
}

function dateRange(it){
  const s = String(it.start || '').trim();
  const e = String(it.end || '').trim();
  if (s && e) return s + ' – ' + e;
  if (s) return s + ' – ' + T('present');
  return e;
}

function levelLabel(lv){ return T('lv' + (lv ? lv.charAt(0).toUpperCase() + lv.slice(1) : 'Fluent')); }

function dotsHTML(lv){
  const n = LEVEL_DOTS[lv] || 3;
  let out = '<span class="dots">';
  for (let i = 1; i <= 5; i++) out += '<span class="dot' + (i <= n ? ' on' : '') + '"></span>';
  return out + '</span>';
}

const SEC_RENDER = {
  summary: function(sec){
    const txt = String(sec.text || '').trim();
    return txt ? '<p class="cv-para">' + nl2br(txt) + '</p>' : '';
  },

  experience: function(sec){
    return (sec.items || []).filter(hasContent).map(function(it){
      const rng = dateRange(it);
      const sub = [it.company, it.location].filter(Boolean).map(esc).join(' • ');
      return '<div class="cv-item">' +
        '<div class="cv-item-top"><span class="cv-item-title">' + esc(it.role || '') + '</span>' +
        (rng ? '<span class="cv-item-date">' + esc(rng) + '</span>' : '') + '</div>' +
        (sub ? '<div class="cv-item-sub">' + sub + '</div>' : '') +
        bullets(it.desc) + '</div>';
    }).join('');
  },

  education: function(sec){
    return (sec.items || []).filter(hasContent).map(function(it){
      const rng = dateRange(it);
      const sub = [it.school, it.location].filter(Boolean).map(esc).join(' • ');
      return '<div class="cv-item">' +
        '<div class="cv-item-top"><span class="cv-item-title">' + esc(it.degree || '') + '</span>' +
        (rng ? '<span class="cv-item-date">' + esc(rng) + '</span>' : '') + '</div>' +
        (sub ? '<div class="cv-item-sub">' + sub + '</div>' : '') +
        bullets(it.desc) + '</div>';
    }).join('');
  },

  skills: function(sec, zone){
    const items = (sec.items || []).filter(function(i){ return String(i.name || '').trim(); });
    if (!items.length) return '';
    const useBars = state.skillBars && zone !== 'side';
    if (useBars){
      return items.map(function(i){
        const lv = clamp(i.level == null ? 80 : i.level, 0, 100);
        return '<div class="cv-bar"><div class="cv-bar-label"><span>' + esc(i.name) + '</span></div>' +
               '<div class="cv-bar-track"><div class="cv-bar-fill" style="width:' + lv + '%"></div></div></div>';
      }).join('');
    }
    return '<div class="cv-chips">' + items.map(function(i){
      return '<span class="cv-chip">' + esc(i.name) + '</span>';
    }).join('') + '</div>';
  },

  languages: function(sec, zone){
    const items = (sec.items || []).filter(function(i){ return String(i.name || '').trim(); });
    if (!items.length) return '';
    if (zone === 'side'){
      return '<ul class="cv-langs">' + items.map(function(i){
        return '<li><span>' + esc(i.name) + '</span>' + dotsHTML(i.level) + '</li>';
      }).join('') + '</ul>';
    }
    return '<div class="cv-lang-grid">' + items.map(function(i){
      return '<div class="cv-lang"><span>' + esc(i.name) + '</span>' +
             '<span class="cv-lang-lv">' + esc(levelLabel(i.level)) + '</span></div>';
    }).join('') + '</div>';
  },

  projects: function(sec){
    return (sec.items || []).filter(hasContent).map(function(it){
      return '<div class="cv-item">' +
        '<div class="cv-item-top"><span class="cv-item-title">' + esc(it.name || '') + '</span>' +
        (it.date ? '<span class="cv-item-date">' + esc(it.date) + '</span>' : '') + '</div>' +
        (it.tech ? '<div class="cv-item-sub">' + esc(it.tech) + '</div>' : '') +
        (it.link ? '<div class="cv-link">' + esc(it.link) + '</div>' : '') +
        bullets(it.desc) + '</div>';
    }).join('');
  },

  certifications: function(sec){
    return (sec.items || []).filter(hasContent).map(function(it){
      return '<div class="cv-item">' +
        '<div class="cv-item-top"><span class="cv-item-title">' + esc(it.name || '') + '</span>' +
        (it.date ? '<span class="cv-item-date">' + esc(it.date) + '</span>' : '') + '</div>' +
        (it.issuer ? '<div class="cv-item-sub">' + esc(it.issuer) + '</div>' : '') +
        (it.link ? '<div class="cv-link">' + esc(it.link) + '</div>' : '') + '</div>';
    }).join('');
  },

  references: function(sec){
    return (sec.items || []).filter(hasContent).map(function(it){
      const sub = [it.position, it.org].filter(Boolean).map(esc).join(' • ');
      const meta = [it.email, it.phone].filter(Boolean).map(esc).join('  ·  ');
      return '<div class="cv-item">' +
        '<div class="cv-item-title">' + esc(it.name || '') + '</div>' +
        (sub ? '<div class="cv-item-sub">' + sub + '</div>' : '') +
        (meta ? '<div class="cv-item-meta">' + meta + '</div>' : '') + '</div>';
    }).join('');
  },

  custom: function(sec){
    return (sec.items || []).filter(hasContent).map(function(it){
      return '<div class="cv-item">' +
        '<div class="cv-item-top"><span class="cv-item-title">' + esc(it.title || '') + '</span>' +
        (it.date ? '<span class="cv-item-date">' + esc(it.date) + '</span>' : '') + '</div>' +
        (it.subtitle ? '<div class="cv-item-sub">' + esc(it.subtitle) + '</div>' : '') +
        bullets(it.desc) + '</div>';
    }).join('');
  }
};

function renderSection(sec, zone){
  if (!sec.visible) return '';
  const fn = SEC_RENDER[sec.type];
  if (!fn) return '';
  const body = fn(sec, zone);
  if (!body) return '';
  const title = sec.title[state.lang] || sec.title.en || '';
  return '<section class="cv-section' + (zone === 'side' ? ' sec-side' : '') + '" data-id="' + sec.id + '" data-type="' + sec.type + '">' +
    (title ? '<h2 class="cv-sec-title">' + esc(title) + '</h2>' : '') +
    '<div class="cv-sec-body">' + body + '</div></section>';
}

function photoBlock(sizeMM, extraClass){
  const p = state.photo;
  if (!p.visible || p.shape === 'hidden' || !p.url) return '';
  const radius = p.shape === 'circle' ? '50%' : (p.shape === 'rounded' ? '14px' : '0px');
  return '<div class="cv-photo ' + (extraClass || '') + '" style="width:' + sizeMM + 'mm;height:' + sizeMM + 'mm;' +
    'border-radius:' + radius + ';border:' + p.borderWidth + 'px solid ' + p.borderColor + '">' +
    '<img src="' + p.url + '" alt="" style="transform:scale(' + (p.zoom / 100) + ') translate(' + p.x + '%,' + p.y + '%)">' +
    '</div>';
}

function contactData(){
  const p = state.personal, out = [];
  const add = function(icon, val, href){
    if (String(val || '').trim()) out.push({ icon: icon, val: String(val).trim(), href: href || '' });
  };
  add('fa-envelope', p.email, 'mailto:' + p.email);
  add('fa-phone', p.phone, 'tel:' + String(p.phone || '').replace(/[^\d+]/g, ''));
  add('fa-location-dot', p.address);
  add('fa-globe', p.website, safeUrl(p.website));
  add('fa-linkedin', p.linkedin, safeUrl(p.linkedin));
  add('fa-github', p.github, safeUrl(p.github));
  add('fa-cake-candles', p.birthDate);
  add('fa-flag', p.nationality);
  add('fa-id-card', p.drivingLicense);
  add('fa-heart', p.maritalStatus);
  return out;
}

function contactList(mode){
  const items = contactData();
  if (!items.length) return '';
  if (mode === 'side'){
    return '<ul class="cv-contact-side">' + items.map(function(i){
      const inner = '<i class="fa-solid ' + i.icon + '"></i><span>' + esc(i.val) + '</span>';
      return '<li>' + (i.href ? '<a href="' + esc(i.href) + '" target="_blank" rel="noopener">' + inner + '</a>' : inner) + '</li>';
    }).join('') + '</ul>';
  }
  return '<div class="cv-contact-inline">' + items.map(function(i){
    const inner = '<i class="fa-solid ' + i.icon + '"></i><span>' + esc(i.val) + '</span>';
    return i.href ? '<a href="' + esc(i.href) + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">' + inner + '</a>' : '<span>' + inner + '</span>';
  }).join('') + '</div>';
}

/* ============================================================
   10. PAGE BUILDER
   ============================================================ */
function buildPage(){
  const tpl = getTpl();
  const single = ['ats','classic','timeline','elegant'].indexOf(tpl.layout) !== -1;
  const sideTypes = tpl.side || [];

  let side = [], main = [];
  if (single){
    main = state.sections.filter(function(s){ return s.visible; });
  } else {
    side = state.sections.filter(function(s){ return s.visible && sideTypes.indexOf(s.type) !== -1; });
    main = state.sections.filter(function(s){ return s.visible && sideTypes.indexOf(s.type) === -1; });
  }

  switch (tpl.layout){
    case 'sidebar-left':
    case 'sidebar-right': return laySidebar(tpl, main, side);
    case 'band':          return layBand(tpl, main, side);
    case 'two-col':       return layTwoCol(tpl, main, side);
    case 'compact':       return layCompact(tpl, main, side);
    case 'creative':      return layCreative(tpl, main, side);
    case 'ats':           return layATS(tpl, main);
    case 'classic':       return layClassic(tpl, main);
    case 'timeline':      return layTimeline(tpl, main);
    case 'elegant':       return layElegant(tpl, main);
    default:              return laySidebar(tpl, main, side);
  }
}

function applyTheme(){
  const page = $('#cvPage');
  const st = page.style;
  const th = state.theme;
  st.setProperty('--primary', th.primary);

/* ============================================================
   11. PREVIEW RENDER + SORTABLE
   ============================================================ */
let previewSortables = [];

function destroyPreviewSortables(){
  previewSortables.forEach(function(s){ try { s.destroy(); } catch (e){} });
  previewSortables = [];
}

function renderPreview(){
  const page = $('#cvPage');
  const tpl = getTpl();

  destroyPreviewSortables();
  applyTheme();

  page.classList.remove('nopad','rtl','ltr');
  const cls = ['lyt-' + tpl.layout];
  if (tpl.layout === 'sidebar-left' || tpl.layout === 'sidebar-right') cls.push('nopad');
  page.className = cls.join(' ');
  page.classList.add(state.lang === 'ar' ? 'rtl' : 'ltr');

  page.innerHTML = buildPage();

  if (window.Sortable){
    $$('.cv-sec-list', page).forEach(function(el){
      previewSortables.push(Sortable.create(el, {
        animation: 180,
        ghostClass: 'drag-ghost',
        forceFallback: false,
        onEnd: function(){
          const ids = Array.prototype.slice.call(el.children)
            .map(function(c){ return c.getAttribute('data-id'); })
            .filter(Boolean);
          setTimeout(function(){
            applyOrder(ids);
            renderFormSections();
            save();
            renderPreview();
          }, 0);
        }
      }));
    });
  }
}

let renderTimer = null;
function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderPreview, 70);
}

function applyOrder(ids){
  const set = {};
  ids.forEach(function(id){ set[id] = true; });
  const slots = [];
  state.sections.forEach(function(s, i){ if (set[s.id]) slots.push(i); });
  const byId = {};
  state.sections.forEach(function(s){ byId[s.id] = s; });
  const next = state.sections.slice();
  slots.forEach(function(slot, i){
    if (byId[ids[i]]) next[slot] = byId[ids[i]];
  });
  state.sections = next;
}

function fieldInput(label, value, secId, idx, field, type){
  if (type === 'select'){
    return '<label class="fld"><span>' + esc(label) + '</span><select data-sec="' + secId + '" data-idx="' + idx + '" data-field="' + field + '">' +
      LEVELS.map(function(l){
        return '<option value="' + l + '"' + (value === l ? ' selected' : '') + '>' + esc(levelLabel(l)) + '</option>';
      }).join('') + '</select></label>';
  }
  if (type === 'number'){
    return '<label class="fld"><span>' + esc(label) + '</span><input type="number" min="0" max="100" value="' + esc(value == null ? 80 : value) + '" data-sec="' + secId + '" data-idx="' + idx + '" data-field="' + field + '"></label>';
  }
  return '<label class="fld"><span>' + esc(label) + '</span><input type="' + type + '" value="' + esc(value || '') + '" data-sec="' + secId + '" data-idx="' + idx + '" data-field="' + field + '"></label>';
}

function formSectionCard(sec){
  const def = SEC_DEFS[sec.type] || SEC_DEFS.custom;
  const isOpen = openSections[sec.id] !== false;
  const titleVal = sec.title[state.lang] || sec.title.en || '';

  let body = '<label class="fld"><span>' + esc(T('sectionTitle')) + '</span>' +
    '<input type="text" data-sec="' + sec.id + '" data-idx="" data-field="title" value="' + esc(titleVal) + '"></label>';

  if (sec.type === 'summary'){
    body += '<label class="fld"><span>' + esc(T('text')) + '</span>' +
      '<textarea rows="5" data-sec="' + sec.id + '" data-idx="" data-field="text">' + esc(sec.text || '') + '</textarea></label>';
  } else {
    const cfg = TYPE_FIELDS[sec.type] || TYPE_FIELDS.custom;
    const items = sec.items || [];
    body += items.map(function(it, idx){
      return '<div class="item-card">' +
        '<div class="item-head"><span>#' + (idx + 1) + '</span>' +
        '<button class="mini danger" data-act="del-item" data-sec="' + sec.id + '" data-idx="' + idx + '" title="' + esc(T('remove')) + '"><i class="fa-solid fa-xmark"></i></button></div>' +
        '<div class="grid2">' + cfg.grid.map(function(f){
          return fieldInput(T(f[0]), it[f[0]], sec.id, idx, f[0], f[1]);
        }).join('') + '</div>' +
        (cfg.desc
          ? '<label class="fld"><span>' + esc(T('description')) + '</span>' +
            '<textarea rows="3" data-sec="' + sec.id + '" data-idx="' + idx + '" data-field="' + cfg.desc + '">' + esc(it[cfg.desc] || '') + '</textarea></label>'
          : '') +
      '</div>';
    }).join('');
    body += '<button class="add-item-btn" data-act="add-item" data-sec="' + sec.id + '"><i class="fa-solid fa-plus"></i> ' + esc(T('addItem')) + '</button>';
  }

  return '<div class="sec-card' + (sec.visible ? '' : ' hidden-sec') + '" data-id="' + sec.id + '">' +
    '<div class="sec-head">' +
      '<span class="drag-handle" title="Drag"><i class="fa-solid fa-grip-vertical"></i></span>' +
      '<span class="ico"><i class="fa-solid ' + def.icon + '"></i></span>' +
      '<span class="nm">' + esc(titleVal || '—') + '</span>' +
      '<button class="mini" data-act="toggle-visible" data-sec="' + sec.id + '" title="' + esc(T('secVisible')) + '"><i class="fa-solid ' + (sec.visible ? 'fa-eye' : 'fa-eye-slash') + '"></i></button>' +
      '<button class="mini" data-act="toggle-open" data-sec="' + sec.id + '"><i class="fa-solid ' + (isOpen ? 'fa-chevron-up' : 'fa-chevron-down') + '"></i></button>' +
      '<button class="mini danger" data-act="del-section" data-sec="' + sec.id + '" title="' + esc(T('remove')) + '"><i class="fa-solid fa-trash-can"></i></button>' +
    '</div>' +
    '<div class="sec-body' + (isOpen ? '' : ' collapsed') + '">' + body + '</div>' +
  '</div>';
}

function renderFormSections(){
  const list = $('#sectionList');
  list.innerHTML = state.sections.map(formSectionCard).join('');

  if (formSortable){ try { formSortable.destroy(); } catch (e){} formSortable = null; }
  if (window.Sortable){
    formSortable = Sortable.create(list, {
      handle: '.drag-handle',
      animation: 180,
      ghostClass: 'drag-ghost',
      onEnd: function(){
        const ids = Array.prototype.slice.call(list.children)
          .map(function(c){ return c.getAttribute('data-id'); })
          .filter(Boolean);
        setTimeout(function(){
          applyOrder(ids);
          renderFormSections();
          renderPreview();
          save();
        }, 0);
      }
    });
  }
}

  const cur = state.photo.visible ? state.photo.shape : 'hidden';
  $$('.shape-btn').forEach(function(b){
    const on = b.getAttribute('data-shape') === cur;
    b.style.borderColor = on ? '#2563eb' : '#dbe2ec';
    b.style.background  = on ? '#eef4ff' : '#fff';
    b.style.color       = on ? '#2563eb' : '#64748b';
  });
}

function syncPhotoPreview(){
  const box = $('#photoPreviewBox');
  if (!state.photo.url){
    box.innerHTML = '<i class="fa-solid fa-user" style="font-size:30px;color:#c3cede"></i>';
    return;
  }
  const radius = state.photo.shape === 'circle' ? '50%' : (state.photo.shape === 'rounded' ? '12px' : '0px');
  box.style.borderRadius = radius;
  box.innerHTML = '<img src="' + state.photo.url + '" style="width:100%;height:100%;object-fit:cover;border-radius:' + radius + '">';
}

function applyTemplate(id){
  const t = TEMPLATES.filter(function(x){ return x.id === id; })[0];
  if (!t) return;
  state.template = t.id;
  Object.keys(t.theme).forEach(function(k){ state.theme[k] = t.theme[k]; });
  if (t.font) state.font = t.font;
  syncDesignInputs();
  renderPreview();
  save();
}

function renderTemplateOptions(){
  $('#templateSelect').innerHTML = TEMPLATES.map(function(t){
    return '<option value="' + t.id + '"' + (state.template === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>';
  }).join('');
}

  $$('[data-i18n]').forEach(function(el){
    const k = el.getAttribute('data-i18n');
    el.textContent = T(k);
  });
  renderPersonalFields();
  renderAddSectionBar();
  renderFontOptions();
  renderFormSections();
  flashSaved(true);

function setLanguage(lang){
  if (!I18N[lang]) lang = 'en';
  const wasArabic = ARABIC_FONTS.indexOf(state.font) !== -1;
  state.lang = lang;
  if (lang === 'ar' && !wasArabic) state.font = 'Cairo';
  if (lang !== 'ar' && wasArabic) state.font = 'Inter';
  $('#langSelect').value = lang;
  applyI18n();
  syncDesignInputs();
  renderPreview();
  save();
}

/* ============================================================
   18. IMPORT / EXPORT / RESET
   ============================================================ */
function exportBackup(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'SaivRESUME-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const obj = JSON.parse(e.target.result);
      state = migrate(obj);
      openSections = {};
      state.sections.forEach(function(x){ openSections[x.id] = false; });
      $('#langSelect').value = state.lang;
      renderTemplateOptions();
      applyI18n();
      syncDesignInputs();
      renderPreview();
      save();
      alert(T('imported'));
    } catch (err){
      alert(T('importError'));
    }
  };
  reader.readAsText(file);
}

function resetAll(){
  if (!confirm(T('confirmReset'))) return;
  try { localStorage.removeItem(LS_KEY); } catch (e){}
  state = defaultState();
  openSections = {};
  $('#langSelect').value = state.lang;
  renderTemplateOptions();
  applyI18n();
  syncDesignInputs();
  setZoom(1);
  renderPreview();
  save();
}

/* ============================================================
   19. PHOTO HANDLING
   ============================================================ */
function handlePhotoFile(file){
  if (!file || !/^image\//.test(file.type)) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const MAX = 560;
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, MAX / Math.max(w, h));
      w = Math.max(1, Math.round(w * sc));
      h = Math.max(1, Math.round(h * sc));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      state.photo.url = c.toDataURL('image/jpeg', 0.9);
      state.photo.visible = true;
      if (state.photo.shape === 'hidden') state.photo.shape = 'circle';
      syncShapeButtons();
      syncPhotoPreview();
      renderPreview();
      save();
    };
    img.onerror = function(){};
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   20. ZOOM
   ============================================================ */
function setZoom(z){
  state.zoom = clamp(z, 0.25, 2);
  $('#pageWrap').style.zoom = state.zoom;
  $('#zoomLabel').textContent = Math.round(state.zoom * 100) + '%';
}
function fitToScreen(){
  const scroller = $('#previewScroll');
  const baseW = 210 * 96 / 25.4; /* A4 width in CSS px */
  const avail = scroller.clientWidth - 64;
  setZoom(clamp(avail / baseW, 0.25, 2));
}

/* ============================================================
   21. EVENT WIRING
   ============================================================ */
function wireEvents(){

  /* ---- Tabs ---- */
  $$('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      $$('.tab').forEach(function(b){ b.classList.remove('active'); });
      $$('.panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      $('#panel-' + btn.getAttribute('data-tab')).classList.add('active');
    });
  });

  /* ---- Language / Template ---- */
  $('#langSelect').addEventListener('change', function(){ setLanguage(this.value); });
  $('#templateSelect').addEventListener('change', function(){ applyTemplate(this.value); });

  /* ---- Personal fields ---- */
  $('#personalFields').addEventListener('input', function(e){
    const k = e.target.getAttribute('data-p');
    if (!k) return;
    state.personal[k] = e.target.value;
    scheduleRender();
    save();
  });

  /* ---- Section list: input ---- */
  $('#sectionList').addEventListener('input', function(e){
    const el = e.target;
    const secId = el.getAttribute('data-sec');
    if (!secId) return;
    const sec = state.sections.filter(function(s){ return s.id === secId; })[0];
    if (!sec) return;

    const idxRaw = el.getAttribute('data-idx');
    const field = el.getAttribute('data-field');
    let val = el.value;
    if (el.type === 'number') val = clamp(val, 0, 100);
    if (el.type === 'checkbox') val = el.checked;

    if (idxRaw === '' || idxRaw === null){
      if (field === 'title'){
        sec.title[state.lang] = val;
        const nm = $('.sec-card[data-id="' + secId + '"] .nm');
        if (nm) nm.textContent = val || '—';
      } else {
        sec[field] = val;
      }
    } else {
      const idx = parseInt(idxRaw, 10);
      if (sec.items && sec.items[idx]) sec.items[idx][field] = val;
    }
    scheduleRender();
    save();
  });

  /* ---- Section list: change (selects) ---- */
  $('#sectionList').addEventListener('change', function(e){
    const el = e.target;
    if (el.tagName === 'SELECT'){
      el.dispatchEvent(new Event('input', { bubbles:true }));
    }
  });

  /* ---- Section list: clicks ---- */
  $('#sectionList').addEventListener('click', function(e){
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.getAttribute('data-act');
    const secId = btn.getAttribute('data-sec');
    const sec = state.sections.filter(function(s){ return s.id === secId; })[0];
    if (!sec) return;

    if (act === 'toggle-open'){
      openSections[sec.id] = (openSections[sec.id] === false);
      renderFormSections();
      return;
    }
    if (act === 'toggle-visible'){
      sec.visible = !sec.visible;
      renderFormSections();
      renderPreview();
      save();
      return;
    }
    if (act === 'del-section'){
      if (!confirm(T('confirmDelete'))) return;
      state.sections = state.sections.filter(function(s){ return s.id !== secId; });
      renderFormSections();
      renderPreview();
      save();
      return;
    }
    if (act === 'del-item'){
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      sec.items.splice(idx, 1);
      renderFormSections();
      renderPreview();
      save();
      return;
    }
    if (act === 'add-item'){
      const blank = BLANK_ITEM[sec.type] || BLANK_ITEM.custom;
      sec.items = sec.items || [];
      sec.items.push(JSON.parse(JSON.stringify(blank)));
      openSections[sec.id] = true;
      renderFormSections();
      renderPreview();
      save();
      return;
    }
  });

  /* ---- Add section ---- */
  $('#addSectionBar').addEventListener('click', function(e){
    if (!e.target.closest('#addSecBtn')) return;
    const sel = $('#addSecType');
    if (!sel) return;
    const type = sel.value;
    const def = SEC_DEFS[type];
    const sec = {
      id: uid('sec'),
      type: type,
      visible: true,
      text: '',
      items: [],
      title: Object.assign({}, def.title)
    };
    if (type !== 'summary') sec.items.push(JSON.parse(JSON.stringify(BLANK_ITEM[type] || BLANK_ITEM.custom)));
    state.sections.push(sec);
    openSections[sec.id] = true;
    renderFormSections();
    renderPreview();
    save();
  });

  /* ---- Photo controls ---- */
  $('#photoInput').addEventListener('change', function(){
    if (this.files && this.files[0]) handlePhotoFile(this.files[0]);
    this.value = '';
  });

  $('#btnRemovePhoto').addEventListener('click', function(){
    state.photo.url = '';
    syncPhotoPreview();
    renderPreview();
    save();
  });

  $('#shapeGroup').addEventListener('click', function(e){
    const btn = e.target.closest('.shape-btn');
    if (!btn) return;
    const shape = btn.getAttribute('data-shape');
    if (shape === 'hidden'){
      state.photo.visible = false;
    } else {
      state.photo.visible = true;
      state.photo.shape = shape;
    }
    syncShapeButtons();
    syncPhotoPreview();
    renderPreview();
    save();
  });

  const photoBind = function(id, prop, transform){
    $(id).addEventListener('input', function(){
      state.photo[prop] = transform ? transform(this.value) : this.value;
      renderPreview();
      save();
    });
  };
  photoBind('#photoZoom','zoom', Number);
  photoBind('#photoBorder','borderWidth', Number);
  photoBind('#photoX','x', Number);
  photoBind('#photoY','y', Number);
  $('#photoBorderColor').addEventListener('input', function(){
    state.photo.borderColor = this.value;
    renderPreview();
    save();
  });

  /* ---- Design controls ---- */
  const colorBind = function(id, key){
    $(id).addEventListener('input', function(){
      state.theme[key] = this.value;
      renderPreview();
      save();
    });
  };
  colorBind('#cPrimary','primary');
  colorBind('#cSecondary','secondary');
  colorBind('#cText','text');
  colorBind('#cMuted','muted');
  colorBind('#cPageBg','pageBg');
  colorBind('#cSideBg','sideBg');
  colorBind('#cSideText','sideText');

  $('#paletteGrid').addEventListener('click', function(e){
    const btn = e.target.closest('.palette-btn');
    if (!btn) return;
    const p = PALETTES[parseInt(btn.getAttribute('data-pal'), 10)];
    if (!p) return;
    ['primary','secondary','text','muted','pageBg','sideBg','sideText'].forEach(function(k){
      state.theme[k] = p[k];
    });
    syncDesignInputs();
    renderPreview();
    save();
  });

  $('#fFont').addEventListener('change', function(){
    state.font = this.value;
    renderPreview();
    save();
  });

  const rangeBind = function(id, key, unit){
    $(id).addEventListener('input', function(){
      state[key] = parseFloat(this.value);
      renderPreview();
      save();
    });
  };
  rangeBind('#rFontSize','fontSize');
  rangeBind('#rLineHeight','lineHeight');
  rangeBind('#rPagePad','pagePad');
  rangeBind('#rSecGap','secGap');
  rangeBind('#rSideW','sideWidth');

  $('#chkSkillBars').addEventListener('change', function(){
    state.skillBars = this.checked;
    renderPreview();
    save();
  });

  /* ---- Actions ---- */
  $('#btnSample').addEventListener('click', fillSample);
  $('#btnSample2').addEventListener('click', fillSample);
  $('#btnExport').addEventListener('click', exportBackup);
  $('#btnExport2').addEventListener('click', exportBackup);
  $('#btnImport').addEventListener('click', function(){ $('#jsonInput').click(); });
  $('#btnImport2').addEventListener('click', function(){ $('#jsonInput').click(); });
  $('#jsonInput').addEventListener('change', function(){
    if (this.files && this.files[0]) importBackup(this.files[0]);
    this.value = '';
  });
  $('#btnReset').addEventListener('click', resetAll);
  $('#btnReset2').addEventListener('click', resetAll);
  $('#btnPrint').addEventListener('click', function(){ window.print(); });

  /* ---- Zoom ---- */
  $('#zoomIn').addEventListener('click', function(){ setZoom(state.zoom + 0.1); });
  $('#zoomOut').addEventListener('click', function(){ setZoom(state.zoom - 0.1); });
  $('#zoomReset').addEventListener('click', function(){ setZoom(1); });
  $('#zoomFit').addEventListener('click', fitToScreen);

  /* ---- Keyboard shortcuts ---- */
  document.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
      e.preventDefault();
      save();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p'){
      e.preventDefault();
      window.print();
    }
  });

  /* ---- Resize → refit ---- */
  window.addEventListener('resize', function(){
    /* keep zoom; nothing to do but keep the layout crisp */
  });
}

/* ============================================================
   22. INIT
   ============================================================ */
function init(){
  const loaded = loadState();
  if (loaded) state = loaded;

  if (state.lang === 'ar' && ARABIC_FONTS.indexOf(state.font) === -1) state.font = 'Cairo';

  renderTemplateOptions();
  $('#langSelect').value = state.lang;

  openSections = {};
  state.sections.forEach(function(s){ openSections[s.id] = true; });
  openSections['sec_projects'] = false;
  openSections['sec_certifications'] = false;
  openSections['sec_references'] = false;

  renderPalettes();
  applyI18n();
  syncDesignInputs();
  renderPreview();

  setZoom(state.zoom || 1);
  if (!loaded) setTimeout(fitToScreen, 120);

  wireEvents();

  window.addEventListener('beforeunload', function(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e){}
  });
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
