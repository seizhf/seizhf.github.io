<!DOCTYPE html>
<html lang="en" data-theme="nokia">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0a">
<meta name="description" content="SaivSANAKE — a nostalgic, mobile-first Snake remake">
<title>SaivSANAKE</title>
<style>
/* ============================================================================
   SaivSANAKE — STYLESHEET
   ----------------------------------------------------------------------------
   Design system:
     - CSS custom properties per theme
     - Retro LCD aesthetic with modern polish
     - Mobile-first 9:16 app shell
     - 60fps transforms/opacity only
   ========================================================================== */

/* ---------------------------------------------------------------------------
   1. RESET & BASE
   ------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  width: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
               system-ui, sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  background: var(--app-bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.6s ease, color 0.4s ease;
}

/* ---------------------------------------------------------------------------
   2. THEMES
   ------------------------------------------------------------------------- */

/* ---- Classic Nokia 3310 ---- */
[data-theme="nokia"] {
  --app-bg: radial-gradient(circle at 50% 30%, #1a2a1a 0%, #0a0f0a 100%);
  --shell-bg: linear-gradient(168deg, #2c3e2c 0%, #1a261a 100%);
  --shell-border: rgba(180, 220, 160, 0.12);
  --board-bg: #9bbc0f;
  --board-grid: rgba(15, 56, 15, 0.07);
  --board-inner: inset 0 0 60px rgba(15, 56, 15, 0.18);
  --snake-head: #0f380f;
  --snake-body: #306230;
  --snake-shadow: rgba(15, 56, 15, 0.35);
  --food: #0f380f;
  --food-glow: rgba(15, 56, 15, 0.5);
  --text: #d4e8c0;
  --text-dim: #7d8f6e;
  --text-faint: #5a6a4d;
  --hud-bg: rgba(180, 220, 160, 0.06);
  --hud-border: rgba(180, 220, 160, 0.13);
  --accent: #9bbc0f;
  --accent-2: #c7e632;
  --btn-bg: linear-gradient(180deg, rgba(180, 220, 160, 0.1), rgba(180, 220, 160, 0.03));
  --btn-border: rgba(180, 220, 160, 0.16);
  --btn-active-bg: linear-gradient(180deg, rgba(155, 188, 15, 0.35), rgba(155, 188, 15, 0.1));
  --btn-active-border: rgba(199, 230, 50, 0.55);
  --overlay-bg: radial-gradient(ellipse at 50% 30%, rgba(26, 42, 26, 0.96), rgba(10, 15, 10, 0.98));
  --primary-bg: linear-gradient(96deg, #9bbc0f, #c7e632);
  --primary-text: #0a1a0a;
  --primary-shadow: 0 12px 34px -10px rgba(155, 188, 15, 0.7);
  --powerup-bonus: #b8860b;
  --powerup-slow: #2c5f8a;
  --powerup-double: #8a2c5f;
  --powerup-shrink: #2c8a5f;
}

/* ---- Cyberpunk Neon ---- */
[data-theme="cyberpunk"] {
  --app-bg: radial-gradient(circle at 50% 30%, #1a0a2e 0%, #05020f 100%);
  --shell-bg: linear-gradient(168deg, #1a0a2e 0%, #0a0518 100%);
  --shell-border: rgba(0, 240, 255, 0.14);
  --board-bg: #0a0518;
  --board-grid: rgba(0, 240, 255, 0.05);
  --board-inner: inset 0 0 80px rgba(255, 0, 160, 0.12);
  --snake-head: #00fff0;
  --snake-body: #00b8c4;
  --snake-shadow: rgba(0, 255, 240, 0.5);
  --food: #ff00a0;
  --food-glow: rgba(255, 0, 160, 0.8);
  --text: #e8f0ff;
  --text-dim: #8a7fb8;
  --text-faint: #5a4f7a;
  --hud-bg: rgba(0, 240, 255, 0.05);
  --hud-border: rgba(0, 240, 255, 0.15);
  --accent: #00fff0;
  --accent-2: #ff00a0;
  --btn-bg: linear-gradient(180deg, rgba(0, 240, 255, 0.08), rgba(0, 240, 255, 0.02));
  --btn-border: rgba(0, 240, 255, 0.2);
  --btn-active-bg: linear-gradient(180deg, rgba(0, 240, 255, 0.3), rgba(0, 240, 255, 0.08));
  --btn-active-border: rgba(0, 255, 240, 0.75);
  --overlay-bg: radial-gradient(ellipse at 50% 30%, rgba(26, 10, 46, 0.96), rgba(5, 2, 15, 0.98));
  --primary-bg: linear-gradient(96deg, #00fff0, #ff00a0);
  --primary-text: #05020f;
  --primary-shadow: 0 12px 34px -10px rgba(0, 255, 240, 0.6);
  --powerup-bonus: #ffb300;
  --powerup-slow: #00e5ff;
  --powerup-double: #ff2d95;
  --powerup-shrink: #7cff6b;
}

/* ---- Minimal Dark ---- */
[data-theme="minimal"] {
  --app-bg: radial-gradient(circle at 50% 30%, #1a1a1a 0%, #08080a 100%);
  --shell-bg: linear-gradient(168deg, #18181c 0%, #0e0e11 100%);
  --shell-border: rgba(255, 255, 255, 0.08);
  --board-bg: #121216;
  --board-grid: rgba(255, 255, 255, 0.032);
  --board-inner: inset 0 0 60px rgba(0, 0, 0, 0.4);
  --snake-head: #f5f5f7;
  --snake-body: #a0a0aa;
  --snake-shadow: rgba(255, 255, 255, 0.28);
  --food: #f5f5f7;
  --food-glow: rgba(255, 255, 255, 0.6);
  --text: #f0f0f3;
  --text-dim: #909099;
  --text-faint: #5c5c66;
  --hud-bg: rgba(255, 255, 255, 0.035);
  --hud-border: rgba(255, 255, 255, 0.075);
  --accent: #ffffff;
  --accent-2: #a8a8b3;
  --btn-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.02));
  --btn-border: rgba(255, 255, 255, 0.1);
  --btn-active-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.06));
  --btn-active-border: rgba(255, 255, 255, 0.4);
  --overlay-bg: radial-gradient(ellipse at 50% 30%, rgba(24, 24, 28, 0.96), rgba(8, 8, 10, 0.98));
  --primary-bg: linear-gradient(96deg, #ffffff, #c8c8d0);
  --primary-text: #0a0a0c;
  --primary-shadow: 0 12px 34px -10px rgba(255, 255, 255, 0.35);
  --powerup-bonus: #f5b955;
  --powerup-slow: #7dd3fc;
  --powerup-double: #f472b6;
  --powerup-shrink: #86efac;
}

/* ---- Crisp Light ---- */
[data-theme="light"] {
  --app-bg: radial-gradient(circle at 50% 30%, #f0f4fa 0%, #d8dee8 100%);
  --shell-bg: linear-gradient(168deg, #ffffff 0%, #eef1f6 100%);
  --shell-border: rgba(0, 0, 0, 0.08);
  --board-bg: #f7f9fc;
  --board-grid: rgba(0, 0, 0, 0.045);
  --board-inner: inset 0 0 60px rgba(0, 0, 0, 0.04);
  --snake-head: #1a1f2e;
  --snake-body: #4a5168;
  --snake-shadow: rgba(0, 0, 0, 0.2);
  --food: #e11d48;
  --food-glow: rgba(225, 29, 72, 0.4);
  --text: #1a1f2e;
  --text-dim: #6b7280;
  --text-faint: #9ca3af;
  --hud-bg: rgba(0, 0, 0, 0.035);
  --hud-border: rgba(0, 0, 0, 0.08);
  --accent: #1a1f2e;
  --accent-2: #e11d48;
  --btn-bg: linear-gradient(180deg, #ffffff, #f0f2f7);
  --btn-border: rgba(0, 0, 0, 0.09);
  --btn-active-bg: linear-gradient(180deg, #e8ecf4, #d0d6e0);
  --btn-active-border: rgba(0, 0, 0, 0.2);
  --overlay-bg: radial-gradient(ellipse at 50% 30%, rgba(255, 255, 255, 0.97), rgba(240, 244, 250, 0.99));
  --primary-bg: linear-gradient(96deg, #1a1f2e, #4a5168);
  --primary-text: #ffffff;
  --primary-shadow: 0 12px 34px -10px rgba(26, 31, 46, 0.5);
  --powerup-bonus: #f59e0b;
  --powerup-slow: #0284c7;
  --powerup-double: #db2777;
  --powerup-shrink: #16a34a;
}

/* ---------------------------------------------------------------------------
   3. APP SHELL
   ------------------------------------------------------------------------- */
.app {
  --avail-h: min(100vh, 880px);
  position: relative;
  z-index: 1;

  height: var(--avail-h);
  width: min(420px, 100vw, calc(var(--avail-h) * 9 / 16));

  display: flex;
  flex-direction: column;
  gap: 8px;

  padding: 10px 10px 12px;

  background: var(--shell-bg);
  border: 1px solid var(--shell-border);
  border-radius: 26px;
  box-shadow:
    0 48px 110px -28px rgba(0, 0, 0, 0.85),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  overflow: hidden;
  isolation: isolate;
  transition: background 0.6s ease, border-color 0.4s ease;
}

@supports (height: 100dvh) {
  .app { --avail-h: min(100dvh, 880px); }
}

@media (max-width: 430px) and (max-height: 900px) {
  .app {
    border-radius: 0;
    border-left: none;
    border-right: none;
    box-shadow: none;
    padding: 8px 8px 10px;
  }
}

/* ---------------------------------------------------------------------------
   4. HUD
   ------------------------------------------------------------------------- */
.hud {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 6px;
  flex: 0 0 auto;
}

.hud-cell {
  background: var(--hud-bg);
  border: 1px solid var(--hud-border);
  border-radius: 11px;
  padding: 6px 9px 7px;
  min-width: 0;
  overflow: hidden;
  transition: border-color 0.3s ease, background 0.3s ease;
}

.hud-cell.flash {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
}

.hud-label {
  display: block;
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 1px;
  white-space: nowrap;
}

.hud-value {
  display: block;
  font-size: 16px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#hudLevel { color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent); }

/* ---------------------------------------------------------------------------
   5. BOARD
   ------------------------------------------------------------------------- */
.board-wrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  overflow: hidden;
  touch-action: none;
  transition: box-shadow 0.4s ease;
}

#board {
  display: block;
  border-radius: 16px;
  background: var(--board-bg);
  box-shadow:
    inset 0 0 0 1px var(--shell-border),
    var(--board-inner),
    0 0 40px -14px color-mix(in srgb, var(--accent) 30%, transparent);
  touch-action: none;
  transition: background 0.6s ease, box-shadow 0.6s ease;
}

/* Board flash on death */
.board-wrap.dead #board {
  animation: boardDead 0.6s ease-in-out;
}

@keyframes boardDead {
  0%, 100% { filter: none; }
  25%, 75% { filter: brightness(1.4) saturate(1.6); }
}

/* ---------------------------------------------------------------------------
   6. CONTROLS (D-Pad + Pause)
   ------------------------------------------------------------------------- */
.controls {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  grid-template-areas:
    ".    up    ."
    "left down  right";
  gap: 6px;
  height: 112px;
}

.ctl {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--btn-bg);
  border: 1px solid var(--btn-border);
  border-radius: 14px;
  color: var(--text-dim);

  cursor: pointer;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  font-family: inherit;

  transition: transform 0.08s var(--ease-out),
              background 0.18s ease,
              border-color 0.18s ease,
              color 0.18s ease,
              box-shadow 0.18s ease;
  will-change: transform;
}

.ctl svg {
  width: 26px;
  height: 26px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

.ctl:active,
.ctl.active {
  transform: scale(0.92);
  color: var(--accent);
  border-color: var(--btn-active-border);
  background: var(--btn-active-bg);
  box-shadow: 0 0 22px -4px color-mix(in srgb, var(--accent) 65%, transparent);
}

.ctl[data-dir="up"]    { grid-area: up; }
.ctl[data-dir="down"]  { grid-area: down; }
.ctl[data-dir="left"]  { grid-area: left; }
.ctl[data-dir="right"] { grid-area: right; }

/* ---------------------------------------------------------------------------
   7. SCREENS / OVERLAYS
   ------------------------------------------------------------------------- */
.screen {
  position: absolute;
  inset: 0;
  z-index: 40;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px 22px;
  background: var(--overlay-bg);

  opacity: 0;
  visibility: hidden;
  transform: scale(1.03);
  transition: opacity 0.28s var(--ease-out),
              visibility 0.28s,
              transform 0.34s var(--ease-out);

  backdrop-filter: blur(14px) saturate(1.15);
  -webkit-backdrop-filter: blur(14px) saturate(1.15);
}

.screen.active {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
}

.screen-inner {
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
  text-align: center;
}

/* ---- Logo mark ---- */
.logo-mark {
  display: grid;
  grid-template-columns: repeat(3, 20px);
  grid-template-rows: 20px;
  gap: 4px;
  margin-bottom: 2px;
  animation: logoFloat 3.4s ease-in-out infinite;
}

.logo-mark i {
  display: block;
  border-radius: 4px;
  background: var(--accent);
  box-shadow: 0 0 14px -1px var(--accent), inset 0 1px 0 rgba(255, 255, 255, 0.4);
}

.logo-mark i:nth-child(2) { background: var(--accent-2); box-shadow: 0 0 14px -1px var(--accent-2); }
.logo-mark i:nth-child(3) { opacity: 0.55; }

@keyframes logoFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-5px) rotate(-1.2deg); }
}

/* ---- Titles ---- */
.title {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1.02;
  background: linear-gradient(96deg, var(--accent) 0%, var(--accent-2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 22px color-mix(in srgb, var(--accent) 40%, transparent));
}

.title.small { font-size: 26px; }

.subtitle {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: -8px;
}

/* ---- Buttons ---- */
.btn {
  position: relative;
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 15px 18px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.1s var(--ease-out),
              box-shadow 0.22s ease,
              background 0.22s ease,
              color 0.22s ease;
  touch-action: manipulation;
}

.btn:active { transform: scale(0.965); }

.btn-primary {
  color: var(--primary-text);
  background: var(--primary-bg);
  box-shadow: var(--primary-shadow);
}

.btn-ghost {
  color: var(--text-dim);
  background: var(--hud-bg);
  border: 1px solid var(--hud-border);
  font-size: 11px;
  padding: 12px 16px;
  letter-spacing: 0.14em;
}

.btn-ghost:active {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--text);
}

.btn-row {
  display: flex;
  gap: 8px;
  width: 100%;
}

.btn-row .btn { flex: 1; }

/* ---- Theme selector ---- */
.theme-row {
  display: flex;
  gap: 8px;
  width: 100%;
  justify-content: center;
  flex-wrap: wrap;
}

.theme-swatch {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
  transition: transform 0.15s var(--ease-out), border-color 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

.theme-swatch:active { transform: scale(0.9); }

.theme-swatch.active {
  border-color: var(--accent);
  box-shadow: 0 0 14px -2px var(--accent);
  transform: scale(1.08);
}

.theme-swatch[data-theme-name="nokia"]     { background: linear-gradient(135deg, #9bbc0f, #0f380f); }
.theme-swatch[data-theme-name="cyberpunk"] { background: linear-gradient(135deg, #00fff0, #ff00a0); }
.theme-swatch[data-theme-name="minimal"]   { background: linear-gradient(135deg, #f5f5f7, #2a2a30); }
.theme-swatch[data-theme-name="light"]     { background: linear-gradient(135deg, #ffffff, #4a5168); }

/* ---- Menu stats ---- */
.menu-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  width: 100%;
  margin-top: 2px;
}

.menu-stats > div {
  background: var(--hud-bg);
  border: 1px solid var(--hud-border);
  border-radius: 12px;
  padding: 9px 4px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.menu-stats b {
  font-size: 15px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  letter-spacing: -0.02em;
}

.menu-stats span {
  font-size: 7.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* ---- Game over ---- */
.over-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--accent);
  text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent);
  animation: badgePop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes badgePop {
  0%   { transform: scale(0.6); opacity: 0; }
  70%  { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

.big-score {
  font-size: 46px;
  font-weight: 900;
  letter-spacing: -0.035em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(96deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 22px color-mix(in srgb, var(--accent) 40%, transparent));
}

.score-caption {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: -6px;
}

.breakdown {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.breakdown > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 8px 11px;
  background: var(--hud-bg);
  border: 1px solid var(--hud-border);
  border-radius: 11px;
}

.breakdown .k {
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.breakdown .v {
  font-size: 13px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}

/* ---- Toast ---- */
.toast {
  position: absolute;
  left: 50%;
  top: 22%;
  transform: translate(-50%, -50%) scale(0.7);
  opacity: 0;
  z-index: 6;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 70%, transparent);
  will-change: transform, opacity;
}

.toast.show {
  animation: toastPop 1.05s cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
}

@keyframes toastPop {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
  16%  { opacity: 1; transform: translate(-50%, -50%) scale(1.14); }
  28%  { transform: translate(-50%, -50%) scale(1); }
  72%  { opacity: 1; transform: translate(-50%, -60%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -90%) scale(0.94); }
}

/* ---- Floating score ---- */
.float-score {
  position: absolute;
  z-index: 5;
  font-size: 15px;
  font-weight: 900;
  color: var(--accent-2);
  text-shadow: 0 0 14px color-mix(in srgb, var(--accent-2) 75%, transparent);
  pointer-events: none;
  font-variant-numeric: tabular-nums;
  animation: floatUp 0.95s var(--ease-out) forwards;
}

@keyframes floatUp {
  0%   { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
  20%  { opacity: 1; transform: translate(-50%, -8px) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -46px) scale(0.95); }
}

/* ---- Powerup indicator ---- */
.powerup-bar {
  position: absolute;
  left: 8px;
  bottom: 8px;
  z-index: 5;
  display: flex;
  gap: 5px;
  pointer-events: none;
}

.powerup-pill {

}

.powerup-pill[data-type="slow"]   { color: var(--powerup-slow); border: 1px solid var(--powerup-slow); }
.powerup-pill[data-type="double"] { color: var(--powerup-double); border: 1px solid var(--powerup-double); }

@keyframes pillIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---- Utility ---- */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

<script>
/* ============================================================================
   SaivSANAKE — GAME ENGINE
   ----------------------------------------------------------------------------
   Sections:
     1.  Config & constants
     2.  Utilities
     3.  Storage
     4.  Audio engine (Web Audio API)
     5.  Haptics
     6.  Game state
     7.  DOM references
     8.  Canvas & rendering
     9.  Game logic (step, food, powerups)
     10. Input (keyboard, dpad, swipe)
     11. UI (screens, HUD, toasts)
     12. Flow control (start/pause/resume/game over)
     13. Game loop
     14. Bootstrap
   ========================================================================== */
(function () {
  "use strict";

  /* ==========================================================================
     1. CONFIG & CONSTANTS
     ========================================================================== */

  const COLS = 15;          // grid columns
  const ROWS = 20;          // grid rows
  const MAX_INPUT_QUEUE = 3; // prevent over-buffering inputs
  const SWIPE_THRESHOLD = 22; // px before a swipe registers
  const FOODS_PER_LEVEL = 5; // foods eaten per level up
  const DEATH_ANIM_MS = 700; // death flash duration

  /** Direction vectors. */
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  },
  };

  /** Opposite lookup (used to prevent 180° turns). */
  const OPPOSITE = {
    up: "down", down: "up", left: "right", right: "left",
  };

  /**
   * Theme definitions. The canvas reads directly from these objects;
   * the DOM styling is driven by the [data-theme] CSS selectors.
   */
  const THEMES = {
    nokia: {
      boardBg:     "#9bbc0f",
      grid:        "rgba(15, 56, 15, 0.08)",
      snakeHead:   "#0f380f",
      snakeBody:   "#306230",
      snakeShadow: "rgba(15, 56, 15, 0.35)",
      food:        "#0f380f",
      foodGlow:    "rgba(15, 56, 15, 0.5)",
      bonus:       "#b8860b",
      slow:        "#2c5f8a",
      double:      "#8a2c5f",
      shrink:      "#2c8a5f",
    },
    cyberpunk: {
      boardBg:     "#0a0518",
      grid:        "rgba(0, 240, 255, 0.05)",
      snakeHead:   "#00fff0",
      snakeBody:   "#00b8c4",
      snakeShadow: "rgba(0, 255, 240, 0.5)",
      food:        "#ff00a0",
      foodGlow:    "rgba(255, 0, 160, 0.8)",
      bonus:       "#ffb300",
      slow:        "#00e5ff",
      double:      "#ff2d95",
      shrink:      "#7cff6b",
    },
    minimal: {
      boardBg:     "#121216",
      grid:        "rgba(255, 255, 255, 0.032)",
      snakeHead:   "#f5f5f7",
      snakeBody:   "#a0a0aa",
      snakeShadow: "rgba(255, 255, 255, 0.28)",
      food:        "#f5f5f7",
      foodGlow:    "rgba(255, 255, 255, 0.6)",
      bonus:       "#f5b955",
      slow:        "#7dd3fc",
      double:      "#f472b6",
      shrink:      "#86efac",
    },
    light: {
      boardBg:     "#f7f9fc",
      grid:        "rgba(0, 0, 0, 0.045)",
      snakeHead:   "#1a1f2e",
      snakeBody:   "#4a5168",
      snakeShadow: "rgba(0, 0, 0, 0.2)",
      food:        "#e11d48",
      foodGlow:    "rgba(225, 29, 72, 0.4)",
      bonus:       "#f59e0b",
      slow:        "#0284c7",
      double:      "#db2777",
      shrink:      "#16a34a",
    },
  };

  /** Power-up definitions. */
  const POWERUPS = {
    bonus:  { key: "bonus",  points: 100, duration: 0,    label: "BONUS" },
    slow:   { key: "slow",   points: 20,  duration: 6000, label: "SLOW-MO" },
    double: { key: "double", points: 20,  duration: 8000, label: "DOUBLE" },
    shrink: { key: "shrink", points: 30,  duration: 0,    label: "SHRINK" },
  };

  const POWERUP_KEYS = Object.keys(POWERUPS);

  /** Easing for visual transitions. */
  const EASE_OUT = "cubic-bezier(0.16, 1, 0.3, 1)";

  /* ==========================================================================
     2. UTILITIES
     ========================================================================== */

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

  function clamp(v, min, max) { return v < min ? min : v > max ? max : v; }

  function randInt(max) { return (Math.random() * max) | 0; }

  function fmt(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const sec = s % 60;
    if (m > 0) return m + "m " + sec + "s";
    return sec + "s";
  }

  /** Shade a hex colour (amt > 0 lighten, < 0 darken). Returns rgb(). */
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255;
    let g = (n >> 8) & 255;
    let b = n & 255;
    if (amt > 0) {
      r += (255 - r) * amt;
      g += (255 - g) * amt;
      b += (255 - b) * amt;
    } else {
      r *= 1 + amt;
      g *= 1 + amt;
      b *= 1 + amt;
    }
    return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
  }

  /** Rounded rectangle path on a 2D context. */
  function roundRectPath(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  /** Draw a star polygon. */
  function starPath(ctx, cx, cy, outerR, innerR, points) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = (Math.PI / points) * i - Math.PI / 2;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  /* ==========================================================================
     3. STORAGE
     ========================================================================== */

  const STORAGE_KEY = "snake-3310.save.v1";

  const Save = {
    data: {
      highScore: 0,
      maxLength: 3,
      games: 0,
      theme: "nokia",
      muted: false,
    },

    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p && typeof p === "object") {
          Object.keys(this.data).forEach((k) => {
            if (typeof p[k] === typeof this.data[k]) this.data[k] = p[k];
          });
        }
      } catch (e) { /* ignore */ }
    },

    save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
      } catch (e) { /* ignore */ }
    },
  };

  /* ==========================================================================
     4. AUDIO ENGINE
     ========================================================================== */

  const Sound = (function () {
    let ctx = null;
    let master = null;
    let muted = false;
    let available = true;

    function init() {
      if (ctx || !available) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { available = false; return; }
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.28;
        master.connect(ctx.destination);
      } catch (e) { available = false; }
    }

    function resume() {
      if (ctx && ctx.state === "suspended") {
        ctx.resume().catch(() => {});
      }
    }

    /** Play a single oscillator tone. */
    function tone(o) {
      if (!ctx || muted || !available) return;

      const now = ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.08;
      const vol = o.vol === undefined ? 0.3 : o.vol;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = o.type || "square";
      osc.frequency.setValueAtTime(o.freq, now);
      if (o.to && o.to !== o.freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), now + dur);
      }

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      osc.connect(gain);
      gain.connect(master);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    /** Short noise burst for impacts. */
    function noise(o) {
      if (!ctx || muted || !available) return;

      const now = ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.1;
      const frames = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < frames; i++) {
        d[i] = (Math.random() * 2 - 1) * (1 - i / frames);
      }

      const src = ctx.createBufferSource();
      src.buffer = buf;

      const filter = ctx.createBiquadFilter();
      filter.type = o.filter || "lowpass";
      filter.frequency.setValueAtTime(o.freq || 800, now);
      if (o.to) filter.frequency.exponentialRampToValueAtTime(o.to, now + dur);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(o.vol === undefined ? 0.2 : o.vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      src.start(now);
    }

    const api = {
      init, resume,

      get muted() { return muted; },

      toggle() {
        muted = !muted;
        Save.data.muted = muted;
        Save.save();
        if (!muted) { resume(); api.uiClick(); }
        return muted;
      },

      setMuted(v) { muted = !!v; Save.data.muted = muted; Save.save(); },

      /* ---- Retro Nokia-style SFX ---- */

      uiClick() {
        tone({ freq: 1200, type: "square", dur: 0.022, vol: 0.16 });
      },

      uiBack() {
        tone({ freq: 800, to: 500, type: "square", dur: 0.06, vol: 0.16 });
      },

      turn() {
        tone({ freq: 1500, type: "square", dur: 0.014, vol: 0.08 });
      },

      eat() {
        tone({ freq: 880, type: "square", dur: 0.028, vol: 0.2 });
        tone({ freq: 1320, type: "square", dur: 0.032, vol: 0.16, delay: 0.045 });
      },

      bonus() {
        [660, 880, 1100, 1320].forEach((f, i) => {
          tone({ freq: f, type: "square", dur: 0.05, vol: 0.15, delay: i * 0.05 });
        });
      },

      powerup() {
        [700, 1000, 1400].forEach((f, i) => {
          tone({ freq: f, type: "triangle", dur: 0.08, vol: 0.15, delay: i * 0.05 });
        });
      },

      levelUp() {
        [523, 659, 784, 1047].forEach((f, i) => {
          tone({ freq: f, type: "square", dur: 0.08, vol: 0.15, delay: i * 0.07 });
        });
      },

      die() {
        [660, 550, 440, 330, 220, 165].forEach((f, i) => {
          tone({ freq: f, type: "square", dur: 0.14, vol: 0.2, delay: i * 0.09 });
        });
        noise({ freq: 600, to: 80, dur: 0.6, vol: 0.14, delay: 0.4 });
      },
    };

    return api;
  })();

  /* ==========================================================================
     5. HAPTICS
     ========================================================================== */

  const Haptics = {
    tap()   { if (navigator.vibrate) try { navigator.vibrate(8);  } catch (e) {} },
    turn()  { if (navigator.vibrate) try { navigator.vibrate(5);  } catch (e) {} },
    eat()   { if (navigator.vibrate) try { navigator.vibrate(14); } catch (e) {} },
    bonus() { if (navigator.vibrate) try { navigator.vibrate([10, 20, 10]); } catch (e) {} },
    die()   { if (navigator.vibrate) try { navigator.vibrate([60, 40, 120]); } catch (e) {} },
  };

  /* ==========================================================================
     6. GAME STATE
     ========================================================================== */

  const G = {
    // Snake
    body: [],           // array of {x, y}; index 0 = head
    dir: DIRS.right,    // current movement direction
    pendingGrowth: 0,   // segments queued to grow

    // Items
    food: { x: 0, y: 0 },
    powerups: [],       // array of { x, y, kind, spawnedAt, expiresAt }

    // Effects
    effects: [],        // visual effects (eat rings, etc.)
    particles: [],      // particle spray

    // Timers
    elapsed: 0,         // total playtime in ms
    stepTimer: 0,       // accumulator for movement
    slowUntil: 0,       // timestamp (game time) for slow-mo effect
    doubleUntil: 0,     // timestamp for double-points effect

    // Progress
    score: 0,
    level: 1,
    foodEaten: 0,
    bonusEaten: 0,
    maxLength: 3,

    // Flow
    status: "menu",     // menu | playing | paused | dying | gameover
    deathTimer: 0,
    newHighScore: false,

    // Random tick counter for item spawning
    bonusCheckTimer: 0,
  };

  /** Input queue (populated by any input source). */
  const inputQueue = [];

  /* ==========================================================================
     7. DOM REFERENCES
     ========================================================================== */

  const els = {
    app:         $("#app"),
    boardWrap:   $("#boardWrap"),
    board:       $("#board"),
    hudScore:    $("#hudScore"),
    hudBest:     $("#hudBest"),
    hudLevel:    $("#hudLevel"),
    hudScoreCell:$("#hudScoreCell"),
    hudLevelCell:$("#hudLevelCell"),
    toast:       $("#toast"),
    powerupBar:  $("#powerupBar"),

    screens: {
      start:  $("#screen-start"),
      pause:  $("#screen-pause"),
      over:   $("#screen-over"),
    },

    startHigh:   $("#startHigh"),
    startGames:  $("#startGames"),
    startLen:    $("#startLen"),

    overTitle:   $("#overTitle"),
    overBadge:   $("#overBadgeSlot"),
    overScore:   $("#overScore"),
    overLength:  $("#overLength"),
    overLevel:   $("#overLevel"),
    overFood:    $("#overFood"),
    overBonus:   $("#overBonus"),
    overTime:    $("#overTime"),
    overBest:    $("#overBest"),

    themeRow:    $("#themeRow"),
    btnSoundStart: $("#btnSoundStart"),
    btnSoundPause: $("#btnSoundPause"),
  };

  /* ==========================================================================
     8. CANVAS & RENDERING
     ========================================================================== */

  const ctx = els.board.getContext("2d");

  let CELL = 24;   // CSS px per cell
  let DPR = 1;
  let boardW = 0;
  let boardH = 0;
  let currentTheme = THEMES.nokia;

  /** Apply a theme (both DOM + canvas). */
  function applyTheme(name) {
    if (!THEMES[name]) name = "nokia";
    document.documentElement.setAttribute("data-theme", name);
    currentTheme = THEMES[name];

    // Update swatch selection
    $$(".theme-swatch").forEach((sw) => {
      sw.classList.toggle("active", sw.dataset.themeName === name);
    });

    Save.data.theme = name;
    Save.save();
  }

  /** Recompute canvas size + DPR transform. */
  function resizeCanvas() {
    const rect = els.boardWrap.getBoundingClientRect();
    const availW = Math.max(40, rect.width - 6);
    const availH = Math.max(40, rect.height - 6);

    DPR = Math.min(window.devicePixelRatio || 1, 2.5);

    CELL = Math.floor(Math.min(availW / COLS, availH / ROWS));
    CELL = Math.max(6, CELL);

    boardW = CELL * COLS;
    boardH = CELL * ROWS;

    els.board.style.width = boardW + "px";
    els.board.style.height = boardH + "px";
    els.board.width = Math.round(boardW * DPR);
    els.board.height = Math.round(boardH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }

  /* --------------------------------------------------------------------------
     Drawing primitives
     -------------------------------------------------------------------------- */

  /** Draw a snake segment as a rounded block. */
  function drawSegment(gx, gy, isHead, direction) {
    const x = gx * CELL;
    const y = gy * CELL;
    const pad = Math.max(1, CELL * 0.06);
    const size = CELL - pad * 2;
    const r = Math.max(2, CELL * 0.24);
    const t = currentTheme;

    const base = isHead ? t.snakeHead : t.snakeBody;

    ctx.save();

    // Outer glow for the head
    if (isHead) {
      ctx.shadowColor = t.snakeShadow;
      ctx.shadowBlur = CELL * 0.55;
    }

    // Body gradient
    const grad = ctx.createLinearGradient(x, y, x, y + CELL);
    grad.addColorStop(0, shade(base, 0.22));
    grad.addColorStop(1, shade(base, -0.22));

    ctx.fillStyle = grad;
    roundRectPath(ctx, x + pad, y + pad, size, size, r);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Inner rim
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = Math.max(0.6, CELL * 0.035);
    roundRectPath(ctx, x + pad, y + pad, size, size, r);
    ctx.stroke();

    // Eyes on the head
    if (isHead) {
      const eyeR = Math.max(1.4, CELL * 0.09);
      const eyeOffset = CELL * 0.22;
      const cx = x + CELL / 2;
      const cy = y + CELL / 2;

      let e1x = cx, e1y = cy, e2x = cx, e2y = cy;

      if (direction.x === 1) {
        e1x = cx + CELL * 0.18; e1y = cy - eyeOffset;
        e2x = cx + CELL * 0.18; e2y = cy + eyeOffset;
      } else if (direction.x === -1) {
        e1x = cx - CELL * 0.18; e1y = cy - eyeOffset;
        e2x = cx - CELL * 0.18; e2y = cy + eyeOffset;
      } else if (direction.y === -1) {
        e1x = cx - eyeOffset; e1y = cy - CELL * 0.18;
        e2x = cx + eyeOffset; e2y = cy - CELL * 0.18;
      } else if (direction.y === 1) {
        e1x = cx - eyeOffset; e1y = cy + CELL * 0.18;
        e2x = cx + eyeOffset; e2y = cy + CELL * 0.18;
      }

      // Eye whites
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(e1x, e1y, eyeR, 0, Math.PI * 2);
      ctx.arc(e2x, e2y, eyeR, 0, Math.PI * 2);
      ctx.fill();

      // Pupils
      ctx.fillStyle = "#0b0b0b";
      ctx.beginPath();
      ctx.arc(e1x, e1y, eyeR * 0.55, 0, Math.PI * 2);
      ctx.arc(e2x, e2y, eyeR * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  /** Draw a food apple. */
  function drawFood(gx, gy, pulse) {
    const cx = gx * CELL + CELL / 2;
    const cy = gy * CELL + CELL / 2;
    const baseR = CELL * 0.32;
    const r = baseR * (1 + pulse * 0.08);
    const t = currentTheme;

    ctx.save();
    ctx.shadowColor = t.foodGlow;
    ctx.shadowBlur = CELL * 0.9;

    // Main circle
    const grad = ctx.createRadialGradient(
      cx - r * 0.3, cy - r * 0.3, r * 0.1,
      cx, cy, r
    );
    grad.addColorStop(0, shade(t.food, 0.35));
    grad.addColorStop(1, t.food);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // Highlight
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath();
    ctx.arc(cx - r * 0.32, cy - r * 0.32, r * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  /** Draw a power-up icon. */
  function drawPowerup(pw, now) {
    const cx = pw.x * CELL + CELL / 2;
    const cy = pw.y * CELL + CELL / 2;
    const t = currentTheme;
    const size = CELL * 0.36;

    const colorMap = {
      bonus:  t.bonus,
      slow:   t.slow,
      double: t.double,
      shrink: t.shrink,
    };
    const color = colorMap[pw.kind] || t.food;

    // Pulse when about to expire
    let pulse = 1;
    let alpha = 1;
    if (pw.expiresAt > 0) {
      const remain = pw.expiresAt - now;
      const total = pw.expiresAt - pw.spawnedAt;
      const p = clamp(remain / total, 0, 1);
      pulse = 0.85 + 0.15 * Math.sin(now / 90);
      // Blink when under 25%
      if (p < 0.25) alpha = 0.4 + 0.6 * Math.abs(Math.sin(now / 100));
    }

    ctx.save();
    ctx.globalAlpha = alpha;

    if (pw.kind === "bonus") {
      // Star
      ctx.shadowColor = color;
      ctx.shadowBlur = CELL * 0.9;
      ctx.fillStyle = color;
      starPath(ctx, cx, cy, size * pulse, size * 0.45 * pulse, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = Math.max(0.8, CELL * 0.04);
      ctx.stroke();
    } else if (pw.kind === "slow") {
      // Clock: circle with a hand
      ctx.shadowColor = color;
      ctx.shadowBlur = CELL * 0.8;
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1.5, CELL * 0.1);
      ctx.beginPath();
      ctx.arc(cx, cy, size * pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, cy - size * 0.62);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + size * 0.42, cy);
      ctx.stroke();
    } else if (pw.kind === "double") {
      // Two overlapping squares
      ctx.shadowColor = color;
      ctx.shadowBlur = CELL * 0.8;
      ctx.fillStyle = color;
      const s = size * 0.75 * pulse;
      roundRectPath(ctx, cx - s * 0.85, cy - s * 0.85, s, s, s * 0.25);
      ctx.fill();
      ctx.globalAlpha = alpha * 0.6;
      roundRectPath(ctx, cx - s * 0.15, cy - s * 0.15, s, s, s * 0.25);
      ctx.fill();
    } else if (pw.kind === "shrink") {
      // Down arrow (shrink)
      ctx.shadowColor = color;
      ctx.shadowBlur = CELL * 0.8;
      ctx.fillStyle = color;
      const s = size * pulse;
      ctx.beginPath();
      ctx.moveTo(cx - s, cy - s * 0.5);
      ctx.lineTo(cx + s, cy - s * 0.5);
      ctx.lineTo(cx, cy + s * 0.9);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  /** Draw the grid (faint dots at intersections). */
  function drawGrid() {
    const step = CELL;
    ctx.fillStyle = currentTheme.grid;
    const r = Math.max(0.6, CELL * 0.03);

    for (let y = 0; y <= ROWS; y++) {
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.arc(x * step, y * step, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /** Draw floating effects (rings, particles). */
  function drawEffects() {
    for (let i = 0; i < G.effects.length; i++) {
      const e = G.effects[i];
      const p = e.t / e.dur;
      const alpha = 1 - p;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = e.color;
      ctx.lineWidth = Math.max(1.5, CELL * 0.1 * (1 - p));
      ctx.shadowColor = e.color;
      ctx.shadowBlur = CELL * 0.6;

      const cx = e.x * CELL + CELL / 2;
      const cy = e.y * CELL + CELL / 2;
      const r = CELL * (0.3 + p * 0.9);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    for (let i = 0; i < G.particles.length; i++) {
      const p = G.particles[i];
      const life = 1 - p.t / p.dur;
      if (life <= 0) continue;

      ctx.save();
      ctx.globalAlpha = life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = CELL * 0.4;
      const size = p.size * life;
      ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
      ctx.restore();
    }
  }

  /* --------------------------------------------------------------------------
     Main render
     -------------------------------------------------------------------------- */

  function render(now) {
    ctx.clearRect(0, 0, boardW, boardH);

    drawGrid();

    // Food
    const foodPulse = Math.sin(now / 260);
    drawFood(G.food.x, G.food.y, foodPulse);

    // Power-ups
    for (let i = 0; i < G.powerups.length; i++) {
      drawPowerup(G.powerups[i], now);
    }

    // Snake — draw tail first so head is on top
    const dying = G.status === "dying";
    const flash = dying
      ? Math.floor(G.deathTimer / 90) % 2 === 0
      : false;

    if (flash) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = "#ff2d55";
    }

    for (let i = G.body.length - 1; i >= 0; i--) {
      const seg = G.body[i];
      if (flash) {
        // Draw solid red when flashing
        const x = seg.x * CELL;
        const y = seg.y * CELL;
        const pad = Math.max(1, CELL * 0.06);
        roundRectPath(ctx, x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, CELL * 0.24);
        ctx.fill();
      } else {
        drawSegment(seg.x, seg.y, i === 0, G.dir);
      }
    }

    if (flash) ctx.restore();

    // Effects on top
    drawEffects();

    // Power-up indicator pills
    updatePowerupBar(now);
  }

  /** Update the DOM power-up indicator bar. */
  let lastPowerupSig = "";
  function updatePowerupBar(now) {
    const active = [];
    if (now < G.slowUntil) active.push({ type: "slow", remaining: G.slowUntil - now });
    if (now < G.doubleUntil) active.push({ type: "double", remaining: G.doubleUntil - now });

    const sig = active.map((a) => a.type + Math.ceil(a.remaining / 500)).join("|");
    if (sig === lastPowerupSig) return;
    lastPowerupSig = sig;

    els.powerupBar.innerHTML = "";
    active.forEach((a) => {
      const pill = document.createElement("div");
      pill.className = "powerup-pill";
      pill.dataset.type = a.type;
      pill.textContent = a.type === "slow"
        ? "SLOW " + Math.ceil(a.remaining / 1000) + "s"
        : "×2 " + Math.ceil(a.remaining / 1000) + "s";
      els.powerupBar.appendChild(pill);
    });
  }

  /* ==========================================================================
     9. GAME LOGIC
     ========================================================================== */

  /** Compute the current step interval (ms per move). */
  function getStepInterval(now) {
    // Base speed by level
    let interval = 200 * Math.pow(0.9, G.level - 1);
    interval = Math.max(55, interval);

    // Slow-mo power-up
    if (now < G.slowUntil) interval *= 1.7;

    return interval;
  }

  /** Check if a cell is occupied by the snake. */
  function isOnSnake(x, y, ignoreTail) {
    const len = ignoreTail ? G.body.length - 1 : G.body.length;
    for (let i = 0; i < len; i++) {
      if (G.body[i].x === x && G.body[i].y === y) return true;
    }
    return false;
  }

  /** Check if a cell has a power-up. */
  function powerupAt(x, y) {
    for (let i = 0; i < G.powerups.length; i++) {
      if (G.powerups[i].x === x && G.powerups[i].y === y) return i;
    }
    return -1;
  }

  /** Find a free cell for spawning. Returns {x, y} or null. */
  function findFreeCell() {
    const occupied = new Set();
    for (let i = 0; i < G.body.length; i++) {
      occupied.add(G.body[i].x + "," + G.body[i].y);
    }
    occupied.add(G.food.x + "," + G.food.y);
    for (let i = 0; i < G.powerups.length; i++) {
      occupied.add(G.powerups[i].x + "," + G.powerups[i].y);
    }

    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!occupied.has(x + "," + y)) free.push({ x, y });
      }
    }

    if (free.length === 0) return null;
    return free[randInt(free.length)];
  }

  /** Spawn a new food item. */
  function spawnFood() {
    const cell = findFreeCell();
    if (!cell) return;
    G.food = cell;
  }

  /** Try to spawn a power-up on a free cell. */
  function spawnPowerup(now) {
    if (G.powerups.length >= 2) return;
    const cell = findFreeCell();
    if (!cell) return;

    // Weighted random kind
    const roll = Math.random();
    let kind;
    if (roll < 0.4) kind = "bonus";
    else if (roll < 0.6) kind = "slow";
    else if (roll < 0.8) kind = "double";
    else kind = "shrink";

    const def = POWERUPS[kind];
    const ttl = kind === "bonus" ? 8000 : 10000;

    G.powerups.push({
      x: cell.x,
      y: cell.y,
      kind: kind,
      spawnedAt: now,
      expiresAt: now + ttl,
    });
  }

  /** Reset the game to the initial state. */
  function resetGame() {
    G.body = [
      { x: 7, y: 10 },
      { x: 6, y: 10 },
      { x: 5, y: 10 },
    ];
    G.dir = DIRS.right;
    G.pendingGrowth = 0;

    G.food = { x: 10, y: 10 };
    G.powerups = [];
    G.effects = [];
    G.particles = [];

    G.elapsed = 0;
    G.stepTimer = 0;
    G.slowUntil = 0;
    G.doubleUntil = 0;

    G.score = 0;
    G.level = 1;
    G.foodEaten = 0;
    G.bonusEaten = 0;
    G.maxLength = 3;

    G.status = "playing";
    G.deathTimer = 0;
    G.newHighScore = false;
    G.bonusCheckTimer = 0;

    inputQueue.length = 0;
    lastPowerupSig = "";

    spawnFood();
    updateHUD();
  }

  /** Perform one movement step. */
  function step(now) {
    // Consume one queued direction
    if (inputQueue.length > 0) {
      G.dir = inputQueue.shift();
    }

    const head = G.body[0];
    let nx = head.x + G.dir.x;
    let ny = head.y + G.dir.y;

    // Wall handling: wrap or die
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
      // Classic mode: walls kill. Arcade mode is not currently exposed in UI,
      // but the code path is preserved for future use.
      die("wall");
      return;
    }

    // Determine if we're eating food
    const willEat = (nx === G.food.x && ny === G.food.y);

    // Determine if we're consuming a power-up
    const pwIdx = powerupAt(nx, ny);

    // Move the snake
    G.body.unshift({ x: nx, y: ny });

    if (willEat) {
      G.pendingGrowth += 1;
    }

    // Apply pending growth
    if (G.pendingGrowth > 0) {
      G.pendingGrowth -= 1;
    } else if (!willEat) {
      // Only pop when we're not growing
    }

    // Handle growth properly: if we ate, we don't pop the tail
    if (!willEat) {
      G.body.pop();
    }

    // Self-collision check (after move, but not against the new head)
    for (let i = 1; i < G.body.length; i++) {
      if (G.body[i].x === nx && G.body[i].y === ny) {
        die("self");
        return;
      }
    }

    // Handle food consumption
    if (willEat) {
      onEatFood(now, nx, ny);
    }

    // Handle power-up consumption
    if (pwIdx >= 0) {
      const pw = G.powerups[pwIdx];
      G.powerups.splice(pwIdx, 1);
      onPowerup(now, pw);
    }

    // Track max length
    if (G.body.length > G.maxLength) {
      G.maxLength = G.body.length;
    }

    updateHUD();
  }

  /** Called when the snake eats a normal food item. */
  function onEatFood(now, x, y) {
    G.foodEaten++;

    // Score
    let points = 10 * G.level;
    if (now < G.doubleUntil) points *= 2;
    G.score += points;

    // Level up every N foods
    if (G.foodEaten % FOODS_PER_LEVEL === 0) {
      G.level++;
      Sound.levelUp();
      showToast("LEVEL " + G.level);
      flashHUD(els.hudLevelCell);
      updateHUD();
    }

    // SFX + haptics
    Sound.eat();
    Haptics.eat();

    // Visual FX
    spawnEatEffect(x, y);
    spawnFood();
    showFloatScore("+" + points, x, y);

    // Occasionally spawn a power-up
    G.bonusCheckTimer += 1;
    if (G.bonusCheckTimer >= 3 && Math.random() < 0.55) {
      spawnPowerup(now);
      G.bonusCheckTimer = 0;
    } else if (G.bonusCheckTimer >= 6) {
      spawnPowerup(now);
      G.bonusCheckTimer = 0;
    }
  }

  /** Called when the snake consumes a power-up. */
  function onPowerup(now, pw) {
    const def = POWERUPS[pw.kind];
    G.bonusEaten++;

    // Points
    let points = def.points * G.level;
    if (now < G.doubleUntil) points *= 2;
    G.score += points;

    // Effect
    if (pw.kind === "bonus") {
      // No timed effect — pure score
    } else if (pw.kind === "slow") {
      G.slowUntil = now + def.duration;
    } else if (pw.kind === "double") {
      G.doubleUntil = now + def.duration;
    } else if (pw.kind === "shrink") {
      // Remove up to 3 segments (never below length 3)
      const removeCount = Math.min(3, Math.max(0, G.body.length - 3));
      for (let i = 0; i < removeCount; i++) {
        G.body.pop();
      }
    }

    // Feedback
    if (pw.kind === "bonus") Sound.bonus();
    else Sound.powerup();
    Haptics.bonus();

    showToast(def.label);
    showFloatScore("+" + points, pw.x, pw.y);
    spawnEatEffect(pw.x, pw.y);

    updateHUD();
  }

  /** Spawn a visual ring + particle burst. */
  function spawnEatEffect(gx, gy) {
    const themeColors = [
      currentTheme.food,
      currentTheme.snakeHead,
    ];
    G.effects.push({
      x: gx, y: gy,
      t: 0,
      dur: 340,
      color: themeColors[0],
    });

    // Particle burst
    const cx = gx * CELL + CELL / 2;
    const cy = gy * CELL + CELL / 2;
    for (let i = 0; i < 8; i++) {
      const a = (Math.PI * 2 / 8) * i + Math.random() * 0.4;
      const speed = 0.4 + Math.random() * 0.6;
      G.particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        t: 0,
        dur: 380 + Math.random() * 220,
        size: CELL * (0.12 + Math.random() * 0.12),
        color: themeColors[randInt(themeColors.length)],
      });
    }
  }

  /** Advance all visual effects. */
  function updateEffects(dt) {
    for (let i = G.effects.length - 1; i >= 0; i--) {
      G.effects[i].t += dt;
      if (G.effects[i].t >= G.effects[i].dur) G.effects.splice(i, 1);
    }
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const p = G.particles[i];
      p.t += dt;
      p.x += p.vx * dt * 0.055;
      p.y += p.vy * dt * 0.055;
      p.vy += 0.0008 * dt;
      if (p.t >= p.dur) G.particles.splice(i, 1);
    }
  }

  /** Handle the death sequence. */
  function die(reason) {
    if (G.status !== "playing") return;

    G.status = "dying";
    G.deathTimer = 0;

    Sound.die();
    Haptics.die();

    els.boardWrap.classList.add("dead");
  }

  /** Finalise the game over after the death animation. */
  function finalizeGameOver() {
    G.status = "gameover";
    els.boardWrap.classList.remove("dead");

    // Persist stats
    Save.data.games += 1;
    const prevHigh = Save.data.highScore;
    G.newHighScore = G.score > prevHigh;
    if (G.newHighScore) Save.data.highScore = G.score;
    if (G.maxLength > Save.data.maxLength) Save.data.maxLength = G.maxLength;
    Save.save();

    // Populate game over screen
    els.overTitle.textContent = G.newHighScore ? "New Record!" : "Game Over";
    els.overScore.textContent = fmt(G.score);
    els.overLength.textContent = String(G.maxLength);
    els.overLevel.textContent = String(G.level);
    els.overFood.textContent = String(G.foodEaten);
    els.overBonus.textContent = String(G.bonusEaten);
    els.overTime.textContent = formatTime(G.elapsed);
    els.overBest.textContent = fmt(Save.data.highScore);

    els.overBadge.innerHTML = "";
    if (G.newHighScore) {
      const badge = document.createElement("div");
      badge.className = "over-badge";
      badge.textContent = "★ New High Score";
      els.overBadge.appendChild(badge);
    }

    showScreen("over");
  }

  /* ==========================================================================
     10. INPUT
     ========================================================================== */

  /** Queue a direction change (from any input source). */
  function queueDirection(name) {
    if (G.status !== "playing") return;
    const dir = DIRS[name];
    if (!dir) return;

    // Determine the "last" direction in the queue (or the current)
    const last = inputQueue.length > 0
      ? inputQueue[inputQueue.length - 1]
      : G.dir;

    // Reject reversal
    if (dir.x === -last.x && dir.y === -last.y) return;
    // Reject duplicates
    if (dir.x === last.x && dir.y === last.y) return;
    // Cap queue
    if (inputQueue.length >= MAX_INPUT_QUEUE) return;

    inputQueue.push(dir);
    Sound.turn();
    Haptics.turn();
  }

  /* --------------------------------------------------------------------------
     Keyboard
     -------------------------------------------------------------------------- */

  const KEY_PREVENT = [
    "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
    " ", "Spacebar",
  ];

  document.addEventListener("keydown", function (e) {
    if (KEY_PREVENT.indexOf(e.key) !== -1) e.preventDefault();

    // Menu shortcuts
    if (G.status === "menu" && (e.key === " " || e.key === "Enter")) {
      startGame();
      return;
    }
    if (G.status === "gameover" && (e.key === " " || e.key === "Enter")) {
      startGame();
      return;
    }

    // Pause toggle
    if (e.key === "p" || e.key === "P" || e.key === "Escape") {
      if (G.status === "playing") pauseGame();
      else if (G.status === "paused") resumeGame();
      return;
    }

    if (G.status !== "playing") return;
    if (e.repeat) return;

    switch (e.key) {
      case "ArrowUp":
      case "w":
      case "W":
        queueDirection("up");
        break;
      case "ArrowDown":
      case "s":
      case "S":
        queueDirection("down");
        break;
      case "ArrowLeft":
      case "a":
      case "A":
        queueDirection("left");
        break;
      case "ArrowRight":
      case "d":
      case "D":
        queueDirection("right");
        break;
    }
  });

  /* --------------------------------------------------------------------------
     D-Pad buttons
     -------------------------------------------------------------------------- */

  function bindDpad() {
    $$(".ctl").forEach(function (btn) {
      let active = false;

      function press(e) {
        e.preventDefault();
        if (active) return;
        active = true;
        btn.classList.add("active");

        try { btn.setPointerCapture(e.pointerId); } catch (err) {}

        Sound.init();
        Sound.resume();

        const dir = btn.dataset.dir;
        if (dir) queueDirection(dir);
        else if (btn.dataset.action === "pause") togglePause();
      }

      function release() {
        if (!active) return;
        active = false;
        btn.classList.remove("active");
      }

      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("lostpointercapture", release);
      btn.addEventListener("contextmenu", (e) => e.preventDefault());
    });
  }

  /* --------------------------------------------------------------------------
     Swipe on board
     -------------------------------------------------------------------------- */

  function bindSwipe() {
    let swipeStart = null;

    els.board.addEventListener("pointerdown", function (e) {
      if (G.status !== "playing") return;
      e.preventDefault();
      Sound.init();
      Sound.resume();

      swipeStart = { x: e.clientX, y: e.clientY };

      try { els.board.setPointerCapture(e.pointerId); } catch (err) {}
    });

    els.board.addEventListener("pointermove", function (e) {
      if (!swipeStart) return;
      if (G.status !== "playing") return;

      e.preventDefault();

      const dx = e.clientX - swipeStart.x;
      const dy = e.clientY - swipeStart.y;

      if (Math.hypot(dx, dy) < SWIPE_THRESHOLD) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        queueDirection(dx > 0 ? "right" : "left");
      } else {
        queueDirection(dy > 0 ? "down" : "up");
      }

      // Reset start so consecutive swipes work without lifting the finger
      swipeStart = { x: e.clientX, y: e.clientY };
    });

    function endSwipe(e) {
      swipeStart = null;
    }

    els.board.addEventListener("pointerup", endSwipe);
    els.board.addEventListener("pointercancel", endSwipe);
    els.board.addEventListener("lostpointercapture", endSwipe);
  }

  /* ==========================================================================
     11. UI
     ========================================================================== */

  /** Update the HUD numbers. */
  function updateHUD() {
    els.hudScore.textContent = fmt(G.score);
    els.hudLevel.textContent = String(G.level);
    els.hudBest.textContent = fmt(Math.max(Save.data.highScore, G.score));
  }

  /** Briefly flash a HUD cell. */
  function flashHUD(el) {
    if (!el) return;
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 420);
  }

  let toastTimeout = null;
  function showToast(text) {
    if (!text) return;
    els.toast.textContent = text;
    els.toast.classList.remove("show");
    void els.toast.offsetWidth;
    els.toast.classList.add("show");

    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => els.toast.classList.remove("show"), 1100);
  }

  /** Spawn a floating "+N" score popup at a grid position. */
  function showFloatScore(text, gx, gy) {
    const el = document.createElement("div");
    el.className = "float-score";
    el.textContent = text;

    // Position relative to the board-wrap
    const boardLeft = els.board.offsetLeft;
    const boardTop = els.board.offsetTop;
    el.style.left = (boardLeft + gx * CELL + CELL / 2) + "px";
    el.style.top = (boardTop + gy * CELL) + "px";

    els.boardWrap.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 1000);
  }

  /* ---- Screens ---- */

  function showScreen(name) {
    Object.keys(els.screens).forEach((k) => {
      els.screens[k].classList.toggle("active", k === name);
    });
  }

  function hideScreens() {
    Object.keys(els.screens).forEach((k) => {
      els.screens[k].classList.remove("active");
    });
  }

  /** Refresh the start-screen stat strip. */
  function refreshMenuStats() {
    els.startHigh.textContent = fmt(Save.data.highScore);
    els.startGames.textContent = fmt(Save.data.games);
    els.startLen.textContent = String(Save.data.maxLength);
  }

  /** Sync sound toggle button labels. */
  function updateSoundLabels() {
    const label = Sound.muted ? "🔇 Sound Off" : "🔊 Sound On";
    if (els.btnSoundStart) els.btnSoundStart.textContent = label;
    if (els.btnSoundPause) els.btnSoundPause.textContent = Sound.muted ? "🔇 Off" : "🔊 On";
  }

  /* ==========================================================================
     12. FLOW CONTROL
     ========================================================================== */

  function startGame() {
    Sound.init();
    Sound.resume();

    resetGame();
    hideScreens();

    updateSoundLabels();
  }

  function pauseGame() {
    if (G.status !== "playing") return;
    G.status = "paused";
    Sound.uiClick();
    updateSoundLabels();
    showScreen("pause");
  }

  function resumeGame() {
    if (G.status !== "paused") return;
    G.status = "playing";
    Sound.uiClick();
    hideScreens();
  }

  function togglePause() {
    if (G.status === "playing") pauseGame();
    else if (G.status === "paused") resumeGame();
  }

  function quitToMenu() {
    G.status = "menu";
    hideScreens();
    showScreen("start");
    refreshMenuStats();
    updateSoundLabels();
    Sound.uiBack();
  }

  /* ==========================================================================
     13. GAME LOOP
     ========================================================================== */

  let lastTime = 0;
  let accumulator = 0;

  function loop(t) {
    if (!lastTime) lastTime = t;
    let dt = t - lastTime;
    lastTime = t;

    // Clamp to avoid huge jumps after tab switches
    if (dt > 100) dt = 100;
    if (dt < 0) dt = 0;

    /* ---- Update ---- */
    updateEffects(dt);

    if (G.status === "playing") {
      G.elapsed += dt;
      G.stepTimer += dt;

      const interval = getStepInterval(G.elapsed);

      // Cap iterations per frame for safety
      let safety = 0;
      while (G.stepTimer >= interval && safety < 4) {
        G.stepTimer -= interval;
        step(G.elapsed);
        safety++;
        if (G.status !== "playing") break;
      }

      // Expire powerups
      for (let i = G.powerups.length - 1; i >= 0; i--) {
        if (G.powerups[i].expiresAt > 0 && G.elapsed >= G.powerups[i].expiresAt) {
          G.powerups.splice(i, 1);
        }
      }
    } else if (G.status === "dying") {
      G.deathTimer += dt;
      if (G.deathTimer >= DEATH_ANIM_MS) {
        finalizeGameOver();
      }
    }

    /* ---- Render ---- */
    render(G.elapsed);

    requestAnimationFrame(loop);
  }

  /* ==========================================================================
     14. BOOTSTRAP
     ========================================================================== */

  function init() {
    /* ---- Load persistence ---- */
    Save.load();
    Sound.setMuted(Save.data.muted);
    applyTheme(Save.data.theme);
    updateSoundLabels();
    refreshMenuStats();

    /* ---- Initial canvas sizing ---- */
    resizeCanvas();

    let resizeRaf = 0;
    function scheduleResize() {
      if (resizeRaf) cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(() => {
        resizeCanvas();
      });
    }

    window.addEventListener("resize", scheduleResize);
    window.addEventListener("orientationchange", () => setTimeout(scheduleResize, 120));

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(scheduleResize);
      ro.observe(els.boardWrap);
    }

    /* ---- Input ---- */
    bindDpad();
    bindSwipe();

    /* ---- Theme selector ---- */
    els.themeRow.addEventListener("click", function (e) {
      const sw = e.target.closest(".theme-swatch");
      if (!sw) return;
      applyTheme(sw.dataset.themeName);
      Sound.uiClick();
      Haptics.tap();
      // Re-render with new theme colors
      render(G.elapsed);
    });

    /* ---- Start screen ---- */
    $("#btnPlay").addEventListener("click", function () {
      Sound.init();
      Sound.resume();
      Sound.uiClick();
      startGame();
    });

    els.btnSoundStart.addEventListener("click", function () {
      Sound.init();
      Sound.toggle();
      updateSoundLabels();
    });

    /* ---- Pause screen ---- */
    $("#btnResume").addEventListener("click", resumeGame);
    $("#btnRestart").addEventListener("click", function () {
      Sound.uiClick();
      startGame();
    });
    $("#btnQuit").addEventListener("click", quitToMenu);
    els.btnSoundPause.addEventListener("click", function () {
      Sound.toggle();
      updateSoundLabels();
    });

    /* ---- Game over screen ---- */
    $("#btnPlayAgain").addEventListener("click", function () {
      Sound.uiClick();
      startGame();
    });
    $("#btnMenu").addEventListener("click", quitToMenu);

    /* ---- Auto-pause when tab is hidden ---- */
    document.addEventListener("visibilitychange", function () {
      if (document.hidden && G.status === "playing") pauseGame();
    });
    window.addEventListener("blur", function () {
      if (G.status === "playing") pauseGame();
    });

    /* ---- Prevent zoom / context menu ---- */
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.addEventListener("contextmenu", function (e) {
      if (e.target.closest && e.target.closest(".app")) e.preventDefault();
    });

    /* ---- Initial render ---- */
    showScreen("start");

    /* ---- Start the loop ---- */
    requestAnimationFrame(function (t) {
      lastTime = t;
      requestAnimationFrame(loop);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
